{id:'py16',t:'py',lv:2,title:'melt: wide to long',
 learn:['Data often arrives <b>wide</b>: one column per moment, metric or month, like <b>mood_before</b> and <b>mood_after</b> in <b>mind</b>. <code>melt</code> makes it <b>long</b>: <code>meals.melt(id_vars=["day", "name"], value_vars=["protein", "carbs", "fat"], var_name="macro", value_name="grams")</code> gives one row per meal and melted column, with the old column name in <b>macro</b> and its value in <b>grams</b>. It is the reverse of pivot_table: melt goes wide to long, pivot_table long to wide.','Long data is what groupby wants: once mood_before and mood_after are rows, "per practice and moment" is a plain <code>groupby(["practice", "moment"])</code>, and a third moment would only be one more name in value_vars. Only melt columns that measure the same thing on the same scale: two 1-10 moods or three macros in grams, yes; a mood and minutes, no.','Columns in neither id_vars nor value_vars are dropped. Leave value_vars out and pandas melts <i>every</i> other column (id, time, minutes ...) into one mixed column. A missing value stays as a row with NaN: <code>mean</code> and <code>count</code> skip it, but <code>size</code> counts it, as in the missing-values lesson.'],
 ex:R`long = checkins.melt(id_vars="day", value_vars=["quality", "energy"], var_name="metric", value_name="score")
print(len(checkins), "wide rows ->", len(long), "long rows")

print(long.value_counts(["metric", "score"]).sort_index())`,
 task:"Mood before vs after, per practice, as a long table. Melt <b>mind</b>'s <b>mood_before</b> and <b>mood_after</b> into rows, then per <b>practice</b> and <b>moment</b>: <b>n</b> (how many of those moods were recorded; a missing mood doesn't count) and <b>mood</b> (their mean, rounded to 2). Keep every practice and moment, even one with no recorded mood at all (n is then 0 and mood NaN). Columns: <b>practice</b>, <b>moment</b> (the original column name: mood_before or mood_after), <b>n</b>, <b>mood</b>.",
 start:R`long = mind.melt(id_vars=
result = `,
 sol:R`long = mind.melt(id_vars="practice", value_vars=["mood_before", "mood_after"], var_name="moment", value_name="mood")
result = long.groupby(["practice", "moment"], as_index=False).agg(n=("mood", "count"), mood=("mood", "mean")).round(2)`,
 hint:'Melt with id_vars="practice" and value_vars=["mood_before", "mood_after"], then group by practice and moment: count skips the NaN moods, size does not.'},
{id:'py6',t:'py',lv:2,title:'np.where: derived categories',
 learn:['<code>np.where(condition, if_true, if_false)</code> builds a column from a mask in one vectorized step: SQL&rsquo;s CASE WHEN ... THEN ... ELSE ... END. For three or more labels, nest it, so the else part is another np.where: <code>np.where(m &lt; 5, "quick", np.where(m &lt; 15, "medium", "long"))</code>. The first condition that is True wins, so walk the scale from one end: from the top, test <code>m &gt;= 15</code> before <code>m &gt;= 5</code>, or a 20-minute hold lands in the 5-to-15 bucket.','The trap is NaN. Every comparison with NaN but <code>!=</code> is False (New columns: vectorized math), so a missing value fails each test and drops into the last else, labelled as if it were real, with no error. Test it first, <code>np.where(s.isna(), "unrated", ...)</code> as in Missing values: isna &amp; count, and give it a label of its own. And check the boundaries: <code>&gt;=</code> or <code>&gt;</code> decides where a value exactly on the line goes.','np.where returns a plain NumPy array, not a Series: assign it to a column of the frame you tested (<code>t["hold"] = np.where(...)</code>, after a <code>.copy()</code>), then group or count by that column as usual. The values can be columns too: <code>np.where(t["pnl"] &gt; 0, t["pnl"], 0)</code> keeps the wins and zeroes the rest. Keep every branch the same kind: mixed with text labels, <code>np.nan</code> becomes the text "nan", which <code>isna()</code> no longer finds.'],
 ex:R`t = trades.copy()
m = t["minutes"]
t["hold"] = np.where(m < 5, "quick", np.where(m < 15, "medium", "long"))
print(t.groupby("hold", as_index=False).agg(trades=("id", "size"), avg_pnl=("pnl", "mean")).round(2))
d = mind["depth"]

 start:R`w = workouts.copy()
r = w["rpe"]
w["effort"] = np.where(
result = `,
 sol:R`w = workouts.copy()
r = w["rpe"]
w["effort"] = np.where(r.isna(), "unrated", np.where(r >= 8, "hard", np.where(r >= 7, "moderate", "easy")))
result = w.groupby("effort", as_index=False).agg(workouts=("id", "size"))
result["pct"] = (result["workouts"] * 100 / len(w)).round(1)`,
 hint:'Test r.isna() first, then nest np.where from the top of the scale down (>= 8, then >= 7); count the rows per label and divide by len(w).'},
{id:'py17',t:'py',lv:2,title:'String methods with .str',
 learn:['The <b>.str</b> accessor runs a string operation on every value of a text column, no loop: <code>trades["contract"].str[:2]</code> (first two characters: NQZ6 becomes NQ), <code>.str.len()</code>, <code>.str.lower()</code>, <code>.str.strip()</code>, <code>.str.startswith("Bench")</code>, <code>.str.contains("Press")</code>, <code>.str.replace(old, new)</code>. Each gives a new column you can filter or group by.','<code>.str.split(" ")</code> gives a <i>list</i> per row, so pick a piece with another <code>.str[n]</code>: <code>meals["name"].str.split(" ").str[0]</code> turns "Salmon bowl" into "Salmon", and <code>.str[-1]</code> takes the last piece. Parsing a text key into a coarser one changes what you can group by: several names can fall into one group.','It only works on text: a number column raises an AttributeError (<code>.astype(str)</code> first). A missing value stays missing, so a <code>contains</code> filter needs <code>na=False</code>. <code>contains</code> reads its pattern as a <b>regex</b> by default, so "Almonds (1 oz)" doesn\'t match itself: the parentheses are regex syntax. Pass <code>regex=False</code> for plain text. <code>replace</code> is plain text by default in pandas 2; real regex comes later, in Regex extraction from logs.'],
 ex:R`t = trades.copy()
t["root"] = t["contract"].str[:2]      # NQZ6 -> NQ (the market)
t["expiry"] = t["contract"].str[-2:]   # Z6 -> December 2026
print(t[["contract", "root", "expiry"]].drop_duplicates())
bowls = meals[meals["name"].str.endswith(" bowl")]

print(meals["name"].str.contains("(1 oz)", regex=False).sum(), "meals measured in oz")`,
 task:'Your lifting by movement family. Take the <b>Weighted</b> workouts only and give each one a <b>family</b>: the last word of its exercise name, words being separated by spaces (Bench Press, Leg Press and Overhead Press are all <b>Press</b>; Deadlift stays <b>Deadlift</b>). Per family: <b>exercises</b> (how many distinct exercise names it groups) and <b>sets</b> (total sets). Columns: <b>family</b>, <b>exercises</b>, <b>sets</b>.',
 start:R`w = workouts[workouts["type"] == "Weighted"].copy()
w["family"] =
result = `,
 sol:R`w = workouts[workouts["type"] == "Weighted"].copy()
w["family"] = w["exercise"].str.split(" ").str[-1]
result = w.groupby("family", as_index=False).agg(exercises=("exercise", "nunique"), sets=("sets", "sum"))`,
 hint:'The last word is .str.split(" ").str[-1]; then, per family, the nunique of exercise and the sum of sets.'},
{id:'py7',t:'py',lv:3,title:'Dates & weekly buckets',ordered:true,
 learn:['To see a trend, give every row a time bucket and group by it. Turn the <b>day</b> text into real dates with <code>pd.to_datetime</code>, then build the key with the <code>.dt</code> accessor: <code>.dt.strftime("%Y-%m")</code> gives a month key like 2026-10, and <code>.dt.to_period("W").dt.start_time</code> gives the Monday each week starts on. After that the key is an ordinary column to group by.','Turn the key back into text with <code>.dt.strftime("%Y-%m-%d")</code>: a raw Timestamp shows up in your answer as 2026-10-05T00:00:00.000, and YYYY-MM-DD text sorts in date order, so <code>sort_values</code> on it puts the weeks in order. pandas weeks run Monday to Sunday: <code>"W"</code> means weeks <i>ending</i> on Sunday. For weeks that start on Sunday, use <code>"W-SAT"</code> (ending on Saturday).','Gotchas: <code>.dt.to_period("W")</code> alone prints as 2026-10-05/2026-10-11, a period, not a date. A week number (<code>.dt.isocalendar().week</code>) or <code>.dt.month</code> starts again every year, so the same week of two years lands in one bucket; key by the full Monday date or by YYYY-MM. And grouping only sees the days you logged: a week with no rows gets no row at all.'],
 ex:R`s = study.copy()
d = pd.to_datetime(s["day"])
s["month"] = d.dt.strftime("%Y-%m")                                     # 2026-10
s["week"] = d.dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")  # the Monday
s["weekday"] = d.dt.day_name()
print(s[["day", "weekday", "week", "month"]].head(5))
print(s.groupby("month", as_index=False).agg(sessions=("id", "size"), minutes=("minutes", "sum")))
print("period:", d.dt.to_period("W").astype(str).iloc[0], "| ISO week number:", d.dt.isocalendar().week.iloc[0])`,
 task:"Your weekly check-in review. Group <b>checkins</b> by week: the Monday the week starts on (weeks run Monday to Sunday), as YYYY-MM-DD text; only weeks with at least one check-in. Per week: <b>checkins</b> (how many check-ins), <b>weigh_ins</b> (how many of them have a <b>weight</b>; a skipped weigh-in doesn't count) and <b>energy</b> (mean energy, rounded to 2). Columns: <b>week</b>, <b>checkins</b>, <b>weigh_ins</b>, <b>energy</b>, oldest week first.",
 start:R`c = checkins.copy()
c["week"] =
result = `,
 sol:R`c = checkins.copy()
c["week"] = pd.to_datetime(c["day"]).dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
result = c.groupby("week", as_index=False).agg(
    checkins=("day", "size"),
    weigh_ins=("weight", "count"),
    energy=("energy", "mean"),
).round(2).sort_values("week")`,
 hint:'The Monday is pd.to_datetime(...).dt.to_period("W").dt.start_time, formatted with .dt.strftime("%Y-%m-%d"); then size counts check-ins and count skips the missing weights.'},
{id:'py18',t:'py',lv:3,title:'Anti-joins: rows with no match',
 learn:['An <b>anti-join</b> keeps the rows that have <i>no</i> match in another table: trading days with no check-in, customers who never ordered. An inner merge silently drops exactly these rows, so you have to ask for them. For one key, <code>isin</code> marks the values that appear in the other column (SQL IN) and <code>~</code> flips the mask: <code>df[~df["day"].isin(checkins["day"])]</code> is SQL\'s NOT IN, or LEFT JOIN ... WHERE right.day IS NULL.','For several key columns, or to see both sides at once, merge with <code>how="left", indicator=True</code>: pandas adds a <b>_merge</b> column that says <b>both</b> or <b>left_only</b>, and you keep <code>_merge == "left_only"</code>. Merge on the right side\'s keys only, deduplicated (<code>other[["day"]].drop_duplicates()</code>), or a key that appears twice there doubles the matched rows.','Test isin or the indicator, never a column from the other table: after a left merge, <b>weight</b> is NaN on days with no check-in <i>and</i> on check-ins where you skipped the scale. ~ binds tighter than &amp;: <code>~a &amp; b</code> negates only a, <code>~(a &amp; b)</code> the whole mask. And decide which rows could have matched at all: days before you started an app aren\'t "skipped".'],
 ex:R`meal_days = meals[["day"]].drop_duplicates()
# one key: a negated isin
no_checkin = meal_days[~meal_days["day"].isin(checkins["day"])]
print(no_checkin["day"].tolist())
# same question with the indicator (works for multi-column keys too)
m = meal_days.merge(checkins[["day"]].drop_duplicates(), on="day", how="left", indicator=True)
print(m["_merge"].value_counts())
print(m[m["_merge"] == "left_only"]["day"].tolist())`,
 task:"Trading days when you skipped the morning check-in. For every trading day (a <b>day</b> in <b>trades</b>) that has no row in <b>checkins</b>, counting only days on or after the earliest day in <b>checkins</b> (before it you weren't using TODAY yet): <b>day</b>, <b>trades</b> (how many trades that day), <b>pnl</b> (that day's total, rounded to 2). Columns: <b>day</b>, <b>trades</b>, <b>pnl</b>.",
 start:R`daily = trades.groupby("day", as_index=False).agg(trades=("id", "size"), pnl=("pnl", "sum"))
first = checkins["day"].min()
result = daily[`,
 sol:R`daily = trades.groupby("day", as_index=False).agg(trades=("id", "size"), pnl=("pnl", "sum"))
first = checkins["day"].min()
skipped = ~daily["day"].isin(checkins["day"]) & (daily["day"] >= first)
result = daily[skipped].round(2)`,
 hint:'Mask with ~daily["day"].isin(checkins["day"]), add the bound against first with & (in brackets), then round(2).'},
{id:'py8',t:'py',lv:3,title:'Top-N per group',
 learn:['Top-N per group is two moves: sort, then keep the first n rows of each group. Sort by the group key and the column you rank on (descending for "biggest"), then <code>groupby("contract").head(3)</code> keeps each contract\'s first 3 rows, whole and unchanged. It is the pandas twin of SQL\'s ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...) &lt;= 3, and a group with fewer than n rows simply keeps all it has.','To number the rows, keep the same sort and add <code>groupby(key).cumcount() + 1</code>: 1 for each group\'s top row, 2 for the next. <code>groupby(key)[col].rank(ascending=False)</code> ranks without sorting, but choose its method for ties: the default gives two tied leaders 1.5 each, <code>"first"</code> numbers ties in frame order, <code>"min"</code> gives them the same rank with a gap (1, 1, 3), <code>"dense"</code> with no gap (1, 1, 2). So rank &lt;= 3 with min or dense can keep more than 3 rows.','Gotchas: ties decide which rows win. On equal values, head and method="first" just take whichever row comes first, so put a tie-breaker (id or time) in the sort, in the direction the question asks: "the most recent wins" means id descending. <code>nlargest(3, "col")</code> is the top 3 of the whole frame, not of each group, and among ties it keeps the earliest rows, not your rule.'],
 ex:R`t = trades.sort_values(["contract", "pnl", "id"], ascending=[True, False, True])
best = t.groupby("contract").head(2).copy()              # 2 best trades per contract
best["rank"] = best.groupby("contract").cumcount() + 1   # 1, 2 within each contract
print(best[["contract", "rank", "id", "day", "pnl"]])    # equal pnl: the earlier trade (lower id) first
s = pd.Series([895, 895, 0, -305])
print(pd.DataFrame({"pnl": s, "first": s.rank(method="first", ascending=False),
                    "min": s.rank(method="min", ascending=False),
                    "dense": s.rank(method="dense", ascending=False)}))`,
 task:'Your 3 strongest urges per trigger. Take the urges in <b>habits</b> (event <b>resisted</b> or <b>slipped</b>; the <b>done</b> rows have no trigger) and, for each <b>trigger</b> (an urge logged without one is left out), its 3 highest-<b>intensity</b> urges. On equal intensity the more recent urge (higher <b>id</b>) ranks higher; a trigger with fewer than 3 urges keeps the ones it has. Columns: <b>trigger</b>, <b>rank</b> (1 = strongest, then 2 and 3), <b>day</b>, <b>intensity</b>, <b>event</b>.',
 start:R`u = habits[habits["event"] != "done"]
u = u.sort_values(
top =
result = `,
 sol:R`u = habits[habits["event"] != "done"]
u = u.sort_values(["trigger", "intensity", "id"], ascending=[True, False, False])
top = u.groupby("trigger").head(3).copy()
top["rank"] = top.groupby("trigger").cumcount() + 1
result = top[["trigger", "rank", "day", "intensity", "event"]]`,
 hint:'Put the tie-breaker in the sort (intensity and id both descending), keep groupby("trigger").head(3), then number the rows with cumcount() + 1.'},
{id:'py19',t:'py',lv:3,title:'shift & diff: the previous row',
 learn:['<code>shift()</code> moves a column down one row, so each row can see the previous row\'s value: the pandas form of SQL\'s LAG (<code>shift(-1)</code> looks ahead, like LEAD). <code>diff()</code> is the shortcut for <code>x - x.shift()</code>, the change since the previous row. "Previous" just means the row above, so sort first (by id or time).','To restart for every day, practice or contract, shift within groups, the same sort-then-groupby move as Top-N per group: <code>t.groupby("day")["pnl"].shift()</code>. Each group\'s first row gets NaN. A plain <code>t["pnl"].shift()</code> hands the previous day\'s last trade to the next day\'s first one, the most common bug here.','That NaN means "there is no previous row". Drop it (<code>dropna(subset=[...])</code>) before you label or count; a filler like fillna(0), or a label built on NaN, quietly turns "no previous trade" into "previous trade was flat". For dates, convert with pd.to_datetime first: the diff is a Timedelta, and <code>.dt.days</code> makes it a number.'],
 ex:R`m = mind.sort_values("id").copy()
m["date"] = pd.to_datetime(m["day"])
m["prev_min"] = m.groupby("practice")["minutes"].shift()
m["gap_days"] = m.groupby("practice")["date"].diff().dt.days
print(m[["practice", "day", "minutes", "prev_min", "gap_days"]].head(8))
# average days between two sessions of the same practice
print(m.groupby("practice")["gap_days"].mean().round(1))`,
 task:'Do you trade worse after a loss? Take <b>trades</b> in <b>id</b> order. For every trade that isn\'t the first of its <b>day</b>, look at the previous trade on that same day and label the trade <b>"after win"</b> (previous pnl &gt; 0), <b>"after loss"</b> (previous pnl &lt; 0) or <b>"after flat"</b> (previous pnl = 0). Leave out each day\'s first trade. Per label: <b>after</b>, <b>trades</b> (count), <b>avg_pnl</b> (mean pnl of the labelled trades themselves, rounded to 2). Columns: <b>after</b>, <b>trades</b>, <b>avg_pnl</b>.',
 start:R`t = trades.sort_values("id").copy()
t["prev"] =
result = `,
 sol:R`t = trades.sort_values("id").copy()
t["prev"] = t.groupby("day")["pnl"].shift()
t = t.dropna(subset=["prev"])
t["after"] = np.where(t["prev"] > 0, "after win", np.where(t["prev"] < 0, "after loss", "after flat"))
result = t.groupby("after", as_index=False).agg(trades=("id", "size"), avg_pnl=("pnl", "mean")).round(2)`,
 hint:'t.groupby("day")["pnl"].shift() gives each trade the previous pnl of its day (NaN for the first); drop those rows, then label with np.where.'},
{id:'py20',t:'py',lv:3,title:'transform: group totals on each row',
 learn:['<code>groupby(key)[col].transform("sum")</code> computes each group\'s total but hands it back on <i>every original row</i>, with the same length and index as the frame. agg collapses a group to one row; transform keeps the rows and adds context. So <code>m["day_kcal"] = m.groupby("day")["kcal"].transform("sum")</code> puts the day\'s total next to each meal, ready for a share.','It also keeps or drops rows by a group property without collapsing anything: <code>trades[trades.groupby("day")["id"].transform("size") &gt;= 3]</code> keeps every trade of the days with at least 3 trades (HAVING, but you keep the rows). Compare a row with <code>transform("max")</code> to keep the group\'s top rows, or subtract <code>transform("mean")</code> to see how far it is from average.','transform lines up on the original index, so assign it straight back as a column; no merge needed. Assigning an agg result instead (<code>m.groupby("day")["kcal"].sum()</code>) aligns day labels against row numbers and fills the column with NaN. Give transform one function, usually by name ("sum", "mean", "max", "size"; named aggregation doesn\'t apply), and use agg when you want one row per group.'],
 ex:R`m = mind.copy()
m["avg_min"] = m.groupby("practice")["minutes"].transform("mean")
m["vs_avg"] = m["minutes"] - m["avg_min"]
print(m[["practice", "day", "minutes", "avg_min", "vs_avg"]].head(6).round(1))
# every session that ties its practice's longest one (all ties stay)
longest = m[m["minutes"] == m.groupby("practice")["minutes"].transform("max")]
print(longest[["practice", "day", "minutes"]])`,
 task:"Meals that were more than half of the day's calories. Only look at days with at least 2 meals logged (2 or more rows in <b>meals</b>; snacks count). For each meal on those days: <b>day</b>, <b>name</b>, <b>kcal</b> (as logged), <b>pct</b> = the meal's kcal * 100 / that day's total kcal (all of that day's rows), rounded to 1. Keep the meals whose pct <i>before rounding</i> is above 50. Columns: <b>day</b>, <b>name</b>, <b>kcal</b>, <b>pct</b>.",
 start:R`m = meals.copy()
m["day_kcal"] =
result = `,
 sol:R`m = meals.copy()
m["day_kcal"] = m.groupby("day")["kcal"].transform("sum")
m["meals"] = m.groupby("day")["kcal"].transform("size")
m["pct"] = m["kcal"] * 100 / m["day_kcal"]
big = m[(m["meals"] >= 2) & (m["pct"] > 50)]
result = big[["day", "name", "kcal", "pct"]].round({"pct": 1})`,
 hint:'m.groupby("day")["kcal"].transform("sum") for the day total and transform("size") for meals per day, then filter on both.'},
{id:'py9',t:'py',lv:3,title:'Flattening JSON',
 learn:['Exports and APIs hand you nested JSON: a list of records holding objects and lists. <code>pd.json_normalize(day_export)</code> makes one row per record and flattens nested objects into dotted columns (<b>checkin.sleep</b>, <b>checkin.energy</b>); a nested <i>list</i> stays in one cell, as a list. Your <b>day_export</b> is the last 14 days: <b>day</b>, a <b>checkin</b> object (None on a day you skipped, which adds a <b>checkin</b> column of NaN you can ignore) and lists of <b>trades</b>, <b>workouts</b> and <b>meals</b>.','<code>record_path="meals"</code> turns a list into rows, one per item, and <code>meta=["day"]</code> copies parent fields onto each of them; reach into a nested parent with a path, <code>meta=[["checkin", "sleep"]]</code>, plus <code>errors="ignore"</code> when some of those objects are None (NaN instead of a KeyError). But a day whose list is empty produces no rows at all, so its count isn\'t 0: the day is simply missing.','Gotchas: those vanished days are the classic bug. Count on the one-row-per-day frame (<code>days["trades"].str.len()</code> is each list\'s length, 0 when empty), or merge per-day totals onto it with how="left" and fill the totals with 0; a missing check-in stays NaN. And a key no record has gets no column: with no check-in in the export there is no <b>checkin.sleep</b>, with no meal the meals frame has no <b>protein</b>. <code>.reindex(columns=[...])</code> adds the missing ones as NaN.'],
 ex:R`print(day_export[0]["day"], day_export[0]["checkin"])
days = pd.json_normalize(day_export)                 # one row per day
print(days.columns.tolist())                         # dotted checkin columns, lists kept whole
t = pd.json_normalize(day_export, record_path="trades", meta=["day", ["checkin", "energy"]], errors="ignore")
print(t.head(3))
print("days in the trade rows:", t["day"].nunique(), "of", len(days))  # empty lists made no rows
print(days["trades"].str.len().tolist())            # trades per day, 0 included`,
 task:"Your last two weeks at a glance, straight from your export. One row for every day in <b>day_export</b>: <b>day</b>; <b>sleep</b> (from that day's <b>checkin</b>; NaN when the day has no check-in); <b>workouts</b> (how many workout entries the day holds; 0 when there are none); <b>protein</b> (the total protein of the day's meals, rounded to 1; 0 when there are none). Columns: <b>day</b>, <b>sleep</b>, <b>workouts</b>, <b>protein</b>.",
 start:R`days = pd.json_normalize(day_export)
m = pd.json_normalize(day_export, record_path="meals", meta=["day"])
result = `,
 sol:R`# reindex: the columns exist even if no day in the export has a check-in, or a meal
days = pd.json_normalize(day_export).reindex(columns=["day", "checkin.sleep", "workouts"])
out = pd.DataFrame({"day": days["day"],
                    "sleep": days["checkin.sleep"],              # NaN without a check-in
                    "workouts": days["workouts"].str.len()})     # 0 for an empty list
m = pd.json_normalize(day_export, record_path="meals", meta=["day"]).reindex(columns=["day", "protein"])
protein = m.groupby("day", as_index=False)["protein"].sum()
out = out.merge(protein, on="day", how="left").fillna({"protein": 0})
result = out.round({"protein": 1})`,
 hint:'Start from the one-row-per-day frame: count each workouts list with .str.len(), and merge the per-day protein onto it with how="left", filling only protein with 0.'},
{id:'py10',t:'py',lv:4,title:'Regex extraction from logs',
 learn:["<code>s.str.extract(pattern)</code> runs a regular expression on every line and returns one column per capture group <code>( )</code>; a line that doesn't match gets NaN. Name a group, <code>(?P&lt;load&gt;\\S+)</code>, and the column is called load. Your <b>logs</b> are lines like <code>DATE TIME APP event key=value ...</code>. A field without a value is left out of the line, so extract each key on its own: <code>load=(\\S+)</code> is NaN on lines with no load.",'Values with spaces are in double quotes. <code>name=("[^"]*"|\\S+)</code> matches either a quoted value (a quote, anything but quotes, a quote) or a run of non-spaces, and <code>.str.strip(\'"\')</code> drops the quotes. The other way, <code>name=(?:"([^"]*)"|(\\S+))</code>, gives two groups that you merge with fillna. Write patterns as raw strings, r"...", so <code>\\S</code> and <code>\\d</code> reach the regex intact.','Gotchas: whatever extract returns is text. <code>pd.to_numeric</code> it before math: summing text glues the strings together, and max compares them as text, so "97.5" beats "102.5". <code>\\d+</code> stops at the first non-digit, so it drops decimals (92.5 becomes 92) and minus signs (pnl=-305.00 doesn\'t match); <code>\\w+</code> stops at a space or hyphen (Pull-up becomes Pull). And <b>logs</b> keeps only your latest 400 events, so counts can be lower than in the tables.'],
 ex:R`s = pd.Series(logs)
u = s[s.str.contains(" REWIRE urge ")]
print(u.iloc[0])
f = u.str.extract(r"^(?P<day>\S+) (?P<clock>\S+) .* intensity=(?P<intensity>\d+)")
f["trigger"] = u.str.extract(r'trigger=("[^"]*"|\S+)')[0].str.strip('"')   # quoted or bare
f["intensity"] = pd.to_numeric(f["intensity"])                              # extract returns text
print(f.head(3))
print(f.groupby("trigger")["intensity"].agg(["size", "mean"]).round(2))`,
 task:"Your training log, rebuilt from text. From the <b>TRAINING exercise</b> lines in <b>logs</b> (your latest 400 events only, so there can be fewer than in <b>workouts</b>), per exercise (the value of <b>name=</b> without its quotes; names with spaces are quoted, the others aren't): <b>entries</b> (how many lines it has) and <b>top_load</b> (its highest <b>load=</b> value, as a number, not rounded; NaN for an exercise whose lines never have a load). Columns: <b>exercise</b>, <b>entries</b>, <b>top_load</b>.",
 start:R`s = pd.Series(logs)
tr = s[s.str.contains(" TRAINING exercise ")]
t = pd.DataFrame({
    "exercise": tr.str.extract(r'name=(...)')[0],
    "load": tr.str.extract(r"load=(...)")[0],
})
result = `,
 sol:R`s = pd.Series(logs)
tr = s[s.str.contains(" TRAINING exercise ")]
t = pd.DataFrame({
    "exercise": tr.str.extract(r'name=("[^"]*"|\S+)')[0].str.strip('"'),
    "load": pd.to_numeric(tr.str.extract(r"load=(\S+)")[0]),
})
result = t.groupby("exercise", as_index=False).agg(entries=("exercise", "size"), top_load=("load", "max"))`,
 hint:'Capture name= as a quoted value or a run of non-spaces and strip the quotes; capture load= with \\S+ and pd.to_numeric it before taking the max.'},
{id:'py11',t:'py',lv:4,title:'Dedup to latest record',
 learn:['Logs keep every version of a thing, and often you want only the newest per key: each bowl\'s latest log, each lift\'s last session. Sort by time (with id as the tie-breaker), then <code>drop_duplicates("exercise", keep="last")</code> keeps each exercise\'s last row: the pandas form of SQL\'s ROW_NUMBER() OVER (PARTITION BY exercise ORDER BY time DESC) = 1. keep="first" keeps the oldest instead, and sorting descending then keeping the first gives the same rows as ascending + last.','Always name the key: <code>drop_duplicates()</code> with no columns only drops rows identical in every column, which log rows never are. Dedup throws rows away, so take whatever needs all of them (a count, the first value) before it, with transform or a separate groupby, and join it back. <code>groupby(key).tail(1)</code> keeps the same rows as keep="last", and <code>head(1)</code> those of keep="first".',"Gotcha: <code>groupby(key).last()</code> is <i>not</i> the latest row. It takes each column's last <i>non-missing</i> value separately, so if your latest check-in skipped the scale, you get that check-in's day next to the weight of an earlier one. Decide which you mean: the latest row as it is (drop_duplicates, NaN included) or the latest row that has a value (<code>dropna(subset=[...])</code> first, then dedup)."],
 ex:R`c = checkins.sort_values("day").copy()
c["week"] = pd.to_datetime(c["day"]).dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
print(c.drop_duplicates("week", keep="last")[["week", "day", "weight"]].tail(3))      # last check-in, weight may be NaN
weighed = c.dropna(subset=["weight"])
print(weighed.drop_duplicates("week", keep="last")[["week", "day", "weight"]].tail(3))  # last weigh-in of each week
print(c.groupby("week")[["day", "weight"]].last().tail(3))   # mixes rows: last day, but the last weight found`,
 task:"Your current bowl recipes. Bowls get re-weighed, so a bowl's numbers can change from one log to the next. For each bowl <b>name</b> in <b>meals</b> (kind <b>bowl</b> only): <b>times</b> (how many times you logged it), <b>last_day</b> (the <b>day</b> of its most recent log), <b>kcal</b> (as logged that most recent time) and <b>kcal_change</b> (that kcal minus the kcal of its first log). Most recent means latest <b>time</b>, and on equal time the higher <b>id</b>; first means earliest time, then lower id. Not rounded. Columns: <b>name</b>, <b>times</b>, <b>last_day</b>, <b>kcal</b>, <b>kcal_change</b>.",
 start:R`b = meals[meals["kind"] == "bowl"].sort_values(["time", "id"])
latest = b.drop_duplicates(
result = `,
 sol:R`b = meals[meals["kind"] == "bowl"].sort_values(["time", "id"]).copy()
b["times"] = b.groupby("name")["id"].transform("size")   # count before dropping rows
latest = b.drop_duplicates("name", keep="last")
first = b.drop_duplicates("name", keep="first")[["name", "kcal"]]
r = latest.merge(first, on="name", suffixes=("", "_first"))
r["kcal_change"] = r["kcal"] - r["kcal_first"]
result = r.rename(columns={"day": "last_day"})[["name", "times", "last_day", "kcal", "kcal_change"]]`,
 hint:'Sorted by time and id, drop_duplicates("name", keep="last") is each bowl\'s latest log and keep="first" its first; count the logs before you drop any rows.'},
{id:'py21',t:'py',lv:4,title:'Running totals & drawdown',ordered:true,
 learn:['<code>cumsum()</code> turns a column into a running total: each row holds itself plus every row above it, the pandas form of SQL’s SUM(...) OVER (ORDER BY ...). <code>cummax()</code> and <code>cummin()</code> keep the highest and lowest value so far, and <code>groupby("track")["minutes"].cumsum()</code> restarts the total for each group.','For a trader they build the two curves that matter. Total pnl per day, then <code>equity = pnl.cumsum()</code> is the equity curve and <code>equity.cummax()</code> the peak so far. <b>drawdown = equity - peak</b> is 0 on a new high and negative below it; its minimum is the max drawdown, the deepest drop from a peak.','Gotchas: cumulative functions follow row order, so sort by time first (a groupby on <b>day</b> already returns days in order). Aggregate to one row per day before building a daily curve; a per-trade curve has one row per trade. <code>cummax()</code> starts at the first value, not at 0, so a curve that opens with a loss shows no drawdown on day one. If your starting balance should count as the first peak, clip the peak, not the equity: <code>equity.cummax().clip(lower=0)</code>.'],
 ex:R`s = study.sort_values("time").copy()
s["total"] = s["minutes"].cumsum()                          # all tracks so far
s["track_total"] = s.groupby("track")["minutes"].cumsum()   # restarts for each track
s["longest"] = s["minutes"].cummax()                        # longest session so far
print(s[["day", "track", "minutes", "total", "track_total", "longest"]])`,
 task:'Your <b>equity curve</b> by trading day, ordered by <b>day</b> (oldest first). Columns: <b>day</b>; <b>pnl</b> (that day’s total pnl); <b>equity</b> (running total of the daily pnl); <b>drawdown</b> (equity minus the highest equity so far, that day included: 0 on a new high, negative below it; the peak starts at your first day’s equity, not at 0). Every number rounded to 2.',
 start:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()
daily["equity"] =
daily["drawdown"] =
result = `,
 sol:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()   # one row per day, in date order
daily["equity"] = daily["pnl"].cumsum()
daily["drawdown"] = daily["equity"] - daily["equity"].cummax()
result = daily.round(2)`,
 hint:'Total pnl per day first, then equity = pnl.cumsum() and drawdown = equity - equity.cummax().'},
{id:'py22',t:'py',lv:4,title:'Filling calendar gaps',
 learn:['A log only has rows for days when something happened. <code>groupby("day")</code> never produces the days you skipped, so per-day counts lose their zeros and per-day averages come out too high. The fix is a <b>calendar spine</b>: <code>pd.date_range(start, end)</code> lists every day in a range, and you check or fill each one against the log.','Two ways to use it. <code>spine.isin(log_days)</code> (as in the anti-join lesson) marks the days that appear in the log, and <code>per_day.reindex(spine, fill_value=0)</code> puts a per-day Series onto every calendar day. Or put the dates on a DatetimeIndex: <code>resample("D").size()</code> or <code>.sum()</code> emits every day from the first to the last row, empty days as 0.','Gotchas: both sides must be real datetimes (<code>pd.to_datetime</code>): a per-day Series indexed by \'YYYY-MM-DD\' text, reindexed onto a date_range, matches nothing and comes back all zeros. Pick the range on purpose (first to last log day is not full weeks). For weekly buckets keep <code>to_period("W").dt.start_time</code> from Dates &amp; weekly buckets: <code>resample("W")</code> labels each week by the Sunday it ends on.'],
 ex:R`m = mind.assign(date=pd.to_datetime(mind["day"])).set_index("date")
per_day = m.resample("D").size()          # every calendar day, 0 when you didn't practise
print(per_day.head(8))
print("days in range:", len(per_day), "| days without a session:", (per_day == 0).sum())
print("sessions per day: logged days only", round(mind.groupby("day").size().mean(), 2),
      "| every day", round(per_day.mean(), 2))`,
 task:'Rest days per week. Take every calendar day from your first to your last <b>workouts</b> day (both included). A day with at least one workouts row is a training day; any other day is a rest day. Per week (the Monday it starts, as YYYY-MM-DD text): how many training days and rest days. The first and last weeks count only the days inside that range, so they can have fewer than 7; a week inside the range with no workouts at all still gets a row (train_days 0). Columns: <b>week</b>, <b>train_days</b>, <b>rest_days</b>.',
 start:R`days = pd.to_datetime(workouts["day"]).drop_duplicates()
cal = pd.DataFrame({"date": pd.date_range(          )})
cal["train"] =
cal["week"] =
result = `,
 sol:R`days = pd.to_datetime(workouts["day"]).drop_duplicates()
cal = pd.DataFrame({"date": pd.date_range(days.min(), days.max())})
cal["train"] = cal["date"].isin(days).astype(int)
cal["rest"] = 1 - cal["train"]
cal["week"] = cal["date"].dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
result = cal.groupby("week", as_index=False).agg(train_days=("train", "sum"), rest_days=("rest", "sum"))`,
 hint:'pd.date_range(first day, last day) gives every day; isin(training days) marks the training days; then group by the Monday week key and sum.'},
{id:'py23',t:'py',lv:4,title:'Rolling windows over time',
 learn:['A rolling window aggregates each row together with the rows just before it, a moving sum or average that smooths a noisy daily series. <code>s.rolling(7).sum()</code> uses the last 7 <i>rows</i>. <code>df.rolling("7D", on="date")["minutes"].sum()</code> uses the last 7 <i>calendar days</i>: the row’s own day and the 6 days before it.','The two only agree when there is a row for every day. Seven rows of a log with days off can stretch over two weeks, while a time window counts by the calendar, so an empty day simply adds nothing. A time window needs a datetime column, sorted ascending (or a DatetimeIndex); text dates raise a confusing <i>window must be an integer</i> error.','Gotchas: aggregate to one row per day first, or a day with two sessions gives two rows and the first one misses the second’s minutes. Time windows default to <code>min_periods=1</code>, so the first days get a partial window, while <code>rolling(7)</code> stays NaN until 7 rows exist. <code>"7D"</code> on a timestamp like <b>time</b> means 168 hours back from that moment, not 7 calendar days, so roll on the date.'],
 ex:R`c = checkins.assign(date=pd.to_datetime(checkins["day"])).sort_values("date")
c["avg_7_rows"] = c["energy"].rolling(7).mean()                # your last 7 check-ins
c["avg_7_days"] = c.rolling("7D", on="date")["energy"].mean()  # check-ins in the last 7 calendar days
print(c[["day", "energy", "avg_7_rows", "avg_7_days"]].round(2).tail(10))`,
 task:'Your rolling mindfulness load. Total the <b>mind</b> minutes per <b>day</b>; then, for each day you practised: <b>day</b>, <b>minutes</b> (that day’s total) and <b>last_7d</b> (total minutes over the 7 calendar days ending that day: the day itself and the 6 before it; days without a session add nothing, and near your first day the window just covers fewer days). Calendar days come from <b>day</b>, not <b>time</b>. Not rounded (whole minutes). Columns: <b>day</b>, <b>minutes</b>, <b>last_7d</b>.',
 start:R`d = mind.groupby("day", as_index=False)["minutes"].sum()
d["date"] = pd.to_datetime(d["day"])
d["last_7d"] =
result = `,
 sol:R`d = mind.groupby("day", as_index=False)["minutes"].sum()   # one row per day, in date order
d["date"] = pd.to_datetime(d["day"])
d["last_7d"] = d.rolling("7D", on="date")["minutes"].sum()
result = d[["day", "minutes", "last_7d"]]`,
 hint:'Use a time window, not a row count: rolling("7D", on="date") over the per-day totals, then sum the minutes.'},
{id:'py24',t:'py',lv:4,title:'Streaks: runs of consecutive days',
 learn:['Streaks are a gaps-and-islands problem. Sort the distinct dates and flag each one whose gap to the previous date isn’t exactly 1 day: <code>diff().dt.days.ne(1)</code> (from shift &amp; diff). The <code>cumsum()</code> of those True/False flags (from running totals) counts the run starts so far, so every row of one run shares the same number: a <b>run id</b>. Group by it for the start (min), end (max) and length (size).','The same flag-and-cumsum trick labels runs of anything: <code>s.ne(s.shift()).cumsum()</code> gives a new id each time a value changes, which finds runs of winning trades, losing days or high-energy mornings.','Gotchas: deduplicate days first; two logs on one day give a gap of 0, which breaks the run. Take the gap within each key, <code>groupby("habit")["date"].diff()</code>, so one habit’s run can’t continue into another’s. The first row of each group has a NaN gap; <code>ne(1)</code> is True for NaN, so it correctly starts a run. A run’s length is end - start + 1 days, not end - start.'],
 ex:R`t = trades.sort_values("id").copy()
t["result"] = np.where(t["pnl"] > 0, "win", "no win")
t["run"] = t["result"].ne(t["result"].shift()).cumsum()   # new id whenever the label changes
runs = t.groupby("run").agg(result=("result", "first"), trades=("id", "size"),
                            first_day=("day", "min"), pnl=("pnl", "sum"))
longest = runs.sort_values(["trades", "first_day"], ascending=[False, True]).drop_duplicates("result")
print(longest)   # your longest run of each kind`,
 task:'Your good-habit streaks. From the <b>habits</b> rows with event <b>done</b>, find every run of consecutive calendar days on which you did each habit: several logs of one habit on one day count as one day, and a day without it ends the run. One row per run. Columns: <b>habit</b>, <b>start</b> and <b>end</b> (the run’s first and last day, as YYYY-MM-DD text), <b>days</b> (its length in days; a single day is a streak of 1).',
 start:R`d = habits[habits["event"] == "done"][["habit", "day"]].drop_duplicates().copy()
d["date"] = pd.to_datetime(d["day"])
d = d.sort_values(["habit", "date"])
d["run"] =
result = `,
 sol:R`d = habits[habits["event"] == "done"][["habit", "day"]].drop_duplicates().copy()
d["date"] = pd.to_datetime(d["day"])
d = d.sort_values(["habit", "date"])
gap = d.groupby("habit")["date"].diff().dt.days
d["run"] = gap.ne(1).cumsum()          # a new id at each habit's first day and after every gap
result = d.groupby(["habit", "run"], as_index=False).agg(start=("day", "min"), end=("day", "max"), days=("day", "size"))
result = result[["habit", "start", "end", "days"]]`,
 hint:'Within each habit, a gap that isn’t 1 day starts a new run: gap.ne(1).cumsum() is the run id; then group by habit and run id.'},
/* ---------- SAS ---------- */
{id:'sas1',t:'sas',lv:1,title:'The DATA step',
 learn:['A <b>DATA step</b> builds a data set one row at a time. <code>data shorts;</code> names the output, <code>set work.trades;</code> reads the input row by row, the statements in between run once per row, and <code>run;</code> ends the step. At the bottom of each pass SAS writes the row out and goes back to the top. Every statement ends with a semicolon. Your logs are work.trades, work.workouts, work.mind, work.meals, work.habits, work.checkins and work.study; a one-level name like shorts is saved beside them, in WORK (the next lesson, on libraries, explains it).',"<b>WHERE</b> keeps the rows that pass a test: <code>where side = 'Short';</code>. Text goes in quotes and must match exactly, case included: <code>'short'</code> matches nothing, the step still runs, and the log says <i>NOTE: The data set WORK.SHORTS has 0 observations and 13 variables.</i> Numbers go bare (<code>where pnl &lt; 0;</code>): <code>pnl &lt; '0'</code> stops with <i>ERROR: WHERE clause operator requires compatible variables.</i> Join several tests in one WHERE with AND and OR.",'<b>KEEP</b> names the columns to write (<code>keep day contract qty pnl;</code>), <b>DROP</b> the ones to leave out (<code>drop account entry exit;</code>). Both act on the output only: the step still reads every input column, so WHERE can test side when side is not kept. KEEP does not reorder: columns come out in the input&rsquo;s order. Check the log after each step for the rows read (with a WHERE, only those that passed) and the rows and columns written: <i>NOTE: The data set WORK.SHORTS has N observations and 4 variables.</i>'],
 ex:R`/* your losing Short trades */
data short_losses;
  set work.trades;                    /* reads work.trades one row at a time */
  where side = 'Short' and pnl < 0;   /* text in quotes, exact case; numbers bare */
  keep day contract qty pnl;          /* side is tested above, but not written */
run;

/* DROP names what to leave out instead: everything but weight */
data checkins_lite;
  set work.checkins;
  drop weight;
run;`,
 quiz:{q:"What does <code>data shorts; set work.trades; where side = 'Short'; keep day contract pnl; run;</code> do?",o:['Writes the Short trades, with only day, contract and pnl as columns','Stops with an ERROR: WHERE can only test a column that KEEP lists','Writes the Short trades, plus side: a column WHERE tests is always kept','Writes 0 rows, because KEEP removes side before the WHERE can test it'],a:0,why:'KEEP decides which columns are written to shorts, but the step still reads every column of work.trades, so the WHERE can test side. The result is the Short trades with day, contract and pnl, and no side column. A column is never added to the output because a WHERE used it, and KEEP removes nothing before the WHERE runs.'},
 prac:{task:'Your protein snacks. Write a DATA step that creates <b>protein_snacks</b> from work.meals with the snacks (<b>kind</b> is <b>snack</b>, lowercase as logged) that have at least 10 g of <b>protein</b>, both tests in one WHERE statement. Write only day, name, kcal and protein (they are already in that order in work.meals), without kind. Then read the log: how many observations does it say were read from work.meals, and how many observations and variables does protein_snacks have?',sol:R`data protein_snacks;
  set work.meals;
  where kind = 'snack' and protein >= 10;   /* 'snack' quoted, exact case; 10 bare */
  keep day name kcal protein;               /* kind is tested but not written */
run;

/* log:
   NOTE: There were N observations read from the data set WORK.MEALS.
   NOTE: The data set WORK.PROTEIN_SNACKS has N observations and 4 variables.
   The same N twice: with a WHERE, only the rows that pass are read
   (your protein shakes and Greek yogurts). */`}},
{id:'sas9',t:'sas',lv:1,title:'Libraries: WORK vs permanent',
 learn:['A <b>libref</b> is a short nickname (up to 8 characters) for a folder of SAS data sets: <code>libname isx "~/isionlogs";</code>. Every data set has a two-level name, <i>library.member</i>, so <b>isx.trades</b> is the file trades.sas7bdat in that folder. A one-level name means WORK: <code>data wins;</code> writes <b>work.wins</b>, and your app logs sit in WORK too (work.trades, work.checkins, …).','WORK is scratch space: SAS deletes it when the session ends, and in SAS Studio that means every sign-out, timeout or <i>Reset SAS Session</i>. Anything you want next week goes to a permanent library: write it there (<code>data isx.wins;</code>) or copy it with a <b>procedure</b> (PROC), one of SAS&rsquo;s built-in tools, run as a PROC step that ends with RUN like a DATA step: <code>proc copy in=work out=isx; select workouts mind; run;</code>. The libref itself only lasts for the session, so the LIBNAME has to run again each time: put it in your autoexec file.','<b>PROC CONTENTS</b> shows what you have: <code>data=isx._all_ nods</code> lists a library&rsquo;s members, and <code>data=isx.trades</code> lists every column with its type (Num or Char), length and format. Run it on any table before you trust a column: in these lessons <b>day</b> and <b>time</b> are Char (10 and 19 long), not SAS dates. Gotcha: LIBNAME does not create the folder. Make it in the Files pane first, or run <code>options dlcreatedir;</code> before the LIBNAME.'],
 ex:R`/* a permanent library: the folder must already exist */
libname isx "~/isionlogs";

/* two-level name: saved in ~/isionlogs, still there next session */
data isx.meals;
  set work.meals;
run;

/* one-level name = work.bowls: deleted when you sign out */
data bowls;
  set isx.meals;
  where kind = 'bowl';
run;

/* the columns of isx.meals, in table order */
proc contents data=isx.meals varnum;
run;`,
 quiz:{q:'You run <code>data wins; set work.trades; where pnl &gt; 0; run;</code> and sign out of SAS Studio. Where is <b>wins</b> when you sign back in?',o:['In your home folder, as wins.sas7bdat','In SASUSER, which keeps your data between sessions','Gone: it was WORK.wins, and WORK is deleted at sign-out','Still in WORK, until you delete it with PROC DATASETS'],a:2,why:'wins has no libref, so SAS writes it to WORK, the scratch library it deletes at the end of every session (sign-out, timeout or Reset SAS Session). Nothing goes to your home folder or to SASUSER unless you name a library that points there. To keep it, assign a permanent libref and write data isx.wins; instead.'},
 prac:{task:'Make your logs permanent. Assign the libref <b>isx</b> to the folder <b>~/isionlogs</b>, in a way that works even if the folder does not exist yet, and copy <b>work.trades</b> and <b>work.checkins</b> into it. Then run PROC CONTENTS twice: once to list only the library&rsquo;s members (no column details per table), once on <b>isx.trades</b> to read the type and length of <b>day</b> and <b>pnl</b>. Next session, which statement must run again before isx.trades works?',sol:R`options dlcreatedir;          /* lets LIBNAME create ~/isionlogs if it is missing */
libname isx "~/isionlogs";

proc copy in=work out=isx;
  select trades checkins;
run;

/* the members of the library */
proc contents data=isx._all_ nods;
run;

/* the columns of isx.trades: day is Char 10, pnl is Num 8 */
proc contents data=isx.trades;
run;

/* the same copy with DATA steps:
   data isx.trades;   set work.trades;   run;
   data isx.checkins; set work.checkins; run;

   Next session: the LIBNAME. The libref ends with the session,
   the files in ~/isionlogs do not. */`}},
{id:'sas10',t:'sas',lv:1,title:'PROC IMPORT: reading CSV & Excel',
 learn:['<b>PROC IMPORT</b> turns a CSV or Excel file into a SAS data set: <code>proc import datafile="~/isionlogs/meals.csv" out=work.meals_csv dbms=csv replace; getnames=yes; run;</code>. DBMS= names the file type (CSV, TAB or XLSX; a workbook also takes <code>sheet=\'name\';</code>) and GETNAMES=YES takes the column names from the first row. REPLACE overwrites the data set if it exists; without it the log says the import was cancelled and you keep working on the old table.','The gotcha: for a CSV, PROC IMPORT guesses each column&rsquo;s type and length from the first rows only (20 by default in SAS 9.4) and never looks again. A longer text value further down is silently cut short, and a column that looked numeric turns later text into missing values. Add <code>guessingrows=max;</code> to scan the whole file. Dates get a guess too: YYYY-MM-DD text becomes a numeric SAS date with format YYMMDD10. (the dates lesson explains), so check the result with PROC CONTENTS.','<b>PROC EXPORT</b> is the mirror image: <code>proc export data=work.meals outfile="~/isionlogs/meals.csv" dbms=csv replace; run;</code> writes a data set out as CSV (or XLSX), column names in the first row. For a CSV, PROC IMPORT writes a DATA step for you and shows it in the log. When you need full control of types and lengths, copy that step or write your own with <code>infile ... dsd firstobs=2;</code> and INPUT.'],
 ex:R`/* a workbook: one sheet into one data set */
proc import datafile="~/isionlogs/study.xlsx"
            out=work.study_xl
            dbms=xlsx
            replace;
  sheet="study";
  getnames=yes;
run;

data sas_only;
  set work.study_xl;
  where track = 'SAS';
run;

/* and back out as a CSV */
proc export data=sas_only
            outfile="~/isionlogs/sas_study.csv"
            dbms=csv
            replace;
run;`,
 quiz:{q:'You import habits.csv with <code>dbms=csv replace; getnames=yes;</code> and no other options. Months later you log a new trigger, <b>Argument with partner</b>, and run the import again. Far down the file, it arrives in SAS as <b>Argument with</b>. Why?',o:["Its length was set from the first 20 rows, whose longest trigger is 'Phone in hand' (13 characters); add GUESSINGROWS=MAX","REPLACE keeps the old table's column lengths, so the new value is cut to fit; delete the table before importing",'The value contains spaces, so it has to be quoted in the CSV, or SAS stops reading at a blank','CSV text columns have a fixed maximum length; save the log as .xlsx and use DBMS=XLSX'],a:0,why:"PROC IMPORT guesses each column's type and length from the rows it scans (20 by default in SAS 9.4) and never looks again. The longest trigger there was 'Phone in hand', so trigger became Char 13 and any longer value is cut to 13 characters with no error. GUESSINGROWS=MAX scans the whole file. REPLACE rewrites the whole table, lengths included; a CSV field ends at a comma, not a blank; and CSV text has no fixed cap."},
 prac:{task:'Round-trip your REWIRE log. First write <b>work.habits</b> out as <b>~/isionlogs/habits.csv</b> with PROC EXPORT (the folder from the libraries lesson). Then import that file into <b>work.habits_csv</b>: column names from the first row, types and lengths guessed from every row, and overwrite the table if it already exists. Run PROC CONTENTS on it and note the type and length of <b>trigger</b> and the type and format of <b>day</b>. Why is day no longer the Char 10 column it is in work.habits?',sol:R`/* the file: work.habits written out as CSV, names in row 1 */
proc export data=work.habits
            outfile="~/isionlogs/habits.csv"
            dbms=csv
            replace;
run;

proc import datafile="~/isionlogs/habits.csv"
            out=work.habits_csv
            dbms=csv
            replace;
  getnames=yes;
  guessingrows=max;     /* scan every row, not just the first 20 */
run;

proc contents data=work.habits_csv varnum;
run;

/* trigger: Char 13 ('Phone in hand' is the longest trigger)
   day:     Num 8, format YYMMDD10. The CSV holds day as text like
            2026-10-01; PROC IMPORT recognised the YYYY-MM-DD pattern
            and stored a SAS date, which is a number. */`}},
{id:'sas2',t:'sas',lv:1,title:'PROC SORT & PROC PRINT',
 learn:["<b>PROC SORT</b> orders rows by its BY variables: <code>by exercise time;</code> sorts by exercise, then by time within each exercise. <b>DESCENDING</b> goes <i>before</i> the one variable it reverses: <code>by descending pnl day;</code> is pnl high to low, then day oldest first. Rows that tie on every BY variable keep the order they had, so add <b>id</b> as a last key when ties must come out in time order. <b>day</b> ('YYYY-MM-DD') and <b>time</b> are text that sorts in date order. MERGE and BY group steps later need sorted input.",'Without <b>OUT=</b>, PROC SORT writes the sorted rows back over its input: <code>proc sort data=work.trades; by pnl; run;</code> leaves work.trades in pnl order. With <b>NODUPKEY</b> it is worse: only the first row of each BY value (in the current order) survives, the rest are deleted from the input itself, and the log only gives a count: <i>NOTE: N observations with duplicate key values were deleted.</i> So sort into a new data set (<code>out=trade_days</code>). NODUPKEY compares only the BY variables, not whole rows.','<b>PROC PRINT</b> shows a data set in Results, in stored order (sort first for a top 5): <code>var day contract pnl;</code> picks the columns and their order, and <b>NOOBS</b> drops the Obs column. <code>(obs=5)</code> after a data set name is a <b>data set option</b>, for that one data set: <code>data=best(obs=5)</code> prints the first 5 rows. <code>(keep=day)</code> on an input reads only those columns, while the KEEP statement of the DATA step lesson limits what is written.'],
 ex:R`/* your 5 best trades: a sorted copy, then its top rows */
proc sort data=work.trades out=best;   /* OUT=: work.trades keeps its order */
  by descending pnl closed;            /* pnl high to low; ties: earliest close first */
run;

proc print data=best(obs=5) noobs;     /* first 5 rows, no Obs column */
  var day contract side pnl;           /* these columns, in this order */
run;

/* which contract and side pairs have you traded? */
proc sort data=work.trades(keep=contract side) out=setups nodupkey;
  by contract side;                    /* one row per pair */
run;`,
 quiz:{q:'To list the days you traded, you run <code>proc sort data=work.trades nodupkey; by day; run;</code>. What happens to <b>work.trades</b>?',o:['Nothing: without OUT=, PROC SORT only prints the sorted rows','It is overwritten: sorted by day, with one trade left per day','It is sorted by day, and the log lists the repeated days it found','It keeps every trade: NODUPKEY drops only rows identical in every column'],a:1,why:'With no OUT=, PROC SORT writes its result back over the input, and NODUPKEY keeps only the first row for each day, so work.trades now holds one trade per day; the log gives the number deleted, not the rows. PROC SORT prints nothing, and NODUPKEY compares only the BY variables, so trades that differ in every other column still count as duplicates. Add out=trade_days to leave work.trades as it was.'},
 prac:{task:'Two sorts, and work.workouts must keep its own order in both. (1) Create <b>wk_sorted</b>: work.workouts by exercise (A to Z), then load from heaviest to lightest, then time (earliest first). Print its first 10 rows with only exercise, day, sets, reps and load, in that order, without the Obs column. (2) Create <b>train_days</b> with one row per day you logged a workout and <b>day</b> as its only column, in date order. How many rows does the log say were deleted, and what do they add up to with the rows of train_days?',sol:R`/* (1) a sorted copy: work.workouts keeps its order */
proc sort data=work.workouts out=wk_sorted;
  by exercise descending load time;   /* DESCENDING reverses load only */
run;

proc print data=wk_sorted(obs=10) noobs;
  var exercise day sets reps load;
run;

/* (2) one row per training day, day only */
proc sort data=work.workouts(keep=day) out=train_days nodupkey;
  by day;
run;

/* log: NOTE: ... observations with duplicate key values were deleted.
   Deleted rows + rows of train_days = rows of work.workouts.
   Exercises with no load (Pull-up, Run, stretches) have none on any
   row, so within them time alone sets the order. */`}},
{id:'sas11',t:'sas',lv:1,title:'New columns with IF-THEN/ELSE',
 learn:['An assignment statement makes a new column, computed row by row: <code>hours = minutes / 60;</code>. <b>IF-THEN / ELSE IF / ELSE</b> picks one value per row, and <code>then do; ... end;</code> runs several statements under one condition. SAS tests the conditions top to bottom and stops at the first true one, so the order matters: after <code>if sleep &lt; 7 then ...</code>, a later <code>else if sleep &lt; 6</code> can never fire.',"The gotcha: SAS sets a new character column&rsquo;s length once, when it compiles the step, from the first place the column appears in your code. If that is <code>result = 'win';</code>, result is 3 characters long, so 'loss' is stored as 'los' and 'flat' as 'fla', with no error or warning. Declare it before the IFs: <code>length result $ 4;</code> (the $ means text, and 4 fits the longest label).","<code>round(x, 0.01)</code> rounds to 2 decimals: the second argument is the unit to round to, so <code>round(x, 2)</code> gives the nearest multiple of 2, not 2 decimals. Text comparisons are case-sensitive (<code>side = 'long'</code> matches nothing). Conditions combine with AND and OR, and IN tests a list: <code>if contract in ('NQZ6', 'ESZ6') then ...</code>."],
 ex:R`/* label each night by how long you slept */
data nights;
  set work.checkins;
  length night $ 6;               /* longest label: 'rested' */
  if sleep < 6 then do;           /* two statements, one condition */
    night = 'short';
    debt = 7.5 - sleep;           /* hours under a 7.5-hour night (missing on other nights) */
  end;
  else if sleep < 7.5 then night = 'ok';
  else night = 'rested';
  sleep_min = sleep * 60;
  keep day sleep energy night debt sleep_min;
run;`,
 quiz:{q:"<code>if pnl &gt; 0 then result = 'win'; else if pnl &lt; 0 then result = 'loss'; else result = 'flat';</code> runs on work.trades with no LENGTH statement. What is stored in <b>result</b> for a losing trade?",o:["'loss'",'A blank (missing) value',"Nothing: the step stops with an error because 'loss' does not fit","'los'"],a:3,why:"SAS fixes a new character column's length at compile time, from the first place it appears: result = 'win' gives length 3. Every later value is cut to 3 characters with no error or warning, so losses read 'los' and break-evens 'fla'. length result $ 4; before the IFs fixes it."},
 prac:{task:"Label every trade. Create <b>trade_labels</b> from work.trades with <b>result</b> = 'win' when pnl &gt; 0, 'loss' when pnl &lt; 0 and 'flat' otherwise (stored in full, not cut short), and <b>hours</b> = minutes / 60, stored rounded to 2 decimals with ROUND (not just displayed with a format). Keep id, day, contract, side, pnl, result and hours, in any order. Then print the first 10 rows to check that the losses read 'loss'.",sol:R`data trade_labels;
  set work.trades;
  length result $ 4;              /* before the IFs, or 'loss' is cut to 'los' */
  if pnl > 0 then result = 'win';
  else if pnl < 0 then result = 'loss';
  else result = 'flat';           /* pnl = 0: break-even */
  hours = round(minutes / 60, 0.01);
  keep id day contract side pnl result hours;
run;

proc print data=trade_labels(obs=10);
run;`}},
{id:'sas12',t:'sas',lv:1,title:'PROC FREQ: counts & crosstabs',
 learn:['<b>PROC FREQ</b> counts rows per value. <code>tables trigger;</code> prints a one-way table: Frequency, Percent, Cumulative Frequency and Cumulative Percent for each trigger, sorted by value. <code>order=freq</code> on the PROC statement lists the most frequent values first. A WHERE statement filters the rows before they are counted, for every table in the step, and <code>/ out=name</code> on the TABLES statement saves the counts as a data set (the value, COUNT and PERCENT).','An asterisk makes a crosstab: <code>tables habit*event;</code> puts habit down the side and event across the top, and each cell shows its count plus the percent of all rows, the row percent and the column percent. <code>/ norow nocol nopercent</code> leaves just the counts. Gotcha: <code>tables habit event;</code> with a space is not a crosstab: it asks for two separate one-way tables.','Missing values are left out. The <i>done</i> rows in <b>work.habits</b> have no trigger, so <code>tables trigger;</code> counts only your urges, its percents are shares of the urges, and the done rows appear as one line under the table: Frequency Missing (the missing-values lesson shows how to count them). Run PROC FREQ first on any new table: typos, odd codes and gaps show up at once.'],
 ex:R`/* losing trades: which contracts, and Long vs Short within each */
proc freq data=work.trades order=freq;
  where pnl < 0;
  tables contract / out=loser_counts;       /* one-way, counts saved */
  tables contract*side / nocol nopercent;   /* crosstab: count + row % */
run;`,
 quiz:{q:'What does <code>proc freq data=work.habits; tables habit event; run;</code> produce?',o:['A crosstab of habit by event','One table that lists each habit-event pair with its count','Two separate one-way tables: one for habit, one for event','An error: two variables need an asterisk between them'],a:2,why:'A space separates two requests, so you get a one-way table of habit and another one of event. habit*event makes the crosstab, and habit*event / list prints the pairs as rows. Listing several variables is valid, so there is no error.'},
 prac:{task:'Practice on <b>work.habits</b>. (1) Check how the log is coded: a crosstab of <b>habit</b> by <b>event</b> over all rows, showing counts only. Each urge habit should only get resisted or slipped, and each good habit only done. (2) Which triggers bring your strongest urges? A one-way table of <b>trigger</b> for the urges (event resisted or slipped) with <b>intensity</b> 7 or more, most frequent first, with the counts saved to <b>strong_triggers</b>.',sol:R`/* (1) every row: habit down the side, event across, counts only */
proc freq data=work.habits;
  tables habit*event / norow nocol nopercent;
run;

/* (2) strong urges only, most frequent trigger first, counts saved.
   A separate step: a WHERE applies to every table in its step */
proc freq data=work.habits order=freq;
  where event in ('resisted', 'slipped') and intensity >= 7;
  tables trigger / out=strong_triggers;   /* trigger, COUNT, PERCENT */
run;`}},
{id:'sas13',t:'sas',lv:2,title:'Subsetting IF vs WHERE',
 learn:["A DATA step can drop rows in two ways. <b>WHERE</b> filters rows <i>as they are read</i>: a row of <b>work.trades</b> that fails never enters the step, which is why it is fast on big tables, and it works in PROC steps too (<code>proc print; where side = 'Short';</code>). A <b>subsetting IF</b> is an IF with no THEN, such as <code>if hours &gt; 0.5;</code>. When it is false, SAS stops working on that row and goes back to the top of the step, so the row is not written.",'The catch: WHERE only sees columns already in the input data set. A column computed in the step (<code>hours = minutes / 60;</code>) does not exist yet when WHERE runs, so <code>where hours &gt; 0.5;</code> stops the step with <i>ERROR: Variable hours is not on file WORK.TRADES.</i> An expression on input columns is fine (<code>where minutes / 60 &gt; 0.5;</code>). Anything made inside the step needs IF: computed columns, the IN= flags of a MERGE (end of this level) and FIRST./LAST. (next level).',"Rule of thumb: WHERE for input columns (early and cheap), IF for anything computed. It is the same idea as WHERE vs HAVING in SQL: the difference is <i>when</i> the filter runs. Gotchas: a subsetting IF only sees what was computed <i>above</i> it, so put it after the assignment (above it, hours is still missing and every row is dropped). A subsetting IF is not allowed in a PROC step. WHERE has operators IF lacks: <code>between 10 and 30</code>, <code>like 'NQ%'</code>, <code>is missing</code>."],
 ex:R`/* your big-volume sets: WHERE on an input column, IF on a computed one */
data big_sets;
  set work.workouts;
  where type = 'Weighted';        /* input column: filtered as rows are read */
  volume = sets * reps * load;
  if volume >= 3000;              /* computed in the step: only IF can see it */
  keep day exercise sets reps load volume;
run;

/* WHERE also works in a PROC step; a subsetting IF does not */
proc print data=work.workouts;
  where type = 'Cardio';
  var day exercise distance minutes;
run;`,
 quiz:{q:'In a DATA step on <b>work.trades</b> you compute <code>hours = minutes / 60;</code> and then write <code>where hours &gt; 0.5;</code>. What happens?',o:['It keeps the trades held over 30 minutes, just like if hours > 0.5;','The WHERE is skipped with a WARNING, and every row is written','No rows are written, because hours is still missing when WHERE tests it','The step stops with ERROR: Variable hours is not on file WORK.TRADES.'],a:3,why:'WHERE filters rows as they are read from WORK.TRADES, before any statement in the step runs, so it can only name columns that data set already has. hours is created inside the step, so SAS stops with that error and writes nothing. Use a subsetting IF after the assignment (if hours > 0.5;) or test the input column (where minutes > 30;).'},
 prac:{task:'Your patient winners. Create <b>long_wins</b> from work.trades with the winning trades (<b>pnl &gt; 0</b>, filtered with WHERE) that you held for more than half an hour: compute <b>hours = minutes / 60</b> (not rounded) in the step and filter it with a subsetting IF. Keep day, contract, side, hours and pnl. Then list only the Short ones from long_wins with PROC PRINT.',sol:R`data long_wins;
  set work.trades;
  where pnl > 0;            /* input column: filtered as rows are read */
  hours = minutes / 60;
  if hours > 0.5;           /* computed column: subsetting IF, after the assignment */
  keep day contract side hours pnl;
run;

proc print data=long_wins;
  where side = 'Short';     /* in a PROC step only WHERE works */
run;`}},
{id:'sas3',t:'sas',lv:2,title:'PROC SQL',
 learn:['<b>PROC SQL</b> runs the SQL you know on SAS data sets (<code>from work.trades</code>). A SELECT on its own prints a report; <code>create table contract_pnl as select …</code> saves a data set and prints nothing. Each statement runs as soon as it is read, so one step can hold several queries, and it ends with <b>QUIT</b>: a RUN only earns <i>NOTE: PROC SQL statements are executed immediately; The RUN statement has no effect.</i> Unlike KEEP or VAR lists, SQL separates columns with commas.',"SAS adds column options after the alias: <code>sum(pnl) as net format=dollar12.2 label='Net PnL'</code> (a <b>format</b> only changes the display: dollar12.2 shows $1,234.50, and 5.1 one decimal). WHERE sees only table columns, as in a DATA step (the subsetting IF lesson), so to reuse an alias in WHERE or in another column, write <b>CALCULATED</b>: <code>where calculated hours &gt; 1</code>. Without it: <i>ERROR: The following columns were not found in the contributing tables: hours.</i> ORDER BY takes the alias as it is, and HAVING filters groups as in the SQL track.",'The SAS-only trap: most databases reject a selected column that is neither grouped nor summarised, and SQLite returns one row per group anyway. PROC SQL <i>remerges</i>: <code>select contract, day, sum(pnl) as net from work.trades group by contract;</code> puts each contract&rsquo;s total on every one of its rows, so you get one row per trade, with only <i>NOTE: The query requires remerging summary statistics back with the original data.</i> That NOTE usually means a column is missing from GROUP BY.'],
 ex:R`proc sql;
  /* 1. saved as a data set: nothing is printed */
  create table contract_pnl as
  select contract,
         count(*) as trades,
         sum(pnl) as net format=dollar12.2 label='Net PnL'
  from work.trades
  group by contract
  order by net desc;              /* ORDER BY takes the alias as it is */

  /* 2. a plain SELECT prints a report: trades held over an hour */
  select day, contract, side,
         minutes / 60 as hours format=5.2,
         pnl
  from work.trades
  where calculated hours > 1;     /* an alias in WHERE needs CALCULATED */
quit;                             /* QUIT ends PROC SQL; RUN does nothing here */`,
 quiz:{q:'In PROC SQL you run <code>select contract, day, sum(pnl) as net from work.trades group by contract;</code>. What comes back?',o:['One row per contract, with day taken from one of its trades','An ERROR, because day is neither grouped nor summarised',"One row per trade, each with its contract's total as net",'One row per contract and day, as if day were grouped too'],a:2,why:"PROC SQL sums pnl per contract and, because day is neither grouped nor summarised, remerges that total onto every input row: one row per trade, each showing its contract's net, with only a NOTE in the log that the query requires remerging summary statistics. Most databases would stop with an error and SQLite would return one row per contract, but SAS does neither, and GROUP BY never adds a column you did not list. Add day to GROUP BY for one row per contract and day, or take it out of the SELECT."},
 prac:{task:'Your study pace per track. With PROC SQL, create <b>track_pace</b> from work.study with one row per track and the columns track, <b>sessions</b> (count of rows), <b>total_min</b> (sum of minutes), <b>total_lessons</b> (sum of lessons) and <b>min_per_lesson</b> (total_min divided by total_lessons, built from those two aliases with CALCULATED and shown with 1 decimal by a format, not rounded), highest min_per_lesson first. Print it with a second query in the same PROC SQL step. Then run the CREATE TABLE query once more with <b>day</b> added after track in the SELECT but not in GROUP BY: what does the log say, and how many rows does it say track_pace now has?',sol:R`proc sql;
  create table track_pace as               /* saved, not printed */
  select track,
         count(*)     as sessions,
         sum(minutes) as total_min,
         sum(lessons) as total_lessons,
         calculated total_min / calculated total_lessons
                      as min_per_lesson format=5.1   /* any w.1 format */
  from work.study
  group by track
  order by min_per_lesson desc;

  select * from track_pace;                /* now printed */
quit;

/* sum(minutes) / sum(lessons) gives the same min_per_lesson.

   With day in the SELECT but not in GROUP BY:
   NOTE: The query requires remerging summary statistics back with the original data.
   NOTE: Table WORK.TRACK_PACE created, with N rows and 6 columns.
   N is the number of rows in work.study: one row per study session,
   not per track, each carrying its track's totals. */`}},
{id:'sas14',t:'sas',lv:2,title:'Missing values in SAS',
 learn:['A missing number is a period (<b>.</b>) and a missing character value is a blank. In <b>work.habits</b> the <i>done</i> rows have no intensity and no trigger. The rule to remember: SAS treats a missing number as <b>smaller than any number</b>. It sorts first, and <code>intensity &lt; 5</code> is <i>true</i> when intensity is missing, so <code>where intensity &lt; 5;</code> quietly keeps every done row as well.','PROC SQL in SAS compares missing values the same way: it does not use the NULL logic of the SQL track. Guard the filter: <code>where intensity is not missing and intensity &lt; 5;</code>, or in an IF, <code>if . &lt; intensity &lt; 5;</code>. MISSING(x) works for numbers and text. PROC FREQ leaves missing values out of the table and the percents (it prints Frequency Missing under it) unless you add <code>/ missing</code> to the TABLES statement.','Arithmetic spreads missing: <code>mood_after - mood_before</code> is . when either is missing, and the log says <i>NOTE: Missing values were generated as a result of performing an operation on missing values.</i> Functions skip it: SUM() and MEAN() use only the values present (if all are missing the result is .), N() counts the values present and NMISS() the missing ones. In PROC SQL, AVG and COUNT(col) skip missing values; COUNT(*) counts every row.'],
 ex:R`/* did each session lift your mood? (moods are missing when you skipped rating) */
data mood_lift;
  set work.mind;
  lift     = mood_after - mood_before;           /* . if either is missing: NOTE in the log */
  avg_mood = mean(mood_before, mood_after);      /* averages whichever were rated */
  skipped  = nmiss(mood_before, mood_after, depth);   /* 0 to 3 scores left blank */
  dipped   = (. < lift < 0);   /* 1 if the mood dropped; lift < 0 alone would flag missing lifts */
  keep day practice mood_before mood_after depth lift avg_mood skipped dipped;
run;

proc sql;
  select practice,
         count(*)    as sessions,
         count(lift) as with_lift,              /* missing lifts are not counted... */
         avg(lift)   as avg_lift format=5.2     /* ...and not averaged as 0 */
  from mood_lift
  group by practice;
quit;`,
 quiz:{q:'In <b>work.habits</b> the done rows have no intensity. Which is true of <code>where intensity &lt; 5;</code>?',o:['It keeps the urges rated under 5 and every done row, in a DATA step and in PROC SQL alike','It keeps only the urges rated under 5, because a comparison with a missing value is never true','A DATA step keeps the done rows, but PROC SQL drops them, as standard SQL does with NULL','It stops with an error, because some rows have no intensity'],a:0,why:'SAS treats a missing number as smaller than any number, so . < 5 is true and every done row passes the filter. PROC SQL in SAS follows the same rule, not ANSI NULL logic. Guard it: where intensity is not missing and intensity < 5; (or if . < intensity < 5;).'},
 prac:{task:'Your mild urges. (1) Run <code>data test; set work.habits; where intensity &lt; 5; run;</code> and note in the log how many rows it wrote. (2) Create <b>mild_urges</b> from work.habits with the rows whose intensity is under 5, written so that the done rows (intensity is .) cannot get in. Keep day, habit, event, intensity and trigger, and compare its row count with (1). (3) Run PROC FREQ on work.habits for intensity so the done rows show up as their own level, counted in the percents.',sol:R`/* (1) the trap: done rows (intensity = .) count as "under 5" */
data test;
  set work.habits;
  where intensity < 5;
run;

/* (2) rated rows only */
data mild_urges;
  set work.habits;
  where intensity is not missing and intensity < 5;   /* or: if . < intensity < 5; */
  keep day habit event intensity trigger;
run;

/* (3) missing as its own level */
proc freq data=work.habits;
  tables intensity / missing;
run;`}},
{id:'sas15',t:'sas',lv:2,title:'Character functions: SUBSTR, SCAN, CATX',
 learn:["Codes often pack several facts into one string. Your contracts are root + month code + year digit: <b>NQZ6</b> is NQ, Z (December), 6 (2026). <code>substr(s, start, len)</code> cuts by position, <code>scan(s, n, ' ')</code> takes the nth word (a negative n counts from the right) and <code>length(s)</code> gives the length without trailing blanks. So <code>substr(contract, 1, length(contract) - 2)</code> is the root for NQZ6 and for a 3-letter root like MNQZ6.","To build text, <code>catx('-', root, side)</code> strips the blanks around each piece and joins them with the separator: 'NQ-Long'. STRIP removes leading and trailing blanks, UPCASE, LOWCASE and PROPCASE change case, and <code>find(s, 'x')</code> returns the position where the text starts (0 if it is not there).","Gotchas: without a third argument SCAN splits at a whole set of default delimiters, not just blanks (the period, hyphen, slash and comma among them), so <code>scan('Box 4-4-4-4', 2)</code> is '4'. Pass ' ' to split on blanks only. SAS text columns are fixed-length and padded with blanks: a new column from SUBSTR gets the full length of contract, so <code>root || '-' || side</code> can come out as 'NQ&nbsp;&nbsp;-Long'. CATX (or STRIP) avoids that, and LENGTH sets the size (as in the IF-THEN lesson)."],
 ex:R`/* name your mind techniques by their first word */
data techniques;
  set work.mind;
  length first_word last_word $ 20 tag $ 40;
  first_word = scan(technique, 1, ' ');    /* Box, Resonance, Single-point */
  last_word  = scan(technique, -1, ' ');   /* 4-4-4-4, 5.5, sigh */
  tag = catx(' / ', upcase(practice), first_word);   /* BREATHWORK / Box */
  keep practice technique first_word last_word tag;
run;

proc freq data=techniques order=freq;
  tables tag;
run;`,
 quiz:{q:"What does <code>scan('Resonance 5.5', 2)</code> return?",o:["'5.5', the second blank-separated word","'esonance 5.5', everything from position 2 on",'A blank, because without a delimiter argument SCAN splits only at commas',"'5', because the period is a delimiter too"],a:3,why:"With no third argument SCAN uses a set of default delimiters that includes the blank, the period, the hyphen, the comma and the slash, so the words of 'Resonance 5.5' are 'Resonance', '5' and '5'. scan(technique, 2, ' ') splits at blanks only and returns '5.5'. Counting characters from a position is what SUBSTR does."},
 prac:{task:'Which setups do you trade most? From work.trades create <b>contracts</b> with <b>root</b> (the contract without its last 2 characters, e.g. NQ), <b>month_code</b> (the second-to-last character, e.g. Z) and <b>setup</b> (root and side joined by a hyphen with no blanks, e.g. NQ-Long). Cut with the LENGTH function, so a 3-letter root such as MNQ would work too, and declare the three new columns with a LENGTH statement, long enough for a 4-letter root. Keep id, day, contract, side, pnl and the three new columns. Then run PROC FREQ on setup, most frequent first.',sol:R`data contracts;
  set work.trades;
  length root $ 4 month_code $ 1 setup $ 12;   /* any lengths that fit: setup needs root + 1 + 5 */
  root       = substr(contract, 1, length(contract) - 2);   /* NQZ6 -> NQ */
  month_code = substr(contract, length(contract) - 1, 1);   /* NQZ6 -> Z (December) */
  setup      = catx('-', root, side);                       /* NQ-Long, no padding */
  keep id day contract side pnl root month_code setup;
run;

proc freq data=contracts order=freq;
  tables setup;
run;`}},
{id:'sas16',t:'sas',lv:2,title:'SAS dates: INPUT and formats',
