<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LEARN">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>ISIONXXX // LEARN</title>
<link rel="stylesheet" href="ui.css">
<style>
:root{
  color-scheme:dark;
  --bg:#070707;--card:#0c0c0c;--cell:#0a0a0a;--line:#1c1c1c;--line2:#2c2c2c;
  --tx:#d9d5c8;--mu:#8f8a7e;--acc:#ffb000;--amber:#ffb000;
  --g:#33ff66;--r:#ff4545;--a:#ff7a33;--b:#7f9cb0;--blue:#ffb000;
  --f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{margin:0 auto;max-width:1440px;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(48px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);font:13px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
::selection{background:var(--acc);color:#000}
.red{color:var(--r)}.grn{color:var(--g)}.amb{color:var(--acc)}.mu{color:var(--mu)}.mu2{color:var(--mu)}
.hidden{display:none!important}

/* header + filter bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;letter-spacing:.14em}
.brand b{color:var(--acc)}
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--acc);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top .btn svg{display:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0}
.sel{background:var(--bg);border:1px solid var(--line2);border-radius:0;padding:7px 10px;min-width:150px}
.sel:hover{border-color:var(--acc);color:var(--acc)}
.ctx{color:var(--mu)}
.sp{flex:1}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--bg);border-radius:0;padding:7px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn svg{width:14px;height:14px}
.btn.pri,.btn.go{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600}
.btn.pri:hover,.btn.go:hover{color:#000;filter:brightness(1.12)}
.btn.dng{color:var(--r)}.btn.dng:hover{border-color:var(--r)}

/* layout + cards */
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.gm{grid-template-columns:2fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ban{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:16px;margin-bottom:12px;flex-wrap:wrap;border-color:var(--acc)}
.bd{padding:16px;flex:1;display:flex;flex-direction:column}
.ft{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;font-size:11px;color:var(--mu);gap:10px;flex-wrap:wrap;align-items:center}
.card h3{font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
.card h3::before{content:'> ';color:var(--mu)}
.lbl{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:22px;font-weight:600;margin:2px 0 8px}
.gauge{display:block;width:150px;max-width:100%;margin:6px auto 10px}
.gauge path{fill:none;stroke-width:9}
.gauge text{fill:var(--tx);font:600 17px var(--f)}
.lr{display:grid;grid-template-columns:14px 1fr auto 46px;align-items:center;padding:2px 0}
.lr span{min-width:0}.lr b{text-align:right}.lr em{font-style:normal;text-align:right;color:var(--mu)}
.dot{width:7px;height:7px;margin-right:7px;display:inline-block;flex:none}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}
.hb{height:8px;background:#111;margin:6px 0 4px;overflow:hidden}
.hb i{display:block;height:100%}

/* calendar */
.calhd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wl{color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:12px}
.dh{text-align:center;font-size:11px;color:var(--mu);padding:4px 0;letter-spacing:.08em;text-transform:uppercase}
.cell{min-height:66px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--mu);cursor:pointer;position:relative;overflow:hidden}
.cell.hatch{background:repeating-linear-gradient(135deg,#0a0a0a 0 6px,#111 6px 7px)}
.cell.out{cursor:default;border-color:transparent;opacity:.5}
.cell.fut span{color:#827d72}
.cell.on{border-color:rgba(51,255,102,.3)}
.cell.on b{font-size:12px;color:var(--tx)}
.cell.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cell small{font-size:10px;color:var(--mu)}
.cell.wk{border:1px dashed var(--line2);background:#0a0a0a;color:var(--mu);cursor:default}
.cell.wk b{font-size:11px}
.cdots{display:flex;gap:2px}.cdots i{width:5px;height:5px}
.calft{padding:10px 16px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line2);min-width:33px;height:33px;padding:0 10px;font-size:12px}
.nav button:hover{border-color:var(--acc);color:var(--acc)}
.nav .tb{font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* coverage */
.ev h4{font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase;font-weight:400;margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.ev h4:first-of-type{border:0;padding-top:0;margin-top:0}
.er{display:flex;align-items:center;padding:5px 0;gap:2px}
.er span{flex:1}.er b{margin-right:8px;text-align:right;font-weight:600}
.q{width:12px;height:12px;border:1px solid var(--line2);font-size:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu);font-style:normal;flex:none;cursor:help}
hr{border:0;border-top:1px solid var(--line);margin:4px 0 8px}

/* cross-filters: anything with .pick narrows every card and the log; the filters show as chips under the bar */
.pick{cursor:pointer}.pick:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.lr.pick,.er.pick{margin:0 -6px;padding-left:6px;padding-right:6px}.lr.pick:hover,.er.pick:hover{background:#121212}
.lr.on,.er.on{background:#1a1406;box-shadow:inset 2px 0 0 var(--acc)}
.gauge path.pick:hover{filter:brightness(1.3)}.gauge path.off,.chart .off{opacity:.25}
.chart .hit{fill:transparent}.chart .hit:hover{fill:rgba(255,176,0,.08)}.chart .hit.on{fill:rgba(255,176,0,.14)}
.xf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px}
.xf span{color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.xf button{border:1px solid var(--acc);color:var(--acc);padding:5px 8px;font-size:12px}.xf button b{font-weight:600}.xf .clr{border-color:var(--line2);color:var(--mu)}
.xf button:hover{background:#1a1406}.xf[hidden]{display:none}
/* charts */
.chart{width:100%;height:160px;display:block;margin-top:8px}
.chart *{vector-effect:non-scaling-stroke}
.empty{height:160px;display:grid;place-items:center;color:var(--mu);letter-spacing:.14em;font-size:11px;text-transform:uppercase;text-align:center}
.eqh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ks{display:flex;gap:22px;flex-wrap:wrap}
.ks div{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;gap:2px}
.ks b{font-size:13px;color:var(--tx);letter-spacing:0;text-transform:none}
.radar{width:100%;max-width:230px;height:auto;margin:0 auto;display:block}
svg text{font-family:var(--f)}

/* table */
.tw{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:500;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.num{text-align:right}
.pill{display:inline-flex;padding:1px 6px;font-size:10px;border:1px solid;letter-spacing:.06em;text-transform:uppercase}
.acts{display:flex;gap:4px;justify-content:flex-end}
td .acts button{width:24px;height:24px;border:1px solid var(--line2);color:var(--tx);display:inline-flex;align-items:center;justify-content:center}
td .acts button:hover{border-color:var(--acc);color:var(--acc)}
.acts svg{width:13px;height:13px}
.th{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 4px}   /* title on the same line as every other card title */
.th h3{margin:0;flex:1}
.dim{color:var(--mu)}
/* table pager, as in the other apps */
.calf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px}
.calf button{border:1px solid var(--line2);padding:7px 10px;font-size:12px;letter-spacing:.06em}
.calf button:hover{border-color:var(--acc);color:var(--acc)}

/* modal (matches the dialogs in MIND / TRAINING / NUTRITION) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:25;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.box{background:var(--card);border:1px solid var(--acc);padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.box.wide{max-width:900px}
.box h3{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.box p{margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1px solid var(--line2);padding:7px 10px;width:100%;font-size:13px;letter-spacing:0;text-transform:none;color:var(--tx)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--acc);outline:0}
.ck{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--tx)}
.fg .ck label,.ck label{flex-direction:row;align-items:center;gap:6px;color:var(--tx);text-transform:none;letter-spacing:0;font-size:12px}
.ck input{width:auto;accent-color:var(--acc)}
.full{grid-column:1/-1}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.ui-set input{flex:none;width:84px;background:var(--bg);border:1px solid var(--line2);padding:7px 10px;text-align:right}
.ui-set input:focus{border-color:var(--acc);outline:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}.kv span{color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;background:var(--card);border:1px solid var(--acc);color:var(--acc);padding:8px 14px;z-index:40}

/* daily review: a script to read top to bottom (as in JOURNAL) */
.box.rvd{max-width:680px}
.rvh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.rvh h3{margin:0;flex:1}.rvh .btn{min-width:33px;justify-content:center}
.rv{border-top:1px solid var(--line);padding:14px 0 4px;font-size:13.5px;line-height:1.7}
.rv h4{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.rv p{margin:0 0 8px}.rv b{font-weight:600}
.rv ol,.rv ul{margin:0 0 8px;padding-left:22px}.rv li{margin:0 0 6px}.rv li::marker{color:var(--mu)}
.rv .tr{display:block;color:var(--mu);font-size:12px}
.rvf .btn:first-child{margin-right:auto}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);padding:7px 10px;font-size:12px;letter-spacing:.06em}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000}

/* buttons, extra */
a.btn{text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{border-color:var(--line2);color:inherit}
.btn.xs{padding:4px 8px;font-size:11px}
.btn.yt{border-color:#5c1515;color:#ffc9c9}
.btn.yt:hover{border-color:var(--r);color:var(--r)}

/* tracks + lists */
.tk{padding:10px 0;border-bottom:1px solid var(--line)}
.tk:last-child{border:0}
.tkh{display:flex;align-items:center;gap:8px}
.tkh b{flex:1;font-weight:600}
.tl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.tl span{color:var(--mu)}
.l5{display:inline-flex;gap:3px}.l5 i{width:10px;height:10px}

/* code */
pre,.ed{font:12.5px/1.55 var(--f)}
pre{background:var(--bg);border:1px solid var(--line);padding:12px 14px;overflow:auto;color:var(--tx);white-space:pre;tab-size:2}
.ed{width:100%;min-height:170px;background:#050505;border:1px solid var(--line2);padding:12px 14px;color:var(--tx);caret-color:var(--acc);resize:vertical;tab-size:2;white-space:pre;overflow:auto}
.ed:focus{border-color:var(--acc);outline:0}
.codeh{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.codeh b{flex:1;font-weight:500;color:var(--acc)}
.rt{border-collapse:collapse;font:12px var(--f);width:auto}
.rt th,.rt td{border:1px solid var(--line2);padding:5px 9px;text-align:left;white-space:nowrap}
.rt th{background:#111;color:var(--mu);font-weight:500;font-size:11px;letter-spacing:.06em}
.outw{max-height:320px;overflow:auto;margin-top:8px}
.fb{border:1px solid;padding:10px 12px;margin-top:10px;line-height:1.5}
.fb.ok{background:rgba(51,255,102,.06);border-color:rgba(51,255,102,.35);color:#b8f5cf}
.fb.no{background:rgba(255,69,69,.07);border-color:rgba(255,69,69,.35);color:#ffc9c9}
.fb.info{background:var(--bg);border-color:var(--line2);border-left:2px solid var(--acc);color:var(--tx)}

/* watch */
.watch{background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--r);padding:12px 14px;margin-top:16px}
.watch .codeh{margin-top:0}
.vid{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;border:1px solid var(--line);margin:8px 0 10px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vpin{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.vpin input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line2);padding:7px 10px}
.vpin input:focus{border-color:var(--acc);outline:0}

/* lesson overlay */
.po{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch}
.lv{width:100%;max-width:860px}
.lvh{position:sticky;top:0;background:rgba(7,7,7,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:3;padding:calc(12px + env(safe-area-inset-top)) 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.lvh .btn{min-height:34px}
.stime{font-size:13px;font-weight:600;color:var(--acc);min-width:52px}
.lvb{padding:18px 0 40px}
.lvb h2{font-size:18px;font-weight:600;letter-spacing:.02em;margin:6px 0 12px}
.lvb h2::before{content:'> ';color:var(--acc)}
.lvb p.learn{font-size:13.5px;line-height:1.65;margin-bottom:10px}
.task{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--acc);padding:12px 14px;line-height:1.6;margin-top:18px}
.task b{color:var(--acc)}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--line2);padding:11px 14px;background:var(--bg);line-height:1.5}
.opt:hover{border-color:var(--acc)}
.opt.right{border-color:var(--g);background:rgba(51,255,102,.06)}
.opt.wrong{border-color:var(--r);background:rgba(255,69,69,.07)}
.lnav{display:flex;gap:8px;justify-content:space-between;margin-top:24px;flex-wrap:wrap}
.ltrk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:8px}
.li{text-align:left;border:1px solid var(--line2);padding:9px 12px;background:var(--bg);font-size:12px;display:flex;gap:8px;align-items:center}
.li:hover{border-color:var(--acc)}
.li b{flex:1;font-weight:500}
.li.done{border-color:rgba(51,255,102,.4)}
.rosetta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rosetta .codeh{margin-top:0}

@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.gm,.g3{grid-template-columns:1fr}}
@media(max-width:560px){
  body{padding-left:10px;padding-right:10px}
  .g4,.fg,.rosetta{grid-template-columns:1fr}
  .sel{min-width:0;flex:1}.ctx{width:100%}
  .cell{min-height:50px;padding:3px}.cell small{display:none}.cell b{font-size:10px}
  .ed,.fg input,.fg select,.fg textarea,.vpin input,.ui-set input{font-size:16px}
  .lvb h2{font-size:16px}
}
h1.brand{margin:0}
.cell span{color:#a9a498}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">ISIONXXX <b>//</b> LEARN<i class="cur"></i></h1>
  <div class="acts" id="barBtns"></div>
</header>
<div id="top"></div>
<div class="bar">
  <select id="fTrack" aria-label="Track" class="sel"><option value="all">All tracks</option><option value="sql">SQL</option><option value="py">Python</option><option value="sas">SAS</option><option value="tab">Tableau</option></select>
  <select id="fRange" aria-label="Date range" class="sel">
    <option value="today">Today</option><option value="week">This week</option><option value="month">This month</option><option value="all" selected>All time</option>
  </select>
  <span id="ctx" class="ctx"></span>
</div>
<div id="xf" class="xf" hidden></div>
<div id="app" role="main"></div>
<div id="po" class="po hidden"></div>
<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>

<script src="sync.js" data-keys="xl.progress.v1 xl.events.v1 xl.sessions.v1 xl.drafts.v1 xl.settings.v1 xl.videos.v1"></script>
<script src="ui.js"></script>
<script>
const $=s=>document.querySelector(s);
const ACC='var(--acc,#ffb000)';                       // brand amber (measurement)
const R=String.raw;
/* ================= tracks & levels ================= */
const TR={sql:{n:'SQL',col:'#7f9cb0',run:1},py:{n:'Python',col:'#ffb000',run:1},sas:{n:'SAS',col:'#9c8aa5'},tab:{n:'Tableau',col:'#c8b38a'}};
const TK=Object.keys(TR);
const LV=['','Beginner','Intermediate','Advanced','Expert'],XPL=[0,10,20,30,50];
const LVC=['','#e6d3a8','#ffc233','#ffb000','#b37a00'];   // amber ramp, light → deep
const RANKS=[[0,'Novice'],[.15,'Apprentice'],[.35,'Practitioner'],[.6,'Specialist'],[.85,'Expert']];

/* ================= video search config ================= */
const YTQ={
  sql1:'SQL SELECT WHERE tutorial for beginners',sql2:'SQL ORDER BY LIMIT top N tutorial',sql3:'SQL GROUP BY COUNT SUM tutorial',
  sql4:'SQL JOINs explained inner join tutorial',sql5:'SQL HAVING vs WHERE explained',sql6:'SQL CASE WHEN tutorial',

function parseYT(url){
  const s=String(url||'').trim();if(!s)return null;
  const m=s.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/)||s.match(/^([\w-]{11})$/);
  if(!m)return null;
  const t=s.match(/[?&](?:t|start)=(\d+h)?(\d+m)?(\d+)s?/);
  let start=0;if(t){start=(parseInt(t[1])||0)*3600+(parseInt(t[2])||0)*60+(parseInt(t[3])||0)}
  return{id:m[1],start};
}

print(top2[["practice", "day", "minutes"]])`,
 task:'Each <b>Weighted</b> exercise&rsquo;s <b>3 heaviest sets</b> (by <b>load</b>). On equal load, the more recent entry (higher <b>id</b>) wins. Columns: <b>exercise</b>, <b>day</b>, <b>load</b>.',
 start:R`w = workouts[workouts["type"] == "Weighted"]
w = w.sort_values(
result = `,
 sol:R`w = workouts[workouts["type"] == "Weighted"]
w = w.sort_values(["exercise", "load", "id"], ascending=[True, False, False])
result = w.groupby("exercise").head(3)[["exercise", "day", "load"]]`,
 hint:'sort_values(["exercise", "load", "id"], ascending=[True, False, False]).groupby("exercise").head(3)'},
{id:'py9',t:'py',lv:3,title:'Flattening JSON',
 learn:['Exports and APIs return nested JSON. pd.json_normalize flattens it: record_path turns a nested list into rows, meta carries parent fields along (nested keys become "checkin.sleep").','A preloaded list <b>day_export</b> holds your last 14 days: each day has a <b>checkin</b> object (or None) and lists of <b>trades</b>, <b>workouts</b> and <b>meals</b>.'],
 ex:R`print(day_export[0]["day"], day_export[0]["checkin"])
days = pd.json_normalize(day_export)
print(days.columns.tolist())
t = pd.json_normalize(day_export, record_path="trades", meta=["day"])
print(t.groupby("day")["pnl"].sum())`,
 task:'One row per <b>workout</b> entry that has a <b>load</b>, with its training volume (sets &times; reps &times; load). Columns, in this order: <b>day</b>, <b>exercise</b>, <b>volume</b>.',
 start:R`w = pd.json_normalize(day_export, record_path="workouts", meta=["day"])
result = `,
 sol:R`w = pd.json_normalize(day_export, record_path="workouts", meta=["day"])
w = w.dropna(subset=["load"]).copy()
w["volume"] = w["sets"] * w["reps"] * w["load"]
result = w[["day", "exercise", "volume"]]`,
 hint:'dropna(subset=["load"]), w["volume"] = w["sets"] * w["reps"] * w["load"], then select the three columns.'},
{id:'py10',t:'py',lv:4,title:'Regex extraction from logs',
 learn:['Semi-structured text is extracted with regular expressions. Series.str.extract(pattern) returns one column per capture group; lines that don&rsquo;t match become NaN.','A preloaded list <b>logs</b> holds your apps&rsquo; activity as lines like <b>DATE TIME APP event key=value …</b>, e.g. <b>… REWIRE urge habit=Doomscrolling result=resisted intensity=4 trigger="Phone in hand"</b>. Values with spaces are in double quotes; empty fields are left out.'],
 ex:R`s = pd.Series(logs)
d = s.str.extract(r"^\S+ \S+ (\w+) (\w+)")
d.columns = ["app", "event"]
print(d.value_counts())`,
 task:'Which trigger hits you most? From the <b>REWIRE urge</b> lines, count urges per <b>trigger</b> (quoted or not, without the quotes). Columns: <b>trigger</b>, <b>n</b>.',
 start:R`s = pd.Series(logs)
u = s[s.str.contains(" REWIRE urge ")]
t = u.str.extract(r'trigger=(?:"([^"]*)"|(\S+))')
# t[0] holds quoted values, t[1] unquoted ones
result = `,
 sol:R`s = pd.Series(logs)
u = s[s.str.contains(" REWIRE urge ")]
t = u.str.extract(r'trigger=(?:"([^"]*)"|(\S+))')
trig = t[0].fillna(t[1]).dropna()
result = trig.value_counts().rename_axis("trigger").reset_index(name="n")`,
 hint:'t[0].fillna(t[1]).dropna(), then value_counts().rename_axis("trigger").reset_index(name="n").'},
{id:'py11',t:'py',lv:4,title:'Dedup to latest record',
 learn:['sort_values by key + time (+ tie-breaker), then drop_duplicates(key, keep="last") keeps the newest row per key: fast and readable.','This is the pandas equivalent of the ROW_NUMBER() … WHERE rn = 1 pattern.'],
 ex:R`c = checkins.dropna(subset=["weight"]).copy()
c["week"] = pd.to_datetime(c["day"]).dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
print(c.sort_values("day").drop_duplicates("week", keep="last")[["week", "day", "weight"]])`,
 task:'Your <b>most recent session of each practice</b> in <b>mind</b>: columns <b>practice</b>, <b>day</b>, <b>technique</b>, <b>minutes</b>. Order by <b>time</b>, and break time ties by highest <b>id</b>.',
 start:R`m = mind.sort_values(["practice", "time", "id"])
result = `,
 sol:R`m = mind.sort_values(["practice", "time", "id"])
m = m.drop_duplicates("practice", keep="last")
result = m[["practice", "day", "technique", "minutes"]]`,
 hint:'drop_duplicates("practice", keep="last"), then select the four columns.'},
/* ---------- SAS ---------- */
{id:'sas1',t:'sas',lv:1,title:'The DATA step',
 learn:['SAS works through data one row at a time in a DATA step. DATA names the output, SET reads the input, the statements in between change each row, and RUN executes it.','WHERE filters rows as they are read. KEEP and DROP choose which columns are written. Your app logs are in <b>work.trades</b>, <b>work.workouts</b>, <b>work.mind</b>, <b>work.meals</b>, <b>work.habits</b>, <b>work.checkins</b> and <b>work.study</b>.'],
 ex:R`data short_trades;
  set work.trades;
  where side = 'Short';
  keep day contract qty pnl;
run;`,
 quiz:{q:'Which statement controls which <b>columns</b> are written to the output data set?',o:['WHERE','KEEP','SET','RUN'],a:1,why:'KEEP (or DROP) selects variables. WHERE filters rows, SET names the input, RUN executes the step.'},
 prac:{task:'Write a DATA step that creates <b>slips</b> from work.habits. Keep only the urges you gave in to (event = <b>slipped</b>) and only the columns day, habit, intensity and trigger.',sol:R`data slips;
  set work.habits;
  where event = 'slipped';
  keep day habit intensity trigger;
run;`}},
{id:'sas2',t:'sas',lv:1,title:'PROC SORT & PROC PRINT',
 learn:['Procedures (PROCs) are SAS’s built-in tools. PROC SORT puts rows in order, and many later steps (MERGE, BY-group logic) need sorted input.','OUT= writes a sorted copy and leaves the original alone. NODUPKEY drops rows with a repeated BY value. PROC PRINT with (obs=5) shows the first 5 rows.'],
 ex:R`/* your 5 best trades */
proc sort data=work.trades out=best;
  by descending pnl;
run;

proc print data=best(obs=5);
  var day contract side pnl;
run;`,
 quiz:{q:'What does <b>OUT=</b> do in PROC SORT?',o:['Exports the data to a CSV file','Writes the sorted result to a new data set, leaving the input unchanged','Removes duplicate rows','Prints the output'],a:1,why:'Without OUT=, PROC SORT replaces the input data set with its sorted version.'},
 prac:{task:'Sort work.workouts by exercise, then by day, into <b>wk_sorted</b>, so each exercise’s history reads in date order.',sol:R`proc sort data=work.workouts out=wk_sorted;
  by exercise day;
run;`}},
{id:'sas3',t:'sas',lv:2,title:'PROC SQL',
 learn:['PROC SQL lets you write (mostly ANSI) SQL inside SAS, so the GROUP BY and joins from the SQL track carry over. CREATE TABLE ... AS saves the result as a data set.','You can add SAS formats inline (format=dollar12.2). PROC SQL runs each statement right away and ends with QUIT, not RUN.'],
 ex:R`/* net P&L per contract */
proc sql;
  create table contract_pnl as
  select contract,
         count(*)  as trades,
         sum(pnl)  as net format=dollar12.2
  from work.trades
  group by contract
  order by net desc;
quit;`,
 quiz:{q:'Which statement ends a PROC SQL step?',o:['RUN;','END;','QUIT;','STOP;'],a:2,why:'PROC SQL executes statements as it reads them; QUIT; ends the procedure. RUN; is ignored there.'},
 prac:{task:'With PROC SQL, create <b>practice_time</b> from work.mind: the number of sessions and the total minutes for each practice.',sol:R`proc sql;
  create table practice_time as
  select practice,
         count(*)     as sessions,
         sum(minutes) as total_min
  from work.mind
  group by practice;
quit;`}},
{id:'sas4',t:'sas',lv:2,title:'MERGE with BY and IN=',
 learn:['A DATA-step MERGE joins data sets on a shared BY variable. Your logs share <b>day</b>, so day is the key. IN= makes temporary flags that tell you which input gave each row.','if a and not b; keeps rows only in a (an anti-join). if a and b; is an inner join. With no condition you get a full outer join. Many trades can merge onto one check-in per day: that is a one-to-many merge.'],
 ex:R`/* days you checked in but did not train */
proc sort data=work.checkins out=c; by day; run;
proc sort data=work.workouts(keep=day) out=w nodupkey; by day; run;

data rest_days;
  merge c(in=in_c) w(in=in_w);
  by day;
  if in_c and not in_w;
run;`,
 quiz:{q:'Before a DATA-step MERGE with BY, both inputs must be…',o:['Indexed or sorted by the BY variable','Exported to CSV','The same number of rows','Created with PROC SQL'],a:0,why:'MERGE walks both tables in BY order, so they must be sorted (or indexed) by the BY variable. Otherwise SAS stops with an error.'},
 prac:{task:'Data sets <b>t</b> (work.trades sorted by day) and <b>c</b> (work.checkins sorted by day) exist. Merge them by day into <b>trades_sleep</b>, keeping only trades that have a check-in that day, so each trade carries that morning’s sleep and energy.',sol:R`data trades_sleep;
  merge t(in=in_t) c(in=in_c);
  by day;
  if in_t and in_c;
run;`}},
{id:'sas5',t:'sas',lv:3,title:'PROC MEANS / SUMMARY',
 learn:['PROC MEANS computes statistics by group. CLASS sets the groups (no sorting needed), VAR the measures, and OUTPUT OUT= writes the results to a data set.','NWAY keeps only the full CLASS combination and drops the overall-total row SAS adds by default (_TYPE_=0). NOPRINT turns off the printed report.'],
 ex:R`/* Long vs Short: total, average and count */
proc means data=work.trades noprint nway;
  class side;
  var pnl;
  output out=side_stats(drop=_type_ _freq_)
         sum=net mean=avg_pnl n=trades;
run;`,
 quiz:{q:'What does <b>NWAY</b> do in PROC MEANS?',o:['Uses n-way parallel processing','Keeps only the highest-level combination of CLASS variables in the output','Removes missing values','Sorts the output'],a:1,why:'Without NWAY, OUTPUT includes every subtotal level, including a grand total row (_TYPE_=0).'},
 prac:{task:'Get the min, max and mean kcal for each meal kind (bowl / snack) from work.meals into <b>kcal_stats</b>.',sol:R`proc means data=work.meals noprint nway;
  class kind;
  var kcal;
  output out=kcal_stats(drop=_type_ _freq_)
         min=min_kcal max=max_kcal mean=avg_kcal;
run;`}},
{id:'sas6',t:'sas',lv:3,title:'FIRST. and LAST.: BY-group logic',
 learn:['With BY in a DATA step, SAS creates FIRST.var and LAST.var flags (1 or 0) that mark the first and last row of each group.','They drive dedup (“keep the latest per key”), running counts per group and group-level resets: jobs SQL does with window functions.'],
 ex:R`/* the latest set you logged for each exercise */
proc sort data=work.workouts out=w;
  by exercise time id;
run;

data latest_set;
  set w;
  by exercise;
  if last.exercise;
run;`,
 quiz:{q:'Inside a BY-group, <b>LAST.exercise = 1</b> when…',o:['The exercise name is the last one alphabetically','The current row is the final row for that exercise','The data set has ended','exercise is missing'],a:1,why:'LAST.var is 1 on the last observation of each BY group, so the subsetting IF keeps one row per exercise: the latest one after sorting by time.'},
 prac:{task:'Data set <b>h</b> is work.habits sorted by habit. With BY-group logic, count the log entries per habit into <b>habit_counts</b> (one row per habit, variable n).',sol:R`data habit_counts;
  set h;
  by habit;
  if first.habit then n = 0;
  n + 1;
  if last.habit;
  keep habit n;
run;`}},
{id:'sas7',t:'sas',lv:4,title:'Macros for reusable extracts',
 learn:['The macro language writes SAS code for you. %macro / %mend defines a template, parameters become &variables, and %do loops repeat steps.','Macro variables only resolve inside <b>double</b> quotes. In single quotes, &val stays literal text. That is the #1 macro bug.'],
 ex:R`%macro pull(data=, col=, val=, out=);
  proc sql;
    create table &out as
    select * from &data
    where &col = "&val";
  quit;
%mend pull;

%pull(data=work.trades, col=side, val=Long,  out=longs)
%pull(data=work.meals,  col=kind, val=bowl,  out=bowls)`,
 quiz:{q:'Why does the WHERE clause use <b>"&val"</b> (double quotes)?',o:['Double quotes are faster','Macro variables resolve inside double quotes but not single quotes','SAS requires double quotes for all text','It prevents SQL injection'],a:1,why:'Inside single quotes the macro processor does not scan, so the query would look for the literal text &val.'},
 prac:{task:'Write a %do loop that calls %pull on work.study once per track (SQL, Python, SAS, Tableau), creating study_SQL, study_Python and so on (hint: %scan).',sol:R`%macro all_tracks;
  %let list = SQL Python SAS Tableau;
  %do i = 1 %to 4;
    %let t = %scan(&list, &i);
    %pull(data=work.study, col=track, val=&t, out=study_&t)
  %end;
%mend all_tracks;
%all_tracks`}},
{id:'sas8',t:'sas',lv:4,title:'SQL pass-through to databases',
 learn:['When data lives in a database, push the work there. Say your app logs sync to a Postgres copy (a backup or sync server). Explicit pass-through (CONNECT TO … / CONNECTION TO …) sends native SQL to it, and only the result travels back to SAS.','EXECUTE (...) BY runs statements that return nothing (updates, refreshing a view). LIBNAME engines try implicit pass-through, but explicit pass-through gives you full control of the dialect.'],
 ex:R`proc sql;
  connect to postgres as db
    (server="sync.example.com" database=isionlogs
     user=&user password=&pw);

  /* daily P&L for the last 90 days, summed inside Postgres */
  create table daily_pnl as
  select * from connection to db (
    select day, count(*) as trades, sum(pnl) as net
    from trades
    where day::date >= current_date - 90
    group by day
  );

  execute (refresh materialized view day_summary) by db;
  disconnect from db;
quit;`,
 quiz:{q:'Main benefit of explicit SQL pass-through?',o:['It converts SQL into DATA steps','The query runs inside the database in its own dialect, so only the result is transferred','It encrypts the data','It avoids needing credentials'],a:1,why:'Filtering and aggregating in the database means only a few summary rows cross the network, not every logged row.'},
 prac:{task:'Using an existing connection <b>db</b> to the synced database, pull your total protein per week from its meals table (columns day, protein) into <b>weekly_protein</b>.',sol:R`create table weekly_protein as
select * from connection to db (
  select date_trunc('week', day::date) as week,
         sum(protein) as protein
  from meals
  group by date_trunc('week', day::date)
  order by week
);`}},
/* ---------- Tableau ---------- */
{id:'tab1',t:'tab',lv:1,title:'Live connections vs extracts',
 learn:['A <b>live</b> connection queries the source every time the view changes: always current, but only as fast as the source. An <b>extract</b> (.hyper) is a compressed snapshot Tableau stores and refreshes on a schedule.','Your app logs are a good fit for an extract: they grow by a few rows a day. Extract filters and “Aggregate data for visible dimensions” keep it small; data source filters limit what any workbook can see.'],
 ex:R`Connect to the exported logs (SQLite file or the synced database)
Data Source tab → Connection: ( ) Live  (•) Extract → Edit…
  • Filters → Add… → Day — relative date: last 12 months
  • ☑ Aggregate data for visible dimensions
  • Incremental refresh on: Id`,
 quiz:{q:'When is an <b>extract</b> usually the better choice?',o:['When you need second-by-second real-time data','When the source is slow, you want to reduce load on it, or you need offline access','When the data is under 100 rows','Never: live is always better'],a:1,why:'Extracts trade freshness for speed and lower load on the source. Live makes sense for near-real-time needs on a fast database.'},
 prac:{task:'Describe how you would set up a <b>trades</b> extract that keeps only the last 2 years and adds just the new trades each day.',sol:R`Extract → Edit → Filters: Day — relative date: last 2 years
Incremental refresh: ☑ identify new rows using Id (or Closed)
Schedule: full refresh weekly, incremental refresh daily`}},
{id:'tab2',t:'tab',lv:1,title:'Dimensions, measures & aggregation',
 learn:['Dimensions (blue, discrete) slice the view: Contract, Side, Exercise, Habit. Measures (green, continuous) get aggregated: Pnl, Kcal, Minutes. Dropping a measure on a shelf applies a default aggregation, usually SUM.','The level of detail of the view is the set of dimensions on it. That is the same idea as GROUP BY.'],
 ex:R`Columns: [Contract]
Rows:    SUM([Pnl])
→ same as SQL: SELECT contract, SUM(pnl) FROM trades GROUP BY contract`,
 quiz:{q:'With [Side] on Columns, you drag the measure [Pnl] to Rows. What appears?',o:['Every single trade’s P&L','SUM(Pnl) for Long and for Short','The count of sides','An error until you choose an aggregation'],a:1,why:'Measures default to SUM, aggregated to the dimensions in the view (Side).'},
 prac:{task:'Which Tableau setup answers “Which habit do I slip on most?”, i.e. SELECT habit, COUNT(*) FROM habits WHERE event = \'slipped\' GROUP BY habit?',sol:R`Filters: [Event] = slipped
Rows:    [Habit]
Text/Columns: CNT([Habits])   (the table's count field)
Sort descending`}},
{id:'tab3',t:'tab',lv:2,title:'Relationships vs joins',
 learn:['Tableau’s logical layer uses <b>relationships</b> (“noodles”): tables stay separate and are joined at query time, at the right level of detail. Physical-layer <b>joins</b> flatten the tables into one first.','Your logs show why this matters. <b>trades</b> has one row per trade; <b>checkins</b> has one row per day. They relate on Day. Join them physically and each morning’s sleep is copied onto every trade that day.'],
 ex:R`Logical layer:   Trades ──(Day = Day)── Checkins
  → AVG([Sleep]) is computed per check-in day,
    SUM([Pnl]) per trade: both correct

Physical join:   Trades ⨝ Checkins on Day
  → a day with 6 trades repeats its sleep 6 times
  → SUM([Sleep]) is inflated, AVG([Sleep]) leans to busy days`,
 quiz:{q:'Trades (one row per trade) and Checkins (one row per day) are combined with a <b>physical join</b> on Day. What happens to SUM([Sleep])?',o:['It is correct','It is inflated, because each day’s sleep repeats on every trade that day','It becomes NULL','Tableau blocks the join'],a:1,why:'Joining tables of different grain duplicates the coarser rows. Relationships (or a FIXED LOD) prevent this.'},
 prac:{task:'You really do want a row-level table of trades with that morning’s sleep. How do you get to the physical layer and build a left join?',sol:R`Data Source tab → double-click the logical table Trades
→ opens the physical layer → drag Checkins in
→ choose Left join, clause: Day = Day
(every trade kept; Sleep is NULL on days with no check-in)`}},
{id:'tab4',t:'tab',lv:2,title:'Calculated fields',
 learn:['Calculated fields (Analysis → Create Calculated Field) are row-level formulas, like expressions in a SQL SELECT. IF/ELSEIF/ELSE/END, IIF, CASE, DATEDIFF, DATETRUNC and string functions are the core tools.','An IF with no ELSE returns NULL for rows that do not match, and SUM ignores NULLs: handy for conditional measures like “P&L on Long trades only”.'],
 ex:R`// Winning trade? (1/0, so AVG gives your win rate)
IIF([Pnl] > 0, 1, 0)

// Minutes in the trade
DATEDIFF('minute', [Opened], [Closed])

// Mood lift from a meditation session
[Mood After] - [Mood Before]

// Week bucket
DATETRUNC('week', [Day])`,
 quiz:{q:'What does <b>IF [Side] = "Long" THEN [Pnl] END</b> return for a Short trade?',o:['0','NULL','An error','The P&L anyway'],a:1,why:'With no ELSE branch, rows that do not match return NULL. Aggregations like SUM skip NULLs.'},
 prac:{task:'Write a calc on <b>checkins</b> that labels each night: sleep under 6 hours "short", under 7.5 "ok", else "rested".',sol:R`IF [Sleep] < 6 THEN "short"
ELSEIF [Sleep] < 7.5 THEN "ok"
ELSE "rested"
END`}},
{id:'tab5',t:'tab',lv:3,title:'LOD expressions: FIXED',
 learn:['Level of Detail expressions compute at a grain you choose, whatever the view shows. { FIXED [Day] : SUM([Pnl]) } puts the whole day’s P&L on every trade, so you can ask “how did my trades do on red days?”','FIXED runs <b>before</b> dimension filters (but after context, data source and extract filters). INCLUDE and EXCLUDE adjust the view’s grain instead.'],
 ex:R`// Whole-day P&L on every trade row
{ FIXED [Day] : SUM([Pnl]) }

// First day you ever traded each contract
{ FIXED [Contract] : MIN([Day]) }

// Your heaviest load per exercise, on every set
{ FIXED [Exercise] : MAX([Load]) }`,
 quiz:{q:'A FIXED LOD is evaluated relative to a normal <b>dimension filter</b>…',o:['After it, so it respects the filter','Before it, so the filter does not change the FIXED result','At the same time','Only on extracts'],a:1,why:'In Tableau’s order of operations, FIXED LODs come before dimension filters. Add the filter to context if you want FIXED to respect it.'},
 prac:{task:'Write an LOD that returns, for each habit, the number of distinct days you slipped on it.',sol:R`{ FIXED [Habit] : COUNTD(IF [Event] = "slipped" THEN [Day] END) }`}},
{id:'tab6',t:'tab',lv:3,title:'Table calculations',
 learn:['Table calculations run <b>last</b>, on the aggregated numbers already in the view: running totals, % of total, rank, difference, moving averages. Your equity curve is a running sum of daily P&L.','“Compute Using” (table across, pane down, or specific dimensions) sets the direction and scope: the Tableau version of PARTITION BY / ORDER BY.'],
 ex:R`// Columns: DAY([Day])
RUNNING_SUM(SUM([Pnl]))                 // equity curve
SUM([Pnl]) / TOTAL(SUM([Pnl]))          // % of total per contract
RANK(SUM([Pnl]))                        // contract rank
WINDOW_AVG(AVG([Sleep]), -6, 0)         // 7-day moving avg sleep`,
 quiz:{q:'When are table calculations computed?',o:['Before any filters, at row level','In the database during extraction','Last, on the aggregated results currently in the view','Only when exporting'],a:2,why:'They work on the view’s result table, so they change if you filter out marks or change the dimensions in the view.'},
 prac:{task:'Write a table calc for the week-over-week % change in your meditation minutes (from <b>mind</b>).',sol:R`(ZN(SUM([Minutes])) - LOOKUP(ZN(SUM([Minutes])), -1))
/ ABS(LOOKUP(ZN(SUM([Minutes])), -1))
// Columns: WEEK([Day]) · Compute using: Day`}},
{id:'tab7',t:'tab',lv:4,title:'Order of operations & context filters',
 learn:['Tableau’s query pipeline: extract filters → data source filters → <b>context filters</b> → Top N / FIXED LOD → dimension filters → INCLUDE/EXCLUDE LOD → measure filters → table calcs → table-calc filters.','Most “why is my Top 5 wrong?” bugs come from this order. Adding a filter to context makes it apply before Top N and FIXED.'],
 ex:R`Goal: your Top 5 contracts by P&L *on Short trades only*
1. Filters: [Contract] → Top → By field: Top 5 by SUM(Pnl)
2. Filters: [Side] = Short  → right-click → Add to Context
   (without context, the Top 5 is picked from all trades first,
    then Short is applied, so you may see fewer or wrong contracts)`,
 quiz:{q:'Your Top 5 Contracts filter ignores the Side filter. The fix?',o:['Convert Side to a measure','Add the Side filter to context','Use a live connection','Sort descending'],a:1,why:'Top N filters run before regular dimension filters; context filters run before Top N.'},
 prac:{task:'Where do FIXED LODs sit relative to context filters and dimension filters? What does that mean for { FIXED [Day] : SUM([Pnl]) } with a Side filter on?',sol:R`Context filters → FIXED LOD → dimension filters
A normal Side filter does not change the whole-day P&L;
add Side to context to get the day's P&L for that side only.`}},
{id:'tab8',t:'tab',lv:4,title:'Automating extracts: Hyper API & REST',
 learn:['The Tableau Hyper API (Python package tableauhyperapi) builds .hyper extracts straight from code: ideal after a SQL or pandas step that cleans your app logs. You define a table, insert rows, and publish.','Publishing and refreshing are automated with the REST API (the Python wrapper is tableauserverclient, TSC) or the tabcmd command line.'],
 ex:R`from tableauhyperapi import (HyperProcess, Telemetry, Connection, CreateMode,
                             TableDefinition, TableName, SqlType, Inserter)

with HyperProcess(Telemetry.DO_NOT_SEND_USAGE_DATA_TO_TABLEAU) as hp:
    with Connection(hp.endpoint, "isionlogs.hyper", CreateMode.CREATE_AND_REPLACE) as con:
        con.catalog.create_schema("Extract")
        t = TableDefinition(TableName("Extract", "trades"), [
            TableDefinition.Column("id", SqlType.int()),
            TableDefinition.Column("day", SqlType.date()),
            TableDefinition.Column("contract", SqlType.text()),
            TableDefinition.Column("side", SqlType.text()),
            TableDefinition.Column("pnl", SqlType.double()),
        ])
        con.catalog.create_table(t)
        with Inserter(con, t) as ins:
            ins.add_rows(rows)   # list of tuples from trades; day as datetime.date

const PYSETUP=R`
import pandas as pd, numpy as np, io, json, sys, traceback
TABLES = json.loads(TABLES_JSON)
pd.set_option("display.width", 120)
def fresh_ns():
    ns = {"pd": pd, "np": np, "json": json}
    for name, t in TABLES.items():
        ns[name] = pd.DataFrame(t["rows"], columns=t["cols"])
    ns["day_export"] = json.loads(EXPORT_JSON)
    ns["logs"] = LOGS.split("\n")
    return ns
def to_rows(r):
    if r is None:
        return None
    if isinstance(r, pd.Series):
        r = r.reset_index() if (r.index.name is not None or isinstance(r.index, pd.MultiIndex)) else r.to_frame()
    if isinstance(r, pd.DataFrame):
        if r.index.name is not None or isinstance(r.index, pd.MultiIndex):
            r = r.reset_index()
        r = r.reset_index(drop=True)
        return {"cols": [str(c) for c in r.columns], "rows": json.loads(r.to_json(orient="values", date_format="iso"))}
    return {"cols": ["value"], "rows": [[r if isinstance(r, (int, float, str)) else str(r)]]}
def run_user(code):
    buf = io.StringIO()
    old = sys.stdout

        exec(code, ns)
    except Exception as e:
        err = "".join(traceback.format_exception_only(type(e), e))
    finally:

        try:
            res = to_rows(ns.get("result"))
        except Exception as e:
            err = "Could not read result: " + str(e)

  W.forEach(l=>{const f=fails(l.id),q=progress[l.id]||{};
    if(f>=3)look.push(`<b>${esc(l.title)}</b> took ${pl(f,'failed attempt')} before ${E1.some(e=>e.lesson===l.id&&e.ok)?'it passed':'I stopped'}.`);
    if(q.rev)look.push(`I opened the solution for <b>${esc(l.title)}</b>${q.rev>1?` ${q.rev} times`:''}. Could I write it from scratch now?`);
    if(!(q.done&&q.date<=day)){const f0=[...evs.filter(e=>e.lesson===l.id).map(dayOf),...ses.filter(s=>(s.lessons||[]).includes(l.id)).map(dayOf)].sort()[0],n=diffDays(f0,day)+1;
      if(n>=3)look.push(`<b>${esc(l.title)}</b> has been in progress for ${n} days (since ${fdate(f0)}).`)}});
  S1.filter(s=>s.min<10).forEach(s=>look.push(`The ${hm(s.time)} session lasted only ${mins(s.min)}.`));
  const T0=new Set([...before.map(e=>LM[e.lesson].t),...ses.filter(s=>dayOf(s)<day).flatMap(s=>s.tracks||[])]);
  TK.filter(t=>tOk(t)&&T0.has(t)&&!W.some(l=>l.t===t)).forEach(t=>{const last=[...before.filter(e=>LM[e.lesson].t===t).map(dayOf),...ses.filter(s=>dayOf(s)<day&&(s.tracks||[]).includes(t)).map(dayOf)].sort().at(-1),n=diffDays(last,day);
    if(n>=7)look.push(`I haven't touched ${TR[t].n} in ${n} days (last on ${fdate(last)}).`)});
  out+=sec('What went well',ul(good))+sec('What to look at',ul(look));
  // the morning check-in for this date, when there is one
  let ci=null;try{ci=(JSON.parse(localStorage.getItem('isx.checkin.v1'))?.log||[]).find(e=>e.day===day)}catch(e){}
  if(ci){const Q=['','poor','restless','OK','good','great'],E=['','drained','low','steady','good','charged'];
    out+=sec('My state',`<p>I slept <b>${ci.sleep} h</b> (${Q[ci.q]||'unrated'} sleep) and my energy was <b>${E[ci.energy]||'unrated'}</b>.${ci.sleep<7&&S1.length&&min<g?' Short sleep on a short study day: worth watching if it repeats.':''}</p>`)}
  // next up: the same lesson the START button opens
  const nx=S.track==='all'?recommend():nextIn(S.track);
  out+=sec('Next up',nx?`<p>${day===today()?'Next for me':'As things stand now, next for me'} is ${lt(nx)}${progress[nx.id]?.att?`, where I've already made ${pl(progress[nx.id].att,'attempt')}`:''}. Press <b>START</b> to pick it up.</p>`:`<p>I've completed every ${S.track==='all'?'':TR[S.track].n+' '}lesson. Revisit the ones that took the most attempts.</p>`);
  // questions, most specific first
  const hard=W.slice().sort((a,b)=>fails(b.id)-fails(a.id))[0],q=[];
  if(hard)q.push(`Explain ${esc(hard.title)} in one sentence without looking.`);
  if(hard&&fails(hard.id))q.push(fails(hard.id)>1?`What did my failed attempts on ${esc(hard.title)} have in common?`:`What did my failed attempt on ${esc(hard.title)} miss?`);
  W.filter(l=>progress[l.id]?.rev).slice(0,1).forEach(l=>q.push(`Could I solve ${esc(l.title)} again from a blank editor?`));
  W.filter(l=>!(progress[l.id]?.done&&progress[l.id].date<=day)).slice(0,1).forEach(l=>q.push(`What's the one step in ${esc(l.title)} I'm still unsure of?`));
  if(S1.length&&min<g)q.push(`What got in the way of the full ${g} minutes?`);
  q.push('One thing to keep doing tomorrow. One thing to change.');
  out+=sec('Questions to answer',`<ol>${q.map(x=>`<li>${x}</li>`).join('')}</ol>`);
  return out;
}

// four weeks ending yesterday: a session most days, the first SQL and Python lessons in order, checks that mostly pass. Fixed seed: the same every time.
function sample(){
  if((events.length||sessions.length||Object.values(progress).some(p=>p.done))&&!confirm('Replace your progress, attempts and study history with the sample?'))return;
  let sd=1337;const rnd=()=>(sd=sd*16807%2147483647)/2147483647,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  // lesson, days spent on it, failed checks, hints; the last one is still in progress
  const PLAN=[['sql1',1,0,0],['py1',1,1,0],['sql2',1,0,0],['sql3',2,2,1],['py2',1,0,0],['sql4',3,3,1],['py3',2,1,0],['sql5',1,0,0],['py4',3,2,1],['sql6',2,1,0],['py5',2,0,0],['sql7',2,1,0]];
  const REST=new Set([25,21,18,14,11,7,3]),t0=today(),now=Date.now();
  progress={};events=[];sessions=[];
  let pi=0,dn=0;
  for(let ago=27;ago>=0&&pi<PLAN.length;ago--){
    if(REST.has(ago))continue;
    const[id,days,fails,hint]=PLAN[pi],l=LM[id],last=++dn===days,k=addDays(t0,-ago),d=pd(k),p=pr(id),min=ri(15,45);
    // today's session has already ended
    let at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),rnd()<.35?ri(6,8):ri(18,21),ri(0,59)).getTime();if(!ago)at=Math.min(at,now-(min+5)*6e4);
    sessions.push({id:uid(),time:new Date(at).toISOString(),min,lessons:[id],tracks:[l.t]});
    let m=ri(5,12);const ev=ok=>{p.att++;events.push({id:uid(),time:new Date(at+m*6e4).toISOString(),lesson:id,kind:'check',ok});m=Math.min(min-1,m+ri(3,9))};
    for(let f=last?fails-p.att:Math.min(fails-p.att,Math.ceil(fails/days));f>0;f--)ev(false);
    if(last){p.hint=hint;if(pi<PLAN.length-1){ev(true);p.done=true;p.first=p.att===1&&!p.hint&&!p.rev;p.xp=Math.round(XPL[l.lv]*(p.first?1.5:1));p.date=k}pi++;dn=0}
  }
  settings.last=PLAN.at(-1)[0];save();S.sel=null;S.range='all';S.page=1;closeModal();render();toast('Sample loaded')
}
