 learn:['A <b>dimension filter</b> ([Contract], [Side], a range of [Day]) removes rows <i>before</i> the view adds anything up, like SQL’s WHERE. A <b>measure filter</b> on an aggregate, such as SUM([Pnl]) at least 200, runs <i>after</i> the aggregation and keeps the marks whose total passes, like HAVING. Both sit on the same Filters shelf; a pill that reads SUM(Pnl) is the HAVING kind.','Drag a measure to Filters and Tableau asks how to filter it. <b>All values</b> tests every row, so [Pnl] at least 0 keeps each non-losing trade: a WHERE on pnl. <b>Sum</b> (or Average, Count…) tests the aggregated marks: the HAVING. Pick the wrong one and you get each contract’s total of its non-losing trades when you wanted the contracts that are at least even overall.','Gotcha: a measure filter is computed at the view’s level of detail. SUM([Pnl]) at least 200 with only [Day] on Rows keeps whole days. Add [Side] and the same filter tests each day’s Long and Short totals on their own: a day can come back with only its winning side, or show up twice. Nothing about the filter changed; the grain did.'],
 ex:R`Which weighted exercises got real volume? (workouts)

Rows:    [Exercise]
Text:    SUM([Sets])
Filters: [Type] = Weighted        dimension filter: rows out first (WHERE)
         SUM([Sets]) at least 12  measure filter, "Sum" in the dialog:
                                  exercises out after adding up (HAVING)
same as SQL:
  SELECT exercise, SUM(sets) FROM workouts
  WHERE type = 'Weighted'
  GROUP BY exercise
  HAVING SUM(sets) >= 12

"All values" at least 12 would test each logged entry instead
(WHERE sets >= 12): no single entry has 12 sets, so the view empties.`,
 quiz:{q:'[Contract] on Rows, SUM([Pnl]) on Text. You drag [Pnl] to Filters, choose <b>All values</b> and set <b>At least 0</b>. What does the table show?',o:['Only the contracts whose total P&L is at least 0, with their full totals','Each contract’s total of its non-losing trades only: All values tests each trade','The full totals, but only for contracts with at least one trade at 0 or above','Every contract with its full total: a filter on a measure only hides marks'],a:1,why:'All values filters the individual rows, like WHERE pnl >= 0: losing trades are dropped before the SUM, so each contract shows the total of its non-losing trades only (a contract with a net loss can even turn positive). Choosing Sum in that dialog gives A, the HAVING version; Maximum would give C. D is wrong because the losing trades are gone before the totals are computed.'},
 prac:{task:'On <b>trades</b>, list the days when your <b>NQZ6</b> trades together made at least $200: [Day] on Rows as one discrete header per date (not per day of the month), SUM([Pnl]) on Text. Which of your two filters is a dimension filter and which a measure filter, and which acts first? Then add [Side] to Rows: why does the list change?',sol:R`Rows:    DAY([Day]) as discrete headers, one per date
         (Day from the 2nd group or Exact Date, then right-click → Discrete;
          not Day from the 1st group, which is the day of the month)
Text:    SUM([Pnl])
Filters: [Contract] = NQZ6        dimension filter, acts first: the
                                  other contracts' trades are gone (WHERE)
         SUM([Pnl]) at least 200  measure filter (choose Sum, not All
                                  values): keeps the days whose NQZ6
                                  total is at least 200 (HAVING)
≈ SELECT day, SUM(pnl) FROM trades WHERE contract = 'NQZ6'
  GROUP BY day HAVING SUM(pnl) >= 200
(21 days in the built-in sample)

After [Side] goes on Rows the grain is day + side, so the filter
tests each day's Long total and Short total separately. A day where
both sides made 200+ now shows twice, a day that missed overall can
come back with just its winning side, and a day that only made it
with both sides together would drop out. In the sample: 21 → 22 rows.`}},
{id:'tab12',t:'tab',lv:1,title:'Measure Names & Measure Values',
 learn:['<b>Measure Values</b> is one field that holds several measures at once; <b>Measure Names</b> is the dimension Tableau generates to label them. Together they put several measures side by side in one view: Measure Names on Columns (or Color) splits the view by measure, Measure Values on Text or Rows shows each one’s value. That is how you build a KPI table with sleep, quality and energy as its columns.','You rarely set it up by hand. Double-click a second measure into a text table, or drop a measure onto an existing axis, and Tableau places both fields for you. Which measures are in it lives on the <b>Measure Values card</b> under the Marks card: drag a pill off to remove it. Each pill keeps its own aggregation, so one can be AVG and another SUM (right-click → Measure).','Gotcha: everything in Measure Values shares <b>one axis</b>. A bowl’s kcal (about 1,100) next to its grams of protein flattens the grams into slivers. Keep measures of the same unit together, and give a different unit its own pill on Rows: each measure pill there gets its own axis. Dragging Measure Values in from the Data pane brings every measure along, so prune the card.'],
 ex:R`Morning check-in averages by month (checkins): a text table

Rows:    MONTH([Day])     (discrete)
Columns: Measure Names
Text:    Measure Values
Measure Values card: AVG([Sleep])  AVG([Quality])  AVG([Energy])
  (drag the other measures off; right-click each → Measure → Average)

As a chart, keep only the two 1-5 scores on the card:
Columns: MONTH([Day]), Measure Names
Rows:    Measure Values        Color: Measure Names
Measure Values card: AVG([Quality])  AVG([Energy])
→ one shared axis, fine for two 1-5 scores; add AVG([Weight])
  (about 80) and those bars flatten`,
 quiz:{q:'Your bar chart of Measure Values with [Kcal], [Protein], [Carbs] and [Fat] (Measure Names on Columns) shows one huge bar and three slivers. Why?',o:['Protein, Carbs and Fat are averaged while Kcal is summed','Measure Values turns each measure into its share of the total, and kcal is most of it','All four measures share one axis, so grams look tiny next to kcal','Measure Names hides small values, so most protein, carbs and fat rows are left out'],a:2,why:'Measure Values draws every measure it holds on a single shared axis, so a scale that fits the kcal leaves the grams near zero. Mixed aggregations would change the heights, but the grams would still be tiny next to kcal; Measure Values shows plain values, not shares; and Measure Names only labels the measures, it does not drop rows. Keep same-unit measures together, or give Kcal its own pill on Rows and so its own axis.'},
 prac:{task:'On <b>meals</b>, for each meal [Name], show side-by-side bars of the <b>average</b> protein, carbs and fat per logged meal (one row of meals), in one chart with a colour legend. Which meal has the highest average protein?',sol:R`Columns: [Name], Measure Names   (Measure Names after Name:
                                   the three bars stand side by side)
Rows:    Measure Values
Color:   Measure Names            (the legend)
Measure Values card: keep only Protein, Carbs and Fat; drag Kcal,
  Fiber and any other measure off. Right-click each remaining pill
  → Measure → Average (each pill keeps its own aggregation).
(With Measure Names only on Color, the bars stack instead.)

Kcal stays out: on the shared axis 1,100+ kcal would flatten the grams.
Highest average protein: the Chicken bowl (about 72 g in the sample
data), with the Steak bowl close behind.`}},
{id:'tab3',t:'tab',lv:2,title:'Relationships vs joins',
 learn:['Tableau’s logical layer uses <b>relationships</b> (“noodles”): tables stay separate and are joined at query time, at the right level of detail. Physical-layer <b>joins</b> flatten the tables into one first.','Your logs show why this matters. <b>trades</b> has one row per trade; <b>checkins</b> has one row per day. They relate on Day. Join them physically and each morning’s sleep is copied onto every trade that day.'],
 ex:R`Logical layer:   Trades ──(Day = Day)── Checkins
  → AVG([Sleep]) is computed per check-in day,
    SUM([Pnl]) per trade: both correct

Physical join:   Trades ⨝ Checkins on Day
  → a day with 6 trades repeats its sleep 6 times
  → SUM([Sleep]) is inflated, AVG([Sleep]) leans to busy days`,
 quiz:{q:'Trades (one row per trade) and Checkins (one row per day) are combined with a <b>physical join</b> on Day. What happens to SUM([Sleep])?',o:['It is correct','It becomes NULL','It is inflated, because each day’s sleep repeats on every trade that day','Tableau blocks the join'],a:2,why:'Joining tables of different grain duplicates the coarser rows. Relationships (or a FIXED LOD) prevent this.'},
 prac:{task:'You really do want a row-level table of trades with that morning’s sleep. How do you get to the physical layer and build a left join?',sol:R`Data Source tab → double-click the logical table Trades
→ opens the physical layer → drag Checkins in
→ choose Left join, clause: Day = Day
(every trade kept; Sleep is NULL on days with no check-in)`}},
{id:'tab4',t:'tab',lv:2,title:'Calculated fields',
 learn:['Calculated fields (Analysis → Create Calculated Field) are row-level formulas, like expressions in a SQL SELECT. IF/ELSEIF/ELSE/END, IIF, CASE, DATEDIFF, DATETRUNC and string functions are the core tools.','An IF with no ELSE returns NULL for rows that do not match, and SUM ignores NULLs: handy for conditional measures like “P&L on Long trades only”.'],
 ex:R`// Winning trade? (1/0, so AVG gives your win rate)
IIF([Pnl] > 0, 1, 0)

// Minutes in the trade
DATEDIFF('minute', [Opened], [Closed])

// Mood lift from a meditation session
[Mood After] - [Mood Before]

// Week bucket
DATETRUNC('week', [Day])`,
 quiz:{q:'What does <b>IF [Side] = "Long" THEN [Pnl] END</b> return for a Short trade?',o:['0','The P&L anyway','An error','NULL'],a:3,why:'With no ELSE branch, rows that do not match return NULL. Aggregations like SUM skip NULLs.'},
 prac:{task:'Write a calc on <b>checkins</b> that labels each night: sleep under 6 hours "short", under 7.5 "ok", else "rested".',sol:R`IF [Sleep] < 6 THEN "short"
ELSEIF [Sleep] < 7.5 THEN "ok"
ELSE "rested"
END`}},
{id:'tab13',t:'tab',lv:2,title:'Aggregate vs row-level calcs',
 learn:['A calculated field is one of two kinds. The calcs in <i>Calculated fields</i> are all <b>row-level</b>: <code>[Mood After] - [Mood Before]</code> or <code>[Protein] / [Kcal]</code> is computed on each row <i>before</i> anything is grouped, and on a shelf it then gets an aggregation like any measure. An <b>aggregate</b> calc, such as <code>SUM([Protein]) / SUM([Kcal])</code>, has every field inside an aggregation: it is computed <i>after</i> grouping, once per mark at the view&rsquo;s level of detail, and shows on the shelf as AGG(…).','Ratios and KPIs belong in aggregate calcs. For protein per kcal across a day&rsquo;s meals, <code>SUM([Protein] / [Kcal])</code> adds up one ratio per meal, a number that grows with every meal you log; <code>AVG([Protein] / [Kcal])</code> is the average meal&rsquo;s ratio, where a banana weighs as much as a steak bowl. Only <code>SUM([Protein]) / SUM([Kcal])</code> is the ratio of the totals. A conditional sum such as <code>SUM(IF [Pnl] &gt; 0 THEN [Pnl] END)</code> is fine: a row-level IF inside an aggregate.','Gotchas: mixing the two kinds is refused. <code>SUM([Pnl]) / [Minutes]</code> fails with “Cannot mix aggregate and non-aggregate arguments with this function”, and <code>IF SUM([Pnl]) &gt; 0 THEN [Contract] END</code> gets a similar IF error. Aggregate every field to fix it: SUM, AVG, MIN, or <code>ATTR([Contract])</code>, which returns the value when every row of the mark shares it and * otherwise. Division by zero gives NULL, not an error, so a ratio whose denominator is 0 or empty shows as an empty cell.'],
 ex:R`// mind table
// Row-level: computed on each session, before grouping
[Mood After] - [Mood Before]
    // save as [Mood lift]; on a shelf it arrives as SUM:
    // switch it to AVG([Mood lift]) for the average session's lift

// Aggregate: every field inside an aggregation, computed once
// per mark after grouping (AGG on the shelf)
SUM(IF [Practice] = "Meditation" THEN [Minutes] END) / SUM([Minutes])
    // with WEEK([Day]) on Columns: the share of each week's
    // minutes spent meditating (a row-level IF inside SUM is fine)

// Mixed: refused with
// "Cannot mix aggregate and non-aggregate arguments with this function."
[Mood After] - AVG([Mood Before])          // wrong
AVG([Mood After]) - AVG([Mood Before])     // fixed: aggregate every field`,
 quiz:{q:'A text table shows only your snacks ([Kind] on Rows, filtered to snack). Which calc gives the protein per 100 kcal of all your snacks <i>together</i>?',o:['SUM([Protein] / [Kcal] * 100)','AVG([Protein] / [Kcal]) * 100','[Protein] / SUM([Kcal]) * 100','SUM([Protein]) / SUM([Kcal]) * 100'],a:3,why:'“Together” means total protein over total kcal: a ratio of two sums, computed after grouping. A adds up one ratio per snack, so it grows with every snack you log (on the built-in data it lands in the hundreds). B is the average snack’s ratio: a 95 kcal apple counts as much as a 160 kcal protein shake, so on the built-in data it comes out lower. C mixes the row-level [Protein] with SUM([Kcal]), and Tableau refuses it: Cannot mix aggregate and non-aggregate arguments with this function.'},
 prac:{task:'On <b>trades</b>, build a KPI table with [Contract] on Rows and these aggregate calcs side by side (Measure Values). <b>Profit factor</b>: dollars won divided by dollars lost. <b>Payoff ratio</b>: the average winning trade divided by the average losing trade. Make both positive, and count a trade with [Pnl] = 0 as neither a win nor a loss. <b>$ per minute</b>: total P&amp;L per minute held. Next to it, add the AVG of a row-level <code>[Pnl] / [Minutes]</code>. Which contract has the best profit factor, why do the two per-minute columns disagree, and which cells would be empty for a contract with no losing trade?',sol:R`// Profit factor: dollars won / dollars lost
SUM(IF [Pnl] > 0 THEN [Pnl] END) / ABS(SUM(IF [Pnl] < 0 THEN [Pnl] END))

// Payoff ratio: average win / average loss
AVG(IF [Pnl] > 0 THEN [Pnl] END) / ABS(AVG(IF [Pnl] < 0 THEN [Pnl] END))

// $ per minute held
SUM([Pnl]) / SUM([Minutes])

// Row-level, for the comparison column (set its pill to AVG)
[Pnl] / [Minutes]

Rows: [Contract] · Columns: Measure Names · Text: Measure Values

Why aggregate: each KPI is a ratio of totals or averages per contract,
so it must be computed after grouping (AGG on the shelf). The IFs are
row-level inside the aggregates: a 0 trade is NULL in both branches and
skipped, so it counts as neither a win nor a loss.

Best profit factor: above 1 means the contract won more than it lost.
Built-in sample: NQZ6 leads (about 2.1) and GCZ6 sits below 1 (about
0.67). Apps' data: ESZ6 leads (about 2.4).
Payoff ratio: on the apps' data every win is +895 and every loss -305,
so it is 895 / 305 = 2.93 for every contract. The built-in sample also
has -5 trades on ESZ6 and GCZ6: they count as losses, shrink the average
loss and push the ratio up (ESZ6 about 4.2, GCZ6 3.1, NQZ6 2.93).

$ per minute: SUM / SUM is the dollars the contract made per minute in
the market. AVG([Pnl] / [Minutes]) is the average trade's own rate, so a
-305 stop-out after a few minutes (about -50 a minute) weighs as much
as a 25-minute winner (about +36 a minute). On both datasets it is
negative for every contract, even the ones that made money: a different
question.

Empty cells: a contract with no losing trade loses its profit factor
and its payoff ratio. Both denominators aggregate no values, so they
are NULL, and dividing by NULL (or by 0) gives NULL, not an error.
The two per-minute columns still show.`}},
{id:'tab14',t:'tab',lv:2,title:'Dual-axis & combo charts',
 learn:['Two measures on Rows give two panes stacked one above the other, each with its own axis. Right-click the second pill → <b>Dual Axis</b> (or drag the measure to the right edge of the view until a dashed line appears) and they overlay in one pane: one axis on the left, one on the right, and a Marks card per measure (plus All). That is how daily P&amp;L becomes bars and morning energy a line over the same dates.','A <b>shared</b> (blended) axis is different: drop the second measure onto the first axis itself and Tableau switches to Measure Values (as in <i>Measure Names &amp; Measure Values</i>): one scale, one Marks card. Use it, or a dual axis with <b>Synchronize Axis</b> (right-click the right axis), only when the units match, such as protein and carbs (both grams). Dollars next to a 1–5 score need two independent scales, or the score flattens along zero.','Gotchas: unsynchronized axes have their own ranges, so the two zero lines need not meet and heights can&rsquo;t be compared across measures; title both axes (right-click → Edit Axis). Dual Axis may reset the mark types, so set Bar and Line on each measure&rsquo;s own card, and put colour there too, not on All. Energy comes from <b>checkins</b>, related to <b>trades</b> on Day (<i>Relationships vs joins</i>): put Trades&rsquo; [Day] on Columns, and energy is still averaged per check-in, not repeated per trade.'],
 ex:R`Combo on meals: daily kcal (bars) + protein (line)
Columns: DAY([Day])                  (continuous, green)
Rows:    SUM([Kcal])   SUM([Protein])
         → two stacked panes, one axis each

Right-click SUM([Protein]) → Dual Axis
         → one pane: Kcal axis on the left, Protein on the right
Marks cards:  All · SUM(Kcal) → Bar · SUM(Protein) → Line
Synchronize Axis?  No: kcal and grams are different units.

Protein and Carbs instead (both grams)?
         → Dual Axis, then right-click the right axis → Synchronize Axis

Shared (blended) axis instead: drag SUM([Protein]) onto the Kcal axis
         → Measure Values on Rows: one axis, one Marks card`,
 quiz:{q:'Daily SUM([Pnl]) bars over continuous DAY([Day]). You drop AVG([Energy]) onto the P&amp;L axis, so both measures share one axis, and the energy values barely leave zero. What is the best fix?',o:['Make it a dual axis, then right-click the right axis → Synchronize Axis so both read on one scale','Change the pill to SUM([Energy]) so the values grow into the dollar range','Put AVG([Energy]) on Rows as its own pill → Dual Axis, and leave the axes unsynchronized','Edit the shared axis to a fixed range of 0 to 5 so the energy values fill it'],a:2,why:'Dollars and a 1–5 score cannot share a scale. On a dual axis, Energy gets its own independent axis on the right, and its own Marks card, so it can be a line over the bars. Synchronizing forces that axis back onto the dollar range, so energy flattens again. There is one check-in per day, so SUM([Energy]) per day is the same number as AVG. A fixed 0 to 5 range clips almost every P&L bar.'},
 prac:{task:'On <b>trades</b> related to <b>checkins</b> on Day, build one combo chart: Trades&rsquo; [Day] as continuous DAY([Day]) on Columns; daily SUM([Pnl]) as bars, coloured by the aggregate calc <code>SUM([Pnl]) &gt; 0</code> (True green, False red) on the bars only; AVG([Energy]) as a line on a dual axis. Should you synchronize the axes, and why? Do low-energy check-ins (Energy 1 or 2) line up with red days?',sol:R`Calc [Green day]:  SUM([Pnl]) > 0     (aggregate: one True/False per day)

Columns: DAY([Day]) from Trades, continuous
Rows:    SUM([Pnl])   AVG([Energy])
Right-click AVG(Energy) → Dual Axis     (the Energy axis moves to the right)

Marks cards (Dual Axis may have reset both mark types):
  SUM(Pnl)    → Bar, [Green day] on Color
                (on this card only, so the line keeps one colour)
                Color → Edit Colors: True green, False red
  AVG(Energy) → Line

Do not Synchronize Axis: dollars vs a 1-5 score. Synced, the energy line
flattens near 0 again.
Title both axes (right-click → Edit Axis): "Daily P&L ($)" and
"Morning energy (1-5)". The zero lines don't match, so read each
measure against its own axis.

Reading it: days with trades but no check-in have no energy point, and
check-in days without trades have no date on Trades' axis, so their
energy is left out. On both datasets, days with a 1-2 check-in average
clearly less P&L than days with a 4-5 (built-in sample: about 110 vs 730),
but many of them still finish green: a hint, not a rule.`}},
{id:'tab15',t:'tab',lv:2,title:'Reference lines & trend lines',
 learn:['The <b>Analytics</b> pane (the tab next to Data) holds ready-made items you drag onto the view, among them Constant Line, Average Line, Median with Quartiles, Box Plot, Totals, Trend Line and Forecast, plus custom Reference Line, Reference Band and Distribution Band. Drag a line and drop zones appear: <b>Table</b>, <b>Pane</b> or <b>Cell</b>. That is the scope: one line for the whole view, one per pane (each [Contract] row, say) or one per cell. Right-click a line → Edit to change it later.','A reference line is computed from the <b>marks</b> in the view, not the raw rows. On daily SUM([Pnl]) bars an Average Line is the mean of the bars: your average trading day, not your average trade (a day with four trades counts once, as their total). Days with no trades are not zeros; they have no bar, so they don&rsquo;t count. Put [Contract] on Rows and even the Table average moves, because each mark is now one contract on one day; switch the scope to Per Pane for one average per contract.','A <b>Trend Line</b> (Linear, Logarithmic, Exponential, Polynomial or Power) needs numbers or dates on both axes, so use continuous DAY([Day]), not text headers. By default it draws one trend per colour (“Allow a trend line per color” in its options). Right-click it → <b>Describe Trend Line</b> for the equation, R-Squared (how much of the variation the line explains) and the p-value: above 0.05, the slope could well be noise.'],
 ex:R`Daily practice minutes (mind)
Columns: DAY([Day]) continuous · Rows: SUM([Minutes]) · Mark: Bar

Analytics pane → drag onto the view:
  Constant Line → Table → type 20    your daily target
  Average Line  → Table              the mean of the daily bars: your
                                     average practice day, not your
                                     average session
  Trend Line    → Linear             is your practice growing?
     right-click the trend line → Describe Trend Line…
     → equation, R-Squared, p-value

Rows: + [Practice]                   one pane per practice
  right-click the average line → Edit → Scope: Per Pane
                                     → one average per practice`,
 quiz:{q:'Daily P&amp;L bars: continuous DAY([Day]) on Columns, SUM([Pnl]) on Rows. You drag <b>Average Line</b> from the Analytics pane and drop it on <b>Table</b>. What value does the line show?',o:['The average P&L per trade, because averages are computed from the rows','The mean of the daily totals, one per day you traded: your average trading day','The average over every calendar day on the axis, with no-trade days counted as 0','A moving average that follows the bars from one day to the next'],a:1,why:'Reference lines aggregate the marks in the view, not the rows. Each bar is one day’s SUM([Pnl]), so the Average Line is the mean of those bars. Days without trades have no bar, so they are left out, not counted as 0. A per-trade average would need AVG([Pnl]) in the view, and a moving average needs a table calculation (a later lesson), not an Average Line.'},
 prac:{task:'(a) On <b>meals</b>: daily kcal bars (continuous DAY([Day]) on Columns, SUM([Kcal]) on Rows) with a Constant Line at a 2,400 kcal target and an Average Line, both on Table. What does the average line measure, why is it not your average meal, and is it above the target? Now put [Kind] on Rows: why does the Table average drop? Then edit its scope to Per Pane: what are your average bowl day and your average snack day? (b) On <b>checkins</b>: AVG([Weight]) as a line over continuous DAY([Day]) with a linear Trend Line. Open Describe Trend Line: is the slope down, and is it significant (p-value below 0.05)?',sol:R`(a) Analytics pane → Constant Line → drop on Table → type 2400
    Analytics pane → Average Line → drop on Table
    → one line at the mean of the daily bars: your average logged day
      (days with nothing logged have no bar, so they don't count). It is
      not your average meal: each bar adds up all of that day's meals,
      while AVG([Kcal]) would average the meals one by one.
      Built-in sample: about 2,441 a day, just above the target, against
      about 876 a meal. Apps' data: about 2,383 a day (just under) and 821.
    Rows: [Kind] → one pane per kind. Each mark is now one kind on one
      day, so the Table average averages kind-days and drops (built-in
      sample: about 2,441 → 1,577; apps' data: 2,383 → 1,478).
    Right-click the average line → Edit → Scope: Per Pane
    → one line per kind, over the days you ate it: bowls about 2,333 a
      day and snacks about 197 on the sample (apps' data: 2,251 and 215).

(b) Columns: DAY([Day]) continuous · Rows: AVG([Weight]) · Mark: Line
    Analytics pane → Trend Line → Linear
    Right-click the trend line → Describe Trend Line…
    → the equation (its Day coefficient is the slope), R-Squared, p-value.
    Days with no weight (NULL) are left out of the line and the fit.
    Built-in sample: slope down, R-Squared high (about 0.9), p-value far
    below 0.05: a real downtrend.
    Apps' data: the weight zig-zags around 81 and the line is nearly
    flat; R-Squared is near 0 and the p-value far above 0.05: no real
    trend, the slope is noise.`}},
{id:'tab16',t:'tab',lv:2,title:'Dashboards & filter actions',
 learn:['A <b>dashboard</b> (Dashboard → New Dashboard) puts sheets together: drag them in from the Sheets list, tiled into a grid or floating on top, at a Fixed, Automatic or Range size. <b>Dashboard → Actions</b> makes them talk to each other. A <b>Filter</b> action turns a click on one sheet into a filter on others; <b>Use as Filter</b> (the funnel icon on a sheet&rsquo;s frame) makes one in a click. Highlight, Go to URL and Go to Sheet actions also exist; parameter and set actions come later.','Each filter action has <b>source</b> sheets, <b>target</b> sheets, a trigger (<i>Run action on</i>: Hover, Select or Menu) and what <b>Clearing the selection will</b> do: Show all values (the default: the target shows everything again), Keep filtered values (the last selection stays) or Exclude all values (the target goes blank). It filters on the dimensions of the clicked mark (All fields) or only the ones you pick (Selected fields): click the NQZ6 bar and the targets keep Contract = NQZ6.','Gotchas: a filter card shown on a dashboard filters only its own sheet until you open its menu → <b>Apply to Worksheets</b> → All Using This Data Source (or Selected Worksheets). Clearing is set per action, so a detail list that stays empty until a click, next to a chart that shows everything, needs two actions. A <b>highlight</b> action fades the other marks instead of removing them, and the target sheet needs the field it matches on.'],
 ex:R`Dashboard "Urges" on habits ([Event] = resisted, slipped on both sheets)
  Sheet "By trigger": Rows [Trigger] · Columns AVG([Intensity])
  Sheet "Log":        Rows [Id] · [Day] (exact date, discrete) · [Event]
                      · [Trigger] · Text SUM([Intensity])

Dashboard → Actions → Add Action → Filter…
  Name:           Pick a trigger
  Source sheets:  By trigger      Run action on: (•) Select ( ) Hover ( ) Menu
  Target sheets:  Log
  Clearing the selection will:
    (•) Show all values  ( ) Keep filtered values  ( ) Exclude all values
  Filter:         (•) All fields  ( ) Selected fields
→ click the Boredom bar: the log keeps only Boredom urges

Filter card [Event] ▾ → Apply to Worksheets → All Using This Data Source
  (by default a card filters only the sheet it came from)`,
 quiz:{q:'On your trading dashboard, clicking a contract in the P&amp;L bar chart filters the trade list. You want the list to stay <b>empty</b> until a contract is clicked, and empty again after you clear the click. Which setting does that?',o:['Filter action: Clearing the selection will → Show all values','Filter action: Clearing the selection will → Keep filtered values','Change Run action on from Select to Hover','Filter action: Clearing the selection will → Exclude all values'],a:3,why:'Exclude all values filters every row out of the target while nothing is selected, so the list is blank until you click a bar and blank again when you clear it. Show all values (the default) fills the list with every trade whenever nothing is selected. Keep filtered values leaves the last contract’s trades in place after you clear, and the list is still full before the first click. Hover only changes what triggers the action, not what clearing does.'},
 prac:{task:'Build a <b>Trading review</b> dashboard on <b>trades</b> with three sheets. <b>A</b>: bars of SUM([Pnl]) by [Contract]. <b>B</b>: a trade list, one row per trade ([Id] as a dimension, [Day] as a discrete exact date, [Side], with SUM([Minutes]) and SUM([Pnl])). <b>C</b>: daily P&amp;L lines, continuous DAY([Day]) and SUM([Pnl]) with [Side] on Color. Clicking a contract in A filters B and C; while nothing is clicked, B is empty and C shows every contract. Hovering a trade in B highlights its side (matched on [Side] only) in B and C. Add a [Day] range filter card that applies to all three sheets. Save the workbook as Trading review: later lessons build on it.',sol:R`Sheets
  A: Columns [Contract] · Rows SUM([Pnl])
  B: Rows [Id] (dimension) · [Day] (exact date, discrete) · [Side]
     Text: Measure Values = SUM([Minutes]), SUM([Pnl])
     Columns: Measure Names
  C: Columns DAY([Day]) continuous · Rows SUM([Pnl]) · Color [Side] · Line

Dashboard → New Dashboard → drag in A, B, C (tiled)

Dashboard → Actions → Add Action → Filter…
  1  Source: A · Run action on: Select · Target: B
     Clearing the selection will: Exclude all values
  2  Source: A · Run action on: Select · Target: C
     Clearing the selection will: Show all values
  (clearing is set per action, so B and C need one action each;
   Filter: All fields, so the clicked bar passes its Contract)

Dashboard → Actions → Add Action → Highlight…
  Source: B · Run action on: Hover · Targets: B, C
  Target highlighting: Selected fields → Side
  (Side is on Rows in B and on Color in C, so both can match it)

Date filter: on C, drag [Day] to Filters → Range of Dates
  On the dashboard: C's ▾ menu → Filters → Day (shows the card)
  Card ▾ → Apply to Worksheets → All Using This Data Source
  (A, B and C all use trades, so all three follow it)

File → Save As… → Trading review

Check: click the NQZ6 bar → B lists only NQZ6 trades, C shows NQZ6's
daily P&L per side. Click empty space in A → B empties again and C shows
every contract. Hover a Long trade in B → the Long rows and the Long
line stay bright, Short fades.`}},
{id:'tab17',t:'tab',lv:3,title:'Parameters: user inputs',
 learn:['A <b>parameter</b> is one workbook-wide value (a number, text, a date or True/False) that the viewer sets through a control: right-click it in the Data pane → <b>Show Parameter</b>. On its own it does nothing. It only acts where something refers to it: a calculated field, the N of a Top N filter (the Top tab of a filter dialog), a reference line (<i>Reference lines &amp; trend lines</i>), a title. Unlike a filter it belongs to no data source, and filters never change its value.','The classic build is a <b>measure switcher</b>: a String parameter [Metric] with the list Kcal, Protein, Carbs, Fat, and a row-level calc <code>CASE [Metric] WHEN "Kcal" THEN [Kcal] WHEN "Protein" THEN [Protein] … END</code>. Each meal returns the picked column, and the SUM on the shelf adds it up per day. A parameter also sits happily next to aggregates: <code>SUM([Protein]) &gt;= [Target]</code> raises no mixing error.','Gotcha: a list’s values are fixed when you create it, so a contract or exercise you start logging later is not in it, unless you set the list to refresh from a field <b>When workbook opens</b> (dynamic parameters, Tableau 2020.1 and later). The value it opens with can also come from a calculated field, such as one that returns your latest [Day], so a Date parameter always starts on your newest data.'],
 ex:R`// trades: let the viewer pick a side (a parameter used as a filter)
// 1. Create Parameter [Pick side]: String · List: Long, Short, Both
// 2. Calc [Side filter] (row-level TRUE/FALSE):
[Pick side] = "Both" OR [Side] = [Pick side]
// 3. Filters: [Side filter] = True
//    right-click [Pick side] → Show Parameter
// 4. Rows: [Contract] · Columns: SUM([Pnl])
//    Title: P&L by contract: <Parameters.Pick side>`,
 quiz:{q:'You created a String parameter <b>[Metric]</b> and showed its control, but picking another value does not change the chart. Why?',o:['Its allowable values are a fixed list; set them to refresh from a field when the workbook opens','Nothing in the view uses it yet: no calc, filter, reference line or title refers to it','The chart uses another data source, and a parameter only works in the data source it was created in','It must be added to context so it applies before the aggregation'],a:1,why:'A parameter is just a value the viewer sets. Showing its control changes nothing until a calculated field (like the CASE switcher), a Top N filter, a reference line or a title uses it. A fixed list still changes value when you pick (refreshing only updates which values are offered), parameters belong to the whole workbook rather than one data source, and context applies to filters, not parameters.'},
 prac:{task:'On <b>meals</b>, build a metric switcher. (1) A String parameter <b>[Metric]</b> with the list Kcal, Protein, Carbs, Fat, shown as a control. (2) A calc <b>[Selected metric]</b> that returns the picked column. (3) Continuous DAY([Day]) on Columns (Day from the second, date-value group of the pill menu), SUM([Selected metric]) on Rows as bars, and the parameter’s value in the sheet title. (4) In place of a constant target line, a Float parameter <b>[Daily target]</b> drawn as a reference line, and the bars coloured by whether the day’s total is <i>at least</i> the target. Switch to Protein with a target of 120: how many days reach it?',sol:R`Parameter [Metric]: Data type String · Allowable values: List
  Kcal, Protein, Carbs, Fat · Current value Kcal
  right-click [Metric] → Show Parameter
Calc [Selected metric] (row-level):
CASE [Metric]
  WHEN "Kcal"    THEN [Kcal]
  WHEN "Protein" THEN [Protein]
  WHEN "Carbs"   THEN [Carbs]
  WHEN "Fat"     THEN [Fat]
END
Columns: DAY([Day]) (continuous) · Rows: SUM([Selected metric]) · Mark: Bar
Title: Daily <Parameters.Metric>   (Edit Title → Insert → Parameters.Metric)

Parameter [Daily target]: Float · Allowable values: All · Current value 2400
  Show Parameter
Analytics pane → Reference Line → drop on Table → Value: [Daily target]
Calc [Hit target] = SUM([Selected metric]) >= [Daily target]  → Color
Metric = Protein, target 120: the line moves to 120 and the colours recompute.
Count the True bars: 13 of 42 days on the built-in sample (one day lands
exactly on 120 and counts, because the calc uses >=), 16 of 31 on the apps'
data. The target is one number,
so set it again when you switch metric (2400 means nothing for grams).
Filters never change either parameter: only the viewer (or an action) does.`}},
{id:'tab18',t:'tab',lv:3,title:'Data blending: primary & secondary',
 learn:['<b>Blending</b> combines two separate data sources in one sheet. Tableau queries each source on its own (the primary at the view’s level of detail, the secondary grouped by the <b>linking fields</b> in the view), then matches the results. The first source you use in a sheet is the <b>primary</b> (blue tick in the Data pane) and decides which marks exist; the other is the <b>secondary</b> (orange tick). It behaves like a left join of aggregated results, not of rows.','Fields with the same name link automatically; otherwise set the link in Data → Edit Blend Relationships. In the secondary’s Data pane an orange chain next to the field means the link is active, a grey broken chain that it is off; Tableau turns it on when the linking field is used in the view. Make [Day] a Date in both sources first, as in <i>Discrete vs continuous</i>. The primary is chosen per sheet: whichever source you drag a field from first.','Gotchas: (1) secondary fields are always aggregated. A secondary dimension comes in as <code>ATTR()</code>, which shows <b>*</b> when one primary mark matches several values. (2) Rows that exist only in the secondary disappear, because the primary drives the marks. Blend when the tables can’t be related in one data source (two published sources you can’t edit, say); otherwise a relationship (<i>Relationships vs joins</i>) is simpler.'],
 ex:R`Two data sources: Meals and Checkins (Data → New Data Source)
Drag [Day] from Meals first → Meals is primary (blue tick)
  Rows:    [Day]  (exact date, discrete)
  Columns: SUM([Kcal])      ← Meals, primary
           AVG([Weight])    ← Checkins, secondary (orange tick)
  Data pane: orange chain next to Checkins' [Day] = link active
Same result as SQL:
  SELECT m.day, m.kcal, c.weight
  FROM (SELECT day, SUM(kcal) AS kcal FROM meals GROUP BY day) m
  LEFT JOIN (SELECT day, AVG(weight) AS weight FROM checkins GROUP BY day) c
    ON c.day = m.day`,
 quiz:{q:'Checkins is the primary source and Trades the secondary, linked on [Day]. Exact-date [Day] is on Rows and you drag Trades’ <b>[Contract]</b> onto Text. Some rows show <b>*</b>. Why?',o:['Those days have several contracts, and a secondary dimension comes in as ATTR([Contract])','The link on Day is broken for those days, so Tableau cannot match the two sources','You made no trades on those days, so the secondary returns NULL, which is shown as *','Blending repeated those check-in rows once per trade, as a join would, and * marks the duplicates'],a:0,why:'The secondary is aggregated to the linking field before it is matched, so every field from it is aggregated; a dimension becomes ATTR([Contract]), which returns the value when there is only one and * when there are several. Days with no trades get NULL, not *, and blending never duplicates primary rows the way a row-level join does.'},
 prac:{task:'Add <b>trades</b> and <b>checkins</b> as two separate data sources (two connections, not related), with [Day] as a Date in both (checkins has one row per day). Sheet 1, Trades primary: [Day] as a discrete exact date on Rows, SUM([Pnl]) and the blended AVG([Energy]) on Columns. Sheet 2, Checkins primary: [Day] from Checkins, again as a discrete exact date, on Rows, AVG([Energy]) and Trades’ SUM([Pnl]) on Columns, and Trades’ [Contract] on Label. Which days appear in one sheet and not the other, and why? What do the * labels mean?',sol:R`Data → New Data Source twice (trades, checkins); change [Day] to Date in both.
Link: same name → Tableau links on Day automatically
  (if not: Data → Edit Blend Relationships → Custom → Add: Day ↔ Day)
Sheet 1: drag [Day] from Trades first → Trades primary (blue tick)
  Rows: [Day] (right-click → Exact Date, Discrete) · Columns: SUM([Pnl]),
  then AVG([Energy]) from Checkins (orange tick, orange chain on Day)
  → one row per trading day. Check-in days with no trades are missing;
    trade days with no check-in have an empty Energy bar.
Sheet 2: drag [Day] from Checkins first → Checkins primary
  Rows: [Day] (Exact Date, Discrete) · Columns: AVG([Energy]), SUM([Pnl]) from Trades · Label: [Contract] from Trades
  → one row per check-in day. Trade-only days vanish; check-in days
    with no trades have no P&L.
  * = ATTR([Contract]) on a day with more than one contract.
Why: each source is queried on its own, the secondary is aggregated to Day
and matched to the primary's rows (a left join of aggregates), so the
primary decides which days exist. Both datasets have days of each kind:
  built-in sample: 44 trade days, 46 check-in days; 11 trade days have no
  check-in (only in sheet 1), 13 check-in days have no trades (only in sheet 2)
  apps' data: 48 trade days, 33 check-in days; 24 only in sheet 1, 9 only in sheet 2
vs a relationship ("Relationships vs joins"): both tables sit in one data
source and no source is primary; blend only when the sources can't be modelled together.`}},
{id:'tab5',t:'tab',lv:3,title:'LOD expressions: FIXED',
 learn:['Level of Detail expressions compute at a grain you choose, whatever the view shows. { FIXED [Day] : SUM([Pnl]) } puts the whole day’s P&L on every trade, so you can ask “how did my trades do on red days?”','FIXED runs <b>before</b> dimension filters (but after context, data source and extract filters). INCLUDE and EXCLUDE adjust the view’s grain instead.'],
 ex:R`// Whole-day P&L on every trade row
{ FIXED [Day] : SUM([Pnl]) }

// First day you ever traded each contract
{ FIXED [Contract] : MIN([Day]) }

// Your heaviest load per exercise, on every set
{ FIXED [Exercise] : MAX([Load]) }`,
 quiz:{q:'A FIXED LOD is evaluated relative to a normal <b>dimension filter</b>…',o:['Before it, so the filter does not change the FIXED result','After it, so it respects the filter','At the same time','Only on extracts'],a:0,why:'In Tableau’s order of operations, FIXED LODs come before dimension filters. Add the filter to context if you want FIXED to respect it.'},
 prac:{task:'Write an LOD that returns, for each habit, the number of distinct days you slipped on it.',sol:R`{ FIXED [Habit] : COUNTD(IF [Event] = "slipped" THEN [Day] END) }`}},
{id:'tab19',t:'tab',lv:3,title:'LOD expressions: INCLUDE & EXCLUDE',
 learn:['A FIXED LOD (<i>LOD expressions: FIXED</i>) ignores the view. <b>INCLUDE</b> and <b>EXCLUDE</b> are relative to it. INCLUDE adds a dimension to the view’s grain for the inner aggregate, and an outer aggregation rolls the result back up to the marks: with [Kind] on Rows, <code>AVG({ INCLUDE [Day] : SUM([Kcal]) })</code> totals kcal per kind and day, then averages those days, giving the kcal per day you ate that kind, where <code>AVG([Kcal])</code> is per meal.','<b>EXCLUDE</b> removes a dimension from the grain: <code>{ EXCLUDE [Kind] : SUM([Kcal]) }</code> is the total across all kinds, on every kind’s mark. Wrap it in MIN (one value per mark) for a share of the parent: <code>SUM([Kcal]) / MIN({ EXCLUDE [Kind] : SUM([Kcal]) })</code>. It is an ordinary measure computed in the query, so you can reuse it in further calcs. The next lesson, <i>Table calculations</i>, gets the same share from TOTAL(), computed afterwards on the marks in the view.','Gotchas: (1) both run <i>after</i> dimension filters, so a [Day] filter changes them, while FIXED runs before them and ignores it unless the filter is in context. (2) The outer aggregation matters: SUM of an INCLUDE that sums just adds the days back up to plain SUM([Kcal]); AVG gives the per-day figure. (3) EXCLUDE of a dimension that isn’t in the view changes nothing.'],
 ex:R`// mind · Rows: [Practice]
AVG([Minutes])                               // minutes per session
AVG({ INCLUDE [Day] : SUM([Minutes]) })      // minutes per day you did it
SUM({ INCLUDE [Day] : SUM([Minutes]) })      // = SUM([Minutes]): outer SUM undoes it

// share of all your practice minutes (format as %)
SUM([Minutes]) / MIN({ EXCLUDE [Practice] : SUM([Minutes]) })`,
 quiz:{q:'[Contract] is on Rows. What does <b>AVG({ INCLUDE [Day] : SUM([Pnl]) })</b> return?',o:['Each contract’s average P&L per trade, as AVG([Pnl]) would give','Each contract’s total P&L, the same as SUM([Pnl]), since the days are added back up','One number on every row: your average daily P&L across all contracts','Each contract’s average daily P&L, over the days you traded it'],a:3,why:'INCLUDE adds [Day] to the view’s grain for the inner SUM, so Tableau first totals P&L per contract and day, then the outer AVG rolls those daily totals back up to each contract. The per-trade average is AVG([Pnl]); only an outer SUM would give back the plain total; and because [Contract] stays in the grain, each contract gets its own value.'},
 prac:{task:'On <b>workouts</b> (one row per exercise logged), with [Type] on Rows, show three columns side by side: the average sets per exercise logged, the average sets per <i>day</i> you trained that type (an INCLUDE calc), and each type’s share of all your sets (an EXCLUDE calc), formatted as a percentage. Cardio logs no sets, so its row stays empty. Why are Weighted’s first two columns so far apart, and why does the INCLUDE need an outer AVG? Then add a [Day] filter that keeps only October 2026: do the two LOD columns respect it, and would <code>{ FIXED [Type] : SUM([Sets]) }</code>?',sol:R`Rows: [Type] · Measure Names on Columns · Measure Values on Text:
  AVG([Sets])                                     → sets per exercise logged
  [Sets per day] = AVG({ INCLUDE [Day] : SUM([Sets]) })
     inner SUM per Type × Day, outer AVG over the days you trained that type
  [Share of sets] = SUM([Sets]) / MIN({ EXCLUDE [Type] : SUM([Sets]) })
     denominator = all types' total on every row; MIN because it is one
     value per mark · Format → Numbers → Percentage
Weighted: about 3 sets per exercise, but you log several exercises in one
  session, so about 8 sets per training day on the built-in sample (about 16
  on the apps' data, where Stretch also goes from 2 to 16). One exercise a
  day of a type means both columns match, as Bodyweight and Stretch do on
  the sample. Weighted is about 84% of all sets on the sample, 70% on apps.
Outer AVG: with SUM outside you add the days back up to plain SUM([Sets]).
[Day] filter (October 2026 only): both LOD columns change (the share is now
  of October's sets), because INCLUDE and EXCLUDE run after dimension
  filters. { FIXED [Type] : SUM([Sets]) } would keep the all-time total
  unless the [Day] filter is added to context.`}},
{id:'tab6',t:'tab',lv:3,title:'Table calculations',
 learn:['Table calculations run <b>last</b>, on the aggregated numbers already in the view: running totals, % of total, rank, difference, moving averages. Your equity curve is a running sum of daily P&L.','“Compute Using” (table across, pane down, or specific dimensions) sets the direction and scope: the Tableau version of PARTITION BY / ORDER BY.'],
 ex:R`// Columns: DAY([Day])
RUNNING_SUM(SUM([Pnl]))                 // equity curve
SUM([Pnl]) / TOTAL(SUM([Pnl]))          // % of total per contract
RANK(SUM([Pnl]))                        // contract rank
WINDOW_AVG(AVG([Sleep]), -6, 0)         // 7-day moving avg sleep`,
 quiz:{q:'When are table calculations computed?',o:['Before any filters, at row level','Last, on the aggregated results currently in the view','In the database during extraction','Only when exporting'],a:1,why:'They work on the view’s result table, so they change if you filter out marks or change the dimensions in the view.'},
 prac:{task:'Write a table calc for the week-over-week % change in your meditation minutes (from <b>mind</b>).',sol:R`(ZN(SUM([Minutes])) - LOOKUP(ZN(SUM([Minutes])), -1))
/ ABS(LOOKUP(ZN(SUM([Minutes])), -1))
// Columns: WEEK([Day]) · Compute using: Day`}},
{id:'tab20',t:'tab',lv:3,title:'Groups vs sets',
 learn:['A <b>group</b> relabels members by hand: select Bench Press, Overhead Press and Triceps Pushdown → Group → “Push”. The result is still a dimension with many values (Push, Pull, Legs…), and ticking <b>Include ‘Other’</b> pools everything ungrouped into one Other member. Gotcha: a group doesn’t place new members. An exercise you start logging next week stays on its own, or falls into Other, until you edit the group.','A <b>set</b> splits members into <b>In</b> and <b>Out</b>. It can be fixed (members you tick) or computed: by condition (SUM([Volume]) &gt; 10000, volume being sets × reps × load) or Top N by a field, where N can be a parameter (<i>Parameters: user inputs</i>). Computed sets recompute as your data grows. In a calc a set is TRUE/FALSE: <code>IF [Top exercises] THEN [Exercise] ELSE "Other" END</code>. Create Combined Set merges two sets on one dimension (all, shared, or one set except shared members).','Gotcha: conditional and Top N sets are computed at the same stage as Top N filters and FIXED LODs (<i>LOD expressions: FIXED</i>), before ordinary dimension filters. A [Day] filter for the last two weeks hides older workouts but doesn’t change who is in the set: it is still your all-time top N. If the set should follow the filter, right-click it → <b>Add to Context</b>: a context filter runs before sets and FIXED.'],
 ex:R`// mind
// Group: right-click [Practice] → Create → Group
//   Calm = Meditation, Breathwork, Body Scan
//   Mind = Visualization, Focus
//   ☑ Include 'Other'  → Journaling lands in Other
//   → a new dimension with 3 values

// Set by condition: right-click [Practice] → Create → Set
//   Condition tab · By formula: AVG([Depth]) >= 6.5   → [Deep practices]
//   Color: [Deep practices]   → In / Out

// A set in a calc is TRUE/FALSE:
IF [Deep practices] THEN [Practice] ELSE "Other" END`,
 quiz:{q:'You want a bar for each of your top <i>N</i> exercises by training volume plus one “Other” bar, with N picked through a parameter, membership that updates as you log more, and a TRUE/FALSE you can use in a calc. What do you build?',o:['A group of your current top five exercises, with Include Other ticked','A Top N set on [Exercise] by SUM([Volume]), with N set to the parameter','A Top N filter on [Exercise] by SUM([Volume]), with N set to the parameter','A String parameter whose list holds your top exercise names'],a:1,why:'A Top N set recomputes its In/Out members from the data, takes a parameter for N, and is TRUE/FALSE in a calc, so IF [Top exercises] THEN [Exercise] ELSE "Other" END builds the Other bar. A group is a fixed hand-made mapping that does not move as your volumes change; a Top N filter removes the other exercises instead of pooling them; a parameter list is fixed values a viewer picks from, not a ranking.'},
 prac:{task:'On <b>workouts</b>: (1) a row-level calc <b>[Volume]</b> = <code>ZN([Sets] * [Reps] * [Load])</code> (0 for anything without a load). (2) An integer parameter <b>[Top N]</b> (current value 5), shown as a control. (3) A set <b>[Top exercises]</b>: the top [Top N] of [Exercise] by SUM([Volume]). (4) A calc <b>[Exercise or Other]</b> and a bar chart of SUM([Volume]) by it, with the set on Color. (5) Group the exercises into Push / Pull / Legs with Include ‘Other’ ticked: what happens to the group and to the set when you log a new exercise? (6) Add a [Day] filter that keeps only October 2026. What happens to the bars, does set membership change, and what would make the set rank on October only?',sol:R`[Volume] = ZN([Sets] * [Reps] * [Load])     // 0 for cardio, stretch, bodyweight
Parameter [Top N]: Integer · Current value 5 · Range 1 to 10 · Show Parameter
Set: right-click [Exercise] → Create → Set → Top tab
     By field: Top [Top N] by [Volume] Sum   → [Top exercises]
[Exercise or Other] = IF [Top exercises] THEN [Exercise] ELSE "Other" END
Rows: [Exercise or Other] · Columns: SUM([Volume]) · Color: [Top exercises]
  sort descending: Leg Press is your top exercise on both datasets (on the
  apps' data the Other bar, 31 exercises together, is bigger still)
Group: right-click [Exercise] → Create → Group → select members → Group
  Push (Bench Press, Overhead Press, Triceps Pushdown…), Pull (Deadlift,
  Barbell Row, Pull-up…), Legs (Leg Press, Back Squat, Romanian Deadlift…)
  ☑ Include 'Other'
New exercise: the set recomputes (a heavy one can enter the top N, and N
  moves with the control); the group is a fixed mapping, so the new exercise
  lands in Other until you edit the group. A group has many values; a set
  has In/Out and is TRUE/FALSE in calcs.
[Day] filter: the bars shrink to October's volume, but membership stays your
  all-time top N, because Top N sets are computed before dimension filters.
  Built-in sample: Deadlift keeps its own bar although Triceps Pushdown (in
  Other) lifted more in October. Right-click the filter → Add to
  Context and the set ranks October only: Triceps Pushdown comes in, Deadlift
  goes to Other. (On the apps' data the top 5 is the same either way.)`}},
{id:'tab7',t:'tab',lv:4,title:'Order of operations & context filters',
 learn:['Tableau’s query pipeline: extract filters → data source filters → <b>context filters</b> → Top N / FIXED LOD → dimension filters → INCLUDE/EXCLUDE LOD → measure filters → table calcs → table-calc filters.','Most “why is my Top 5 wrong?” bugs come from this order. Adding a filter to context makes it apply before Top N and FIXED.'],
 ex:R`Goal: your Top 5 contracts by P&L *on Short trades only*
1. Filters: [Contract] → Top → By field: Top 5 by SUM(Pnl)
2. Filters: [Side] = Short  → right-click → Add to Context
   (without context, the Top 5 is picked from all trades first,
    then Short is applied, so you may see fewer or wrong contracts)`,
 quiz:{q:'Your Top 5 Contracts filter ignores the Side filter. The fix?',o:['Convert Side to a measure','Use a live connection','Add the Side filter to context','Sort descending'],a:2,why:'Top N filters run before regular dimension filters; context filters run before Top N.'},
 prac:{task:'Where do FIXED LODs sit relative to context filters and dimension filters? What does that mean for { FIXED [Day] : SUM([Pnl]) } with a Side filter on?',sol:R`Context filters → FIXED LOD → dimension filters
A normal Side filter does not change the whole-day P&L;
add Side to context to get the day's P&L for that side only.`}},
{id:'tab21',t:'tab',lv:4,title:'Filtering without breaking table calcs',
 learn:['A dimension filter on [Day] removes rows <b>before</b> table calculations run (the pipeline in <i>Order of operations &amp; context filters</i>). Filter your equity curve, RUNNING_SUM(SUM([Pnl])), to October and the sum starts over: the first point is just that day’s P&amp;L. % of total and RANK are likewise recomputed on whatever is left.','A filter built on a <b>table calculation</b> runs last, so it only <b>hides</b> marks and every calc still sees all the data. <code>LAST() &lt;= 9</code> keeps the last 10 marks, <code>INDEX() &lt;= 5</code> the first five, and <code>LOOKUP(MIN([Day]), 0)</code> is the same date returned as a table calc, so a date range on it hides days instead of removing them.','Gotchas: (1) give the filter calc the same Compute Using as the running sum (Day), or it counts within the wrong partition. (2) It still queries every row, so it is no faster. (3) Hidden marks still count in TOTAL() and the WINDOW_ calcs, so the visible shares no longer add up to 100%. LAST() counts marks: on a daily chart that means trading days, not calendar days.'],
 ex:R`// mind: each practice's share of ALL your minutes, showing only the top 3
Rows: [Practice]
Text: SUM([Minutes]) / TOTAL(SUM([Minutes]))      Compute Using: Table (down)

[Top 3 practices] = RANK(SUM([Minutes])) <= 3     Compute Using: Table (down)
Filters: [Top 3 practices] = True
→ three rows, each still a share of ALL minutes: together less than 100%

Same view with a dimension filter instead ([Practice]: tick those three)
→ the other rows are gone before TOTAL() runs, so the three add up to 100%`,
 quiz:{q:'Your equity curve is RUNNING_SUM(SUM([Pnl])) on a continuous DAY([Day]) axis, starting in August. You add a normal <b>[Day] filter</b> that keeps only October. What happens to the curve?',o:['Only the axis zooms in to October; every point keeps the value it had with all days shown','Nothing is filtered, because table calcs run before dimension filters','It starts over: the first October point is just that day’s P&L, and it adds up from there','Each October point shows only that day’s P&L, because a filtered running sum stops accumulating'],a:2,why:'Dimension filters run before table calcs, so the running sum only ever sees October’s rows. It still accumulates within October (so not D), but from zero instead of from your earlier total. To keep the level built up in earlier months, filter on a table calc such as LOOKUP(MIN([Day]), 0) or LAST(), which only hides marks.'},
 prac:{task:'On <b>trades</b>: an equity curve, RUNNING_SUM(SUM([Pnl])) on a continuous DAY([Day]) axis, that shows only your <b>last 10 trading days</b> (days with trades) but still counts from your first trade. Write the table-calc filter and say how you set its Compute Using. Then show a single month (October, or your latest month), again without restarting the curve: a date range on a table-calc version of [Day], not on [Day] itself. Where do both filters sit in the order of operations, and how do you check that the first visible point is right?',sol:R`Sheet: Columns DAY([Day]) (continuous)   Rows: RUNNING_SUM(SUM([Pnl]))
       running sum Compute Using: Day

1. Last 10 trading days
   [Last 10 days] = LAST() <= 9
   Drag it to Filters → tick True
   Right-click the filter pill → Compute Using → Day (same as the running sum)
   LAST() counts marks, so these are the last 10 days with trades.

2. One month
   [Day shown] = LOOKUP(MIN([Day]), 0)          Compute Using: Day
   Drag it to Filters (keep all dates) → right-click → Show Filter
   → narrow the range to the month, e.g. 1–31 October
   It returns each mark's own date, but as a table calc, so it runs last.

Order: dimension filters → measure filters → table calcs (the running sum)
→ table-calc filters (these two). The running sum is computed over every day,
then the earlier marks are hidden.

Check: compare with the unfiltered curve. The first visible point must equal
the value the full curve had on that day (your running total up to then), not
that day's own P&L, which is what a plain [Day] filter would give. For the
last 10 days, the last point also equals your all-time SUM([Pnl]).`}},
{id:'tab22',t:'tab',lv:4,title:'Parameter & set actions',
 learn:['A <b>filter action</b> removes what you did not click from its targets. <b>Parameter</b> and <b>set actions</b> write the clicked value into a parameter or a set instead, so the rest of the data stays in the view for comparison. Both are in Dashboard → Actions → Add Action: Change Parameter and Change Set Values.','A parameter action has source sheets, a trigger (Hover, Select, Menu), a target parameter, a source field and an aggregation; clearing keeps the current value (the default) or sets a value you choose. Its data type must match the field: a Date parameter for [Day]. A set action can <b>Assign values to set</b>, <b>Add values to set</b> or <b>Remove values from set</b>; clearing keeps the set values, adds all or removes all.','Nothing changes until something uses the target, as with any parameter (<i>Parameters: user inputs</i>): <code>[Day] = [Picked Day]</code> on Filters, a reference line at [Picked Day] (<i>Reference lines &amp; trend lines</i>) or the set on Color. A parameter is not tied to a data source, so one click can drive a checkins sheet too. Check older actions: a filter action that clears with Exclude all values keeps its target empty whatever the parameter says.'],
 ex:R`// workouts: click exercises to compare them with everything else
Set: right-click [Exercise] → Create → Set… → [Compare]  (nothing ticked)
Sheet "Sets by exercise": Rows [Exercise], Columns SUM([Sets]), Color [Compare]
Dashboard → Actions → Add Action → Change Set Values…
  Source sheet: Sets by exercise      Run action on: Select
  Target set: Compare
  Running the action will:     Add values to set   (each click adds one more)
  Clearing the selection will: Keep set values
The set works in calcs too:
  IF [Compare] THEN [Exercise] ELSE "Everything else" END

// mind: click a practice to see its sessions, keeping every practice on screen
Parameter [Picked Practice]: String, current value "Meditation"
Add Action → Change Parameter…
  Source sheet: Minutes by practice   Target parameter: Picked Practice
  Source field: Practice              Aggregation: None
  Clearing the selection will: Keep current value
Sessions sheet: calc [Practice] = [Picked Practice] on Filters → True`,
 quiz:{q:'On the Trading review dashboard, clicking a contract in the P&amp;L bar chart should turn that bar orange, keep the other contracts on screen in grey, and let a calc such as <code>IF [Selected contracts] THEN [Side] END</code> use the choice. Which setup does that?',o:['A set [Selected contracts] on [Contract], placed on Color and filled by a set action (Assign values to set)','A filter action from the bar chart to itself, with Clearing the selection set to Keep filtered values','A highlight action on [Contract], which fades every contract except the clicked one','A parameter action that writes the clicked contract into a string parameter, with nothing else in the view'],a:0,why:'A set action only changes who is IN the set: the set on Color draws IN and OUT in two colours, the calc can test it, and every contract stays drawn. A filter action removes the unclicked contracts from its target; Keep filtered values only decides what happens when you clear. A highlight action fades the rest but cannot be used in a calc. A parameter does nothing until a calc, filter or reference line refers to it.'},
 prac:{task:'Extend the <b>Trading review</b> dashboard from <i>Dashboards &amp; filter actions</i> (on <b>trades</b>). (1) Clicking a day on the daily P&amp;L chart (C) stores it in a Date parameter [Picked Day]: a reference line marks that day, the trade list (B) shows only that day’s trades, and C keeps every day. Before any click the list shows your latest trading day; clicking empty space keeps the last pick. (2) Clicking a contract on the bar chart (A) turns it orange and the others grey; clearing the click turns every bar grey again. (3) Optional: only the clicked contract splits into Long and Short bars, the others keep one “Both sides” bar. Give the parameter, the calcs and the settings of both action dialogs.',sol:R`1. Create Parameter → [Picked Day]: Data type Date, Allowable values All,
   Current value: your latest trading day
   ([Day] must be a Date field, see Discrete vs continuous; if it is
    Date & Time, compare DATE([Day]) instead)
   Dashboard → Actions → Add Action → Change Parameter…
     Source sheets: C (daily P&L)      Run action on: Select
     Target parameter: Picked Day
     Source field: Day                 Aggregation: None
     Clearing the selection will: Keep current value
   C: right-click the Day axis → Add Reference Line
     Scope: Entire Table   Value: Picked Day (parameter)   Label: Value
   B (trade list): calc [Is picked day] = [Day] = [Picked Day] → Filters: True
   The old filter action A → B clears with Exclude all values, so B would stay
   empty until a contract is clicked: set its clearing to Show all values
   (or take B out of its targets).
   C is never filtered by the parameter, so every day stays visible.

2. Right-click [Contract] → Create → Set… → [Selected contracts], none ticked
   A: [Selected contracts] on Color (Edit Colors: In orange, Out grey)
   Add Action → Change Set Values…
     Source sheets: A (P&L by contract)   Run action on: Select
     Target set: Selected contracts
     Running the action will: Assign values to set
     Clearing the selection will: Remove all values from set (all grey again)
   (Keep set values would leave the last contract orange.)

3. [Side detail] = IF [Selected contracts] THEN [Side] ELSE "Both sides" END
   A: Columns [Contract], [Side detail] → only the clicked contract shows
   a Long and a Short bar

Nothing moves until a calc, filter or reference line uses the parameter or set.`}},
{id:'tab23',t:'tab',lv:4,title:'Performance: recording & tuning',
 learn:['Measure before you fix. In Tableau Desktop choose Help → Settings and Performance → <b>Start Performance Recording</b>, use the dashboard as a viewer would, then Stop Performance Recording. Tableau opens a Performance Summary workbook: a <b>Timeline</b> of events by sheet, the <b>Events</b> longest first (Executing Query, Compiling Query, Computing Layouts and others) and the <b>Query</b> text of a query event you click.','Slow queries point at the data: an extract with unused fields hidden and data aggregated (<i>Live connections vs extracts</i>), booleans and integers instead of strings, few COUNTDs on many-valued fields. Slow layout points at the dashboard: fewer marks, sheets and filter cards. An <b>Only Relevant Values</b> card re-queries its list after every change to another filter; <b>All Values in Database</b> avoids that, and an Apply button or action filter cuts how often it runs.','Gotchas: (1) a context filter (<i>Order of operations &amp; context filters</i>) helps only when it removes a large share of the rows; otherwise it just adds a step. (2) Tableau caches query results, so a repeat of the same steps can look faster with nothing fixed: far fewer Executing Query events means the cache answered. (3) On your logs every event is tiny; the method is what carries over to work data.'],
 ex:R`// workouts: recording a Training dashboard
Help → Settings and Performance → Start Performance Recording
  open the dashboard · change the [Type] filter · click an exercise
Help → Settings and Performance → Stop Performance Recording
→ the Performance Summary opens as a new workbook
  Timeline: which sheet was busy, and when
  Events: the longest first, for example
    Executing Query     on "Volume by exercise"   → the data side
    Computing Layouts   on "Training dashboard"   → the layout side
  click an Executing Query bar → its text appears in Query

Fixes it might point to:
  IF [Type] = "Weighted" THEN "yes" ELSE "no" END   →  [Type] = "Weighted"  (boolean)
  [Exercise] card: Only Relevant Values             →  All Values in Database`,
 quiz:{q:'A dashboard has six filter cards, all set to <b>Only Relevant Values</b>, and it is slow every time you change any one of them. What is the main reason?',o:['Only Relevant Values turns each card into a context filter, so a temporary table is rebuilt on every change','Filter cards force a live connection, even when the data source is an extract','Every filter change makes the table calculations run again in the database, on all rows','After each change, every relevant-values card has to query the data again to rebuild its own list of values'],a:3,why:'An Only Relevant Values card lists only the values that pass the other filters, so each change sends a new query for every other card’s list, on top of the view’s own queries. All Values in Database avoids those queries; an Apply button or action filters cut how often they run. Filter cards do not change the connection type or create context filters, and table calcs run in Tableau on the results already in the view, not in the database.'},
 prac:{task:'In Tableau Desktop, record the <b>Trading review</b> dashboard from <i>Dashboards &amp; filter actions</i> (on <b>trades</b>) while you open it, change the [Day] filter and click a contract. Which event took longest, and on which sheet? Write down three concrete changes, ranked by what the recording shows, make them, then record the same steps again and compare, allowing for the query cache.',sol:R`Help → Settings and Performance → Start Performance Recording
  open the dashboard · move the [Day] filter · click a contract bar
Help → Settings and Performance → Stop Performance Recording

Reading the Performance Summary
  Events: the top bar is the slowest event; its type says where to look
  (Executing Query = the data source, Computing Layouts = the dashboard)
  Timeline: which sheet or dashboard it belonged to, and when it happened
  Query: click an Executing Query event to read the query it sent

Ranked fixes (typical for this dashboard)
1. Queries: use an extract; Extract → Edit → Hide All Unused Fields, so only
   the fields the sheets use (Id, Day, Contract, Side, Minutes, Pnl) are stored
2. Filter cards: All Values in Database wherever Only Relevant Values is set;
   Customize → Show Apply Button on list cards
3. Marks and layout: the trade list draws one row per trade; keep it short
   (empty until a click, or only the picked day from Parameter & set actions),
   and remove sheets nobody looks at

Record the same steps again and compare the time per event type. If the
second run has far fewer Executing Query events, the cache answered them,
so credit a fix only for what it changed. With a couple of hundred trades
every event takes milliseconds; on a work dataset the same reading shows
where the seconds go.`}},
{id:'tab8',t:'tab',lv:4,title:'Automating extracts: Hyper API & REST',
 learn:['The Tableau Hyper API (Python package tableauhyperapi) builds .hyper extracts straight from code: ideal after a SQL or pandas step that cleans your app logs. You define a table, insert rows, and publish.','Publishing and refreshing are automated with the REST API (the Python wrapper is tableauserverclient, TSC) or the tabcmd command line.'],
 ex:R`from tableauhyperapi import (HyperProcess, Telemetry, Connection, CreateMode,
                             TableDefinition, TableName, SqlType, Inserter)

with HyperProcess(Telemetry.DO_NOT_SEND_USAGE_DATA_TO_TABLEAU) as hp:
    with Connection(hp.endpoint, "isionlogs.hyper", CreateMode.CREATE_AND_REPLACE) as con:
        con.catalog.create_schema("Extract")
        t = TableDefinition(TableName("Extract", "trades"), [
            TableDefinition.Column("id", SqlType.int()),
            TableDefinition.Column("day", SqlType.date()),
            TableDefinition.Column("contract", SqlType.text()),
            TableDefinition.Column("side", SqlType.text()),
            TableDefinition.Column("pnl", SqlType.double()),
        ])
        con.catalog.create_table(t)
        with Inserter(con, t) as ins:
            ins.add_rows(rows)   # list of tuples from trades; day as datetime.date
            ins.execute()`,
 quiz:{q:'Which tool would you use to <b>publish and refresh</b> data sources on Tableau Server/Cloud from a Python script?',o:['tableauhyperapi only','Tableau Prep only','PROC SQL','Tableau Server Client (REST API) or tabcmd'],a:3,why:'The Hyper API creates files; publishing, refresh jobs and permissions go through the REST API (tableauserverclient) or tabcmd.'},
 prac:{task:'Sketch TSC code to publish isionlogs.hyper to a project, overwriting the existing data source.',sol:R`import tableauserverclient as TSC
auth = TSC.PersonalAccessTokenAuth("token-name", "token-secret", site_id="mysite")
server = TSC.Server("https://tableau.example.com", use_server_version=True)
with server.auth.sign_in(auth):
    ds = TSC.DatasourceItem(project_id="PROJECT_ID")
    server.datasources.publish(ds, "isionlogs.hyper", TSC.Server.PublishMode.Overwrite)`}},
{id:'tab24',t:'tab',lv:4,title:'Row-level security with USERNAME()',
 learn:['<b>Row-level security</b>: one published data source in which each viewer sees only their own rows. The usual pattern is an entitlement table (User, Contract) inner-joined to the facts in the physical layer, a calc [Allowed] = <code>[User] = USERNAME()</code> added as a <b>data source filter</b> (True), then Server → Publish Data Source. For groups, test <code>ISMEMBEROF("Coaches")</code>.','Data source filters travel with the published source: every workbook that connects to it gets them, and authors and viewers cannot remove them. A sheet filter can be deleted by anyone who edits the workbook, and an extract filter runs once, when the extract is built, so it cannot vary by viewer. Server → Create User Filter is quicker but lives in one workbook and is kept up by hand.','Gotchas: (1) USERNAME() is your Server or Cloud user name when signed in (on Cloud, your sign-in email) and your local user name in Desktop otherwise; the User column must match it exactly. (2) Before the filter, a contract two users share repeats every trade; after it, each user has one row per contract, so nothing is double-counted. (3) A contract with no entitlement row is hidden from everyone. Tableau Public cannot publish separate data sources.'],
 ex:R`// habits: an accountability partner sees only the urge they help with
Entitlements_Habits.csv
  User,Habit
  analyst,Doomscrolling
  analyst,Drink water
  analyst,Walk 10 min
  partner,Doomscrolling

Data Source tab: Connections → Add → Text file (the CSV)
  double-click Habits → drag the CSV next to it → Inner join: Habit = Habit
[Allowed] = [User] = USERNAME()
Data Source tab → Filters: Add… → Allowed → True      (data source filter)
Server → Publish Data Source → Habits

// group version, no entitlement table:
NOT ISMEMBEROF("Partners") OR [Habit] = "Doomscrolling"`,
 quiz:{q:'Why add the USERNAME() filter as a <b>data source filter</b> on the published data source, rather than as a normal filter on each sheet?',o:['It applies to every workbook that connects to the source, and workbook authors and viewers cannot remove it','USERNAME() can only be used in data source filters; a sheet filter cannot call it','Data source filters run after table calculations, so totals are computed on every user’s rows first','A data source filter is applied when the extract is built, giving each user their own copy of the extract'],a:0,why:'Data source filters are part of the published source, so every query from every workbook carries them and nobody downstream can edit them away. USERNAME() works in any calc, sheet filters included; the trouble is that a sheet filter covers one workbook and anyone who edits it can delete the filter. Data source filters run near the start of the pipeline, long before table calcs. A filter applied when the extract is built (an extract filter) runs once, which is exactly why it cannot vary per viewer.'},
 prac:{task:'On <b>trades</b>: your coach should see only NQZ6 and ESZ6 trades, and you should see all three contracts (ESZ6, GCZ6 and NQZ6). Build an Entitlements table (User, Contract), inner-join it to trades on [Contract] in the physical layer, write [Allowed] and add it as a data source filter before publishing. Then explain what each user sees, what happens to a contract with no entitlement row, how you preview the coach’s view in Desktop, and how a user filter (Server → Create User Filter) would differ.',sol:R`Entitlements (a CSV or an Excel sheet)
  User          Contract
  <your name>   ESZ6
  <your name>   GCZ6
  <your name>   NQZ6
  coach         ESZ6
  coach         NQZ6
<your name> = exactly what USERNAME() returns for you: your Server user name
or Cloud sign-in email, or your local user name in Desktop when you are not
signed in (check it with a calc USERNAME() on Text).

Data Source tab: Connections → Add the file; double-click Trades (physical layer)
  and drag Entitlements next to it → Inner join: Contract = Contract
  (before the filter, every ESZ6 and NQZ6 trade appears twice: once per user)
[Allowed] = [User] = USERNAME()
Data Source tab → Filters: Add… → Allowed → True   (data source filter)
  With an extract, create the extract first, then add this filter: Tableau
  offers existing data source filters as extract filters, and as one it would
  keep only your own rows in the extract.
Server → Publish Data Source → Trades; build workbooks on the published source.

You: all three contracts, each trade once. Coach: ESZ6 and NQZ6 only; the
coach's queries never return GCZ6 rows.
A contract with no entitlement row (say a new one you start trading): the inner
join drops it, so nobody sees it, you included, until you add rows for it.
Preview the coach in Desktop: temporarily change [Allowed] to [User] = "coach",
then put USERNAME() back before publishing.

User filter: Server → Create User Filter → Contract (signed in to Server or
Cloud), tick the contracts for each user. It becomes a set on the Filters shelf
of one workbook: quick to make, but every workbook needs its own, anyone who
edits the workbook can remove it, and each change is made by hand.`}},
];

{t:'Filter rows',sql:R`SELECT day, contract, qty, pnl
FROM trades
WHERE side = 'Short';`,sas:R`data shorts;

 {t:'Top N per group',sql:R`SELECT * FROM (

    ROW_NUMBER() OVER (PARTITION BY contract
                       ORDER BY pnl DESC, id) AS rn
  FROM trades
) WHERE rn <= 2;`,sas:R`proc sort data=trades out=t;
  by contract descending pnl id;
run;

run;`,py:R`(trades.sort_values(["pnl", "id"], ascending=[False, True])
       .groupby("contract").head(2))`,tab:R`Calc: INDEX() with [Contract] and [Id] on Rows,
sorted by SUM([Pnl]) desc → Compute using: Id
Filter the calc to ≤ 2`},
 {t:'Running total',sql:R`SELECT day, SUM(pnl) AS pnl,
  SUM(SUM(pnl)) OVER (ORDER BY day) AS running
FROM trades
GROUP BY day;`,sas:R`proc sql;

  select day, sum(pnl) as pnl
  from trades group by day order by day;
quit;
data equity;

run;`,py:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()
daily["running"] = daily["pnl"].cumsum()`,tab:R`Columns: DAY([Day]) · Rows: SUM([Pnl]) → right-click
→ Quick Table Calculation → Running Total
(= RUNNING_SUM(SUM([Pnl])), your equity curve)`},
 {t:'Latest record per key',sql:R`SELECT * FROM (
  SELECT w.*, ROW_NUMBER() OVER (
    PARTITION BY exercise
    ORDER BY time DESC, id DESC) AS rn
  FROM workouts w
) WHERE rn = 1;`,sas:R`proc sort data=workouts out=w;

run;
data latest;

run;`,py:R`(workouts.sort_values(["exercise", "time", "id"])
         .drop_duplicates("exercise", keep="last"))`,tab:R`Filter calc:
[Time] = { FIXED [Exercise] : MAX([Time]) }

const DATA=(()=>{
  const p2=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  const stamp=ms=>{const d=new Date(ms);return `${iso(d)} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`};
  const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
  const n2=v=>v==null||v===''||!isFinite(v)?null:Math.round(v*100)/100;
  // samples: seeded, so a sample table is the same every time; dates run up to today
  const rng=seed=>{let sd=seed;return()=>(sd=sd*16807%2147483647)/2147483647};
  const now=new Date(),dayAt=(k,h,m,r)=>{const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-k);d.setHours(h,m,Math.floor(r()*60));return d};
  const S={

const PYSETUP=R`
import pandas as pd, numpy as np, io, json, sys, traceback
TABLES = json.loads(TABLES_JSON)
pd.set_option("display.width", 120)
def fresh_ns():
    ns = {"pd": pd, "np": np, "json": json}
    for name, t in TABLES.items():
        ns[name] = pd.DataFrame(t["rows"], columns=t["cols"])
    ns["day_export"] = json.loads(EXPORT_JSON)
    ns["logs"] = LOGS.split("\n")
    return ns
def to_rows(r):
    if r is None:
        return None
    if isinstance(r, pd.Series):
        r = r.reset_index() if (r.index.name is not None or isinstance(r.index, pd.MultiIndex)) else r.to_frame()
    if isinstance(r, pd.DataFrame):
        if r.index.name is not None or isinstance(r.index, pd.MultiIndex):
            r = r.reset_index()
        r = r.reset_index(drop=True)
        return {"cols": [str(c) for c in r.columns], "rows": json.loads(r.to_json(orient="values", date_format="iso"))}
    return {"cols": ["value"], "rows": [[r if isinstance(r, (int, float, str)) else str(r)]]}
def run_user(code):
    buf = io.StringIO()
    old = sys.stdout
    sys.stdout = buf
    err = ""
    ns = fresh_ns()
    try:
        exec(code, ns)
    except Exception as e:
        err = "".join(traceback.format_exception_only(type(e), e))
    finally:
        sys.stdout = old
    res = None
    if not err:
        try:
            res = to_rows(ns.get("result"))
        except Exception as e:
            err = "Could not read result: " + str(e)
    return json.dumps({"out": buf.getvalue(), "err": err, "res": res})
`;

    py.globals.set('EXPORT_JSON',DATA.json);py.globals.set('LOGS',DATA.logs);

}
