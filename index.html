 learn:['A SAS date is a <b>number</b>: the days since 1 January 1960, so 1 Oct 2026 is 24380. A <b>format</b> only changes how that number is shown (DATE9. shows 01OCT2026, YYMMDD10. shows 2026-10-01 and WEEKDATE. shows Thursday, October 1, 2026), never the value. Because it is a number, dates sort and compare correctly, and <code>d2 - d1</code> is the number of days between them.',"In these lessons <b>day</b> is text, Char 10 in 'YYYY-MM-DD' form (PROC CONTENTS shows it; a PROC IMPORT would already have made it a date). Convert it with an <b>informat</b>, <code>d = input(day, yymmdd10.);</code>, and give it a format, <code>format d date9.;</code>. Then the date functions work: YEAR(d), MONTH(d), WEEKDAY(d) (1 = Sunday … 7 = Saturday), and a date literal such as <code>'01OCT2026'd</code> for comparisons.","Gotchas: <b>INPUT</b> reads text into a number with an informat, and <b>PUT</b> writes a value out as text with a format (<code>put(d, downame.)</code> gives the day name, padded, so wrap it in STRIP). Mixing them up is the classic interview question. Without a FORMAT a date prints as 24380. And text cannot be compared with a date: <code>where day &gt;= '01OCT2026'd;</code> stops with <i>ERROR: WHERE clause operator requires compatible variables.</i>"],
 ex:R`/* your nights since 1 September, averaged by month */
data nights;
  set work.checkins;
  d = input(day, yymmdd10.);     /* text 'YYYY-MM-DD' -> days since 1 Jan 1960 */
  format d date9.;               /* display only: 14SEP2026 */
  if d >= '01SEP2026'd;          /* d is computed in the step, so IF, not WHERE */
  month = month(d);              /* 9, 10 */
  mon   = put(d, monyy7.);       /* PUT: number -> text, SEP2026 */
run;

proc sql;
  select month, mon, count(*) as nights, avg(sleep) as avg_sleep format=4.1
  from nights
  group by month, mon
  order by month;
quit;`,
 quiz:{q:"<code>d = input('2026-10-01', yymmdd10.);</code> with no FORMAT statement. What is stored in d, and what does PROC PRINT show?",o:['The number 24380, shown as 2026-10-01 because the informat also sets the display','The number 24380, shown as 24380','The text 2026-10-01, because INPUT reads text and keeps it as text','The number 24380, shown as 01OCT2026, the default look of a date'],a:1,why:'INPUT with the YYMMDD10. informat turns the text into a SAS date: the number of days since 1 January 1960, which is 24380 for 1 Oct 2026. An informat only controls how text is read and attaches no format, so PROC PRINT shows the plain number until you add format d date9.; (or yymmdd10.).'},
 prac:{task:"Which weekday makes you money? Create <b>trade_days</b> from work.trades with <b>d</b> (day, the text 'YYYY-MM-DD', as a SAS date with format DATE9.), <b>dow</b> (its WEEKDAY number, 1 = Sunday) and <b>dayname</b> (the day&rsquo;s name as text without padding, e.g. Monday); keep id, day, d, dow, dayname, contract and pnl. Then with PROC SQL create <b>weekday_pnl</b>: per dow and dayname, <b>trades</b> (count) and <b>net</b> (sum of pnl), ordered by dow so Monday comes before Tuesday (sorting by name would put Friday first).",sol:R`data trade_days;
  set work.trades;
  d = input(day, yymmdd10.);           /* text -> SAS date */
  format d date9.;
  dow = weekday(d);                    /* 1 = Sunday ... 7 = Saturday */
  dayname = strip(put(d, downame.));   /* number -> text, padding removed */
  keep id day d dow dayname contract pnl;
run;

proc sql;
  create table weekday_pnl as
  select dow, dayname,
         count(*) as trades,
         sum(pnl) as net format=dollar12.2
  from trade_days
  group by dow, dayname
  order by dow;
quit;`}},
{id:'sas4',t:'sas',lv:2,title:'MERGE with BY and IN=',
 learn:['<b>MERGE</b> takes the place of SET to join data sets side by side, matching rows on the <b>BY</b> variables: <code>merge t c; by day;</code>. Each input must already be sorted by them (PROC SORT, with OUT= so your logs keep their order), or the step stops with <i>ERROR: BY variables are not properly sorted on data set WORK.T.</i> Your logs share <b>day</b>. One check-in against several trades on a day is <i>one-to-many</i>: that morning&rsquo;s sleep and energy are repeated on each of the day&rsquo;s trades.','With no condition, MERGE keeps every day found in any input (a full outer join); a side with no row that day leaves its columns missing. <b>IN=</b>, a data set option, picks the join: <code>merge t(in=in_t) c(in=in_c);</code> sets in_t to 1 when t has a row for the day, else 0. <code>if in_t and in_c;</code> is an inner join, <code>if in_t;</code> a left join, <code>if in_c and not in_t;</code> an anti-join. The flags exist only in the step: WHERE cannot test them (the subsetting IF lesson), and they are not written unless copied (<code>has_ci = in_c;</code>).','Two traps that do not stop the step. A column in both inputs (other than BY) stays one column, holding whichever value SAS read last: work.trades and work.mind both have <b>id</b> and <b>minutes</b>, so rename one, <code>m(rename=(minutes=mind_min))</code>. And when both sides repeat a day (several trades, several sessions), MERGE pairs their rows in order instead of making every combination, and the log only says <i>NOTE: MERGE statement has more than one data set with repeats of BY values.</i> Join those with PROC SQL.'],
 ex:R`/* each MIND session with that morning's energy */
proc sort data=work.mind out=m;
  by day time;
run;
proc sort data=work.checkins out=c;
  by day;
run;

data mind_energy;
  merge m(in=in_m) c(in=in_c keep=day energy);   /* several sessions, one check-in */
  by day;
  if in_m;              /* every session: a left join (energy is . with no check-in) */
  checked_in = in_c;    /* IN= flags are not written: copy one to keep it */
run;

/* check-in days with no session: an anti-join */
data quiet_days;
  merge c(in=in_c) m(in=in_m keep=day);
  by day;
  if in_c and not in_m;
run;`,
 quiz:{q:'<b>t</b> is work.trades sorted by day and <b>c</b> is work.checkins sorted by day (one row per day). On a day with 3 trades and a check-in, what does <code>data ts; merge t c; by day; run;</code> write for that day?',o:['One row: MERGE keeps a single row per value of day','4 rows: the 3 trades, then the check-in as a row of its own','3 rows, with sleep and energy on the first trade only',"3 rows, each carrying that morning's sleep and energy"],a:3,why:"It is a one-to-many merge: the check-in's values stay in place while SAS reads the day's other trades, so all 3 rows get the same sleep and energy. MERGE matches the check-in to the trades rather than adding it as a row of its own, and nothing is reset to missing inside a BY group. A day comes out as one row only when no input has more than one row for it. With no IF, days found in only one input are kept as well, with missing values for the other's columns."},
 prac:{task:'Does your morning check-in show in your P&amp;L? Sort work.trades by day and id into <b>t</b>, and work.checkins by day into <b>c</b>. (1) Merge them by day into <b>trades_sleep</b>: one row per trade that has a check-in that morning, each carrying that morning&rsquo;s sleep and energy; keep id, day, contract, pnl, sleep and energy. (2) In a second DATA step, create <b>no_checkin</b> with the trades from days you did not check in, keeping id, day, contract and pnl. Together the two must hold every trade exactly once. (3) With PROC SQL on trades_sleep, print per <b>energy</b> level the number of <b>trades</b> and the <b>net</b> pnl, lowest energy first.',sol:R`proc sort data=work.trades out=t;
  by day id;
run;
proc sort data=work.checkins out=c;
  by day;
run;

/* (1) inner join: trades on days with a check-in */
data trades_sleep;
  merge t(in=in_t) c(in=in_c);
  by day;
  if in_t and in_c;              /* IF, not WHERE: the flags exist only in the step */
  keep id day contract pnl sleep energy;
run;

/* (2) anti-join: trades on days without a check-in */
data no_checkin;
  merge t(in=in_t) c(in=in_c);
  by day;
  if in_t and not in_c;
  keep id day contract pnl;
run;
/* log check: rows of trades_sleep + rows of no_checkin = rows of work.trades
   (one check-in per day, so no trade is repeated) */

/* (3) */
proc sql;
  select energy,
         count(*) as trades,
         sum(pnl) as net format=dollar12.2
  from trades_sleep
  group by energy
  order by energy;
quit;`}},
{id:'sas17',t:'sas',lv:3,title:'RETAIN and the sum statement',
 learn:['A DATA step runs its statements once per row, building each row in the <b>program data vector</b> (PDV). At the top of every iteration SAS sets each column you compute back to missing. So a counter written <code>n = n + 1;</code> is missing on every row: n starts at ., and missing plus anything is missing (the missing-values lesson). <b>RETAIN</b> stops that reset: <code>retain peak 0;</code> keeps peak from one row to the next and starts it at 0. Without a starting value it starts missing.','The <b>sum statement</b>, <code>equity + pnl;</code> with no equals sign, is the shortcut for a running total: equity is retained automatically, starts at 0, and a missing pnl adds 0 instead of wiping the total. <code>n + 1;</code> is the counter that works (the FIRST./LAST. lesson later in this level uses it). Columns read by SET are retained too, but the next row read overwrites them, so RETAIN on an input column changes nothing. To carry a value past the rows where it is missing, copy it into a new retained column.',"Gotchas: a running total follows the row order, so sort first (<b>closed</b> is 'YYYY-MM-DD HH:MM:SS' text, which sorts in time order). <code>retain total 0; total = total + pnl;</code> works until one pnl is missing; from then on every total is missing. The sum statement, or <code>total = sum(total, pnl);</code>, carries on. A running maximum is RETAIN plus MAX, which skips missing values: <code>peak = max(peak, equity);</code>."],
 ex:R`/* carry your last weigh-in forward over the mornings you skipped the scale */
proc sort data=work.checkins out=c;
  by day;
run;

data weigh;
  set c;
  retain last_weight;            /* not reset to . at the top of each row; starts missing */
  if not missing(weight) then do;
    last_weight = weight;        /* only updated on mornings you weighed in */
    weigh_ins + 1;               /* sum statement: a counter that starts at 0 */
  end;
  keep day weight last_weight weigh_ins;
run;

/* without the RETAIN, last_weight would be . on every skipped morning */
proc print data=weigh(obs=10);
run;`,
 quiz:{q:'<b>t</b> is work.trades sorted by closed; it has no column called total. <code>data eq; set t; total = total + pnl; run;</code> has no RETAIN. What ends up in <b>total</b>?',o:['A running total of pnl, row by row','Missing on every row','The same value as pnl, because the missing total counts as 0','Nothing: the step stops with an error because total is used before it has a value'],a:1,why:'total is created by an assignment, so SAS sets it back to missing at the top of every iteration. Missing plus pnl is missing (the log says Missing values were generated), so every row gets a missing total. SAS does not stop over a variable without a value; it uses missing. retain total 0; with total = sum(total, pnl); or the sum statement total + pnl; gives the running total.'},
 prac:{task:'Your equity curve and drawdowns. Sort work.trades by <b>closed</b> and <b>id</b>, then create the data set <b>equity</b> with three new columns: <b>equity</b> (the running total of pnl, with a sum statement), <b>peak</b> (the highest equity so far, this row included, starting at 0, with RETAIN and MAX) and <b>drawdown</b> (equity - peak: 0 at a new high, negative below it). Keep id, day, contract, pnl, equity, peak and drawdown. Then print the one trade where your worst drawdown was first reached: the lowest drawdown and, on a tie, the lowest id (ids follow time order).',sol:R`proc sort data=work.trades out=t;
  by closed id;                 /* the running total follows this order */
run;

data equity;
  set t;
  equity + pnl;                 /* sum statement: retained, starts at 0 */
  retain peak 0;                /* starts at 0, your starting balance */
  peak = max(peak, equity);     /* highest equity so far */
  drawdown = equity - peak;     /* 0 at a new high, negative below it */
  keep id day contract pnl equity peak drawdown;
run;

/* worst drawdown first; on a tie, the earliest trade */
proc sort data=equity out=dd;
  by drawdown id;
run;

proc print data=dd(obs=1);
run;`}},
{id:'sas5',t:'sas',lv:3,title:'PROC MEANS / SUMMARY',
 learn:['<b>PROC MEANS</b> computes statistics per group in one step: <code>proc means data=work.trades n sum mean maxdec=2; class contract; var pnl; run;</code> prints one row per contract. Keywords on the PROC statement pick the statistics (none listed gives N, MEAN, STD, MIN and MAX; SUM, MEDIAN and others on request), VAR names the numeric columns and CLASS the groups. CLASS needs no sort, unlike BY, which wants sorted input and prints one table per group. MAXDEC= rounds only the printout.','<code>output out=stats n=trades sum=net mean=avg_pnl;</code> writes the numbers to a data set, each keyword naming its column (<code>mean(pnl minutes)=avg_pnl avg_min</code> picks VAR columns, in order), and NOPRINT drops the report. Without <b>NWAY</b> it holds every level of grouping, numbered by <b>_TYPE_</b>: 0 for the total over all rows, then each CLASS column alone and each combination up to the full one, the only level NWAY keeps. <b>_FREQ_</b> counts the rows in each. <b>PROC SUMMARY</b> is the same procedure, printing nothing unless you add PRINT.','Gotchas: <b>N</b> counts the <i>non-missing</i> values of a VAR column, while _FREQ_ (N Obs in the report) counts every row of the group, so a group can have rows and still get N = 0 and a missing mean. And a row whose CLASS value is missing is left out of the whole analysis, the _TYPE_ 0 total included: <code>class depth;</code> on work.mind silently drops your unrated Journaling sessions from every statistic. Add MISSING to the PROC statement to keep them as a group of their own.'],
 ex:R`/* the printed report: your check-ins by sleep quality (1-5) */
proc means data=work.checkins n mean min max maxdec=1;
  class quality;
  var sleep energy weight;     /* weight: N is below N Obs when you skipped the scale */
run;

/* the numbers as a data set: one row per contract and side */
proc means data=work.trades noprint nway;
  class contract side;
  var pnl minutes;
  output out=setup_stats(drop=_type_ rename=(_freq_=trades))
         sum(pnl)=net
         mean(pnl minutes)=avg_pnl avg_minutes
         max(pnl)=best;
run;

proc print data=setup_stats;
run;`,
 quiz:{q:'You trade 3 contracts, each both Long and Short. How many rows does <b>s</b> have after <code>proc means data=work.trades noprint; class contract side; var pnl; output out=s sum=net; run;</code>?',o:['12: the total, one per contract, one per side and one per pair','6: one per contract and side, as GROUP BY contract, side gives','7: the 6 contract and side pairs plus a row with the total','9: the 6 pairs plus a subtotal row for each of the 3 contracts'],a:0,why:'Without NWAY, OUTPUT writes every level of the CLASS combination, numbered by _TYPE_: 0 is the total over all trades (1 row), 1 is side alone (2 rows), 2 is contract alone (3 rows) and 3 is contract by side (6 rows), 12 in all. NWAY keeps only the 6 rows of the full combination, the same rows GROUP BY contract, side gives in PROC SQL.'},
 prac:{task:'How hard do you train, by type? With PROC MEANS on <b>work.workouts</b> create <b>type_stats</b>: one row per <b>type</b> and no overall row, with <b>rows</b> (the rows of that type: rename _FREQ_), <b>n_load</b> (how many of them have a load), <b>avg_load</b> (mean load), <b>avg_rpe</b> and <b>max_rpe</b> (mean and maximum rpe). Drop _TYPE_, print nothing from PROC MEANS itself, then print type_stats with PROC PRINT. For which types are n_load 0 and avg_load missing, and why is rows not 0 there?',sol:R`proc means data=work.workouts noprint nway;   /* NWAY: no _TYPE_ 0 row (or where=(_type_=1) on OUT=) */
  class type;
  var load rpe;
  output out=type_stats(drop=_type_ rename=(_freq_=rows))
         n(load)=n_load
         mean(load rpe)=avg_load avg_rpe
         max(rpe)=max_rpe;
run;

proc print data=type_stats;   /* Bodyweight, Cardio, Stretch, Weighted */
run;

/* Bodyweight, Cardio and Stretch: n_load = 0 and avg_load = .
   load is only logged for Weighted rows. N counts the non-missing
   values of load, so it is 0 and the mean is missing; rows (_FREQ_)
   counts every row of the type, load or not. On data where no Stretch
   row has an rpe, its avg_rpe and max_rpe are . for the same reason. */`}},
{id:'sas18',t:'sas',lv:3,title:'PROC FORMAT: your own buckets',
 learn:["PROC FORMAT&rsquo;s <b>VALUE</b> statement defines your own format: a label for each value or range. <code>value holdf low-&lt;10 = 'under 10m' 10-&lt;30 = '10-30m' 30-high = '30m+';</code> buckets minutes held. The &lt; leaves that end out of the range, LOW and HIGH are the open ends, and OTHER catches anything not listed. A character format&rsquo;s name starts with $ and its values are quoted. Apply it like a built-in one, name plus period: <code>format minutes holdf.;</code>.",'A format changes only how a value <b>looks</b>: a trade held 12.35 minutes shows as 10-30m but still stores 12.35. The payoff is that <b>PROC FREQ</b> and the <b>CLASS</b> statement of PROC MEANS group rows by the formatted value, so <code>tables minutes; format minutes holdf.;</code> counts three buckets without creating a column. A FORMAT statement in a PROC lasts for that step; in a DATA step it is saved with the column, so every later PROC shows the labels.',"Gotchas: filters still test the raw value, so it is <code>where minutes &lt; 10;</code>, never 'under 10m'. PROC SQL&rsquo;s GROUP BY uses raw values too (there a format only changes the display), so group by <code>put(minutes, holdf.)</code>. Ranges that overlap, like <code>10-30</code> and <code>30-high</code> (both hold 30), stop PROC FORMAT with an error: that is what the &lt; is for. A format name cannot end in a digit, and formats are stored in WORK, so rerun PROC FORMAT each session."],
 ex:R`/* urges by strength, and urges vs good habits, without a new column */
proc format;
  value intf  low-<4 = 'mild'
              4-<7   = 'medium'
              7-high = 'strong';
  value $evf  'resisted', 'slipped' = 'urge'
              'done'                = 'good habit';
run;

proc freq data=work.habits;
  tables event intensity;          /* grouped by the labels */
  format event $evf. intensity intf.;
run;

/* the filter tests the raw number; the format only changes the display */
proc print data=work.habits(obs=10);
  where intensity >= 7;
  var day habit intensity trigger;
  format intensity intf.;
run;`,
 quiz:{q:'With holdf. defined as above, a trade was held 7.61 minutes. After <code>data t2; set work.trades; format minutes holdf.; run;</code>, what does t2 store in <b>minutes</b> for it?',o:["The text 'under 10m'; minutes becomes a character column",'1, the number of the range it falls in','No t2 is created: a FORMAT statement only works in PROC steps','7.61; only its display becomes under 10m'],a:3,why:'A format never changes the stored value; it only controls how the value is shown. t2 keeps the number 7.61, and because the FORMAT statement ran in a DATA step, holdf. is saved with the column, so PROC PRINT shows under 10m. A WHERE on t2 still tests the number (where minutes < 10). FORMAT statements work in DATA and PROC steps alike.'},
 prac:{task:'Do quick scalps or longer holds pay? Define a format <b>heldf.</b> for minutes held with four labels: <b>under 5m</b>, <b>5-15m</b> (5 to under 15), <b>15-30m</b> (15 to under 30) and <b>30m+</b> (30 or more). (1) Count your trades per bucket with PROC FREQ, without creating a new column. (2) With PROC MEANS create <b>hold_pnl</b>, one row per bucket: minutes (the bucket), <b>trades</b> (N), <b>net</b> (sum of pnl) and <b>avg_pnl</b> (mean pnl), without _TYPE_ and _FREQ_. (3) With PROC SQL, print <b>hold</b> (the label), trades, net and avg_pnl: 4 rows, not one per distinct minutes value.',sol:R`proc format;
  value heldf low-<5  = 'under 5m'
              5-<15   = '5-15m'
              15-<30  = '15-30m'
              30-high = '30m+';
run;

/* (1) PROC FREQ groups by the formatted value */
proc freq data=work.trades;
  tables minutes;
  format minutes heldf.;
run;

/* (2) so does CLASS in PROC MEANS */
proc means data=work.trades noprint nway;
  class minutes;
  format minutes heldf.;
  var pnl;
  output out=hold_pnl(drop=_type_ _freq_)
         n=trades sum=net mean=avg_pnl;
run;

/* (3) PROC SQL groups raw values, so group by the label itself */
proc sql;
  select put(minutes, heldf.) as hold,
         count(*) as trades,
         sum(pnl) as net,
         avg(pnl) as avg_pnl format=8.2
  from work.trades
  group by put(minutes, heldf.);
quit;`}},
{id:'sas6',t:'sas',lv:3,title:'FIRST. and LAST.: BY group logic',
 learn:['A <b>BY</b> statement in a DATA step reads the rows in groups. For each BY variable SAS creates two flags, <code>first.habit</code> and <code>last.habit</code>: 1 on the first (or last) row of each group, 0 elsewhere, and a group of one row has both set to 1. The input must be sorted by the BY variables (else <i>ERROR: BY variables are not properly sorted</i>), and it may be sorted by more: sort by exercise and time, write <code>by exercise;</code>, and <code>if last.exercise;</code> keeps each exercise&rsquo;s latest row, every column included.','With two BY variables the flags nest: after <code>by day kind;</code>, first.kind is 1 at each new kind <i>and</i> whenever a new day starts, even if the kind is the same as on the row before. That makes per-group work possible: reset on the first row, add up with a sum statement (the RETAIN lesson) and write one row on the last: <code>if first.day then n = 0; n + 1; if last.day;</code>. The flags are not written to the output; copy one into a column to keep it.','Gotchas: the sum statement is retained across groups, so without the reset the count runs on through every group. Order matters: a subsetting IF on last. placed above the sum statement drops rows before they are counted. A value you set on the first row is reset to missing on the next one, so <code>if first.day then first_kcal = kcal;</code> is . by the last row unless you RETAIN first_kcal. And a BY variable must be in the data set SET reads: one computed in the same step cannot be used.'],
 ex:R`/* the heaviest set you ever logged, per exercise */
proc sort data=work.workouts out=w;
  where type = 'Weighted';
  by exercise load time;          /* within an exercise: heaviest (then latest) last */
run;

data best_set;
  set w;
  by exercise;                    /* sorted by more variables than BY: fine */
  if last.exercise;               /* one row per exercise, all its columns */
  keep exercise day sets reps load;
run;

/* two BY variables: number your meals within each day and kind */
proc sort data=work.meals out=m;
  by day kind time;
run;

data meal_no;
  set m;
  by day kind;
  if first.kind then k = 0;       /* 1 at a new kind and at every new day */
  k + 1;
  day_start = first.day;          /* a flag is not kept unless you copy it */
  keep day kind name kcal k day_start;
run;`,
 quiz:{q:'<b>h</b> is work.habits sorted by habit. What ends up in <b>n</b> after <code>data counts; set h; by habit; n + 1; if last.habit; keep habit n; run;</code>?',o:['The number of rows for each habit, because BY restarts n at every new habit','A running count: the rows read so far, earlier habits included','1 on every row, because only the last row of each habit is counted','Missing on every row, because n is never given a starting value'],a:1,why:'The sum statement retains n and starts it at 0, and nothing resets it: BY only sets the FIRST. and LAST. flags. So the first habit shows its own count, every later habit adds its rows to the ones before, and the last habit shows the total number of rows. The subsetting IF comes after n + 1, so every row is counted and only the last of each habit is written. Put if first.habit then n = 0; before n + 1 to count per habit.'},
 prac:{task:'Your monthly weigh-ins. (1) Create <b>c</b> from work.checkins with only the mornings you weighed in (weight not missing) and <b>month</b> = the first 7 characters of day (e.g. 2026-09), and sort it by month and day. (2) With BY group logic create <b>monthly_weight</b>, one row per month, with month, <b>weigh_ins</b> (how many), <b>first_weight</b> (the month&rsquo;s first weigh-in), <b>last_weight</b> (its last) and <b>change</b> = last_weight - first_weight. A month with a single weigh-in gets change 0.',sol:R`/* (1) weigh-in mornings only, with the BY variable made beforehand */
data c;
  set work.checkins;
  where weight is not missing;
  month = substr(day, 1, 7);      /* '2026-09': a BY variable must be in the data SET reads */
run;

proc sort data=c;
  by month day;
run;

/* (2) one row per month */
data monthly_weight;
  set c;
  by month;
  retain first_weight;            /* set on the first row, still needed on the last */
  if first.month then do;
    first_weight = weight;
    weigh_ins = 0;                /* reset the counter for each month */
  end;
  weigh_ins + 1;
  if last.month;                  /* after the count, so every row is counted */
  last_weight = weight;           /* the last row's own value: no RETAIN needed */
  change = last_weight - first_weight;
  keep month weigh_ins first_weight last_weight change;
run;`}},
{id:'sas19',t:'sas',lv:3,title:'LAG and DIF: the previous row',
 learn:['<code>lag(x)</code> returns the value x had the <b>previous time that LAG call ran</b>. On a plain SET that is the row read before, so <code>prev_load = lag(load);</code> puts the previous row&rsquo;s load beside this one (missing on the first row). <code>dif(x)</code> is <code>x - lag(x)</code>, the change since then, and <code>lag2(x)</code> looks two calls back. "Previous" only means the row read before, so sort first.',"LAG is a <b>queue</b>, not a pointer to the row above: each time the call runs, it hands back the value it stored last time and stores the current one. Inside IF-THEN it only runs when the condition is true, so <code>if side = 'Long' then prev = lag(pnl);</code> returns the pnl of the last Long trade, however far back, not of the trade before. Never put LAG (or DIF) under a condition: compute it on every row, then use the result in conditions.",'BY groups do not reset the queue either. On trades sorted by contract and closed, with <code>by contract;</code>, the first trade of a contract gets the last pnl of the contract before. Reset it after the lag: <code>prev_pnl = lag(pnl); if first.contract then prev_pnl = .;</code>. Writing <code>if not first.contract then prev_pnl = lag(pnl);</code> is the conditional trap again: on a contract&rsquo;s second trade the queue still holds the last pnl it saw, from the contract before.'],
 ex:R`/* how did your energy change from one check-in to the next? */
proc sort data=work.checkins out=c;
  by day;
run;

data energy_change;
  set c;
  prev_energy = lag(energy);       /* the check-in before; . on the first row */
  change      = dif(energy);       /* energy - lag(energy) */
  two_back    = lag2(energy);      /* two check-ins back */
  dropped     = (. < change < 0);  /* use the lag in a condition, never the reverse */
  keep day energy prev_energy change two_back dropped;
run;

/* the trap: if energy >= 4 then prev_hi = lag(energy);
   gives the energy of the last check-in that also had 4 or more,
   not of the check-in before */`,
 quiz:{q:"On work.workouts sorted by time, you write <code>if type = 'Weighted' then prev = lag(load);</code>. What is <b>prev</b> on a Weighted row?",o:['The load of the row directly above it, whatever its type','Missing on every row, because LAG cannot be used inside IF-THEN','The load of the most recent earlier Weighted row, however far back',"The load of the same exercise's previous session"],a:2,why:'LAG returns the value from the previous time that LAG call ran, and inside IF-THEN it only runs on Weighted rows. So prev is the load of the last Weighted row before this one (missing for the first), even if Cardio or Stretch rows sit in between. LAG knows nothing about exercises either. Compute lag(load) on every row, then use it in conditions.'},
 prac:{task:'Progressive overload: is the bar getting heavier? From the <b>Weighted</b> rows of work.workouts, sorted by exercise, time and id, create <b>load_change</b> with <b>prev_load</b> (the load of the same exercise&rsquo;s previous session, missing on each exercise&rsquo;s first session; each row is one exercise in one session) and <b>change</b> = load - prev_load. Keep exercise, day, load, prev_load and change. Check it: the first row of every exercise must show a missing prev_load, not the previous exercise&rsquo;s last load.',sol:R`proc sort data=work.workouts out=w;
  where type = 'Weighted';
  by exercise time id;
run;

data load_change;
  set w;
  by exercise;
  prev_load = lag(load);                 /* on every row, never inside an IF */
  if first.exercise then prev_load = .;  /* then drop the previous exercise's value */
  change = load - prev_load;             /* . on each first session (a NOTE in the log) */
  keep exercise day load prev_load change;
run;`}},
{id:'sas20',t:'sas',lv:3,title:'Date intervals: INTNX and INTCK',
 learn:["<code>intnx(interval, d, n)</code> moves date d by n intervals and, by default, snaps the result to the <b>start</b> of that interval: <code>intnx('month', d, 0)</code> is the first of d&rsquo;s month, <code>intnx('month', d, 1)</code> the first of the next. A fourth argument sets the alignment: 'b' (beginning, the default), 'm' (middle), 'e' (end), 's' (same day). Every date in a period maps to one date, which makes INTNX the way to bucket rows by week, month or quarter.","Weeks start on <b>Sunday</b>: <code>intnx('week', d, 0)</code> is the Sunday on or before d. For Monday weeks write <code>'week.2'</code> (the shift .2 starts each week on the 2nd day, Monday). <code>intck(interval, start, end)</code> counts the interval <b>boundaries</b> between two dates, not whole periods: <code>intck('year', '31DEC2025'd, '01JAN2026'd)</code> is 1 although one day passed. A fourth argument 'c' (continuous) counts complete intervals only, and that gives 0.","Gotchas: both functions need numeric SAS dates, so convert the text day first with <code>input(day, yymmdd10.)</code>, as in the dates lesson. The result is a plain number until you format it: <code>intnx('week.2', '01OCT2026'd, 0)</code> prints as 24377 until a format such as YYMMDD10. shows it as 2026-09-28. INTCK counts boundaries, so the months from your first to your last entry, both included, are <code>intck('month', first, last) + 1</code>. For days, <code>d2 - d1</code> already does it."],
 ex:R`/* habits: month buckets, month ends, time since your last slip */
data h;
  set work.habits;
  d       = input(day, yymmdd10.);
  month   = intnx('month', d, 0);        /* 1st of that month */
  month_e = intnx('month', d, 0, 'e');   /* last day of that month */
  format d month month_e date9.;
run;

proc freq data=h;
  tables month;                          /* entries per month */
run;

proc sql;
  select habit,
         max(d) as last_slip format=date9.,
         intck('day', max(d), today()) as days_clean,          /* same as today() - max(d) */
         intck('month', max(d), today(), 'c') as full_months   /* complete months only */
  from h
  where event = 'slipped'
  group by habit;
quit;`,
 quiz:{q:"What does <code>intck('month', '31JAN2026'd, '01FEB2026'd)</code> return?",o:['0, because less than a whole month has passed','1, because one month boundary is crossed','0.03, the fraction of a month between the two dates','2, one for January and one for February'],a:1,why:"By default INTCK counts how many interval boundaries (here, the first of a month) it crosses going from the start date to the end date, not how many whole months passed. 1 February is a month start, so the answer is 1 although the dates are a day apart. Adding the continuous method, intck(..., 'c'), counts complete months only and returns 0. INTCK always returns a whole number."},
 prac:{task:'Your weekly MIND sessions, with weeks that start on Monday. (1) Create <b>m</b> from work.mind with <b>week</b>: the Monday that starts the week of the session&rsquo;s day, with format YYMMDD10. (2) With PROC MEANS create <b>weekly_mind</b>: one row per week in date order with week, <b>sessions</b> (N) and <b>minutes</b> (sum of minutes), without _TYPE_ and _FREQ_. (3) With PROC SQL on weekly_mind, print one row: <b>first_week</b> and <b>last_week</b> (formatted YYMMDD10.), <b>weeks</b> (how many Monday weeks that span covers, counting both ends) and <b>active</b> (how many of them have sessions), so you can see whether you skipped a whole week.',sol:R`data m;
  set work.mind;
  week = intnx('week.2', input(day, yymmdd10.), 0);   /* Monday of that week */
  format week yymmdd10.;
run;

proc means data=m noprint nway;
  class week;                    /* one row per week, in date order */
  var minutes;
  output out=weekly_mind(drop=_type_ _freq_) n=sessions sum=minutes;
run;

proc sql;
  select min(week) as first_week format=yymmdd10.,
         max(week) as last_week  format=yymmdd10.,
         intck('week.2', min(week), max(week)) + 1 as weeks,   /* boundaries + 1 */
         count(*) as active
  from weekly_mind;
quit;`}},
{id:'sas21',t:'sas',lv:4,title:'PROC TRANSPOSE: long to wide',
 learn:['Your logs are <b>long</b>: <b>work.meals</b> has one row per meal, so most days appear two to four times. Reports and many models want them <b>wide</b>: one row per day, with a bowl column and a snack column. PROC TRANSPOSE does that reshape. <code>by day;</code> gives one output row per day (sort by day first), <code>id kind;</code> turns each value of kind into a column name, and <code>var kcal;</code> fills the cells. The output also gets <b>_NAME_</b>, holding the VAR variable&rsquo;s name (kcal): drop it with <code>out=w(drop=_name_)</code>.','The trap: inside one BY group each ID value is a single cell, so it may occur only once. Most days you log more than one bowl, so transposing work.meals as it is stops with <i>ERROR: The ID value "bowl" occurs twice in the same BY group.</i> Aggregate first (sum kcal by day and kind with PROC SQL or PROC MEANS), then transpose the totals. The LET option lets the step run by keeping only the <i>last</i> row of each ID value: each day gets one of its bowls, and the others are dropped.',"A cell with no input row is <b>missing</b>, not 0: a day without a snack gets <code>snack = .</code> (the next lesson fills those in). New columns appear in the order their ID values are first met. Without ID they are named COL1, COL2, and so on; with ID, <code>prefix=kcal_</code> names them kcal_bowl and kcal_snack. In SQL you would write one <code>sum(case when kind = 'bowl' ...)</code> per value you know about; TRANSPOSE makes a column for every value it finds."],
 ex:R`/* study minutes per month, one column per track */
data s;
  set work.study;
  month = substr(day, 1, 7);          /* '2026-10' */
run;

/* step 1: one row per month and track (several sessions add up) */
proc means data=s noprint nway;
  class month track;
  var minutes;
  output out=month_track(drop=_type_ _freq_) sum=minutes;
run;                                  /* comes out sorted by month, then track */

/* step 2: long to wide */
proc transpose data=month_track out=study_wide(drop=_name_);
  by month;                           /* one output row per month */
  id track;                           /* Python, SAS, SQL, Tableau become columns */
  var minutes;                        /* the values that fill the cells */
run;

proc print data=study_wide; run;      /* a track you skipped that month is . */`,
 quiz:{q:'<b>work.meals</b> is in day order. <code>proc transpose data=work.meals out=w; by day; id kind; var kcal; run;</code> stops with <i>ERROR: The ID value "bowl" occurs twice in the same BY group.</i> What is the right fix?',o:['Add the LET option to the PROC TRANSPOSE statement','Sort by day and kind, then run the same step','Sum kcal by day and kind first, then transpose the totals','Add PREFIX=kcal_ so the new columns get unique names'],a:2,why:"A day has one bowl cell, but most days have more than one bowl row. Summing first leaves one row per day and kind, so every cell gets exactly one value: the day's total. LET runs without the error but keeps only the last bowl of each day (the others are dropped), sorting by kind as well still leaves two bowl rows in the same day, and PREFIX= only renames the columns."},
 prac:{task:'Build <b>daily_kcal</b> with one row per day and exactly the columns <b>day</b>, <b>bowl</b> and <b>snack</b>: that day&rsquo;s total kcal from bowls and from snacks. Most days have more than one bowl, so sum kcal by day and kind first (PROC SQL or PROC MEANS), make sure the result is sorted by day, then transpose and drop _NAME_. Days without a snack keep a missing snack. Keep daily_kcal (rerun this if your session has ended): the arrays lesson&rsquo;s example starts from it and fills in those missing snacks.',sol:R`/* 1. one row per day and kind */
proc sql;
  create table day_kind as
  select day, kind, sum(kcal) as kcal
  from work.meals
  group by day, kind
  order by day, kind;
quit;

/* 2. long to wide */
proc transpose data=day_kind out=daily_kcal(drop=_name_);
  by day;
  id kind;
  var kcal;
run;
/* columns: day bowl snack; snack is . on days without a snack */`}},
{id:'sas22',t:'sas',lv:4,title:'Arrays: one rule, many columns',
 learn:['An <b>ARRAY</b> gives several columns one name, so a loop can apply one rule to each: after <code>array g{3} protein carbs fat;</code>, <code>g{2}</code> is carbs, and the iterative loop <code>do i = 1 to dim(g); ... g{i} ...; end;</code> runs once for each i from 1 to 3. DIM returns the number of elements, and <code>{*}</code> lets SAS count them (<code>array n{*} _numeric_;</code> takes every numeric column defined so far in the step). The array is only a name used while the step runs: it is not stored in the output.','Names that do not exist yet become new columns: <code>array pct{3} pct_protein pct_carbs pct_fat;</code> creates three (with no names at all, <code>array pct{3};</code> makes pct1 to pct3). A <b>_TEMPORARY_</b> array holds constants without creating any columns: <code>array kpg{3} _temporary_ (4 4 9);</code> for kcal per gram. All elements must be the same type, so numeric and character columns cannot share an array. Functions take a whole array: <code>sum(of pct{*})</code>.','Gotchas: a subscript outside 1 to DIM stops the step with <i>ERROR: Array subscript out of range</i>, so loop to <code>dim(g)</code>, not a typed number. The index <code>i</code> is an ordinary variable and lands in the output unless you drop it. The ARRAY statement must come before the first use of the array. Arrays write a rule once for many columns; macros (next lesson) do the same for whole steps.'],
 ex:R`/* daily_kcal from the TRANSPOSE lesson: day bowl snack (snack is . on days without one) */
data daily_kcal0;
  set daily_kcal;
  array k{*} _numeric_;               /* every numeric column so far: bowl snack */
  do i = 1 to dim(k);
    if missing(k{i}) then k{i} = 0;   /* no snack that day: 0 kcal, not missing */
  end;
  total = sum(of k{*});               /* a function over the whole array */
  drop i;
run;`,
 quiz:{q:'These statements run in a DATA step that reads <b>work.meals</b>. What happens?<br><code>array g{3} protein carbs fat;<br>do i = 1 to 4;<br>&nbsp;&nbsp;x = g{i};<br>end;</code>',o:['The step stops with ERROR: Array subscript out of range','The loop quietly stops after the 3rd element, because DIM(g) is 3','x is set to missing when i = 4, and the step carries on','SAS adds a 4th element, g4, as a new column'],a:0,why:'SAS checks every subscript while the step runs. g has 3 elements, so g{4} does not exist: on the very first row the step stops with ERROR: Array subscript out of range, and no rows are written. Write do i = 1 to dim(g); so the loop always matches the array.'},
 prac:{task:'Where do your meal calories come from? From <b>work.meals</b> (one row per meal, not daily_kcal), create <b>macro_split</b> with <b>pct_protein</b>, <b>pct_carbs</b> and <b>pct_fat</b>: the share of the meal&rsquo;s kcal from each macro, that is grams times kcal per gram (4, 4 and 9, held in a _TEMPORARY_ array) divided by kcal, times 100, rounded to 0.1. Use arrays and one DO loop, not three copied formulas. Keep only day, name, kcal and the three pct columns. kcal is never 0 or missing. The shares need not add up to exactly 100: labels round, and 4-4-9 is an approximation.',sol:R`data macro_split;
  set work.meals;
  array g{3}   protein carbs fat;                  /* grams */
  array kpg{3} _temporary_ (4 4 9);                /* kcal per gram: no columns */
  array pct{3} pct_protein pct_carbs pct_fat;      /* new columns */
  do i = 1 to dim(g);
    pct{i} = round(g{i} * kpg{i} / kcal * 100, 0.1);
  end;
  keep day name kcal pct_protein pct_carbs pct_fat;   /* i is not kept */
run;`}},
{id:'sas7',t:'sas',lv:4,title:'Macros for reusable extracts',
 learn:['The macro language writes SAS code for you before it runs. <code>%let since = 2026-10-01;</code> stores text in a macro variable, and <code>&amp;since</code> pastes it in wherever it appears. <code>%macro pull(data=, col=, val=, out=); … %mend pull;</code> defines a template whose keyword parameters work as macro variables inside it, and <code>%pull(data=work.meals, col=kind, val=bowl, out=bowls)</code> generates its steps. <code>options mprint;</code> shows that generated code in the log.','<code>%do i = 1 %to &amp;n; … %end;</code> repeats code, and only inside a macro definition. <code>%scan(&amp;list, &amp;i)</code> takes the i-th word of a list and <code>%sysfunc(countw(&amp;list))</code> counts the words, so the loop fits the list instead of a typed count. <code>%local i v;</code> makes the loop variables private to the macro, so they cannot overwrite variables of the same name outside it. The macro processor only handles text: it builds the code, and the DATA and PROC steps do the work.','Gotchas: a macro variable resolves inside <b>double</b> quotes, never inside single ones. <code>where day &gt;= \'&amp;since\';</code> compares day with the literal text &amp;since, with no warning; write <code>"&amp;since"</code>. A period ends a macro variable&rsquo;s name and is dropped: <code>out=&amp;k._only</code> gives bowl_only, while <code>&amp;k_only</code> looks for a macro variable k_only (<i>WARNING: Apparent symbolic reference K_ONLY not resolved.</i>). And %SCAN and COUNTW split at the same default delimiters as SCAN, so Body Scan or Pull-up counts as two words.'],
 ex:R`options mprint;                      /* the code each call generates goes to the log */

%macro pull(data=, col=, val=, out=);
  proc sql;
    create table &out as
    select * from &data
    where &col = "&val";             /* double quotes: &val resolves */
  quit;
%mend pull;

%let since = 2026-10-01;
%pull(data=work.trades, col=side, val=Long, out=longs)

proc print data=longs;
  where day >= "&since";             /* '&since' would be the literal text */
run;

/* a %do loop runs only inside a macro: one data set per meal kind */
%macro kinds;
  %local i k;
  %do i = 1 %to 2;
    %let k = %scan(bowl snack, &i);
    %pull(data=work.meals, col=kind, val=&k, out=&k._only)   /* bowl_only, snack_only */
  %end;
%mend kinds;
%kinds`,
 quiz:{q:"<code>%let c = NQZ6;</code> runs, then <code>proc print data=work.trades; where contract = '&amp;c'; run;</code>. What does it print?",o:['Your NQZ6 trades, since &c resolves to NQZ6 before the step runs','No rows, after WARNING: Apparent symbolic reference C not resolved.','No rows, with no macro warning: it looks for a contract spelled &c','An ERROR, because a macro variable cannot be used in a WHERE statement'],a:2,why:'The macro processor does not look inside single quotes, so &c is never resolved and no warning is written: WHERE compares contract with the two characters &c, and no contract matches. In double quotes, where contract = "&c", it becomes NQZ6 before the step runs. Macro variables work in any statement, WHERE included.'},
 prac:{task:'Make <b>%pull</b> (from the example) reusable over any list. Write <code>%split(data=, col=, list=, prefix=)</code>: it counts the words of list with <code>%sysfunc(countw(&amp;list))</code>, loops over them with %do and %scan, and calls %pull once per word with <code>out=</code> the prefix followed by the word; declare the counter, the word count and the current word %local. Turn on MPRINT and call it to split work.workouts by <b>type</b> into <b>wk_Weighted</b>, <b>wk_Bodyweight</b>, <b>wk_Cardio</b> and <b>wk_Stretch</b>: the log should show four PROC SQL steps.',sol:R`options mprint;

/* %pull as in the example: rerun its definition if your session restarted */
%macro split(data=, col=, list=, prefix=);
  %local i n v;
  %let n = %sysfunc(countw(&list));         /* the number of words, not a typed 4 */
  %do i = 1 %to &n;
    %let v = %scan(&list, &i);
    %pull(data=&data, col=&col, val=&v, out=&prefix&v)
  %end;
%mend split;

%split(data=work.workouts, col=type, list=Weighted Bodyweight Cardio Stretch, prefix=wk_)
/* MPRINT shows four PROC SQL steps: wk_Weighted, wk_Bodyweight, wk_Cardio, wk_Stretch */`}},
{id:'sas23',t:'sas',lv:4,title:'Macro variables from data: INTO',
 learn:["So far you typed macro variables in (<code>%let since = 2026-10-01;</code>, or a list for %scan). PROC SQL&rsquo;s <b>INTO</b> fills them from the data: <code>select count(distinct contract) into :n trimmed from work.trades;</code> and <code>select distinct contract into :clist separated by ' ' from work.trades;</code> (add NOPRINT to PROC SQL so nothing is printed). <code>%put &amp;=clist;</code> writes <i>CLIST=ESZ6 GCZ6 NQZ6</i> to the log. Your code now adapts: a new contract next month gets its own data set without an edit.","In a DATA step, <code>call symputx('net', net);</code> does the same job. It strips blanks and turns numbers into clean text; the older SYMPUT keeps them, so a number arrives padded with leading blanks. Timing matters: the macro variable exists only <i>after</i> that step finishes. A <code>&amp;net</code> inside the same step was resolved before the step ran. Macro variables are always text.",'Gotchas: without SEPARATED BY, INTO keeps only the <b>first</b> row&rsquo;s value, with no error or warning. Without TRIMMED, a number is stored with leading blanks, which breaks names like <code>trades_&amp;n</code>. If the query returns no rows, the macro variable is not updated, so an old value silently survives: check <code>&amp;sqlobs</code> (rows from the last SQL statement). And <code>title "P&amp;L";</code> makes SAS look for a macro variable L (<i>WARNING: Apparent symbolic reference L not resolved</i>), so write PnL.'],
 ex:R`/* your study tracks and total minutes, straight from the data */
proc sql noprint;
  select distinct track into :tracks separated by ', '
    from work.study;
  select sum(minutes) into :total trimmed
    from work.study;
quit;
%put &=tracks &=total;

/* the same from a DATA step: the day of your latest session */
data _null_;                       /* a DATA step that writes no data set */
  set work.study end=last;         /* last = 1 on the final row read */
  if last then call symputx('last_day', day);
run;

title "Study: &total minutes on &tracks (latest &last_day)";
proc means data=work.study n sum mean maxdec=1;
  class track;
  var minutes;
run;
title;`,
 quiz:{q:'You traded 3 contracts. After <code>proc sql noprint; select distinct contract into :clist from work.trades; quit;</code> what does <code>%put &amp;=clist;</code> show?',o:['CLIST= followed by all three contracts, separated by blanks','CLIST= followed by one contract: the value from the first row','CLIST= followed by all three contracts, separated by commas','Nothing: PROC SQL stops with an ERROR because 3 rows come back'],a:1,why:"Without SEPARATED BY, INTO :clist stores a single value, the first row's, and ignores the other rows without any warning. Add separated by ' ' to get the whole list."},
 prac:{task:'Make the macros lesson&rsquo;s loop data-driven. With PROC SQL INTO, store your distinct contracts in <b>clist</b> (separated by a blank) and their count in <b>n</b> (count distinct, trimmed), and show both with %put. Then write a macro that loops <code>%do i = 1 %to &amp;n</code>, takes the i-th contract from clist with %scan and calls <b>%pull</b> (from the macros lesson; rerun its definition if your session restarted) with <code>data=work.trades</code>, <code>col=contract</code>, <code>val=</code> that contract and <code>out=trades_</code> plus the contract: trades_ESZ6, trades_GCZ6 and trades_NQZ6 on your data, with no contract code typed.',sol:R`proc sql noprint;
  select distinct contract into :clist separated by ' '
    from work.trades;
  select count(distinct contract) into :n trimmed
    from work.trades;
quit;
%put &=n &=clist;

%macro by_contract;
  %local i c;
  %do i = 1 %to &n;
    %let c = %scan(&clist, &i);
    %pull(data=work.trades, col=contract, val=&c, out=trades_&c)
  %end;
%mend by_contract;
%by_contract

/* with %split from the macros lesson's practice, one call does the loop:
   %split(data=work.trades, col=contract, list=&clist, prefix=trades_) */`}},
{id:'sas8',t:'sas',lv:4,title:'SQL pass-through to databases',
 learn:['When your logs also sync to a database (say a PostgreSQL copy on a server), SAS reaches it through a SAS/ACCESS engine, which must be licensed and set up. A LIBNAME with that engine (<code>libname pg postgres server=… database=isionlogs …;</code>) makes its tables look like data sets: <b>pg.trades</b> works in PROC SQL and DATA steps, and SAS translates what it can into Postgres SQL (<i>implicit</i> pass-through). <b>Explicit</b> pass-through sends your own: <code>connect using pg as db;</code>, then <code>select * from connection to db ( … )</code>.',"Only the inner query&rsquo;s result comes back. <code>execute ( … ) by db;</code> runs a statement that returns no rows, and <code>disconnect from db;</code> (or QUIT) ends the connection, which lives only inside that PROC SQL step. The inner text is sent as is, so it must be <i>Postgres</i> SQL: no SAS functions or formats (INTNX, PUT, <code>'01OCT2026'd</code>), and double quotes name a column, so text takes single quotes. Macro variables still resolve outside single quotes: the macro processor runs first.","Gotchas: implicit pass-through can quietly fetch every row. When part of a query has no translation (a SAS format, or a function the engine cannot map), SAS reads the rows and does that part itself; <code>options sastrace=',,,d' sastraceloc=saslog nostsuffix;</code> logs the SQL actually sent. Types are mapped: a Postgres date becomes a SAS date, but a timestamp becomes a SAS <b>datetime</b> (seconds, not days), and date_trunc returns a timestamp, so cast it with <code>::date</code>."],
 ex:R`/* the database as a library (SAS/ACCESS Interface to PostgreSQL) */
/* &pg_user and &pg_pw: set them first with %let, not typed into shared code */
libname pg postgres server="sync.example.com" port=5432
           database=isionlogs user=&pg_user password="&pg_pw";

options sastrace=',,,d' sastraceloc=saslog nostsuffix;   /* log the SQL sent */

/* implicit: SAS SQL on pg.trades, translated for you */
proc sql;
  create table nq as
  select day, pnl from pg.trades
  where contract = 'NQZ6';
quit;

/* explicit: your own Postgres SQL, run inside the database */
%let days = 30;                    /* resolves before the query is sent */
proc sql;
  connect using pg as db;
  create table daily_pnl as
  select * from connection to db (
    select day::date as d, count(*) as trades, sum(pnl) as net
    from trades
    where day::date >= current_date - &days
    group by day::date
  );
  execute (analyze trades) by db;  /* a statement that returns no rows */
  disconnect from db;
quit;`,
 quiz:{q:'Inside <code>connection to db ( … )</code> you filter with <code>where side = "Long"</code>, as you would in SAS. The step stops: Postgres reports that column "Long" does not exist. Why?',o:['A filter cannot go inside the parentheses; put the WHERE in the outer SAS query','Values are case-sensitive in Postgres, and the column holds the text in lowercase','SAS resolves macro triggers inside double quotes, so it rewrote the text first','The inner query is Postgres SQL, where double quotes name a column, not text'],a:3,why:'Everything inside the parentheses goes to Postgres unchanged, and in Postgres double quotes mark a name, so "Long" is read as a column. Text takes single quotes there: where side = \'Long\'. Filtering inside is right, since it keeps the rows in the database; a case mismatch would return no rows, not an error; and "Long" has no & or % for the macro processor to act on.'},
 prac:{task:'Your synced PostgreSQL database has a table <b>workouts</b> with the same columns as work.workouts (day is text, YYYY-MM-DD), and the libref <b>pg</b> from the example points to it. In one PROC SQL step, connect through the pg libref (CONNECT USING) and use explicit pass-through, so Postgres does the filtering and grouping, to create <b>weekly_training</b> from the <b>Weighted</b> rows: one row per week with <b>week</b> (the Monday that starts it, as a SAS date, not a datetime; Postgres weeks start on Monday), <b>days</b> (distinct days trained), <b>sets</b> (total sets) and <b>volume</b> (sum of sets × reps × load), sorted by week. Then close the connection.',sol:R`proc sql;
  connect using pg as db;          /* or connect to postgres as db (server=... ) */
  create table weekly_training as
  select * from connection to db (
    select date_trunc('week', day::date)::date as week,   /* ::date: a date, not a timestamp */
           count(distinct day)                 as days,
           sum(sets)                           as sets,
           sum(sets * reps * load)             as volume
    from workouts
    where type = 'Weighted'                                /* single quotes: text in Postgres */
    group by date_trunc('week', day::date)::date
  )
  order by week;                   /* sorted by SAS; an ORDER BY inside works too */
  disconnect from db;
quit;
/* week arrives as a SAS date; without ::date it would be a datetime (seconds).
   Also right: leave out ::date and convert in SAS, with
   select datepart(week) as week format=date9., days, sets, volume
   from connection to db ( ... ) */`}},
{id:'sas24',t:'sas',lv:4,title:'ODS EXCEL: reports to a workbook',
 learn:['The Output Delivery System (ODS) decides where procedure output goes. <code>ods excel file="~/isionlogs/weekly_review.xlsx" options(sheet_name=\'Contracts\' embedded_titles=\'yes\');</code> opens a workbook. Every table a PROC prints after that lands in it, each on its own sheet by default, and <code>ods excel close;</code> finishes the file. Unlike PROC EXPORT (from the import lesson), which writes a data set&rsquo;s raw rows, ODS sends the formatted report you see in Results.',"Rename the next tab between PROCs with <code>ods excel options(sheet_name='Habits');</code>. <code>embedded_titles='yes'</code> writes the TITLE text into the sheet itself. <code>ods select CrossTabFreqs;</code> before a PROC sends only that table (by its ODS name; <code>ods trace on;</code> lists the names in the log) and resets after the step. The same open, run, close pattern works for <code>ods pdf</code> and <code>ods rtf</code>.",'Gotchas: the workbook is not complete until <b>ODS EXCEL CLOSE</b> runs. Before that it is empty or Excel will not open it. A PROC with NOPRINT sends nothing, and neither does a DATA step. FILE= takes a path, not a libref, and the folder must already exist (~/isionlogs from the libraries lesson). Clear the title with <code>title;</code> afterwards, or it follows every later report.'],
 ex:R`/* one titled sheet of training stats */
ods excel file="~/isionlogs/training.xlsx"
          options(sheet_name='Lifts' embedded_titles='yes');

title 'Weighted lifts: sessions and load';
proc means data=work.workouts n mean max maxdec=1;
  where type = 'Weighted';
  class exercise;
  var load;
run;

ods excel close;
title;

/* the same pattern to a PDF */
ods pdf file="~/isionlogs/practices.pdf";
title 'Sessions per practice';
proc freq data=work.mind;
  tables practice / nocum;
run;
ods pdf close;
title;`,
 quiz:{q:'Your program opens <code>ods excel file="~/isionlogs/weekly_review.xlsx";</code>, then runs PROC MEANS and PROC FREQ without errors, and ends there. The workbook is empty, or Excel says it cannot open it. What is missing?',o:['ODS EXCEL CLOSE; at the end of the program','A RUN; after the last PROC step','A LIBNAME statement for the ~/isionlogs folder','ODS HTML CLOSE; before the ODS EXCEL statement'],a:0,why:'ODS EXCEL builds the workbook while the destination is open and writes the finished .xlsx only when it is closed, so without ODS EXCEL CLOSE the file is incomplete. FILE= takes a path, so no LIBNAME is needed, and the HTML results can stay open alongside. Both PROCs ran, so a missing RUN is not the problem.'},
 prac:{task:'Build <b>weekly_review.xlsx</b> in ~/isionlogs with two sheets, each showing a TITLE inside the sheet (your own wording). Sheet <b>Contracts</b>: PROC MEANS on work.trades with the n, sum and mean of pnl per contract, to 2 decimals. Sheet <b>Habits</b>: a PROC FREQ crosstab of habit by event from work.habits with counts only (norow nocol nopercent), sending only the crosstab table (by its ODS name). Close the destination so the file is written, and clear the title.',sol:R`ods excel file="~/isionlogs/weekly_review.xlsx"
          options(sheet_name='Contracts' embedded_titles='yes');

title 'Trades and PnL by contract';
proc means data=work.trades n sum mean maxdec=2;
  class contract;
  var pnl;
run;

ods excel options(sheet_name='Habits');
title 'Habits by outcome';
ods select CrossTabFreqs;
proc freq data=work.habits;
  tables habit*event / norow nocol nopercent;
run;

ods excel close;
title;`}},
/* ---------- Tableau ---------- */
{id:'tab1',t:'tab',lv:1,title:'Live connections vs extracts',
 learn:['A <b>live</b> connection sends a query to the source every time a view changes: always current, but only as fast as the source, which must be reachable. An <b>extract</b> copies the data into a .hyper file that Tableau queries instead: fast, usable offline and easy on the source, but frozen at its last <b>refresh</b>. You switch with Live / Extract at the top right of the Data Source tab (Tableau Public always saves extracts).','Keep an extract lean in its Edit… dialog. <b>Extract filters</b> decide which rows are stored, such as a relative date on [Day] for the last 12 months. <b>Hide All Unused Fields</b> drops the fields no sheet uses. <b>Aggregate data for visible dimensions</b> stores one row per combination of the remaining dimensions, so single trades are gone. A <b>data source filter</b> is different: it applies to every query on the source, live or extract.','Gotcha: refreshes. A <b>full refresh</b> rebuilds the whole extract from the source. An <b>incremental refresh</b> only appends the rows whose value in a column you pick, such as [Id], is above the highest one already stored: quick for logs that only grow. It never rewrites or removes stored rows, so a corrected or deleted trade keeps its old version, and rows that age out of a relative-date filter stay, until the next full refresh. So use both: on Tableau Server or Cloud, schedule an incremental refresh daily and a full one weekly (Desktop has no schedules: you refresh by hand).'],
 ex:R`A lean extract of your practice log (mind)
Build the sheets on the live connection first, then:
Data → mind → Extract Data…   (or Data Source tab → Extract → Edit…)
  Filters → Add… → Day → Relative dates → Last 12 months
        extract filter: older sessions are never stored
  Hide All Unused Fields
        keeps only what the sheets use: Day, Practice, Minutes
  ☑ Aggregate data for visible dimensions
        one row per Day × Practice with Minutes summed:
        single sessions (Id, Time, Technique) are gone
Extract → Tableau asks where to save the .hyper file

Tomorrow's sessions appear only after a refresh:
  Data → mind → Extract → Refresh
A live connection would show them at once, by querying the
source on every change instead.`,
 quiz:{q:'Your <b>trades</b> extract runs an incremental refresh every evening, identifying new rows by [Id]. Today you correct the P&amp;L of a trade you logged last week. When does the extract show the corrected value?',o:['At the next full refresh: an incremental refresh only adds rows with a new, higher Id','Tonight: an incremental refresh also re-reads every row changed since the last refresh','At once: an extract checks the source for changed rows each time a view is drawn','Only once you delete the extract and create it again from the live connection'],a:0,why:'An incremental refresh asks the source only for rows whose Id is above the highest Id already stored and appends them. It never re-reads, updates or deletes the rows it holds, so the old P&L stays. A full refresh rebuilds the extract from the source and brings the correction in: there is no need to delete and recreate it. Between refreshes an extract is a snapshot that never checks the source; a live connection would show the change at once.'},
 prac:{task:'Set up an extract of <b>trades</b> for a dashboard whose sheets use [Id], [Day], [Contract], [Side], [Minutes] and [Pnl], including a list of single trades. The extract should keep only the last 2 years of trades (a relative-date filter), store only those six fields, and pick up each day’s new trades without being rebuilt every time. Give the Extract dialog settings, and the refresh schedule (which kinds of refresh, how often) you would set once the data source is published to Tableau Server or Cloud. Then, for each of these, say whether a daily incremental refresh catches it, and what does if not: (a) a trade you log tomorrow, (b) last week’s trade whose P&amp;L you correct, (c) a trade you delete, (d) trades that drift past the 2-year window.',sol:R`Data Source tab → Connection: (•) Extract → Edit…
                 (or Data → trades → Extract Data…)
  Filters → Add… → Day → Relative dates → Last 2 years
      ([Day] must be a Date field: if the Data pane shows Abc next to
       it, right-click → Change Data Type → Date first)
      Relative dates count whole periods, the current one included:
      this year so far plus all of last year. Last 24 months is the
      closer rolling window; either answers the task.
  Hide All Unused Fields
      keeps the six fields the sheets use; Entry, Exit, Fees and the
      rest are not stored
  Aggregate data for visible dimensions: off
      the trade list needs one row per trade
  ☑ Incremental refresh → Identify new rows using column: Id
      Id numbers trades in the order you log them, so every new trade
      has a higher Id than any trade already stored

Schedule: publish the data source to Tableau Server or Cloud and give it
  an incremental refresh every day and a full refresh every week.
  (In Desktop you refresh by hand: Data → trades → Extract → Refresh.)

(a) Tomorrow's trade: caught. It has a new, higher Id, so the next
    incremental refresh appends it.
(b) The corrected P&L: missed. An incremental refresh never rewrites rows
    it already holds; the weekly full refresh rebuilds them.
(c) The deleted trade: missed. It stays in the extract until the full
    refresh.
(d) Trades that fall out of the window: they stay too. An incremental
    refresh only filters the new rows it fetches and never removes stored
    ones; the full refresh applies the 2-year window to everything again.`}},
{id:'tab2',t:'tab',lv:1,title:'Dimensions, measures & aggregation',
 learn:['When you connect, Tableau sorts each table’s fields in the Data pane: <b>dimensions</b> above a thin line, <b>measures</b> below it. Dimensions are what you slice by: [Contract], [Side], [Exercise], [Kind], dates. Measures are numbers to add up: [Pnl], [Kcal], [Minutes]. Text, dates and True/False fields land with the dimensions, most numbers with the measures. Dimensions are <i>usually</i> blue and measures <i>usually</i> green; <i>Discrete vs continuous</i>, next, explains what the colours really mean.','A dimension on Rows or Columns draws one header per value, and the dimensions in the view together set its <b>level of detail</b>: one mark per combination, like SQL’s GROUP BY. A measure on a shelf is <b>aggregated</b> to that level. Dragged in, it arrives as SUM: [Side] on Columns and [Pnl] on Rows give SUM(Pnl) for Long and for Short, and with no dimension at all it is one grand total. Right-click the pill → Measure to pick Average, Count, Count (Distinct), Minimum, Maximum and more.','Gotchas. SUM is only a default: [Rpe] and [Energy] are scores, and their SUM just grows with every entry you log, so average them (right-click the field → Default Properties → Aggregation sets it once). AVG averages <i>rows</i>: AVG([Kcal]) is kcal per logged meal, not per day. Every aggregation skips empty (NULL) values. To count rows, use the count field Tableau adds to each table, such as Meals (Count). A number you want as headers, like [Quality], needs right-click → <b>Convert to Dimension</b>.'],
 ex:R`Meals by kind (meals)
Rows:    [Kind]            dimension: one header per value
Columns: SUM([Kcal])       measure: dragged in, it arrives as SUM
  → one bar for bowls, one for snacks
  ≈ SELECT kind, SUM(kcal) FROM meals GROUP BY kind

Right-click the pill → Measure → Average
  → AVG([Kcal]): kcal per logged meal, not per day

Rows: [Kind], [Name]       one row per kind × name
  ≈ ... GROUP BY kind, name

Rows: (empty)              no dimension in the view:
  → one bar, the grand total over every meal

Columns: Meals (Count)     the table's count field: meals logged`,
 quiz:{q:'On <b>mind</b>, [Practice] is on Rows. You drag [Depth] (how deep a session felt, 1–10) to Columns, and the bars run far past 10. Why?',o:['Depth is a dimension, so each bar stacks one segment per depth value you logged','Depth is a measure, so it arrives as SUM: each bar adds the depth of every session','Tableau adds up the depth of every practice first and shows that total on each bar','A 1–10 score can only be counted, so each bar shows how many sessions you rated'],a:1,why:'[Depth] is a number, so Tableau lists it with the measures, and a measure dragged onto a shelf arrives as SUM, aggregated to the dimensions in the view: seven sessions rated around 6 add up to more than 40. Right-click the pill → Measure → Average for the average session, or set Default Properties → Aggregation to Average once. A dimension would draw headers, not a summed bar; with [Practice] in the view each bar is that practice’s own total, not a grand total; and Tableau sums numbers by default rather than counting them. Journaling gets no bar at all: its sessions have no depth, and SUM skips NULLs.'},
 prac:{task:'On <b>workouts</b>, put [Type] on Rows and three measures side by side on Columns: how many entries you logged of each type (a count of rows), your total sets, and how hard an average entry felt ([Rpe], with the aggregation that answers that). Which type do you log most, and which feels hardest per entry? Why is one of Cardio’s bars empty? Then add [Exercise] to Rows after [Type]: what changes? Write the SQL GROUP BY that each view matches.',sol:R`Rows:    [Type]
Columns: Workouts (Count)   the table's count field: entries logged
                            (or [Id] → right-click → Measure → Count)
         SUM([Sets])        dragged in as SUM: right as it is
         AVG([Rpe])         also arrives as SUM: right-click → Measure
                            → Average (SUM([Rpe]) only grows with the
                            number of entries)
Three measure pills on Columns → three bar charts side by side
≈ SELECT type, COUNT(*), SUM(sets), AVG(rpe) FROM workouts GROUP BY type

Most logged: Weighted on both datasets (62 entries on the built-in
  sample, 66 on the apps' data).
Hardest per entry: Weighted on the sample (about 8.0, with Bodyweight
  7.9 just behind); Bodyweight on the apps' data (8.0 against 7.5).
Cardio logs minutes, not sets: its Sets are NULL and SUM skips NULLs,
  so that bar is empty. On the apps' data Stretch has no RPE either,
  so its AVG([Rpe]) bar is empty too.

+ [Exercise] on Rows after [Type]: the level of detail becomes type ×
  exercise, one row per exercise under its type, and every measure is
  now computed per exercise
≈ SELECT type, exercise, COUNT(*), SUM(sets), AVG(rpe)
  FROM workouts GROUP BY type, exercise`}},
{id:'tab9',t:'tab',lv:1,title:'Discrete vs continuous',
 learn:['Blue or green is a separate choice from dimension or measure. A <b>discrete</b> (blue) pill draws <b>headers</b>, one per value; a <b>continuous</b> (green) pill draws an <b>axis</b>. <i>Dimensions, measures &amp; aggregation</i> paired dimensions with blue and measures with green: that is only the usual case. SUM([Pnl]) can be made discrete (one header per distinct total), and a number or date dimension continuous; a text field cannot.','Dates are the main case. Right-click a date pill: the <b>first group</b> holds date <i>parts</i> (Year, Quarter, Month, Day, and Weekday under More), discrete by default, so WEEKDAY([Day]) puts every Monday under one header. The <b>second group</b> holds date <i>values</i> (Year, Quarter, Month, Week Number, Day), continuous by default: a timeline. Both Day items read DAY(Day) on the pill, but the first is the day of the month (1–31), so check which one is ticked. Below both groups, <b>Exact Date</b> uses the full date as stored.',"Two gotchas. Dragging [Day] onto a shelf gives the discrete <b>YEAR([Day])</b>, and all your logs are from 2026, so “P&amp;L over time” comes out as one bar labelled 2026: pick Day from the second group instead. And [Day] is stored as text ('YYYY-MM-DD') in SQLite: if the Data pane shows <b>Abc</b> next to it, right-click it → Change Data Type → Date first, or there are no date parts to pick at all."],
 ex:R`Same field, two pills (checkins)

Energy over time: a weekly timeline
  Columns: WEEK([Day])     green: Week Number from the 2nd group (date values)
  Rows:    AVG([Energy])
  Marks:   Line            → one axis, one point per week, spaced in real time

Energy by weekday: one header per value
  Columns: WEEKDAY([Day])  blue: Weekday from the 1st group (date parts)
  Rows:    AVG([Energy])
  Marks:   Bar             → every Monday's check-in under one header

Trap: Day from the 1st group is the day of the month (1-31):
  September 20 and October 20 land under the same header, 20

Dragged straight in, [Day] arrives as YEAR([Day]): one header, 2026`,
 quiz:{q:'You drag [Day] to Columns and [Pnl] to Rows to see your P&amp;L over time, but you get <b>one bar labelled 2026</b>. Why?',o:['SUM([Pnl]) adds all your trades into one total: convert Pnl to a dimension to get a bar per day','[Day] is a dimension, so it can only draw headers: it must become a measure before it can draw a time axis','Tableau used the discrete date part YEAR([Day]), and every trade is from 2026: pick Day from the second group','Bars always group dates by year: change the mark type to Line to see each day'],a:2,why:'A date dropped on a shelf starts as YEAR([Day]), a discrete date part: one header per year, and every trade is from 2026. Day from the second group of the pill menu is a continuous date value and draws a timeline with one point per day. B mixes the two choices up: [Day] stays a dimension when it turns continuous. A and D change the measure or the mark, but the view is still grouped by year.'},
 prac:{task:'On <b>trades</b>, build two sheets: (a) your daily P&amp;L as a line over time, (b) your total P&amp;L per weekday as bars. Which pill (and colour) does [Day] need in each, how does the axis in (a) differ from the headers in (b), and which weekday has your lowest total P&amp;L?',sol:R`(a) Daily P&L line
Columns: DAY([Day])      green: Day from the 2nd (date value) group
Rows:    SUM([Pnl])
Marks:   Line
→ an axis of real time: weekends and days without trades still
  take space, and the line runs straight across them

(b) P&L by weekday
Columns: WEEKDAY([Day])  blue: Weekday from the 1st (date part) group
Rows:    SUM([Pnl])
Marks:   Bar
→ one header per weekday: every Monday's trades under one Monday.
  Only Monday to Friday appear, because there are no weekend trades.

Lowest total: it depends on your trades. In the built-in sample it
is Thursday, the only weekday with a net loss (-$700).

If [Day] shows Abc in the Data pane: Change Data Type → Date first.`}},
{id:'tab10',t:'tab',lv:1,title:'The Marks card & level of detail',
 learn:['The <b>Marks card</b> puts more fields on the same marks: <b>Color</b>, <b>Size</b>, <b>Label</b>, <b>Detail</b>, <b>Tooltip</b>, and <b>Shape</b> when the mark type is Shape. The rule that matters: a <b>dimension</b> anywhere on it joins the view’s level of detail (the GROUP BY) and splits the marks, exactly as on Rows or Columns. A <b>measure</b> there only encodes the marks that already exist. <b>Detail</b> splits without encoding anything.','That is how a scatter works. SUM([Minutes]) against SUM([Pnl]) with no dimension in the view is <b>one dot</b>: every trade summed. Put a field that is unique per trade, [Id], on Detail and you get one dot per trade (turning off Analysis → Aggregate Measures also draws one mark per row). Watch the status bar at the bottom of the window: it counts the marks.','Two gotchas. If [Id] is listed with the measures in the Data pane (Tableau may well treat a number column that way), dropping it on Detail gives SUM([Id]), which splits nothing: right-click it → <b>Convert to Dimension</b> first. And Tooltip counts too: a dimension dragged to Tooltip joins the level of detail like any other, so it can split marks you only meant to label.'],
 ex:R`Protein vs calories, one step at a time (meals)
Watch the mark count in the status bar as you go.

Columns: AVG([Kcal])    Rows: AVG([Protein])
                         → 1 mark: every meal averaged together
+ Color:  [Kind]         → 2 marks: bowl and snack
+ Detail: [Name]         → one mark per meal name, still coloured by kind
+ Size:   AVG([Fiber])   → the same marks, now sized:
                           a measure only encodes, it never splits`,
 quiz:{q:'Columns: SUM([Minutes]), Rows: SUM([Pnl]). Your scatter of hold time against P&amp;L shows a <b>single dot</b>. How do you get one dot per trade?',o:['Put [Id], as a dimension, on Detail','Put SUM([Pnl]) on Size','Change the mark type from Automatic to Circle','Put [Side] on Color'],a:0,why:'With no dimension in the view, every trade is summed into one mark. [Id] is unique per trade, so as a dimension on Detail it splits the view into one mark per trade (Analysis → Aggregate Measures off does it too). A measure on Size only sizes the one dot, the mark type only changes how it looks, and [Side] does split it, but only into two dots: Long and Short.'},
 prac:{task:'On <b>trades</b>, build a scatter with <b>one mark per trade</b>: minutes held across, P&amp;L up, [Side] as the colour and [Contract] as the shape. Do your winners and losers differ in how long you held them?',sol:R`Columns: SUM([Minutes])     Rows: SUM([Pnl])
Detail:  [Id]   as a dimension (if it is listed with the measures:
                right-click → Convert to Dimension first)
Color:   [Side]
Shape:   [Contract]  (no Shape button? set the mark type to Shape)
Alternative to [Id] on Detail: Analysis → Aggregate Measures off

Reading it: Pnl takes only a few values (stop-outs at -305,
scratches at 0 or -5, targets at +895), so the marks form
horizontal bands. Compare where each band sits on the minutes
axis. In the sample data the winners were held about 25 minutes
on average and the losers about 8: the -305 band ends before
15 minutes, while the +895 band starts near 8 and runs past 40.`}},
{id:'tab11',t:'tab',lv:1,title:'Dimension vs measure filters',
 learn:['A <b>dimension filter</b> ([Contract], [Side], a range of [Day]) removes rows <i>before</i> the view adds anything up, like SQL’s WHERE. A <b>measure filter</b> on an aggregate, such as SUM([Pnl]) at least 200, runs <i>after</i> the aggregation and keeps the marks whose total passes, like HAVING. Both sit on the same Filters shelf; a pill that reads SUM(Pnl) is the HAVING kind.','Drag a measure to Filters and Tableau asks how to filter it. <b>All values</b> tests every row, so [Pnl] at least 0 keeps each non-losing trade: a WHERE on pnl. <b>Sum</b> (or Average, Count…) tests the aggregated marks: the HAVING. Pick the wrong one and you get each contract’s total of its non-losing trades when you wanted the contracts that are at least even overall.','Gotcha: a measure filter is computed at the view’s level of detail. SUM([Pnl]) at least 200 with only [Day] on Rows keeps whole days. Add [Side] and the same filter tests each day’s Long and Short totals on their own: a day can come back with only its winning side, or show up twice. Nothing about the filter changed; the grain did.'],
 ex:R`Which weighted exercises got real volume? (workouts)

Rows:    [Exercise]
Text:    SUM([Sets])
Filters: [Type] = Weighted        dimension filter: rows out first (WHERE)
         SUM([Sets]) at least 12  measure filter, "Sum" in the dialog:
                                  exercises out after adding up (HAVING)
same as SQL:
  SELECT exercise, SUM(sets) FROM workouts
  WHERE type = 'Weighted'
  GROUP BY exercise
  HAVING SUM(sets) >= 12

"All values" at least 12 would test each logged entry instead
(WHERE sets >= 12): no single entry has 12 sets, so the view empties.`,
 quiz:{q:'[Contract] on Rows, SUM([Pnl]) on Text. You drag [Pnl] to Filters, choose <b>All values</b> and set <b>At least 0</b>. What does the table show?',o:['Only the contracts whose total P&L is at least 0, with their full totals','Each contract’s total of its non-losing trades only: All values tests each trade','The full totals, but only for contracts with at least one trade at 0 or above','Every contract with its full total: a filter on a measure only hides marks'],a:1,why:'All values filters the individual rows, like WHERE pnl >= 0: losing trades are dropped before the SUM, so each contract shows the total of its non-losing trades only (a contract with a net loss can even turn positive). Choosing Sum in that dialog gives A, the HAVING version; Maximum would give C. D is wrong because the losing trades are gone before the totals are computed.'},
 prac:{task:'On <b>trades</b>, list the days when your <b>NQZ6</b> trades together made at least $200: [Day] on Rows as one discrete header per date (not per day of the month), SUM([Pnl]) on Text. Which of your two filters is a dimension filter and which a measure filter, and which acts first? Then add [Side] to Rows: why does the list change?',sol:R`Rows:    DAY([Day]) as discrete headers, one per date
         (Day from the 2nd group or Exact Date, then right-click → Discrete;
          not Day from the 1st group, which is the day of the month)
Text:    SUM([Pnl])
Filters: [Contract] = NQZ6        dimension filter, acts first: the
