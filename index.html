/* ================= lessons ================= */
const LESSONS=[
/* ---------- SQL ---------- */
{id:'sql1',t:'sql',lv:1,title:'SELECT & WHERE',
 learn:['Every query starts with <b>SELECT</b> (which columns, in the order you want them back) and <b>FROM</b> (which table). <b>WHERE</b> keeps only the rows whose condition is true, checked one row at a time before anything is counted or sorted. Compare with =, &lt;&gt; (not equal), &lt;, &lt;=, &gt; and &gt;=. SELECT * returns every column: fine for a first look, but name the columns an answer asks for.','Text goes in <b>single quotes</b>, and = on text is exact, capitals included. Your TRAINING log, <b>workouts</b>, has one row per exercise you logged, its <b>type</b> spelled \'Weighted\', \'Bodyweight\', \'Cardio\' or \'Stretch\' and its effort in <b>rpe</b> (1–10), so type = \'weighted\' matches nothing. Double quotes name columns in standard SQL: SQLite reads an unknown "Weighted" as text, Postgres reports a missing column.',"Combine conditions with <b>AND</b> (both must hold), <b>OR</b> (either will do) and NOT, and match a list with <b>IN</b>: type IN ('Cardio', 'Stretch'). Gotcha: AND binds tighter than OR, the way × binds tighter than +. type = 'Cardio' OR type = 'Stretch' AND rpe &lt; 7 means type = 'Cardio' OR (type = 'Stretch' AND rpe &lt; 7): every Cardio row comes back, easy or not. Put brackets around the OR, or use IN."],
 ex:R`SELECT day, practice, minutes, mood_before, mood_after
FROM mind
WHERE (practice = 'Breathwork' OR practice = 'Meditation')   -- brackets: the OR first
  AND minutes >= 10;
-- the same rows: WHERE practice IN ('Breathwork', 'Meditation') AND minutes >= 10`,
 task:'Your hardest strength work: list <b>day</b>, <b>exercise</b>, <b>type</b> and <b>rpe</b> (in that order) for every row of <b>workouts</b> whose type is <b>Weighted</b> or <b>Bodyweight</b> and whose rpe is <b>8.5 or higher</b>. Row order free.',
 start:R`SELECT
FROM workouts
WHERE `,
 sol:R`SELECT day, exercise, type, rpe
FROM workouts
WHERE type IN ('Weighted', 'Bodyweight')
  AND rpe >= 8.5;`,
 hint:"Two conditions joined by AND; the type test is a list, so write type IN ('Weighted', 'Bodyweight') or put brackets around the OR."},
{id:'sql2',t:'sql',lv:1,title:'ORDER BY & LIMIT',ordered:true,
 learn:['<b>ORDER BY</b> sorts the result: ascending by default (smallest first, A to Z, earliest date first), or largest first with <b>DESC</b>. <b>LIMIT n</b> then keeps the first n rows: the classic “top N” pattern. LIMIT runs last, on the sorted result. Without ORDER BY a database may return rows in any order, and that order can change, so “the first 5 rows” of an unsorted query mean nothing.',"Each sort column takes its own direction. ORDER BY energy, quality DESC sorts energy <i>ascending</i> (your flattest mornings first) and only quality descending: write DESC after every column that needs it. Later columns only break the ties left by earlier ones. Dates stored as 'YYYY-MM-DD' text sort in calendar order, so ORDER BY day DESC puts the latest first.",'When rows tie on every sort column, their order isn’t guaranteed, and LIMIT may keep either one. Finish with a column that is unique: <b>id</b> in most tables (a higher id is a later entry), <b>day</b> in <b>checkins</b>, which has one row per morning. LIMIT 5 OFFSET 5 skips the first 5 (page two); SQL Server writes TOP 5, or OFFSET … FETCH, instead.'],
 ex:R`SELECT day, kind, name, kcal
FROM meals
ORDER BY kind, kcal DESC, id DESC   -- kind A to Z; inside it biggest first, latest first on ties
LIMIT 5;`,
 task:'Your <b>5 best mornings</b> in <b>checkins</b>: <b>day</b>, <b>energy</b>, <b>quality</b>, <b>sleep</b>, in that order. Highest energy first; among mornings with the same energy, higher quality first; if both tie, the most recent day first. Exactly 5 rows, in that order.',
 start:R`SELECT day, energy, quality, sleep
FROM checkins
`,
 sol:R`SELECT day, energy, quality, sleep
FROM checkins
ORDER BY energy DESC, quality DESC, day DESC
LIMIT 5;`,
 hint:'DESC applies to one column only: write it after energy, after quality and after day, then LIMIT 5.'},
{id:'sql3',t:'sql',lv:1,title:'COUNT, SUM & GROUP BY',
 learn:['Aggregate functions (<b>COUNT</b>, <b>SUM</b>, <b>AVG</b>, <b>MIN</b>, <b>MAX</b>) collapse many rows into one value. On their own they summarise the whole table in one row; <b>GROUP BY</b> first splits the rows into groups and returns one row per group, each aggregate worked out inside its group. Group by two columns and you get one row per combination that occurs: GROUP BY day, kind gives each day’s bowls and each day’s snacks.','The rule: every column in SELECT is either in GROUP BY or inside an aggregate. Postgres and SQL Server reject a query that breaks it; SQLite runs it and fills the stray column from an arbitrary row of the group. SELECT day, kind, COUNT(*) FROM meals GROUP BY day returns one row per day with a single kind beside a count of both kinds: no error, wrong answer.','COUNT(*) counts rows; SUM, AVG, MIN and MAX work on a column. Let AVG do the averaging: SUM(energy) / COUNT(*) on a whole-number column divides integers in SQLite (7 / 2 is 3). Name each result with <b>AS</b> (otherwise the column is called COUNT(*)) and ROUND(x, 2) money and averages. GROUP BY doesn’t promise a row order: add ORDER BY when order matters. Your JOURNAL log is <b>trades</b>: one row per trade, with <b>pnl</b> in dollars, already net of fees.'],
 ex:R`SELECT kind,
       COUNT(*) AS meals,
       ROUND(SUM(kcal), 2) AS kcal,
       ROUND(AVG(protein), 2) AS avg_protein,
       MAX(protein) AS most_protein
FROM meals
GROUP BY kind;   -- one row per kind; GROUP BY kind, name would give one per kind + name pair`,
 task:'How does each contract trade on each side? One row per <b>contract</b> and <b>side</b> pair in <b>trades</b>. Columns: <b>contract</b>, <b>side</b>, <b>trades</b> (count), <b>pnl</b> (total pnl, rounded to 2) and <b>avg_pnl</b> (average pnl per trade, rounded to 2). pnl is already net of fees. Row order free.',
 start:R`SELECT contract, side,
       COUNT(*) AS trades
FROM trades
`,
 sol:R`SELECT contract, side,
       COUNT(*) AS trades,
       ROUND(SUM(pnl), 2) AS pnl,
       ROUND(AVG(pnl), 2) AS avg_pnl
FROM trades
GROUP BY contract, side;`,
 hint:'Both columns go in GROUP BY contract, side; then COUNT(*), ROUND(SUM(pnl), 2) and ROUND(AVG(pnl), 2).'},
{id:'sql13',t:'sql',lv:1,title:'DISTINCT & COUNT(DISTINCT)',
 learn:['SELECT DISTINCT drops duplicate rows from a result: SELECT DISTINCT exercise FROM workouts lists each exercise once, however often you logged it. It works on the <b>whole selected row</b>, not the first column, so SELECT DISTINCT day, exercise returns each day + exercise pair once. Nor is DISTINCT a function: SELECT DISTINCT(day), exercise still de-duplicates on both columns.','Inside an aggregate, <b>COUNT(DISTINCT col)</b> counts the <i>different</i> values, so “how many different things” can sit next to “how many rows” in one GROUP BY. Three exercises logged on one morning are 3 rows but 1 day: COUNT(*) and COUNT(day) both say 3, COUNT(DISTINCT day) says 1.','Unique users, active days, products sold: much of everyday analytics is a COUNT(DISTINCT …). SQLite accepts one expression inside it, so COUNT(DISTINCT exercise, day) is an error.'],
 ex:R`-- each practice + technique pair once (DISTINCT applies to both columns):
-- SELECT DISTINCT practice, technique FROM mind;
SELECT practice,
       COUNT(*) AS sessions,
       COUNT(DISTINCT technique) AS techniques
FROM mind
GROUP BY practice;   -- many sessions, only a few different techniques`,
 task:'How varied is your training? One row per workout <b>type</b>. Columns: <b>type</b>, <b>entries</b> (rows logged), <b>exercises</b> (number of different exercises) and <b>days</b> (number of different days you logged that type). Plain counts, row order free.',
 start:R`SELECT type,
       COUNT(*) AS entries,

FROM workouts
GROUP BY type;`,
 sol:R`SELECT type,
       COUNT(*) AS entries,
       COUNT(DISTINCT exercise) AS exercises,
       COUNT(DISTINCT day) AS days
FROM workouts
GROUP BY type;`,
 hint:'COUNT(*) counts rows; COUNT(DISTINCT col) counts each different value once, and you need it for two of the columns.'},
{id:'sql14',t:'sql',lv:1,title:'NULLs: IS NULL & COALESCE',
 learn:['NULL means “unknown or missing”: not 0 and not an empty string. In <b>checkins</b>, weight is NULL on mornings you skipped the scale. Any comparison with NULL, even weight = NULL, gives NULL and never matches, so test with <b>IS NULL</b> / <b>IS NOT NULL</b>. In SQLite a test is 1 when true and 0 when false, so SUM(weight IS NULL) counts the gaps.','Aggregates skip NULLs. COUNT(*) counts every row, COUNT(weight) only the rows that have a weight, and AVG(weight) averages the values you actually logged. So COUNT(*) - COUNT(weight) is also the number of gaps (the portable way). Careful: COUNT(weight IS NULL) counts every row, because 0 is not NULL.',"<b>COALESCE(x, fallback)</b> returns its first non-NULL argument: good for display labels (COALESCE(depth, 'not rated')) and for a 0 where missing really means none. Inside an average it is a trap: AVG(COALESCE(weight, 0)) counts each skipped weigh-in as 0 kg and drags your average far down."],
 ex:R`-- SQLite lets one column mix numbers and text;
-- Postgres would want CAST(depth AS TEXT) inside the COALESCE
SELECT day, practice, technique,
       COALESCE(depth, 'not rated') AS depth
FROM mind
WHERE depth IS NULL OR depth >= 8   -- unrated or deep sessions
ORDER BY day;`,
 task:'Your weigh-in discipline, in one row from <b>checkins</b>. Columns: <b>days</b> (check-ins), <b>weighed</b> (check-ins with a weight), <b>skipped</b> (check-ins whose weight is missing) and <b>avg_weight</b> (the average of the weights you actually logged, rounded to 2).',
 start:R`SELECT COUNT(*) AS days,

FROM checkins;`,
 sol:R`SELECT COUNT(*) AS days,
       COUNT(weight) AS weighed,
       SUM(weight IS NULL) AS skipped,   -- portable: COUNT(*) - COUNT(weight)
       ROUND(AVG(weight), 2) AS avg_weight
FROM checkins;`,
 hint:'COUNT(weight) and AVG(weight) already skip NULLs; count the missing weights with an IS NULL test, never = NULL.'},
{id:'sql15',t:'sql',lv:1,title:'Text functions: SUBSTR & LIKE',
 learn:["String functions reshape text: <b>SUBSTR(s, start, len)</b> cuts a piece, LENGTH(s) counts characters, UPPER / LOWER change case, TRIM strips spaces, REPLACE(s, a, b) swaps text, and <b>||</b> joins strings (+ does not join text in SQLite). Your dates and times are fixed-format text ('YYYY-MM-DD', 'YYYY-MM-DD HH:MM:SS'), so SUBSTR(day, 1, 7) is the month and SUBSTR(time, 12, 5) the clock time.","<b>LIKE</b> matches a pattern: % is any run of characters (even none) and _ exactly one, so contract LIKE 'ES%' catches every S&amp;P expiry (ESZ6 now, ESH7 after the December roll), while contract = 'ES%' matches nothing: = compares exactly, % and all. In SQLite LIKE ignores case, so '%press%' finds 'Bench Press'; in Postgres LIKE is case-sensitive and ILIKE is the case-blind form.","SUBSTR counts from <b>1</b>, not 0: in '2026-08-24 09:38:56' position 11 is the space, so SUBSTR(opened, 11, 2) returns ' 0', not '09'. And slicing dates as text works only because SQLite stores them as TEXT; with real DATE / TIMESTAMP columns use date functions such as EXTRACT."],
 ex:R`SELECT day, exercise,
       SUBSTR(time, 12, 5) AS clock,         -- 'HH:MM' out of 'YYYY-MM-DD HH:MM:SS'
       UPPER(SUBSTR(exercise, 1, 3)) || '-' || LENGTH(exercise) AS code
FROM workouts
WHERE exercise LIKE '%press%'   -- LIKE ignores case: matches 'Bench Press'
ORDER BY id DESC
LIMIT 8;`,
 task:"Your <b>Nasdaq hours</b>: take the trades whose <b>contract</b> starts with 'NQ' (any expiry) and group them by the hour the trade was <b>opened</b>: the two-digit HH of 'YYYY-MM-DD HH:MM:SS', such as '09'. Columns: <b>hour</b>, <b>trades</b> (count), <b>pnl</b> (total, rounded to 2). Row order free.",
 start:R`SELECT SUBSTR(opened,  ,  ) AS hour,
       COUNT(*) AS trades,
       ROUND(SUM(pnl), 2) AS pnl
FROM trades
WHERE contract
GROUP BY hour;`,
 sol:R`SELECT SUBSTR(opened, 12, 2) AS hour,
       COUNT(*) AS trades,
       ROUND(SUM(pnl), 2) AS pnl
FROM trades
WHERE contract LIKE 'NQ%'
GROUP BY hour;`,
 hint:"Count from 1: 'YYYY-MM-DD ' is 11 characters, so the hour starts at 12 and is 2 long; 'starts with' is LIKE with one % at the end."},
{id:'sql4',t:'sql',lv:2,title:'JOINs across apps',
 learn:["Each app keeps its own table, and every table has a <b>day</b> column ('YYYY-MM-DD'), so day is the key that lines them up. FROM checkins c JOIN trades t ON t.day = c.day pairs every trade with that morning’s check-in: sleep next to P&amp;L. The letters after the table names are aliases. Once two tables share a column name, qualify it (c.day, t.day), or SQLite stops with “ambiguous column name: day”.",'JOIN (INNER JOIN in full) keeps only the pairs that match: a trade on a day you didn’t check in has no partner and drops out, and so does a check-in day without trades. <b>checkins</b> has one row per day, so each trade finds at most one partner and is counted once. Join two tables with many rows per day and rows repeat once per match: the next lesson, IN &amp; EXISTS, deals with that; keeping unmatched rows is the job of LEFT JOIN &amp; anti-joins.','The ON condition is what limits the pairs. Leave it out (SQLite accepts a JOIN without ON, or FROM checkins, trades) and every check-in is paired with every trade: thousands of rows, all meaningless. After the join the rows behave like one wide table: WHERE, GROUP BY and the aggregates work as usual, so you can group by a column from one table and add up a column from the other.'],
 ex:R`SELECT s.day, s.track, s.minutes, c.sleep, c.energy
FROM study s
JOIN checkins c ON c.day = s.day   -- one check-in per day: each session appears once
ORDER BY s.day DESC
LIMIT 8;   -- your latest study sessions next to that morning's check-in`,
 task:'Do you trade better after a good night? Join <b>checkins</b> to <b>trades</b> on <b>day</b> and group by sleep <b>quality</b> (1–5); only trades on days you checked in count. Columns: <b>quality</b>, <b>days</b> (number of different trading days), <b>trades</b> (number of trades) and <b>avg_pnl</b> (average pnl per trade, rounded to 2). Row order free.',
 start:R`SELECT c.quality,

FROM checkins c
JOIN trades t ON
GROUP BY c.quality;`,
 sol:R`SELECT c.quality,
       COUNT(DISTINCT t.day) AS days,
       COUNT(*) AS trades,
       ROUND(AVG(t.pnl), 2) AS avg_pnl
FROM checkins c
JOIN trades t ON t.day = c.day
GROUP BY c.quality;`,
 hint:'JOIN trades t ON t.day = c.day; after the join each row is one trade, so COUNT(*) counts trades and COUNT(DISTINCT t.day) counts days.'},
{id:'sql16',t:'sql',lv:2,title:'IN & EXISTS — avoiding fan-out',
 learn:['A JOIN returns one row per <i>matching pair</i>. Join <b>trades</b> to <b>workouts</b> on day and every trade comes back once for each exercise you logged that day: three exercises, three copies of the same trade. This is <b>fan-out</b>. COUNT and SUM quietly double or triple, and nothing warns you.',"When the other table only decides <i>which rows to keep</i>, filter instead of joining (a <b>semi-join</b>). IN, which you met with a list like ('Breathwork', 'Meditation'), also takes a <b>subquery</b>, a SELECT in brackets that produces the list: WHERE day IN (SELECT day FROM workouts). EXISTS asks “is there at least one match?”: in WHERE EXISTS (SELECT 1 FROM workouts w WHERE w.day = t.day) the inner query reads the outer trade’s t.day, so it is asked again for every trade. Either way each trade is kept once, however many matches it has.",'Gotchas: COUNT(DISTINCT t.id) after a fan-out repairs the count but not the SUM, and SUM(DISTINCT pnl) adds up distinct <i>amounts</i>, not trades; joining to a de-duplicated side, JOIN (SELECT DISTINCT day FROM workouts), is a safe fix. NOT IN (subquery) returns no rows at all when the subquery holds a NULL (x NOT IN (2, NULL) is never true), so for “no match” questions (the anti-join lesson) NOT EXISTS is the safer form.'],
 ex:R`SELECT kind, COUNT(*) AS meals, ROUND(AVG(kcal), 2) AS avg_kcal
FROM meals m
WHERE EXISTS (SELECT 1 FROM habits h
              WHERE h.day = m.day AND h.event IN ('resisted', 'slipped'))
GROUP BY kind;   -- what you eat on days you had an urge, each meal counted once`,
 task:'Do you trade better on days you trained? Take the <b>trades</b> whose <b>day</b> has at least one row in <b>workouts</b>, each trade counted once. One row with: <b>trades</b> (count), <b>pnl</b> (their total, rounded to 2), <b>avg_pnl</b> (average pnl per trade, rounded to 2).',
 start:R`SELECT COUNT(*) AS trades,
       ROUND(SUM(t.pnl), 2) AS pnl,
       ROUND(AVG(t.pnl), 2) AS avg_pnl
FROM trades t
JOIN workouts w ON w.day = t.day;   -- run it: each trade repeats once per exercise that day`,
 sol:R`SELECT COUNT(*) AS trades,
       ROUND(SUM(pnl), 2) AS pnl,
       ROUND(AVG(pnl), 2) AS avg_pnl
FROM trades
WHERE day IN (SELECT day FROM workouts);`,
 hint:'Drop the JOIN and keep FROM trades: let workouts only filter, with WHERE day IN (SELECT day FROM workouts) or WHERE EXISTS (...).'},
{id:'sql5',t:'sql',lv:2,title:'HAVING — filtering groups',
 learn:['<b>WHERE</b> filters rows <i>before</i> grouping; <b>HAVING</b> filters groups <i>after</i> the aggregates are worked out, so it can test COUNT(*), SUM(kcal) or AVG(rpe). An aggregate in WHERE is an error (“misuse of aggregate”): WHERE looks at one row at a time, and the group it would add up doesn’t exist yet.',"The logical order is FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. So a test on a plain column, like kind = 'snack', belongs in WHERE: it decides which rows get added up. Moved into HAVING it means something else. Postgres rejects it; SQLite checks kind on one arbitrary row of each group, after the whole group has been summed, so the totals still include every row.",'SELECT runs after HAVING, so in standard SQL a column alias isn’t visible there yet: write HAVING SUM(kcal) &gt; 300, not HAVING snack_kcal &gt; 300. SQLite and MySQL accept the alias, Postgres and SQL Server don’t, so repeating the aggregate is the portable habit. One query can use both filters: WHERE to pick the rows, HAVING to pick the groups.'],
 ex:R`SELECT exercise, COUNT(*) AS entries, MAX(load) AS heaviest
FROM workouts
WHERE type = 'Weighted'      -- rows: only your weighted sets
GROUP BY exercise
HAVING COUNT(*) >= 4;        -- groups: exercises you logged 4 or more times`,
 task:'Your <b>snack-heavy days</b>: days on which your snacks (rows of <b>meals</b> with kind <b>snack</b>) added up to <b>more than 300 kcal</b>. Columns: <b>day</b>, <b>snacks</b> (number of snacks that day) and <b>kcal</b> (their total kcal, rounded to 2). Only snacks count, bowls don’t; leave out days whose snacks total 300 kcal or less. Row order free.',
 start:R`SELECT day, COUNT(*) AS snacks, ROUND(SUM(kcal), 2) AS kcal
FROM meals
`,
 sol:R`SELECT day, COUNT(*) AS snacks, ROUND(SUM(kcal), 2) AS kcal
FROM meals
WHERE kind = 'snack'
GROUP BY day
HAVING SUM(kcal) > 300;`,
 hint:"kind = 'snack' tests a row, so it goes in WHERE; the 300 kcal test is on the day's total, so it goes in HAVING after GROUP BY day."},
{id:'sql6',t:'sql',lv:2,title:'CASE WHEN — deriving labels',
 learn:["<b>CASE WHEN</b> condition <b>THEN</b> value … <b>ELSE</b> value <b>END</b> builds a new value row by row: buckets, flags, cleaned-up labels. The WHENs are tried top to bottom and the <i>first</i> true one wins, so ranges go in order from one end: WHEN rpe &gt;= 8.5 THEN 'hard' WHEN rpe &gt;= 7 THEN 'solid' works, but swap the two and every hard set lands in 'solid'. Give the CASE an alias and GROUP BY it to count per label.",'A row that fails every WHEN gets the ELSE, or NULL when there is no ELSE. That includes NULLs: NULL &gt;= 7 is never true, so a workout with no rpe skips every WHEN and quietly joins the ELSE bucket, inflating it. Decide where missing values belong (their own WHEN rpe IS NULL, or a WHERE that drops them) and which rows the question is about, before you trust the counts.',"CASE also works inside aggregates. The NULLs lesson counted with SUM(weight IS NULL); SUM(CASE WHEN event = 'slipped' THEN 1 ELSE 0 END) is the same kind of count, written so it runs in any database (Postgres can’t SUM a true/false), and it can add up values too: SUM(CASE WHEN kind = 'snack' THEN kcal ELSE 0 END). Careful with COUNT: it counts every non-NULL, so COUNT(CASE … THEN 1 ELSE 0 END) counts all rows. Use SUM, or COUNT with no ELSE."],
 ex:R`SELECT CASE WHEN rpe >= 8.5 THEN 'hard'
            WHEN rpe >= 7 THEN 'solid'
            WHEN rpe IS NOT NULL THEN 'easy'
            ELSE 'not rated' END AS effort,   -- a NULL rpe fails every WHEN
       COUNT(*) AS entries,
       SUM(CASE WHEN type = 'Weighted' THEN 1 ELSE 0 END) AS weighted
FROM workouts
GROUP BY effort;`,
 task:'Do strong urges beat you more often? Take your urges in <b>habits</b> (event <b>resisted</b> or <b>slipped</b>; the <b>done</b> rows are good habits, not urges) and label each by <b>intensity</b>: <b>strong</b> (8 or more), <b>moderate</b> (5 to 7) or <b>mild</b> (4 or less). Per label: <b>level</b> (the label, written exactly as above), <b>urges</b> (count) and <b>slipped</b> (how many of them were slipped). Row order free.',
 start:R`SELECT CASE WHEN       THEN 'strong'
            WHEN       THEN 'moderate'
            ELSE 'mild' END AS level,
       COUNT(*) AS urges,
       SUM(CASE WHEN       THEN 1 ELSE 0 END) AS slipped
FROM habits
GROUP BY level;`,
 sol:R`SELECT CASE WHEN intensity >= 8 THEN 'strong'
            WHEN intensity >= 5 THEN 'moderate'
            ELSE 'mild' END AS level,
       COUNT(*) AS urges,
       SUM(CASE WHEN event = 'slipped' THEN 1 ELSE 0 END) AS slipped
FROM habits
WHERE event IN ('resisted', 'slipped')
GROUP BY level;`,
 hint:"Keep only the urges with WHERE, test intensity >= 8 before >= 5 (the first true WHEN wins), and count slips with SUM(CASE WHEN event = 'slipped' THEN 1 ELSE 0 END)."},
{id:'sql17',t:'sql',lv:2,title:'UNION ALL — stacking apps',
 learn:['JOIN puts tables <i>side by side</i> (more columns). <b>UNION ALL</b> stacks results <i>on top of each other</i> (more rows): one SELECT per source, glued together. Three apps log session minutes, each in its own table (<b>mind</b>, <b>study</b> and Cardio <b>workouts</b>), and stacking turns them into one feed.',"Each SELECT must return the same number of columns, matched by <i>position</i>, not by name; the names come from the first SELECT. Add a literal such as 'MIND' AS app so every row says where it came from. ORDER BY and LIMIT are written once, after the last SELECT, and apply to the whole stack.","Gotcha: plain <b>UNION</b> removes duplicate rows across the whole stack. Stack two 10-minute sessions as ('MIND', 10) and one of them silently disappears. It also has to sort or hash every row to find duplicates, so it is slower. Use UNION ALL unless you actually want de-duplication."],
 ex:R`SELECT time, 'MIND' AS app, practice AS what FROM mind
UNION ALL
SELECT time, 'REWIRE', habit FROM habits
UNION ALL
SELECT time, 'NUTRITION', name FROM meals
ORDER BY time DESC
LIMIT 8;   -- your latest 8 entries from three apps, in one feed`,
 task:"Where do your minutes go across apps? Stack one row per app: <b>app</b> = 'MIND' (every session in <b>mind</b>), 'LEARN' (every session in <b>study</b>) and 'TRAINING' (only <b>workouts</b> with type 'Cardio', the only ones with minutes). Columns: <b>app</b> (those exact labels), <b>sessions</b> (rows), <b>minutes</b> (total minutes, not rounded). Row order free.",
 start:R`SELECT 'MIND' AS app, COUNT(*) AS sessions, SUM(minutes) AS minutes
FROM mind
-- stack LEARN (study) and TRAINING (Cardio workouts) below
`,
 sol:R`SELECT 'MIND' AS app, COUNT(*) AS sessions, SUM(minutes) AS minutes
FROM mind
UNION ALL
SELECT 'LEARN', COUNT(*), SUM(minutes)
FROM study
UNION ALL
SELECT 'TRAINING', COUNT(*), SUM(minutes)
FROM workouts
WHERE type = 'Cardio';`,
 hint:"Three SELECTs with the same three columns in the same order, joined by UNION ALL; the third one needs WHERE type = 'Cardio'."},
{id:'sql18',t:'sql',lv:2,title:'Date math with julianday',
 learn:['Your dates are TEXT, so to subtract them turn them into numbers first: julianday(b) - julianday(a) is the gap in days, with a fraction when there are times. Multiply by 24 for hours or by 1440 for minutes: (julianday(closed) - julianday(opened)) * 1440 is how long a trade was held.',"To move a date, add modifiers: date(day, '+7 days'), date(day, '-1 month'), datetime(closed, '+20 minutes'). They apply left to right: date(day, '-6 days', 'weekday 1') is the Monday of that week. Other databases spell these DATEDIFF, DATE_ADD or + INTERVAL.","Gotchas: subtracting the strings themselves ('2026-10-22' - '2026-10-15') silently gives 0, because SQLite reads each one as the number 2026. A gap is not an inclusive count: the 15th to the 22nd is 7 days apart but covers 8 calendar days, and n dates have n − 1 gaps between them. Dividing by zero returns NULL in SQLite, not an error, so a group with a single date quietly shows a NULL average gap."],
 ex:R`SELECT id, opened, closed, minutes,
       ROUND((julianday(closed) - julianday(opened)) * 1440, 1) AS held_min,
       date(day, '-6 days', 'weekday 1') AS week_start
FROM trades
ORDER BY id DESC
LIMIT 5;   -- your last 5 trades: held_min matches minutes; the Monday of their week`,
 task:'How regular is each technique? For every <b>technique</b> in <b>mind</b> that you used on at least 2 different days: <b>technique</b>, <b>days</b> (number of different days you used it; two sessions on one day count once), <b>span_days</b> (julianday of its last day − julianday of its first day, not rounded), <b>every_days</b> (span_days / (days − 1), the average gap in days between those days, rounded to 1). Row order free.',
 start:R`SELECT technique,
       MIN(day) AS first_day,
       MAX(day) AS last_day
FROM mind
GROUP BY technique;`,
 sol:R`SELECT technique,
       COUNT(DISTINCT day) AS days,
       julianday(MAX(day)) - julianday(MIN(day)) AS span_days,
       ROUND((julianday(MAX(day)) - julianday(MIN(day))) / (COUNT(DISTINCT day) - 1), 1) AS every_days
FROM mind
GROUP BY technique
HAVING COUNT(DISTINCT day) >= 2;`,
 hint:'Span = julianday(MAX(day)) - julianday(MIN(day)). n different days have n - 1 gaps, and HAVING drops the techniques used on a single day.'},
{id:'sql7',t:'sql',lv:3,title:'CTEs & subqueries',
 learn:['A <b>CTE</b> (common table expression) names an in-between result, so a hard question becomes readable steps: WITH daily AS (SELECT …), typical AS (SELECT … FROM daily) SELECT … FROM daily. Commas separate the steps, each step can read the ones above it, and the final SELECT reads them like tables. A CTE lives only for that one statement. A <b>derived table</b>, FROM (SELECT …) AS d, is the same step written inline.','You met subqueries in WHERE … IN (SELECT …) in the IN &amp; EXISTS lesson. A <b>scalar subquery</b> returns a single value and can sit wherever a number can: WHERE minutes &gt; (SELECT AVG(minutes) FROM study). It must return one column; given several rows SQLite quietly uses the first, while Postgres stops with an error. To compare each row with its <i>own</i> group, compute the group figure in a CTE and JOIN it back on the group key, as the example does per track.','The classic two-step is the average of daily totals. Aggregates don’t nest (AVG(SUM(x)) is a “misuse of aggregate” error), and a plain AVG(x) over the raw rows averages <i>entries</i>, not days: three lifts of 2,000 make a 6,000 day, yet their average is 2,000. So total per day in one step, then average those totals in the next. And WHERE can’t test an aggregate of its own query, even by its alias, which is why the comparison runs one level out.'],
 ex:R`WITH per_track AS (              -- step 1: one row per track
  SELECT track, AVG(minutes) AS avg_min
  FROM study
  GROUP BY track
)
SELECT s.day, s.track, s.minutes,
       ROUND(p.avg_min, 1) AS track_avg,
       ROUND((SELECT AVG(minutes) FROM study), 1) AS overall_avg   -- scalar subquery
FROM study s
JOIN per_track p ON p.track = s.track   -- step 2: each session meets its track's average
WHERE s.minutes > p.avg_min
ORDER BY s.day;   -- sessions longer than usual for their track`,
 task:'Your <b>heavy lifting days</b>. A day’s <b>volume</b> is the sum of sets × reps × load over that day’s <b>Weighted</b> rows in <b>workouts</b>. Which days had a volume above the average volume of your lifting days (the days with at least one Weighted row)? Columns: <b>day</b>, <b>volume</b> (not rounded) and <b>avg_volume</b> (that average, the same on every row, rounded to 2). Only the days above the average; row order free.',
 start:R`WITH daily AS (            -- step 1: one row per lifting day
  SELECT day,

  FROM workouts
  WHERE type = 'Weighted'
  GROUP BY day
)
SELECT day, volume
FROM daily
WHERE ;`,
 sol:R`WITH daily AS (
  SELECT day, SUM(sets * reps * load) AS volume
  FROM workouts
  WHERE type = 'Weighted'
  GROUP BY day
)
SELECT day, volume,
       ROUND((SELECT AVG(volume) FROM daily), 2) AS avg_volume
FROM daily
WHERE volume > (SELECT AVG(volume) FROM daily);`,
 hint:'Total each day in a CTE, then compare with (SELECT AVG(volume) FROM that CTE): an AVG over the raw workouts rows averages single entries, not days.'},
{id:'sql8',t:'sql',lv:3,title:'LEFT JOIN & anti-joins',
 learn:['An inner JOIN drops rows that have no partner. <b>LEFT JOIN</b> keeps every row of the left (first) table and fills the right table’s columns with NULL where nothing matches: every study session, with or without a mind session that day. Count matches with COUNT(right.id), which skips those NULLs; COUNT(*) counts the kept row too and says 1 on a day with none. RIGHT JOIN is the mirror image, and FULL JOIN keeps the unmatched rows of both sides.','An <b>anti-join</b> keeps the left rows with <i>no</i> match: LEFT JOIN, then WHERE right.id IS NULL. Test a column that is never NULL in a matched row (the join key or id), not one like weight that can be empty anyway. WHERE NOT EXISTS (SELECT 1 FROM … WHERE …) asks the same question more directly, and as the IN &amp; EXISTS lesson showed it is safer than NOT IN, which returns nothing at all once the subquery holds a NULL.',"Gotcha: where a condition on the right table goes. In <b>ON</b> it decides which rows count as a match; in <b>WHERE</b> it runs after the join and throws away the NULL-filled rows, so LEFT JOIN workouts w ON … WHERE w.type = 'Weighted' is an inner join again. For “days with no Weighted exercise”, put type = 'Weighted' in the ON (or inside the NOT EXISTS) and keep only the IS NULL test in the WHERE."],
 ex:R`SELECT s.day, s.track, s.minutes,
       COUNT(m.id) AS mind_sessions   -- 0 on days without one; COUNT(*) would say 1
FROM study s
LEFT JOIN mind m ON m.day = s.day
GROUP BY s.id, s.day, s.track, s.minutes
ORDER BY s.day;
-- the anti-join, study days with no mind session at all:
--   ... LEFT JOIN mind m ON m.day = s.day WHERE m.id IS NULL
--   or  WHERE NOT EXISTS (SELECT 1 FROM mind m WHERE m.day = s.day)`,
 task:'Your <b>rest days from lifting</b>: every day in <b>checkins</b> on which you logged no <b>Weighted</b> exercise in <b>workouts</b> (Cardio, Stretch and Bodyweight entries don’t count as lifting, so a cardio-only day is a rest day). Columns: <b>day</b>, <b>sleep</b>, <b>energy</b>, one row per check-in day. Row order free.',
 start:R`SELECT c.day, c.sleep, c.energy
FROM checkins c
LEFT JOIN workouts w ON w.day = c.day
WHERE ;`,
 sol:R`SELECT c.day, c.sleep, c.energy
FROM checkins c
LEFT JOIN workouts w
  ON w.day = c.day AND w.type = 'Weighted'
WHERE w.id IS NULL;`,
 hint:"Put type = 'Weighted' in the ON, not the WHERE, and keep the rows where w.id IS NULL (or write WHERE NOT EXISTS (...))."},
{id:'sql19',t:'sql',lv:3,title:'Self-joins & range conditions',
 learn:['A <b>self-join</b> joins a table to itself under two aliases, so rows of the same table can be compared: in FROM trades a JOIN trades b, <b>a</b> is one trade and <b>b</b> another. The ON clause doesn’t have to be an equality. A <b>range condition</b> pairs each row with <i>every</i> row inside a window, so one loss can match two re-entries, or none: something “the next trade” can’t show.',"Build the window with datetime() from the julianday lesson: b.time BETWEEN a.time AND datetime(a.time, '+4 hours') keeps every b in the 4 hours after a, both ends included (BETWEEN means lo &lt;= v AND v &lt;= hi). Text timestamps compare correctly only because they are all 'YYYY-MM-DD HH:MM:SS', as datetime() returns them. Never write a.closed + 60: SQLite reads just the year (2026 + 60 = 2086), compares that as text, and every later trade matches.",'Keep the condition tight: a self-join with a loose ON returns up to n × n rows (150 trades → 22,500 pairs). And make sure a row can’t pair with itself: the BETWEEN above matches b = a too, which is why the example starts at b.time &gt; a.time. A close-to-open window is safe, since a trade opens before it closes. For pairs on the same day, a.id &lt; b.id also stops each pair appearing twice (a,b and b,a).'],
 ex:R`SELECT a.time AS urge, b.time AS came_back, b.event
FROM habits a
JOIN habits b
  ON b.time > a.time
 AND b.time <= datetime(a.time, '+4 hours')
WHERE a.event IN ('resisted', 'slipped')
  AND b.event IN ('resisted', 'slipped');   -- urges that came back within 4 hours`,
 task:'Revenge-trade check: pair every <b>losing</b> trade (pnl &lt; 0) with <i>every</i> trade you opened in the hour after it closed: opened at or after the loss’s <b>closed</b> time, up to and including 60 minutes later. Columns: <b>loss_id</b> (the loss’s id), <b>next_id</b> (the later trade’s id), <b>gap_min</b> = (julianday(later trade’s opened) − julianday(loss’s closed)) × 1440, rounded to 2, and <b>next_pnl</b> (the later trade’s pnl). One row per pair; a loss with no trade in that hour doesn’t appear. Row order free.',
 start:R`SELECT a.id AS loss_id,
       b.id AS next_id,

FROM trades a
JOIN trades b
  ON
WHERE `,
 sol:R`SELECT a.id AS loss_id,
       b.id AS next_id,
       ROUND((julianday(b.opened) - julianday(a.closed)) * 1440, 2) AS gap_min,
       b.pnl AS next_pnl
FROM trades a
JOIN trades b
  ON b.opened BETWEEN a.closed AND datetime(a.closed, '+60 minutes')
WHERE a.pnl < 0;`,
 hint:"Two aliases of trades, joined ON b.opened BETWEEN a.closed AND datetime(a.closed, '+60 minutes'); keep a.pnl < 0."},
{id:'sql9',t:'sql',lv:3,title:'Window functions: RANK',
 learn:['A <b>window function</b> computes across related rows <i>without collapsing them</i>: every row keeps its own columns and gains one more value. OVER (PARTITION BY practice ORDER BY minutes DESC) sets the window. PARTITION BY splits the rows into groups, like GROUP BY but with nothing merged, and the numbering restarts in each; the ORDER BY inside OVER is the order the numbering follows. Leave PARTITION BY out and the whole result is one window.','Three ways to number minutes of 20, 15, 15, 10: <b>ROW_NUMBER</b> gives 1, 2, 3, 4 (always unique; which of two ties comes first is arbitrary unless you add a tie-breaker such as id), <b>RANK</b> gives 1, 2, 2, 4 (ties share a number, then a gap) and <b>DENSE_RANK</b> gives 1, 2, 2, 3 (no gap). So a top 3 kept with RANK can return more than 3 rows when there is a tie for third; ROW_NUMBER returns exactly 3; DENSE_RANK keeps the 3 highest values.','Gotchas: window functions run after WHERE, GROUP BY and HAVING, so WHERE rnk &lt;= 3 in the same SELECT is an error. Rank in a CTE (see CTEs &amp; subqueries) and filter in the outer query. To rank groups, such as how often you ate each dish, count in one step and rank the counted rows in the next. Use DESC so that 1 is the best, and remember the ORDER BY inside OVER doesn’t sort the output: add a final ORDER BY when order matters.'],
 ex:R`SELECT practice, day, minutes,
       ROW_NUMBER() OVER (PARTITION BY practice ORDER BY minutes DESC, id) AS row_num,
       RANK()       OVER (PARTITION BY practice ORDER BY minutes DESC) AS rnk,
       DENSE_RANK() OVER (PARTITION BY practice ORDER BY minutes DESC) AS dense
FROM mind
WHERE practice IN ('Body Scan', 'Breathwork')
ORDER BY practice, row_num;   -- watch the three columns split on tied minutes`,
 task:'Your <b>top 3 dishes of each kind</b>. Count how many times you ate each <b>name</b> per <b>kind</b> in <b>meals</b>, then rank the dishes within their kind by that count, most eaten = 1, using <b>RANK</b> (tied dishes share a rank and the next rank is skipped). Keep the dishes ranked 1 to 3; a tie can bring back more than 3 of a kind. Columns: <b>kind</b>, <b>name</b>, <b>times</b>, <b>rnk</b>. Row order free.',
 start:R`WITH dishes AS (
  SELECT kind, name, COUNT(*) AS times
  FROM meals
  GROUP BY kind, name
)
SELECT kind, name, times,
       RANK() OVER (                ) AS rnk
FROM dishes;`,
 sol:R`WITH dishes AS (
  SELECT kind, name, COUNT(*) AS times
  FROM meals
  GROUP BY kind, name
),
ranked AS (
  SELECT kind, name, times,
         RANK() OVER (PARTITION BY kind ORDER BY times DESC) AS rnk
  FROM dishes
)
SELECT kind, name, times, rnk
FROM ranked
WHERE rnk <= 3;`,
 hint:'RANK() OVER (PARTITION BY kind ORDER BY times DESC) on the counted dishes, inside a CTE; the WHERE rnk <= 3 goes in the outer query.'},
{id:'sql20',t:'sql',lv:3,title:'Window totals: % of total',
 learn:['An aggregate with an empty window, SUM(kcal) OVER (), puts the total of the whole result on every row without collapsing the rows; OVER (PARTITION BY day) puts each group’s own total there instead. Divide a row by it and you have its <b>share of total</b>: the number behind every mix, contribution and Pareto report.','With a GROUP BY, the window runs <i>after</i> the grouping, on the grouped rows, so you aggregate the aggregate: per meal <b>kind</b>, SUM(kcal) * 100.0 / SUM(SUM(kcal)) OVER () is each kind’s share of all your calories, and SUM(COUNT(*)) OVER () is the total number of meals. Plain COUNT(*) OVER () there counts the <i>groups</i> (2 kinds), not your meals.','Gotchas: COUNT(*) is an integer, so COUNT(*) * 100 / … truncates (7 × 100 / 48 = 14, not 14.6); write 100.0. ORDER BY inside OVER turns the total into a running total (a later lesson), so leave it out. And WHERE runs first: a filter shrinks the denominator, so the shares then add up to 100% of the filtered rows only.'],
 ex:R`SELECT day, name, kcal,
       SUM(kcal) OVER (PARTITION BY day) AS day_kcal,
       ROUND(kcal * 100.0 / SUM(kcal) OVER (PARTITION BY day), 1) AS pct_of_day
FROM meals
ORDER BY day, id;   -- each meal's share of that day's calories`,
 task:'Where does your mind time go? Per <b>practice</b> in <b>mind</b>: <b>sessions</b> (count), <b>minutes</b> (total, not rounded), <b>pct_sessions</b> (that practice’s share of all your mind sessions × 100) and <b>pct_minutes</b> (its share of all your mind minutes × 100), both shares rounded to 1. Columns in this order: practice, sessions, minutes, pct_sessions, pct_minutes. Row order free.',
 start:R`SELECT practice,
       COUNT(*) AS sessions,
       SUM(minutes) AS minutes,

FROM mind
GROUP BY practice;`,
 sol:R`SELECT practice,
       COUNT(*) AS sessions,
       SUM(minutes) AS minutes,
       ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 1) AS pct_sessions,
       ROUND(SUM(minutes) * 100.0 / SUM(SUM(minutes)) OVER (), 1) AS pct_minutes
FROM mind
GROUP BY practice;`,
 hint:'Nest the aggregate inside the window: COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), and the same move for SUM(minutes).'},
{id:'sql21',t:'sql',lv:3,title:'LAG & LEAD — the previous row',
 learn:['LAG(pnl) OVER (ORDER BY id) returns pnl from the <i>previous</i> row in that order; LEAD returns the next one. LAG(pnl, 2, 0) looks two rows back and gives 0 instead of NULL when there is no such row. That’s how you get change vs the previous period, time since the last event, or what happened right after X.','Add <b>PARTITION BY</b> so the sequence restarts per group: without PARTITION BY day, yesterday’s last trade becomes the “previous” of today’s first. The first row of each partition has nothing before it and gets NULL; NULL &gt; 0 isn’t true, so a CASE quietly sends that row to its ELSE. Filter it out first. A window function can’t go in the WHERE of its own SELECT: compute it in a CTE, then filter outside.','LAG sees exactly one neighbour, unlike the range self-join, which finds every row in a window. And “previous row” isn’t “previous calendar day”: if you didn’t trade on Tuesday, the row before Wednesday’s is Monday’s.'],
 ex:R`SELECT track, day, minutes,
       LAG(minutes) OVER (PARTITION BY track ORDER BY time) AS prev_minutes,
       minutes - LAG(minutes) OVER (PARTITION BY track ORDER BY time) AS change,
       LEAD(day) OVER (PARTITION BY track ORDER BY time) AS next_day
FROM study
ORDER BY track, time;   -- each study session vs your last one on that track`,
 task:'Does a loss tilt you? For every trade <b>except the first of its day</b>, look at the previous trade <b>on the same day</b> (by id) and label the trade <b>after win</b> (previous pnl &gt; 0), <b>after loss</b> (previous pnl &lt; 0) or <b>after flat</b> (previous pnl = 0). Per label: <b>after</b> (the label, written exactly as above), <b>trades</b> (count), <b>wins</b> (trades with pnl &gt; 0) and <b>avg_pnl</b> (average pnl, rounded to 2). Row order free.',
 start:R`WITH t AS (
  SELECT id, day, pnl,
         LAG(pnl) OVER (                ) AS prev_pnl
  FROM trades
)
SELECT CASE WHEN     THEN 'after win'
            WHEN     THEN 'after loss'
            ELSE 'after flat' END AS after,

FROM t
GROUP BY after;`,
 sol:R`WITH t AS (
  SELECT id, day, pnl,
         LAG(pnl) OVER (PARTITION BY day ORDER BY id) AS prev_pnl
  FROM trades
)
SELECT CASE WHEN prev_pnl > 0 THEN 'after win'
            WHEN prev_pnl < 0 THEN 'after loss'
            ELSE 'after flat' END AS after,
       COUNT(*) AS trades,
       SUM(CASE WHEN pnl > 0 THEN 1 ELSE 0 END) AS wins,
       ROUND(AVG(pnl), 2) AS avg_pnl
FROM t
WHERE prev_pnl IS NOT NULL
GROUP BY after;`,
 hint:'In the CTE: LAG(pnl) OVER (PARTITION BY day ORDER BY id). Outside: drop the rows where it is NULL, then group by the CASE label.'},
{id:'sql10',t:'sql',lv:4,title:'Running totals by week',ordered:true,
 learn:["Put ORDER BY inside OVER and an aggregate becomes <b>cumulative</b>: SUM(pnl) OVER (ORDER BY week) adds every row from the first to the current one (a running total, your equity curve), MAX(x) OVER (ORDER BY …) is the highest value so far (a peak, a personal best), and PARTITION BY restarts them per group. Bucket first: the Monday from the julianday lesson, date(day, '-6 days', 'weekday 1'), sorts across years, while a year-week label, strftime('%Y-%W', day), splits the New Year week in two ('2025-52', '2026-00').",'Gotcha: rows that tie on the window’s ORDER BY are <i>peers</i>, and each gets the total through the last of them. SUM(pnl) OVER (ORDER BY day) on raw <b>trades</b> gives every trade of a day the end-of-day total, not a per-trade curve. Aggregate to one row per week first, or end the ORDER BY with a unique column such as id for a per-row curve. Moving averages: window frames explains the default frame behind this.','Window functions don’t nest: MAX(SUM(pnl) OVER (ORDER BY week)) OVER (ORDER BY week) is an error. Build the curve in steps, one CTE each: weekly totals, then the running total, then the running MAX of that running total. The <b>drawdown</b> is equity − peak: 0 at a new high, negative below it, and its lowest value is the max drawdown, the deepest fall from a peak, which traders size their risk by.'],
 ex:R`SELECT day, sleep, weight,
       SUM(sleep - 8) OVER (ORDER BY day) AS sleep_debt,   -- hours short of 8, so far
       SUM(sleep - 8) OVER (PARTITION BY substr(day, 1, 7)
                            ORDER BY day) AS debt_this_month,   -- restarts each month
       MIN(weight) OVER (ORDER BY day) AS lowest_so_far      -- skips days with no weight
FROM checkins
ORDER BY day;`,
 task:"Your <b>weekly equity curve and drawdown</b>. Bucket <b>trades</b> by week: the Monday of the trade’s <b>day</b>, as 'YYYY-MM-DD', from date(day, '-6 days', 'weekday 1'). One row per week you traded, oldest week first. Columns: <b>week</b>; <b>pnl</b> (that week’s total); <b>equity</b> (running total of the weekly pnl, this week included); <b>peak</b> (the highest equity of this and all earlier weeks: it starts at your first week’s equity, not at 0); <b>drawdown</b> (equity − peak: 0 at a new high, negative below it). Money rounded to 2.",
 start:R`WITH w AS (
  SELECT date(day, '-6 days', 'weekday 1') AS week,
         SUM(pnl) AS pnl
  FROM trades
  GROUP BY week
),
e AS (
  SELECT week, pnl,
                                   AS equity
  FROM w
)
SELECT week, ROUND(pnl, 2) AS pnl, ROUND(equity, 2) AS equity
FROM e
ORDER BY week;`,
 sol:R`WITH w AS (
  SELECT date(day, '-6 days', 'weekday 1') AS week,
         SUM(pnl) AS pnl
  FROM trades
  GROUP BY week
),
e AS (
  SELECT week, pnl,
         SUM(pnl) OVER (ORDER BY week) AS equity
  FROM w
),
p AS (
  SELECT week, pnl, equity,
         MAX(equity) OVER (ORDER BY week) AS peak
  FROM e
)
SELECT week,
       ROUND(pnl, 2) AS pnl,
       ROUND(equity, 2) AS equity,
       ROUND(peak, 2) AS peak,
       ROUND(equity - peak, 2) AS drawdown
FROM p
ORDER BY week;`,
 hint:'Window functions don’t nest: compute equity = SUM(pnl) OVER (ORDER BY week) in one CTE, then take the running MAX of equity as the peak in the next step.'},
{id:'sql22',t:'sql',lv:4,title:'Moving averages: window frames',ordered:true,
 learn:['A <b>window frame</b> says which rows around the current one an aggregate sees. AVG(x) OVER (ORDER BY day <b>ROWS BETWEEN 6 PRECEDING AND CURRENT ROW</b>) averages this row and the 6 before it: a 7-row moving average. The first rows simply see fewer rows (1, 2, … 6), so they average what exists so far. Count the current row: 6 PRECEDING plus the current row is 7 rows, not 6.','Gotcha: with ORDER BY and <i>no</i> frame, the default is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW: the running figure from the running-totals lesson, not a moving one. And aggregate to one row per day in a CTE first; a frame over raw <b>meals</b> counts meals, not days.',"<b>ROWS</b> counts rows, not dates: a day you logged nothing isn’t a 0, it simply isn’t there. For a calendar window, order by a number and use <b>RANGE</b>: ORDER BY julianday(day) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW covers the last 7 calendar days, however many rows fall in them. (Postgres: ORDER BY day RANGE BETWEEN INTERVAL '6 days' PRECEDING AND CURRENT ROW.)"],
 ex:R`SELECT day, minutes,
       ROUND(AVG(minutes) OVER (ORDER BY time
             ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 1) AS avg_last_3_sessions,
       SUM(minutes) OVER (ORDER BY julianday(day)
             RANGE BETWEEN 6 PRECEDING AND CURRENT ROW) AS min_last_7_days
FROM study
ORDER BY time;   -- 3 sessions vs 7 calendar days: compare them after a gap`,
 task:'Smooth out your calorie log: a <b>5-day moving average</b> of your daily <b>kcal</b> from <b>meals</b>, over the days you logged at least one meal. Columns: <b>day</b>, <b>kcal</b> (that day’s total) and <b>ma5</b> (the average of that day’s total and the totals of the 4 logged days before it; your first 4 days average only the days that exist so far), both rounded to 2, ordered by day.',
 start:R`WITH d AS (
  SELECT day, SUM(kcal) AS kcal
  FROM meals
  GROUP BY day
)
SELECT day, ROUND(kcal, 2) AS kcal,
       ROUND(AVG(kcal) OVER (ORDER BY day                ), 2) AS ma5
FROM d
ORDER BY day;`,
 sol:R`WITH d AS (
  SELECT day, SUM(kcal) AS kcal
  FROM meals
  GROUP BY day
)
SELECT day, ROUND(kcal, 2) AS kcal,
       ROUND(AVG(kcal) OVER (ORDER BY day
             ROWS BETWEEN 4 PRECEDING AND CURRENT ROW), 2) AS ma5
FROM d
ORDER BY day;`,
 hint:'Put a frame after ORDER BY day inside OVER: ROWS BETWEEN n PRECEDING AND CURRENT ROW, and remember the current day is one of the 5.'},
{id:'sql11',t:'sql',lv:4,title:'Latest record per key',
 learn:['Keeping only the newest row per key (last session, current weight, latest status) is one of the most common jobs in data work. Number each key’s rows newest first in a CTE, ROW_NUMBER() OVER (PARTITION BY exercise ORDER BY time DESC, id DESC) AS rn, and keep rn = 1 outside. End the ORDER BY with a unique tie-breaker (id): two rows at the same time otherwise come back in either order, and RANK would keep both. Snowflake, BigQuery and DuckDB filter in place with QUALIFY rn = 1.','Shortcuts that break: SELECT exercise, MAX(time), load … GROUP BY exercise runs in SQLite, which takes load from the max row by a documented quirk; Postgres rejects it, and with both MIN and MAX in the query the bare column may come from either row. Joining back on MAX(time) returns two rows when two tie. FIRST_VALUE(x) OVER (PARTITION BY k ORDER BY t) is safe, but LAST_VALUE with the default frame (Moving averages: window frames) stops at the current row and returns its own value, unless you give it ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING.','The latest <i>record</i> isn’t always the latest <i>value</i>: your last check-in of a week may have no weight. Filter the NULLs in the CTE (WHERE weight IS NOT NULL) before numbering, so the newest weigh-in wins; filtering after rn = 1 throws the week away instead of falling back to the day before. For the first and the last of each key in one pass, pair the newest-first ROW_NUMBER with FIRST_VALUE(weight) ordered oldest first, or number twice.'],
 ex:R`WITH ranked AS (
  SELECT exercise, day, load, reps,
         ROW_NUMBER() OVER (PARTITION BY exercise
                            ORDER BY time DESC, id DESC) AS rn
  FROM workouts
  WHERE type = 'Weighted'
)
SELECT exercise, day, load, reps
FROM ranked
WHERE rn = 1
ORDER BY exercise;   -- your current working weight on every lift`,
 task:"Your <b>weekly weigh-ins</b>. From <b>checkins</b>, take only the days that have a <b>weight</b> and bucket them by week: the Monday of the day, as 'YYYY-MM-DD', from date(day, '-6 days', 'weekday 1'). For every week with at least one weigh-in: <b>week</b>; <b>day</b> (the week’s latest weigh-in); <b>weight</b> (that day’s weight); <b>change</b> (that weight minus the week’s first weigh-in, rounded to 2, so 0 when the week has only one). Row order free.",
 start:R`WITH w AS (
  SELECT date(day, '-6 days', 'weekday 1') AS week, day, weight,
         ROW_NUMBER() OVER (                ) AS rn
  FROM checkins
)
SELECT week, day, weight
FROM w
WHERE rn = 1;`,
 sol:R`WITH weighed AS (                -- weigh-ins only, before any numbering
  SELECT date(day, '-6 days', 'weekday 1') AS week, day, weight
  FROM checkins
  WHERE weight IS NOT NULL
),
ranked AS (
  SELECT week, day, weight,
         ROW_NUMBER() OVER (PARTITION BY week ORDER BY day DESC) AS rn,
         FIRST_VALUE(weight) OVER (PARTITION BY week ORDER BY day) AS first_weight
  FROM weighed
)
SELECT week, day, weight,
       ROUND(weight - first_weight, 2) AS change
FROM ranked
WHERE rn = 1;`,
 hint:'Drop the NULL weights in the first CTE; then ROW_NUMBER() OVER (PARTITION BY week ORDER BY day DESC) = 1 is the latest, and FIRST_VALUE(weight) ordered by day the first.'},
{id:'sql23',t:'sql',lv:4,title:'Median & percentiles',
 learn:['The <b>median</b> is the middle value once the values are sorted, or the average of the two middle values when the count is even. A few very long holds pull the mean up but barely move the median, so it describes skewed data honestly. Postgres and Snowflake have PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x), Snowflake and Oracle also MEDIAN(x); standard SQLite has neither.','Build it from window functions. In a CTE, number the rows with ROW_NUMBER() OVER (PARTITION BY g ORDER BY x) AS rn and count them with COUNT(*) OVER (PARTITION BY g) AS n. Then average x where <b>rn IN ((n + 1) / 2, (n + 2) / 2)</b>: integer division picks the one middle row when n is odd and the two middle rows when n is even. (MySQL and Snowflake divide to decimals: wrap each in FLOOR there.)','Gotchas: rn = (n + 1) / 2 alone gives the lower middle for even counts, so test both. A WHERE on rn drops all the other rows, so a COUNT(*) or AVG(x) in that query sees only the middle ones: compute those first, or use AVG(CASE WHEN … THEN x END). NTILE(4) OVER (ORDER BY x) cuts the sorted rows into 4 near-equal groups (quartiles); equal values can straddle two. sql.js adds a non-standard median(): don’t count on it elsewhere.'],
 ex:R`SELECT quartile, COUNT(*) AS sessions,
       MIN(minutes) AS from_min, MAX(minutes) AS to_min
FROM (
  SELECT minutes, NTILE(4) OVER (ORDER BY minutes, id) AS quartile
  FROM mind
)
GROUP BY quartile
ORDER BY quartile;   -- how long your mind sessions run, in quarters`,
 task:'How long do you really hold a trade? Per <b>contract</b>: <b>trades</b> (count), <b>avg_min</b> (mean of <b>minutes</b>, rounded to 2) and <b>median_min</b> (median of minutes, rounded to 2: the middle value once that contract’s trades are sorted by minutes, or the average of the two middle values when the count is even). Row order free.',
 start:R`WITH r AS (
  SELECT contract, minutes,
         ROW_NUMBER() OVER (                ) AS rn,
         COUNT(*) OVER (PARTITION BY contract) AS n
  FROM trades
)
SELECT contract,
FROM r
GROUP BY contract;`,
 sol:R`WITH r AS (
  SELECT contract, minutes,
         ROW_NUMBER() OVER (PARTITION BY contract ORDER BY minutes) AS rn,
         COUNT(*) OVER (PARTITION BY contract) AS n
  FROM trades
)
SELECT contract,
       COUNT(*) AS trades,
       ROUND(AVG(minutes), 2) AS avg_min,
       ROUND(AVG(CASE WHEN rn IN ((n + 1) / 2, (n + 2) / 2) THEN minutes END), 2) AS median_min
FROM r
GROUP BY contract;`,
 hint:'Partition both windows by contract and number by minutes; AVG(CASE WHEN rn IN ((n + 1) / 2, (n + 2) / 2) THEN minutes END) then sits next to a plain AVG(minutes).'},
{id:'sql12',t:'sql',lv:4,title:'Cohort retention by week',
 learn:['A <b>cohort analysis</b> groups members by when they started, then follows each group over time. Here the members are your mind techniques: a technique joins the cohort of the week you first used it, and in each later week it is either used again (retained) or not. It is the table behind customer retention, feature adoption and repeat purchases, built in steps: first-seen per member, activity per member and week, then one count per cohort and week number.',"In CTEs: MIN(day) per technique is its start, and date(MIN(day), '-6 days', 'weekday 1') its cohort Monday. SELECT DISTINCT technique with the Monday of each session gives one row per technique per active week. Join the two on technique, and week_no = (julianday(week) − julianday(cohort)) / 7 is 0 for the first week, 1 for the next, and so on: Mondays are exactly 7 days apart. Then count per cohort and week_no and divide by the cohort’s size.",'Gotchas: count members, not rows: two sessions of one technique in a week are one retained technique, so de-duplicate first or use COUNT(DISTINCT technique). Divide by the size of the cohort, not by how many were active that week or the week before, and divide as decimals (see Window totals: % of total). A cell where nothing came back has no row at all, not a 0. And young cohorts haven’t lived long enough for late weeks: compare cohorts at the same week_no.'],
 ex:R`WITH cohort AS (                  -- one row per exercise: the Monday of its first week
  SELECT exercise, date(MIN(day), '-6 days', 'weekday 1') AS cohort
  FROM workouts
  GROUP BY exercise
),
kept AS (                         -- 1 if you logged it again in any later week
                                  -- (EXISTS is 1 or 0 in SQLite; Postgres: CASE WHEN EXISTS ... THEN 1 ELSE 0 END)
  SELECT c.cohort, c.exercise,
         EXISTS (SELECT 1 FROM workouts w
                 WHERE w.exercise = c.exercise
                   AND w.day >= date(c.cohort, '+7 days')) AS came_back
  FROM cohort c
)
SELECT cohort, COUNT(*) AS new_exercises,
       SUM(came_back) AS came_back,
       ROUND(AVG(came_back), 2) AS rate
FROM kept
GROUP BY cohort
ORDER BY cohort;   -- of the exercises you started each week, how many you kept`,
 task:"Do the techniques you try <b>stick</b>? In <b>mind</b>, each <b>technique</b> belongs to the cohort of the week you first used it: <b>cohort</b> = the Monday of its first day, as 'YYYY-MM-DD', from date(day, '-6 days', 'weekday 1'). For every cohort and every week in which you used at least one of its techniques: <b>cohort</b>; <b>week_no</b> (whole weeks from the cohort’s Monday to that week’s Monday: 0, 1, 2…); <b>techniques</b> (how many different techniques of that cohort you used that week); <b>cohort_size</b> (techniques in the cohort); <b>retention</b> (techniques ÷ cohort_size as a fraction, rounded to 2: 0.5 is half the cohort). A week with none of a cohort’s techniques has no row for it, so week_no can skip numbers. Row order free.",
 start:R`WITH cohorts AS (         -- one row per technique: its cohort Monday
  SELECT technique,

  FROM mind
  GROUP BY technique
),
active AS (               -- one row per technique per week you used it
  SELECT DISTINCT technique,
         date(day, '-6 days', 'weekday 1') AS week
  FROM mind
)
SELECT
FROM cohorts c
JOIN active a ON a.technique = c.technique
GROUP BY ;`,
 sol:R`WITH cohorts AS (
  SELECT technique,
         date(MIN(day), '-6 days', 'weekday 1') AS cohort
  FROM mind
  GROUP BY technique
),
sized AS (
  SELECT technique, cohort,
         COUNT(*) OVER (PARTITION BY cohort) AS cohort_size
  FROM cohorts
),
active AS (
  SELECT DISTINCT technique,
         date(day, '-6 days', 'weekday 1') AS week
  FROM mind
)
SELECT s.cohort,
       CAST((julianday(a.week) - julianday(s.cohort)) / 7 AS INTEGER) AS week_no,
       COUNT(*) AS techniques,
       s.cohort_size,
       ROUND(COUNT(*) * 1.0 / s.cohort_size, 2) AS retention
FROM sized s
JOIN active a ON a.technique = s.technique
GROUP BY s.cohort, week_no, s.cohort_size;`,
 hint:'Add a step that reads the one-row-per-technique CTE and puts COUNT(*) OVER (PARTITION BY cohort) on each row as cohort_size; after the join, GROUP BY cohort and week_no and divide with * 1.0.'},
{id:'sql24',t:'sql',lv:4,title:'Gaps & islands: streaks',
 learn:['A streak is an <b>island</b> of consecutive days; the missing days between streaks are <b>gaps</b>. The trick: number the days in order and subtract. <b>julianday(day) - ROW_NUMBER() OVER (ORDER BY day)</b> stays the same while the days are consecutive (both go up by 1) and jumps after every gap. GROUP BY that key and take MIN(day), MAX(day) and COUNT(*) per streak.',"Gotchas: it needs exactly one row per day. With two sessions on one day the numbering runs ahead of the calendar and the keys go wrong (streaks split and merge), so GROUP BY day in a CTE first, or use DENSE_RANK, which gives same-day rows the same number. Subtract from julianday(day): '2026-09-03' - 1 is 2025, because SQLite reads the text as the number 2026.",'Another way: flag a day whose gap to the previous one (LAG) is more than 1 day, and a running SUM of the flags numbers the streaks. For runs of rows rather than days (winning trades in a row), subtract two ROW_NUMBERs: one over all rows, one per state.'],
 ex:R`SELECT MIN(day) AS first_day, MAX(day) AS last_day, COUNT(*) AS days
FROM (
  SELECT day, julianday(day) - ROW_NUMBER() OVER (ORDER BY day) AS grp
  FROM checkins            -- one row per day already
)
GROUP BY grp
ORDER BY first_day;   -- your check-in streaks`,
 task:'Your <b>MIND streaks</b>: every run of consecutive calendar days with at least one session in <b>mind</b> (a day without a session ends the streak; a single day counts as a streak of 1). One row per streak: <b>start_day</b>, <b>end_day</b>, <b>days</b> (calendar days in the streak) and <b>sessions</b> (mind sessions logged in it). Some days have more than one session. Row order free.',
 start:R`WITH d AS (            -- one row per day, with its session count
  SELECT
  FROM mind
),
g AS (                 -- the same key for consecutive days
  SELECT day, sessions,
                       AS grp
  FROM d
)
SELECT
FROM g
GROUP BY grp;`,
 sol:R`WITH d AS (
  SELECT day, COUNT(*) AS sessions
  FROM mind
  GROUP BY day
),
g AS (
  SELECT day, sessions,
         julianday(day) - ROW_NUMBER() OVER (ORDER BY day) AS grp
  FROM d
)
SELECT MIN(day) AS start_day, MAX(day) AS end_day,
       COUNT(*) AS days, SUM(sessions) AS sessions
FROM g
GROUP BY grp;`,
 hint:'On one row per day, julianday(day) - ROW_NUMBER() OVER (ORDER BY day) is the same for every day of a streak: GROUP BY it.'},

{id:'py1',t:'py',lv:1,title:'Filtering a DataFrame',
 learn:['Every app log is preloaded as a pandas <b>DataFrame</b>: <b>trades</b>, <b>workouts</b>, <b>mind</b>, <b>meals</b>, <b>habits</b>, <b>checkins</b>, <b>study</b>, with <code>pd</code> and <code>np</code> imported; your answer is whatever you assign to <b>result</b>. A comparison such as <code>checkins["energy"] &lt;= 2</code> gives True or False for every row (a <b>mask</b>), and <code>checkins[mask]</code> keeps the True rows. A list inside the brackets picks columns: <code>df[["day", "energy"]]</code>.','Combine masks with <code>&amp;</code> (and) and <code>|</code> (or), never Python&rsquo;s <code>and</code> / <code>or</code>, which raise <i>The truth value of a Series is ambiguous</i>. Put every comparison in its own parentheses: <code>&amp;</code> binds tighter than <code>&lt;=</code>, so <code>df["energy"] &lt;= 2 &amp; df["sleep"] &lt; 6.5</code> fails with a TypeError. When you mix the two, bracket the OR part: <code>a &amp; (b | c)</code> is not <code>(a &amp; b) | c</code>.','Gotchas: text matches are exact and case-sensitive, so <code>trades["side"] == "short"</code> finds nothing. <b>day</b> is YYYY-MM-DD text, which compares correctly as text: <code>trades["day"] &gt;= "2026-10-01"</code> keeps October onwards. One name in single brackets, <code>df["day"]</code>, is one column (a Series), not a table. And the kept rows keep their original row numbers (the index), gaps and all; that is harmless.'],
 ex:R`# losing NQ or ES trades: the OR pair sits in its own brackets
losers = trades[(trades["pnl"] < 0) & ((trades["contract"] == "NQZ6") | (trades["contract"] == "ESZ6"))]
print(losers[["day", "contract", "side", "pnl"]].head())
# without them & runs first: losing NQ trades, plus every ES trade, winners included
loose = trades[(trades["pnl"] < 0) & (trades["contract"] == "NQZ6") | (trades["contract"] == "ESZ6")]
print(len(losers), "losing NQ/ES trades |", len(loose), "rows without the brackets")
october = trades[trades["day"] >= "2026-10-01"]   # YYYY-MM-DD text compares as dates
print(len(october), "trades since 1 October")`,
 task:'Rough mornings: which check-ins had low energy after a bad night? Keep the <b>checkins</b> rows with <b>energy</b> 2 or lower <i>and</i> either <b>sleep</b> under 6.5 hours or <b>quality</b> 2 or lower (exactly 6.5 hours is not short). Columns: <b>day</b>, <b>sleep</b>, <b>quality</b>, <b>energy</b>, as logged.',
 start:R`low = checkins["energy"] <= 2
bad_night =
result = `,
 sol:R`low = checkins["energy"] <= 2
bad_night = (checkins["sleep"] < 6.5) | (checkins["quality"] <= 2)
result = checkins[low & bad_night][["day", "sleep", "quality", "energy"]]`,
 hint:'Each comparison in its own brackets and the OR pair in one more: (energy <= 2) & ((sleep < 6.5) | (quality <= 2)); then pick the four columns with a list.'},
{id:'py2',t:'py',lv:1,title:'Sorting & head',ordered:true,
 learn:['<code>sort_values("minutes")</code> sorts the rows, smallest first, and <code>ascending=False</code> flips it. <code>head(n)</code> keeps the first n rows (<code>tail(n)</code> the last), so sort, then head is a top n. Chain the steps left to right and assign the result: sort_values returns a new, sorted frame and leaves the original as it was. <code>nlargest(5, "minutes")</code> is a shortcut for a top 5 on one column.','Sort on a list of columns to rank by the first and break its ties with the next, each with its own direction: <code>meals.sort_values(["protein", "kcal"], ascending=[False, True])</code> is most protein first, then the fewest calories. Without a tie-breaker, rows with equal values come out in an order you can&rsquo;t rely on, so a top 5 that cuts through a tie can pick either row. End the list with a unique column such as <b>id</b>.','Gotchas: missing values go last whichever way you sort (<code>na_position="first"</code> moves them up), so the 5 lightest <b>workouts</b> by <b>load</b> are real loads, never the rows without one. A single <code>ascending=False</code> applies to every column in the list. Pick the output columns after sorting, or keep the sort columns in your selection: once <b>id</b> is gone you can&rsquo;t sort by it.'],
 ex:R`# best trades first; among equal pnl the quickest (fewest minutes), then the lowest id
best = trades.sort_values(["pnl", "minutes", "id"], ascending=[False, True, True])
print(best.head(5)[["day", "contract", "pnl", "minutes"]])
print(meals.nlargest(3, "protein")[["day", "name", "protein"]])
# NaN sorts last in both directions
up = workouts.sort_values("load")["load"]
down = workouts.sort_values("load", ascending=False)["load"]
print("lightest:", up.head(2).tolist(), "| last rows:", up.tail(2).tolist())
print("heaviest:", down.head(2).tolist(), "| last rows:", down.tail(2).tolist())`,
 task:'Your most productive study sessions. Rank the <b>study</b> sessions by <b>lessons</b>, most first; among equal lessons, the shorter session (fewer <b>minutes</b>) first; still tied, the lower <b>id</b> first. Keep the top 5, in that order. Columns: <b>day</b>, <b>track</b>, <b>lessons</b>, <b>minutes</b>.',
 start:R`result = study.sort_values(`,
 sol:R`ranked = study.sort_values(["lessons", "minutes", "id"], ascending=[False, True, True])
result = ranked.head(5)[["day", "track", "lessons", "minutes"]]`,
 hint:'Sort on a list of three columns with one direction each (ascending=[False, True, True]), then head(5) and the four columns.'},
{id:'py12',t:'py',lv:1,title:'New columns: vectorized math',
 learn:['df["new"] = expression builds a whole column in one go: trades["gross"] = trades["pnl"] + trades["fees"] adds the fees back on every row, with no loop. That is <b>vectorized</b> math, and + - * / work the same way between two columns or with a number. df.assign(gross=...) builds the same column but returns a new frame and leaves df untouched, so it fits in a chain.','A comparison is a vectorized column too: trades["pnl"] &gt; 0 is True or False for every row. Use it as a filter mask, df[mask], or summarise it: .sum() counts the Trues and .mean() gives the rate. Keep True/False columns as helpers; the answers you hand in are numbers or text.','Gotchas: NaN spreads. Arithmetic with NaN gives NaN, and a comparison with NaN is False (only != is True), so a <b>mind</b> session with a missing mood gets a NaN difference and silently drops out of any &gt;= filter on it. And before adding a column to a filtered slice (w = workouts[...]), take .copy(): otherwise pandas warns (SettingWithCopyWarning) and you can&rsquo;t be sure which frame you changed.'],
 ex:R`w = workouts.copy()
w["volume"] = w["sets"] * w["reps"] * w["load"]   # NaN where there is no load
print(w[["exercise", "type", "volume"]].head(7))
win = trades["pnl"] > 0                            # True/False for every trade
print("wins:", win.sum(), "of", len(win), "| win rate:", round(win.mean(), 3))`,

{id:'py3',t:'py',lv:1,title:'groupby basics',
 learn:['<code>groupby</code> splits the rows into groups by a key, aggregates each group and returns one row per group: SQL&rsquo;s GROUP BY. <code>study.groupby("track")["minutes"].sum()</code> totals the minutes per track. Named aggregation builds several columns at once, each written <code>new_name=("column", "function")</code>: <code>.agg(sessions=("id", "size"), minutes=("minutes", "sum"))</code>. Functions include "size" (rows), "sum", "mean", "min" and "max".','The key comes back as the <b>index</b>, not a column: <code>groupby("track", as_index=False)</code>, or a final <code>.reset_index()</code>, keeps it as a column. Groups come out sorted by key. A True/False helper column aggregates too: as in New columns: vectorized math, its <code>"mean"</code> is the share of True rows, so <code>long_share=("long", "mean")</code> on a long-session flag is the share of long sessions. <code>.round(2)</code> at the end rounds every number column.','Gotchas: aggregate only the columns you mean. <code>trades.groupby("side").sum()</code> adds up every column, ids and entry prices included, and glues the text columns together, while <code>.mean()</code> on a frame with text columns raises a TypeError. Rows whose key is missing are left out of the groups unless you pass <code>dropna=False</code>. And a mean is per row: <b>pnl</b> averaged per trade, not per day.'],
 ex:R`print(meals.groupby("kind")["kcal"].sum())             # a Series: kind is the index

    meals=("id", "size"), kcal=("kcal", "sum"), avg_protein=("protein", "mean"))
print(per_kind.round(1))
s = study.assign(long=study["minutes"] >= 30)            # True/False helper column
print(s.groupby("track", as_index=False).agg(sessions=("id", "size"), long_share=("long", "mean")).round(2))`,

{id:'py13',t:'py',lv:1,title:'value_counts & nunique',
 learn:['s.value_counts() counts how often each distinct value occurs, most frequent first: meals["kind"].value_counts() is bowls vs snacks. value_counts(normalize=True) gives shares from 0 to 1 instead (multiply by 100 for %). s.nunique() counts the distinct values, like COUNT(DISTINCT ...) in SQL: workouts["day"].nunique() is how many days you trained.','nunique works per group as well: workouts.groupby("exercise")["day"].nunique() is the number of different days you did each exercise, and ("day", "nunique") does the same inside named aggregation. size counts rows, nunique counts different values: two shakes on one day are 2 rows but 1 day.','Gotchas: the result is a <b>Series</b> indexed by the values and named <i>count</i> (or <i>proportion</i> with normalize=True). reset_index(name="n") turns it into two columns, the value and n; add rename_axis("new_name") first if the index has no name. Missing values are left out unless you pass dropna=False, so the shares are shares of the non-missing rows.'],
 ex:R`print(workouts["type"].value_counts())                         # rows per type, most frequent first
print(workouts["type"].value_counts(normalize=True).round(3))  # shares from 0 to 1
print("training days:", workouts["day"].nunique())
days = workouts.groupby("exercise")["day"].nunique()           # distinct days per exercise
print(days.reset_index(name="days").head())`,
 task:'Your go-to foods. For each meal <b>name</b> in <b>meals</b>: <b>n</b> = how many times you logged it, and <b>pct</b> = its share of all meals logged, in % (0 to 100), rounded to 1. Columns: <b>name</b>, <b>n</b>, <b>pct</b>.',
 start:R`counts = meals["name"].value_counts()
result = `,
 sol:R`counts = meals["name"].value_counts().reset_index(name="n")
counts["pct"] = (counts["n"] * 100 / counts["n"].sum()).round(1)
result = counts`,
 hint:'reset_index(name="n") turns value_counts() into columns; pct is n * 100 divided by the total of n, rounded to 1.'},
{id:'py14',t:'py',lv:1,title:'Missing values: isna & count',
 learn:['NaN marks a value that was never recorded: an unrated session has no <b>depth</b>, a skipped weigh-in has no <b>weight</b>. s.isna() (or notna()) is True/False per row, so s.isna().sum() counts the gaps and df.isna().sum() counts them for every column. NaN == NaN is False, so never test with == np.nan or == None: that finds nothing.','Aggregates treat NaN differently: <b>size</b> counts rows, <b>count</b> counts non-missing values, and sum and mean skip NaN, so a mean is the average of the values that exist. A group with no values at all gets mean NaN, which is honest: there is nothing to average. Its sum, though, is 0.','Handle gaps on purpose: dropna(subset=["depth"]) drops those rows and fillna(value) fills them. Filling with 0 before a mean is the classic bug: every missing value counts as a 0 and drags the average down. And value_counts skips NaN unless you pass dropna=False.'],
 ex:R`print(checkins.isna().sum())                        # gaps per column
w = checkins["weight"]
print("days:", w.size, "| weigh-ins:", w.count(), "| skipped:", w.isna().sum())
print("found with == np.nan:", (w == np.nan).sum())  # always 0
print("mean:", round(w.mean(), 2), "| after fillna(0):", round(w.fillna(0).mean(), 2))
print(workouts.groupby("type").agg(rows=("id", "size"), timed=("minutes", "count"), avg_min=("minutes", "mean")).round(1))`,
 task:'A missing-data audit of your <b>mind</b> log, per <b>practice</b>: <b>sessions</b> (all rows), <b>rated</b> (sessions that have a <b>depth</b>), <b>avg_depth</b> (mean depth of the rated sessions, rounded to 2; a practice you never rated keeps NaN here, not 0) and <b>no_mood</b> (sessions whose <b>mood_after</b> is missing). Columns: <b>practice</b>, <b>sessions</b>, <b>rated</b>, <b>avg_depth</b>, <b>no_mood</b>.',
 start:R`m = mind.copy()
m["no_mood"] =
result = m.groupby("practice", as_index=False).agg(`,
 sol:R`m = mind.copy()
m["no_mood"] = m["mood_after"].isna()
result = m.groupby("practice", as_index=False).agg(
    sessions=("id", "size"),
    rated=("depth", "count"),
    avg_depth=("depth", "mean"),
    no_mood=("no_mood", "sum"),

 hint:'size counts rows and count skips NaN; flag the gaps with m["mood_after"].isna() and sum that column in the agg.'},
{id:'py4',t:'py',lv:2,title:'merge: joining two apps on day',
 learn:['<code>a.merge(b, on="day")</code> puts two tables side by side on a key, like SQL&rsquo;s JOIN. Every app log has a <b>day</b>, so day is how two apps line up. The default, <code>how="inner"</code>, keeps only the days found in both and drops the rest without a word; <code>how="left"</code> keeps every row of <i>a</i> (NaN where <i>b</i> has nothing), "right" every row of <i>b</i> and "outer" every row of both.','Aggregate <i>before</i> you merge. When both sides have several rows per day, merge pairs every row with every row: 3 exercises and 4 trades on one day become 12 rows, so a pnl summed afterwards counts each trade 3 times. Group each log to one row per day, then join one row to one row. <code>validate="one_to_one"</code> makes pandas raise an error if a key repeats; comparing <code>len()</code> before and after shows it too.','Gotchas: a column name on both sides (<b>id</b>, <b>minutes</b>) comes back twice, as <b>id_x</b> and <b>id_y</b>; give your aggregates different names, or pass <code>suffixes=("_w", "_t")</code>. The key must have the same type on both sides: <b>day</b> as text on one and as a datetime on the other raises a ValueError. Then pick the output columns, in the order you want.'],
 ex:R`protein = meals.groupby("day", as_index=False).agg(protein=("protein", "sum"))
morning = checkins[["day", "energy"]]
both = morning.merge(protein, on="day")                 # inner: days in both
every = morning.merge(protein, on="day", how="left")    # every check-in, NaN with no meals
print(len(morning), "check-ins |", len(both), "with meals |", len(every), "after a left merge")
print(every.tail(3))
raw = meals.merge(mind, on="day")                       # every meal paired with every session that day
d = raw["day"].value_counts().index[0]                  # the day with the most pairs
print(d, ":", (meals["day"] == d).sum(), "meals x", (mind["day"] == d).sum(), "sessions =", (raw["day"] == d).sum(), "rows")
print("id columns:", [c for c in raw.columns if c.startswith("id")])`,
 task:'Training and trading on the same day. For every <b>day</b> on which you both logged at least one workout and closed at least one trade: <b>exercises</b> (how many <b>workouts</b> rows that day), <b>trades</b> (how many trades that day) and <b>pnl</b> (that day&rsquo;s total pnl, rounded to 2). Days with only one of the two are left out. Columns: <b>day</b>, <b>exercises</b>, <b>trades</b>, <b>pnl</b>.',
 start:R`w = workouts.groupby("day", as_index=False).agg(exercises=("id", "size"))
t =
result = `,
 sol:R`w = workouts.groupby("day", as_index=False).agg(exercises=("id", "size"))
t = trades.groupby("day", as_index=False).agg(trades=("id", "size"), pnl=("pnl", "sum"))
result = w.merge(t, on="day").round(2)`,

{id:'py15',t:'py',lv:2,title:'concat: stacking tables',
 learn:["<code>pd.concat([a, b], ignore_index=True)</code> stacks tables one under the other: SQL's UNION ALL. merge, from the lesson on joining two apps, puts two tables <i>side by side</i> on a key; concat puts them <i>on top of each other</i> and lines the columns up by <b>name</b>. Use it when two logs record the same kind of thing, like the minutes in <b>mind</b> and the minutes in <b>study</b>.",'Once stacked, the rows look alike, so label each input <i>before</i> stacking: <code>mind[["day", "minutes"]].assign(app="MIND")</code>. The label is then an ordinary column you can filter, count or <code>nunique</code> per group. concat keeps duplicates (UNION ALL, not UNION), and without <code>ignore_index=True</code> the old index numbers repeat (0, 1, 2 ... then 0, 1, 2 again).',"Columns are matched by name, not position. A column that only one input has is filled with NaN on the other input's rows, and the same column spelled two ways becomes two half-empty columns. So select (and rename) the same columns on every input first, then stack."],
 ex:R`logged = pd.concat([
    trades[["day"]].assign(app="JOURNAL"),

 start:R`m = mind[["day", "minutes"]].assign(app="MIND")
s =
both = pd.concat(
result = `,
 sol:R`m = mind[["day", "minutes"]].assign(app="MIND")

 hint:'Tag each side with .assign(app=...) before pd.concat; then, per day, apps is the nunique of app and sessions the row count (size).'},
{id:'py5',t:'py',lv:2,title:'pivot_table',
 learn:['<code>pivot_table</code> turns long rows into a grid: <code>index</code> gives the rows, <code>columns</code> the new column headers, <code>values</code> what fills each cell and <code>aggfunc</code> how the rows that land in one cell are combined. The default aggfunc is the <b>mean</b>, not the sum, so a forgotten <code>aggfunc="sum"</code> gives averages that look plausible. <code>fill_value=0</code> fills the combinations with no rows, which are NaN otherwise.','For weekdays, turn the text <b>day</b> into dates first: <code>pd.to_datetime(s["day"]).dt.day_name()</code> gives Monday, Tuesday ... and <code>.dt.dayofweek</code> gives 0 (Monday) to 6 (Sunday). The new columns come out <b>sorted alphabetically</b>: Friday, Monday, Saturday ... Put them in your order with <code>.reindex(columns=[...], fill_value=0)</code>, which also adds a weekday that never occurs, as 0s; picking them with <code>df[[...]]</code> raises a KeyError for a missing one.','The row labels become the index (<b>contract</b> in the example); <code>reset_index()</code> makes them a column again. pivot_table is a groupby on two keys with the second one spread out: <code>trades.groupby(["contract", "side"])["pnl"].sum().unstack(fill_value=0)</code> gives the example&rsquo;s first grid. Plain <code>pivot</code> only reshapes, with no aggfunc, and raises <i>Index contains duplicate entries</i> as soon as two rows share a cell.'],
 ex:R`p = trades.pivot_table(index="contract", columns="side", values="pnl", aggfunc="sum", fill_value=0)
print(p)                                                  # total pnl per contract and side
print(trades.pivot_table(index="contract", columns="side", values="pnl").round(2))   # no aggfunc: the mean
