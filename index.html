<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LEARN">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>ISIONXXX // LEARN</title>
<link rel="stylesheet" href="ui.css">
<style>
:root{
  color-scheme:dark;
  --bg:#070707;--card:#0c0c0c;--cell:#0a0a0a;--line:#1c1c1c;--line2:#2c2c2c;
  --tx:#d9d5c8;--mu:#8f8a7e;--acc:#ffb000;--amber:#ffb000;
  --g:#33ff66;--r:#ff4545;--a:#ff7a33;--b:#7f9cb0;--blue:#ffb000;
  --f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{margin:0 auto;max-width:1440px;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(48px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);font:13px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
::selection{background:var(--acc);color:#000}
.red{color:var(--r)}.grn{color:var(--g)}.amb{color:var(--acc)}.mu{color:var(--mu)}.mu2{color:var(--mu)}
.hidden{display:none!important}

/* header + filter bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;letter-spacing:.14em}
.brand b{color:var(--acc)}
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--acc);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top .btn svg{display:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0}
.sel{background:var(--bg);border:1px solid var(--line2);border-radius:0;padding:7px 10px;min-width:150px}
.sel:hover{border-color:var(--acc);color:var(--acc)}
.ctx{color:var(--mu)}
.sp{flex:1}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--bg);border-radius:0;padding:7px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn svg{width:14px;height:14px}
.btn.pri,.btn.go{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600}
.btn.pri:hover,.btn.go:hover{color:#000;filter:brightness(1.12)}
.btn.dng{color:var(--r)}.btn.dng:hover{border-color:var(--r)}

/* layout + cards */
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.gm{grid-template-columns:2fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ban{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:16px;margin-bottom:12px;flex-wrap:wrap;border-color:var(--acc)}
.bd{padding:16px;flex:1;display:flex;flex-direction:column}
.ft{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;font-size:11px;color:var(--mu);gap:10px;flex-wrap:wrap;align-items:center}
.card h3{font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
.card h3::before{content:'> ';color:var(--mu)}
.lbl{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:22px;font-weight:600;margin:2px 0 8px}
.gauge{display:block;width:150px;max-width:100%;margin:6px auto 10px}
.gauge path{fill:none;stroke-width:9}
.gauge text{fill:var(--tx);font:600 17px var(--f)}
.lr{display:grid;grid-template-columns:14px 1fr auto 46px;align-items:center;padding:2px 0}
.lr span{min-width:0}.lr b{text-align:right}.lr em{font-style:normal;text-align:right;color:var(--mu)}
.dot{width:7px;height:7px;margin-right:7px;display:inline-block;flex:none}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}
.hb{height:8px;background:#111;margin:6px 0 4px;overflow:hidden}
.hb i{display:block;height:100%}

/* calendar */
.calhd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wl{color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:12px}
.dh{text-align:center;font-size:11px;color:var(--mu);padding:4px 0;letter-spacing:.08em;text-transform:uppercase}
.cell{min-height:66px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--mu);cursor:pointer;position:relative;overflow:hidden}
.cell.hatch{background:repeating-linear-gradient(135deg,#0a0a0a 0 6px,#111 6px 7px)}
.cell.out{cursor:default;border-color:transparent;opacity:.5}
.cell.fut span{color:#827d72}
.cell.on{border-color:rgba(51,255,102,.3)}
.cell.on b{font-size:12px;color:var(--tx)}
.cell.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cell small{font-size:10px;color:var(--mu)}
.cell.wk{border:1px dashed var(--line2);background:#0a0a0a;color:var(--mu);cursor:default}
.cell.wk b{font-size:11px}
.cdots{display:flex;gap:2px}.cdots i{width:5px;height:5px}
.calft{padding:10px 16px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line2);min-width:33px;height:33px;padding:0 10px;font-size:12px}
.nav button:hover{border-color:var(--acc);color:var(--acc)}
.nav .tb{font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* coverage */
.ev h4{font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase;font-weight:400;margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.ev h4:first-of-type{border:0;padding-top:0;margin-top:0}
.er{display:flex;align-items:center;padding:5px 0;gap:2px}
.er span{flex:1}.er b{margin-right:8px;text-align:right;font-weight:600}
.q{width:12px;height:12px;border:1px solid var(--line2);font-size:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu);font-style:normal;flex:none;cursor:help}
hr{border:0;border-top:1px solid var(--line);margin:4px 0 8px}

/* cross-filters: anything with .pick narrows every card and the log; the filters show as chips under the bar */
.pick{cursor:pointer}.pick:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.lr.pick,.er.pick{margin:0 -6px;padding-left:6px;padding-right:6px}.lr.pick:hover,.er.pick:hover{background:#121212}
.lr.on,.er.on{background:#1a1406;box-shadow:inset 2px 0 0 var(--acc)}
.gauge path.pick:hover{filter:brightness(1.3)}.gauge path.off,.chart .off{opacity:.25}
.chart .hit{fill:transparent}.chart .hit:hover{fill:rgba(255,176,0,.08)}.chart .hit.on{fill:rgba(255,176,0,.14)}
.xf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px}
.xf span{color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.xf button{border:1px solid var(--acc);color:var(--acc);padding:5px 8px;font-size:12px}.xf button b{font-weight:600}.xf .clr{border-color:var(--line2);color:var(--mu)}
.xf button:hover{background:#1a1406}.xf[hidden]{display:none}
/* charts */
.chart{width:100%;height:160px;display:block;margin-top:8px}
.chart *{vector-effect:non-scaling-stroke}
.empty{height:160px;display:grid;place-items:center;color:var(--mu);letter-spacing:.14em;font-size:11px;text-transform:uppercase;text-align:center}
.eqh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ks{display:flex;gap:22px;flex-wrap:wrap}
.ks div{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;gap:2px}
.ks b{font-size:13px;color:var(--tx);letter-spacing:0;text-transform:none}
.radar{width:100%;max-width:230px;height:auto;margin:0 auto;display:block}
svg text{font-family:var(--f)}

/* table */
.tw{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:500;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.num{text-align:right}
.pill{display:inline-flex;padding:1px 6px;font-size:10px;border:1px solid;letter-spacing:.06em;text-transform:uppercase}
.acts{display:flex;gap:4px;justify-content:flex-end}
td .acts button{width:24px;height:24px;border:1px solid var(--line2);color:var(--tx);display:inline-flex;align-items:center;justify-content:center}
td .acts button:hover{border-color:var(--acc);color:var(--acc)}
.acts svg{width:13px;height:13px}
.th{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 4px}   /* title on the same line as every other card title */
.th h3{margin:0;flex:1}
.dim{color:var(--mu)}
/* table pager, as in the other apps */
.calf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px}
.calf button{border:1px solid var(--line2);padding:7px 10px;font-size:12px;letter-spacing:.06em}
.calf button:hover{border-color:var(--acc);color:var(--acc)}

/* modal (matches the dialogs in MIND / TRAINING / NUTRITION) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:25;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.box{background:var(--card);border:1px solid var(--acc);padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.box.wide{max-width:900px}
.box h3{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.box p{margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1px solid var(--line2);padding:7px 10px;width:100%;font-size:13px;letter-spacing:0;text-transform:none;color:var(--tx)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--acc);outline:0}
.ck{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--tx)}
.fg .ck label,.ck label{flex-direction:row;align-items:center;gap:6px;color:var(--tx);text-transform:none;letter-spacing:0;font-size:12px}
.ck input{width:auto;accent-color:var(--acc)}
.full{grid-column:1/-1}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.ui-set input{flex:none;width:84px;background:var(--bg);border:1px solid var(--line2);padding:7px 10px;text-align:right}
.ui-set input:focus{border-color:var(--acc);outline:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}.kv span{color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;background:var(--card);border:1px solid var(--acc);color:var(--acc);padding:8px 14px;z-index:40}

/* daily review: a script to read top to bottom (as in JOURNAL) */
.box.rvd{max-width:680px}
.rvh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.rvh h3{margin:0;flex:1}.rvh .btn{min-width:33px;justify-content:center}
.rv{border-top:1px solid var(--line);padding:14px 0 4px;font-size:13.5px;line-height:1.7}
.rv h4{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.rv p{margin:0 0 8px}.rv b{font-weight:600}
.rv ol,.rv ul{margin:0 0 8px;padding-left:22px}.rv li{margin:0 0 6px}.rv li::marker{color:var(--mu)}
.rv .tr{display:block;color:var(--mu);font-size:12px}
.rvf .btn:first-child{margin-right:auto}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);padding:7px 10px;font-size:12px;letter-spacing:.06em}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000}

/* buttons, extra */
a.btn{text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{border-color:var(--line2);color:inherit}
.btn.xs{padding:4px 8px;font-size:11px}
.btn.yt{border-color:#5c1515;color:#ffc9c9}
.btn.yt:hover{border-color:var(--r);color:var(--r)}

/* tracks + lists */
.tk{padding:10px 0;border-bottom:1px solid var(--line)}
.tk:last-child{border:0}
.tkh{display:flex;align-items:center;gap:8px}
.tkh b{flex:1;font-weight:600}
.tl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.tl span{color:var(--mu)}
.l5{display:inline-flex;gap:3px}.l5 i{width:10px;height:10px}

/* code */
pre,.ed{font:12.5px/1.55 var(--f)}
pre{background:var(--bg);border:1px solid var(--line);padding:12px 14px;overflow:auto;color:var(--tx);white-space:pre;tab-size:2}
.ed{width:100%;min-height:170px;background:#050505;border:1px solid var(--line2);padding:12px 14px;color:var(--tx);caret-color:var(--acc);resize:vertical;tab-size:2;white-space:pre;overflow:auto}
.ed:focus{border-color:var(--acc);outline:0}
.codeh{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.codeh b{flex:1;font-weight:500;color:var(--acc)}
.rt{border-collapse:collapse;font:12px var(--f);width:auto}
.rt th,.rt td{border:1px solid var(--line2);padding:5px 9px;text-align:left;white-space:nowrap}
.rt th{background:#111;color:var(--mu);font-weight:500;font-size:11px;letter-spacing:.06em}
.outw{max-height:320px;overflow:auto;margin-top:8px}
.fb{border:1px solid;padding:10px 12px;margin-top:10px;line-height:1.5}
.fb.ok{background:rgba(51,255,102,.06);border-color:rgba(51,255,102,.35);color:#b8f5cf}
.fb.no{background:rgba(255,69,69,.07);border-color:rgba(255,69,69,.35);color:#ffc9c9}
.fb.info{background:var(--bg);border-color:var(--line2);border-left:2px solid var(--acc);color:var(--tx)}

/* watch */
.watch{background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--r);padding:12px 14px;margin-top:16px}
.watch .codeh{margin-top:0}
.vid{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;border:1px solid var(--line);margin:8px 0 10px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vpin{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.vpin input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line2);padding:7px 10px}
.vpin input:focus{border-color:var(--acc);outline:0}

/* lesson overlay */
.po{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto;-webkit-overflow-scrolling:touch}
.lv{width:100%;max-width:860px}
.lvh{position:sticky;top:0;background:rgba(7,7,7,.95);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:3;padding:calc(12px + env(safe-area-inset-top)) 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.lvh .btn{min-height:34px}
.stime{font-size:13px;font-weight:600;color:var(--acc);min-width:52px}
.lvb{padding:18px 0 40px}
.lvb h2{font-size:18px;font-weight:600;letter-spacing:.02em;margin:6px 0 12px}
.lvb h2::before{content:'> ';color:var(--acc)}
.lvb p.learn{font-size:13.5px;line-height:1.65;margin-bottom:10px}
/* code inside a sentence: the lesson's own font and size (a bare code tag falls back to the browser's smaller monospace) */
.lvb code{font:inherit;background:#161616;padding:0 .25em;border-radius:3px}
.task{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--acc);padding:12px 14px;line-height:1.6;margin-top:18px}
.task b{color:var(--acc)}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--line2);padding:11px 14px;background:var(--bg);line-height:1.5}
.opt:hover{border-color:var(--acc)}
.opt.right{border-color:var(--g);background:rgba(51,255,102,.06)}
.opt.wrong{border-color:var(--r);background:rgba(255,69,69,.07)}
.lnav{display:flex;gap:8px;justify-content:space-between;margin-top:24px;flex-wrap:wrap}
.ltrk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:8px}
.li{text-align:left;border:1px solid var(--line2);padding:9px 12px;background:var(--bg);font-size:12px;display:flex;gap:8px;align-items:center}
.li:hover{border-color:var(--acc)}
.li b{flex:1;font-weight:500}
.li.done{border-color:rgba(51,255,102,.4)}
.rosetta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rosetta .codeh{margin-top:0}

/* today's session: the plan START shows, the step bar in the lesson view, the review panel */
.spl{display:grid;gap:6px;margin:12px 0}
.spi{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 12px;border:1px solid var(--line2);background:var(--bg);border-radius:var(--g-r3,0)}
.spi>i{font-style:normal;color:var(--mu);font-size:11px}
.spi b{font-weight:500}.spi small{display:block;color:var(--mu);font-size:11px;margin-top:3px}
.spi em{font-style:normal;color:var(--mu);font-size:11px;white-space:nowrap}
.spi .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-right:6px}
.spi .pill{margin-right:4px}
.spi.now{border-color:var(--acc)}.spi.ok{border-color:rgba(51,255,102,.4)}.spi.ok .tag{color:var(--g)}.spi.off{opacity:.6}
.sdots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:0}
.sdots i{width:7px;height:7px;border:1px solid var(--mu);border-radius:50%}.sdots i.ok{background:var(--g);border-color:var(--g)}.sdots i.no{border-color:var(--a)}.sdots i.now{background:var(--acc);border-color:var(--acc)}
.ssn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rvp{margin-top:0;margin-bottom:14px}
.rvn{margin:4px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rvn summary{cursor:pointer;padding:10px 0;font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.rvn summary:hover{color:var(--acc)}.rvn[open]{padding-bottom:12px}
.ft .nx{display:block;margin-top:3px}
.box.ssm .mact{position:sticky;bottom:-20px;z-index:1;margin:14px -20px -20px;padding:12px 20px;background:rgba(16,16,16,.94);border-top:1px solid var(--g-line,var(--line))}

@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.gm,.g3{grid-template-columns:1fr}}
@media(max-width:560px){
  body{padding-left:10px;padding-right:10px}
  .g4,.fg,.rosetta{grid-template-columns:1fr}
  .sel{min-width:0;flex:1}.ctx{width:100%}
  .cell{min-height:50px;padding:3px}.cell small{display:none}.cell b{font-size:10px}
  .ed,.fg input,.fg select,.fg textarea,.vpin input,.ui-set input{font-size:16px}
  .lvb h2{font-size:16px}
  .lvh .ssn{order:9;flex-basis:100%;justify-content:flex-end}.lvh .sdots{display:none}
  .spi{grid-template-columns:14px minmax(0,1fr);padding:9px 10px}.spi em{grid-column:2}
}

function parseYT(url){

/* ================= lessons ================= */
const LESSONS=[
/* ---------- SQL ---------- */
{id:'sql1',t:'sql',lv:1,title:'SELECT & WHERE',
 learn:['Every question starts with SELECT (which columns) and FROM (which table). WHERE keeps only the rows you care about, before anything else is calculated.','Text goes in single quotes. Combine conditions with AND / OR, and use IN (...) to match a list of values. Your JOURNAL log is the <b>trades</b> table: one row per trade, with <b>pnl</b> in dollars after fees.'],
 ex:R`SELECT day, practice, minutes
FROM mind
WHERE practice IN ('Breathwork', 'Meditation') AND minutes >= 10;`,

 start:R`SELECT
FROM trades
WHERE `,
 sol:R`SELECT day, contract, pnl

WHERE side = 'Short' AND pnl < 0;`,
 hint:"Three columns after SELECT, two conditions joined by AND: side = 'Short' AND pnl < 0."},
{id:'sql2',t:'sql',lv:1,title:'ORDER BY & LIMIT',ordered:true,
 learn:['ORDER BY sorts the result; add DESC for largest first. LIMIT keeps only the first N rows: the classic “top N” pattern.','Without ORDER BY, a database may return rows in any order. When two rows tie, add a second sort column so the order is always the same. In every table, a higher <b>id</b> means a later entry.'],
 ex:R`SELECT day, sleep, energy
FROM checkins
ORDER BY sleep DESC, day DESC
LIMIT 3;   -- your 3 longest nights, latest first on ties`,
 task:'Your <b>5 best trades</b>: <b>id</b>, <b>day</b>, <b>contract</b>, <b>pnl</b>, highest pnl first. When two trades made the same amount, put the later one (higher id) first.',
 start:R`SELECT id, day, contract, pnl
FROM trades
`,
 sol:R`SELECT id, day, contract, pnl
FROM trades
ORDER BY pnl DESC, id DESC
LIMIT 5;`,
 hint:'ORDER BY pnl DESC, id DESC, then LIMIT 5.'},
{id:'sql3',t:'sql',lv:1,title:'COUNT, SUM & GROUP BY',
 learn:['Aggregate functions (COUNT, SUM, AVG, MIN, MAX) collapse many rows into one. GROUP BY splits rows into groups first, giving one output row per group.','Every column in SELECT must either be in GROUP BY or wrapped in an aggregate. Name results with AS, and ROUND(x, 2) money and averages.'],
 ex:R`SELECT kind, COUNT(*) AS meals, ROUND(AVG(protein), 2) AS avg_protein
FROM meals
GROUP BY kind;`,
 task:'Which contract made you the most money? Per <b>contract</b>: <b>trades</b> (how many) and <b>pnl</b> (total, rounded to 2 decimals).',
 start:R`SELECT contract,
FROM trades
`,
 sol:R`SELECT contract, COUNT(*) AS trades, ROUND(SUM(pnl), 2) AS pnl
FROM trades
GROUP BY contract;`,
 hint:'COUNT(*) AS trades, ROUND(SUM(pnl), 2) AS pnl, then GROUP BY contract.'},
{id:'sql13',t:'sql',lv:1,title:'DISTINCT & COUNT(DISTINCT)',
 learn:['SELECT DISTINCT drops duplicate rows from a result: SELECT DISTINCT exercise FROM workouts lists each exercise once, however often you logged it. It works on the <b>whole selected row</b>, not the first column, so SELECT DISTINCT day, exercise returns each day + exercise pair once. Nor is DISTINCT a function: SELECT DISTINCT(day), exercise still de-duplicates on both columns.','Inside an aggregate, <b>COUNT(DISTINCT col)</b> counts the <i>different</i> values, so “how many different things” can sit next to “how many rows” in one GROUP BY. Three exercises logged on one morning are 3 rows but 1 day: COUNT(*) and COUNT(day) both say 3, COUNT(DISTINCT day) says 1.','Unique users, active days, products sold: much of everyday analytics is a COUNT(DISTINCT …). SQLite accepts one expression inside it, so COUNT(DISTINCT exercise, day) is an error.'],
 ex:R`-- each practice + technique pair once (DISTINCT applies to both columns):
-- SELECT DISTINCT practice, technique FROM mind;
SELECT practice,
       COUNT(*) AS sessions,
       COUNT(DISTINCT technique) AS techniques
FROM mind
GROUP BY practice;   -- many sessions, only a few different techniques`,
 task:'How varied is your training? One row per workout <b>type</b>. Columns: <b>type</b>, <b>entries</b> (rows logged), <b>exercises</b> (number of different exercises) and <b>days</b> (number of different days you logged that type). Plain counts, row order free.',
 start:R`SELECT type,
       COUNT(*) AS entries,

FROM workouts
GROUP BY type;`,
 sol:R`SELECT type,
       COUNT(*) AS entries,
       COUNT(DISTINCT exercise) AS exercises,
       COUNT(DISTINCT day) AS days
FROM workouts
GROUP BY type;`,
 hint:'COUNT(*) counts rows; COUNT(DISTINCT col) counts each different value once, and you need it for two of the columns.'},
{id:'sql14',t:'sql',lv:1,title:'NULLs: IS NULL & COALESCE',
 learn:['NULL means “unknown or missing”: not 0 and not an empty string. In <b>checkins</b>, weight is NULL on mornings you skipped the scale. Any comparison with NULL, even weight = NULL, gives NULL and never matches, so test with <b>IS NULL</b> / <b>IS NOT NULL</b>. In SQLite a test is 1 when true and 0 when false, so SUM(weight IS NULL) counts the gaps.','Aggregates skip NULLs. COUNT(*) counts every row, COUNT(weight) only the rows that have a weight, and AVG(weight) averages the values you actually logged. So COUNT(*) - COUNT(weight) is also the number of gaps (the portable way). Careful: COUNT(weight IS NULL) counts every row, because 0 is not NULL.',"<b>COALESCE(x, fallback)</b> returns its first non-NULL argument: good for display labels (COALESCE(depth, 'not rated')) and for a 0 where missing really means none. Inside an average it is a trap: AVG(COALESCE(weight, 0)) counts each skipped weigh-in as 0 kg and drags your average far down."],
 ex:R`-- SQLite lets one column mix numbers and text;
-- Postgres would want CAST(depth AS TEXT) inside the COALESCE
SELECT day, practice, technique,
       COALESCE(depth, 'not rated') AS depth
FROM mind
WHERE depth IS NULL OR depth >= 8   -- unrated or deep sessions
ORDER BY day;`,
 task:'Your weigh-in discipline, in one row from <b>checkins</b>. Columns: <b>days</b> (check-ins), <b>weighed</b> (check-ins with a weight), <b>skipped</b> (check-ins whose weight is missing) and <b>avg_weight</b> (the average of the weights you actually logged, rounded to 2).',
 start:R`SELECT COUNT(*) AS days,

FROM checkins;`,
 sol:R`SELECT COUNT(*) AS days,
       COUNT(weight) AS weighed,
       SUM(weight IS NULL) AS skipped,   -- portable: COUNT(*) - COUNT(weight)
       ROUND(AVG(weight), 2) AS avg_weight
FROM checkins;`,
 hint:'COUNT(weight) and AVG(weight) already skip NULLs; count the missing weights with an IS NULL test, never = NULL.'},
{id:'sql15',t:'sql',lv:1,title:'Text functions: SUBSTR & LIKE',
 learn:["String functions reshape text: <b>SUBSTR(s, start, len)</b> cuts a piece, LENGTH(s) counts characters, UPPER / LOWER change case, TRIM strips spaces, REPLACE(s, a, b) swaps text, and <b>||</b> joins strings (+ does not join text in SQLite). Your dates and times are fixed-format text ('YYYY-MM-DD', 'YYYY-MM-DD HH:MM:SS'), so SUBSTR(day, 1, 7) is the month and SUBSTR(time, 12, 5) the clock time.","<b>LIKE</b> matches a pattern: % is any run of characters (even none) and _ exactly one, so contract LIKE 'ES%' catches every S&amp;P expiry (ESZ6 now, ESH7 after the December roll), while contract = 'ES%' matches nothing: = compares exactly, % and all. In SQLite LIKE ignores case, so '%press%' finds 'Bench Press'; in Postgres LIKE is case-sensitive and ILIKE is the case-blind form.","SUBSTR counts from <b>1</b>, not 0: in '2026-08-24 09:38:56' position 11 is the space, so SUBSTR(opened, 11, 2) returns ' 0', not '09'. And slicing dates as text works only because SQLite stores them as TEXT; with real DATE / TIMESTAMP columns use date functions such as EXTRACT."],
 ex:R`SELECT day, exercise,
       SUBSTR(time, 12, 5) AS clock,         -- 'HH:MM' out of 'YYYY-MM-DD HH:MM:SS'
       UPPER(SUBSTR(exercise, 1, 3)) || '-' || LENGTH(exercise) AS code
FROM workouts
WHERE exercise LIKE '%press%'   -- LIKE ignores case: matches 'Bench Press'
ORDER BY id DESC
LIMIT 8;`,
 task:"Your <b>Nasdaq hours</b>: take the trades whose <b>contract</b> starts with 'NQ' (any expiry) and group them by the hour the trade was <b>opened</b>: the two-digit HH of 'YYYY-MM-DD HH:MM:SS', such as '09'. Columns: <b>hour</b>, <b>trades</b> (count), <b>pnl</b> (total, rounded to 2). Row order free.",
 start:R`SELECT SUBSTR(opened,  ,  ) AS hour,
       COUNT(*) AS trades,
       ROUND(SUM(pnl), 2) AS pnl
FROM trades
WHERE contract
GROUP BY hour;`,
 sol:R`SELECT SUBSTR(opened, 12, 2) AS hour,
       COUNT(*) AS trades,
       ROUND(SUM(pnl), 2) AS pnl
FROM trades
WHERE contract LIKE 'NQ%'
GROUP BY hour;`,
 hint:"Count from 1: 'YYYY-MM-DD ' is 11 characters, so the hour starts at 12 and is 2 long; 'starts with' is LIKE with one % at the end."},
{id:'sql4',t:'sql',lv:2,title:'JOINs across apps',
 learn:['Your apps each keep their own table, but every table has a <b>day</b> column. JOIN ... ON a.day = b.day lines up what happened in two apps on the same date: sleep next to P&amp;L, workouts next to meals.','Use short aliases (c, t). An INNER JOIN keeps only days that appear in <i>both</i> tables; you’ll meet LEFT JOIN soon.'],
 ex:R`SELECT m.day, m.practice, m.mood_before, m.mood_after
FROM mind m
JOIN (SELECT DISTINCT day FROM workouts) w ON w.day = m.day;   -- your sessions on training days`,
 task:'Do you trade better after a good night? Join <b>checkins</b> to <b>trades</b> on <b>day</b> and group by hours of <b>sleep</b>. Columns: <b>sleep</b>, <b>trades</b> (count), <b>avg_pnl</b> (average pnl per trade, rounded to 2).',
 start:R`SELECT c.sleep,
FROM checkins c
JOIN trades t ON
GROUP BY c.sleep;`,
 sol:R`SELECT c.sleep, COUNT(*) AS trades, ROUND(AVG(t.pnl), 2) AS avg_pnl
FROM checkins c
JOIN trades t ON t.day = c.day
GROUP BY c.sleep;`,
 hint:'JOIN trades t ON t.day = c.day, then COUNT(*) and ROUND(AVG(t.pnl), 2).'},
{id:'sql16',t:'sql',lv:2,title:'IN & EXISTS — avoiding fan-out',
 learn:['A JOIN returns one row per <i>matching pair</i>. Join <b>trades</b> to <b>workouts</b> on day and every trade comes back once for each exercise you logged that day: three exercises, three copies of the same trade. This is <b>fan-out</b>. COUNT and SUM quietly double or triple, and nothing warns you.',"When the other table only decides <i>which rows to keep</i>, filter instead of joining (a <b>semi-join</b>). IN, which you met with a list like ('Breathwork', 'Meditation'), also takes a <b>subquery</b>, a SELECT in brackets that produces the list: WHERE day IN (SELECT day FROM workouts). EXISTS asks “is there at least one match?”: in WHERE EXISTS (SELECT 1 FROM workouts w WHERE w.day = t.day) the inner query reads the outer trade’s t.day, so it is asked again for every trade. Either way each trade is kept once, however many matches it has.",'Gotchas: COUNT(DISTINCT t.id) after a fan-out repairs the count but not the SUM, and SUM(DISTINCT pnl) adds up distinct <i>amounts</i>, not trades; joining to a de-duplicated side, JOIN (SELECT DISTINCT day FROM workouts), is a safe fix. NOT IN (subquery) returns no rows at all when the subquery holds a NULL (x NOT IN (2, NULL) is never true), so for “no match” questions (the anti-join lesson) NOT EXISTS is the safer form.'],
 ex:R`SELECT kind, COUNT(*) AS meals, ROUND(AVG(kcal), 2) AS avg_kcal
FROM meals m
WHERE EXISTS (SELECT 1 FROM habits h
              WHERE h.day = m.day AND h.event IN ('resisted', 'slipped'))
GROUP BY kind;   -- what you eat on days you had an urge, each meal counted once`,
 task:'Do you trade better on days you trained? Take the <b>trades</b> whose <b>day</b> has at least one row in <b>workouts</b>, each trade counted once. One row with: <b>trades</b> (count), <b>pnl</b> (their total, rounded to 2), <b>avg_pnl</b> (average pnl per trade, rounded to 2).',
 start:R`SELECT COUNT(*) AS trades,
       ROUND(SUM(t.pnl), 2) AS pnl,
       ROUND(AVG(t.pnl), 2) AS avg_pnl
FROM trades t
JOIN workouts w ON w.day = t.day;   -- run it: each trade repeats once per exercise that day`,
 sol:R`SELECT COUNT(*) AS trades,
       ROUND(SUM(pnl), 2) AS pnl,
       ROUND(AVG(pnl), 2) AS avg_pnl
FROM trades
WHERE day IN (SELECT day FROM workouts);`,
 hint:'Drop the JOIN and keep FROM trades: let workouts only filter, with WHERE day IN (SELECT day FROM workouts) or WHERE EXISTS (...).'},
{id:'sql5',t:'sql',lv:2,title:'HAVING — filtering groups',
 learn:['WHERE filters rows <i>before</i> grouping; HAVING filters groups <i>after</i> aggregation. You can’t use an aggregate like SUM(pnl) in WHERE.','Logical order: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.'],
 ex:R`SELECT practice, COUNT(*) AS sessions, ROUND(AVG(minutes), 2) AS avg_min
FROM mind
GROUP BY practice
HAVING COUNT(*) >= 3;`,
 task:'Find your <b>red days</b>: days where your trades added up to a loss. Columns: <b>day</b>, <b>trades</b> (count), <b>pnl</b> (day total, rounded to 2), only days whose total pnl is below 0.',
 start:R`SELECT day, COUNT(*) AS trades, ROUND(SUM(pnl), 2) AS pnl
FROM trades
`,
 sol:R`SELECT day, COUNT(*) AS trades, ROUND(SUM(pnl), 2) AS pnl
FROM trades
GROUP BY day
HAVING SUM(pnl) < 0;`,
 hint:'GROUP BY day, then HAVING SUM(pnl) < 0.'},
{id:'sql6',t:'sql',lv:2,title:'CASE WHEN — deriving labels',
 learn:['CASE WHEN ... THEN ... ELSE ... END creates new values row by row: buckets, flags, cleaned labels. It works inside SELECT, GROUP BY, ORDER BY and even inside aggregates.','A powerful trick: SUM(CASE WHEN cond THEN 1 ELSE 0 END) counts the rows that meet a condition, so one query can give you a total and a count of wins side by side.'],
 ex:R`SELECT CASE WHEN sleep >= 7 THEN 'rested' ELSE 'short night' END AS night,
       COUNT(*) AS days,
       ROUND(AVG(energy), 2) AS avg_energy
FROM checkins
GROUP BY night;`,
 task:'Are you better Long or Short? Per <b>side</b>: <b>trades</b> (count) and <b>wins</b> (trades with pnl above 0, counted with SUM(CASE WHEN ...)).',
 start:R`SELECT side,
       COUNT(*) AS trades,
       SUM(CASE WHEN  THEN  ELSE  END) AS wins
FROM trades
GROUP BY side;`,
 sol:R`SELECT side,
       COUNT(*) AS trades,
       SUM(CASE WHEN pnl > 0 THEN 1 ELSE 0 END) AS wins
FROM trades
GROUP BY side;`,
 hint:'SUM(CASE WHEN pnl > 0 THEN 1 ELSE 0 END)'},
{id:'sql17',t:'sql',lv:2,title:'UNION ALL — stacking apps',
 learn:['JOIN puts tables <i>side by side</i> (more columns). <b>UNION ALL</b> stacks results <i>on top of each other</i> (more rows): one SELECT per source, glued together. Three apps log session minutes, each in its own table (<b>mind</b>, <b>study</b> and Cardio <b>workouts</b>), and stacking turns them into one feed.',"Each SELECT must return the same number of columns, matched by <i>position</i>, not by name; the names come from the first SELECT. Add a literal such as 'MIND' AS app so every row says where it came from. ORDER BY and LIMIT are written once, after the last SELECT, and apply to the whole stack.","Gotcha: plain <b>UNION</b> removes duplicate rows across the whole stack. Stack two 10-minute sessions as ('MIND', 10) and one of them silently disappears. It also has to sort or hash every row to find duplicates, so it is slower. Use UNION ALL unless you actually want de-duplication."],
 ex:R`SELECT time, 'MIND' AS app, practice AS what FROM mind
UNION ALL
SELECT time, 'REWIRE', habit FROM habits
UNION ALL
SELECT time, 'NUTRITION', name FROM meals
ORDER BY time DESC
LIMIT 8;   -- your latest 8 entries from three apps, in one feed`,
 task:"Where do your minutes go across apps? Stack one row per app: <b>app</b> = 'MIND' (every session in <b>mind</b>), 'LEARN' (every session in <b>study</b>) and 'TRAINING' (only <b>workouts</b> with type 'Cardio', the only ones with minutes). Columns: <b>app</b> (those exact labels), <b>sessions</b> (rows), <b>minutes</b> (total minutes, not rounded). Row order free.",
 start:R`SELECT 'MIND' AS app, COUNT(*) AS sessions, SUM(minutes) AS minutes
FROM mind
-- stack LEARN (study) and TRAINING (Cardio workouts) below
`,
 sol:R`SELECT 'MIND' AS app, COUNT(*) AS sessions, SUM(minutes) AS minutes
FROM mind
UNION ALL
SELECT 'LEARN', COUNT(*), SUM(minutes)
FROM study
UNION ALL
SELECT 'TRAINING', COUNT(*), SUM(minutes)
FROM workouts
WHERE type = 'Cardio';`,
 hint:"Three SELECTs with the same three columns in the same order, joined by UNION ALL; the third one needs WHERE type = 'Cardio'."},
{id:'sql18',t:'sql',lv:2,title:'Date math with julianday',
 learn:['Your dates are TEXT, so to subtract them turn them into numbers first: julianday(b) - julianday(a) is the gap in days, with a fraction when there are times. Multiply by 24 for hours or by 1440 for minutes: (julianday(closed) - julianday(opened)) * 1440 is how long a trade was held.',"To move a date, add modifiers: date(day, '+7 days'), date(day, '-1 month'), datetime(closed, '+20 minutes'). They apply left to right: date(day, '-6 days', 'weekday 1') is the Monday of that week. Other databases spell these DATEDIFF, DATE_ADD or + INTERVAL.","Gotchas: subtracting the strings themselves ('2026-10-22' - '2026-10-15') silently gives 0, because SQLite reads each one as the number 2026. A gap is not an inclusive count: the 15th to the 22nd is 7 days apart but covers 8 calendar days, and n dates have n − 1 gaps between them. Dividing by zero returns NULL in SQLite, not an error, so a group with a single date quietly shows a NULL average gap."],
 ex:R`SELECT id, opened, closed, minutes,
       ROUND((julianday(closed) - julianday(opened)) * 1440, 1) AS held_min,
       date(day, '-6 days', 'weekday 1') AS week_start
FROM trades
ORDER BY id DESC
LIMIT 5;   -- your last 5 trades: held_min matches minutes; the Monday of their week`,
 task:'How regular is each technique? For every <b>technique</b> in <b>mind</b> that you used on at least 2 different days: <b>technique</b>, <b>days</b> (number of different days you used it; two sessions on one day count once), <b>span_days</b> (julianday of its last day − julianday of its first day, not rounded), <b>every_days</b> (span_days / (days − 1), the average gap in days between those days, rounded to 1). Row order free.',
 start:R`SELECT technique,
       MIN(day) AS first_day,
       MAX(day) AS last_day
FROM mind
GROUP BY technique;`,
 sol:R`SELECT technique,
       COUNT(DISTINCT day) AS days,
       julianday(MAX(day)) - julianday(MIN(day)) AS span_days,
       ROUND((julianday(MAX(day)) - julianday(MIN(day))) / (COUNT(DISTINCT day) - 1), 1) AS every_days
FROM mind
GROUP BY technique
HAVING COUNT(DISTINCT day) >= 2;`,
 hint:'Span = julianday(MAX(day)) - julianday(MIN(day)). n different days have n - 1 gaps, and HAVING drops the techniques used on a single day.'},
{id:'sql7',t:'sql',lv:3,title:'CTEs & subqueries',
 learn:['A CTE (WITH name AS (...)) names an in-between result so you can build a query in readable steps. A subquery does the same inline.','Here: first add up each day’s P&amp;L, then compare every day to the average of those daily totals. That is a two-step question a single GROUP BY can’t answer.'],
 ex:R`WITH d AS (
  SELECT day, SUM(protein) AS protein
  FROM meals GROUP BY day
)
SELECT day, ROUND(protein, 2) AS protein
FROM d
WHERE protein > (SELECT AVG(protein) FROM d);   -- your high-protein days`,
 task:'Which trading days beat your <b>average day</b>? Columns: <b>day</b>, <b>pnl</b> (the day’s total, rounded to 2), only days whose total is above the average daily total.',
 start:R`WITH d AS (
  SELECT day, SUM(pnl) AS pnl
  FROM trades
  GROUP BY day
)
SELECT
FROM d
WHERE `,
 sol:R`WITH d AS (
  SELECT day, SUM(pnl) AS pnl
  FROM trades
  GROUP BY day
)
SELECT day, ROUND(pnl, 2) AS pnl
FROM d
WHERE pnl > (SELECT AVG(pnl) FROM d);`,
 hint:'Compare pnl to a scalar subquery: (SELECT AVG(pnl) FROM d).'},
{id:'sql8',t:'sql',lv:3,title:'LEFT JOIN & anti-joins',
 learn:['LEFT JOIN keeps every row from the left table, filling NULLs where the right table has no match. Filtering WHERE right.key IS NULL keeps only the non-matches: an “anti-join”.','Anti-joins answer “when did I never…?” questions across your apps: check-in days with no trades, training days with no meals logged. NOT EXISTS is an equivalent pattern.'],
 ex:R`SELECT c.day, c.sleep
FROM checkins c
LEFT JOIN trades t ON t.day = c.day
WHERE t.id IS NULL;   -- check-in days you didn't trade`,
 task:'Days you <b>trained but didn’t check in</b>: every distinct <b>day</b> in <b>workouts</b> that has no row in <b>checkins</b>. One column: <b>day</b>.',
 start:R`SELECT DISTINCT w.day
FROM workouts w
LEFT JOIN checkins c ON
WHERE `,
 sol:R`SELECT DISTINCT w.day
FROM workouts w
LEFT JOIN checkins c ON c.day = w.day
WHERE c.day IS NULL;`,
 hint:'Join on c.day = w.day and keep rows WHERE c.day IS NULL.'},
{id:'sql19',t:'sql',lv:3,title:'Self-joins & range conditions',
 learn:['A <b>self-join</b> joins a table to itself under two aliases, so rows of the same table can be compared: in FROM trades a JOIN trades b, <b>a</b> is one trade and <b>b</b> another. The ON clause doesn’t have to be an equality. A <b>range condition</b> pairs each row with <i>every</i> row inside a window, so one loss can match two re-entries, or none: something “the next trade” can’t show.',"Build the window with datetime() from the julianday lesson: b.time BETWEEN a.time AND datetime(a.time, '+4 hours') keeps every b in the 4 hours after a, both ends included (BETWEEN means lo &lt;= v AND v &lt;= hi). Text timestamps compare correctly only because they are all 'YYYY-MM-DD HH:MM:SS', as datetime() returns them. Never write a.closed + 60: SQLite reads just the year (2026 + 60 = 2086), compares that as text, and every later trade matches.",'Keep the condition tight: a self-join with a loose ON returns up to n × n rows (150 trades → 22,500 pairs). And make sure a row can’t pair with itself: the BETWEEN above matches b = a too, which is why the example starts at b.time &gt; a.time. A close-to-open window is safe, since a trade opens before it closes. For pairs on the same day, a.id &lt; b.id also stops each pair appearing twice (a,b and b,a).'],
 ex:R`SELECT a.time AS urge, b.time AS came_back, b.event
FROM habits a
JOIN habits b
  ON b.time > a.time
 AND b.time <= datetime(a.time, '+4 hours')
WHERE a.event IN ('resisted', 'slipped')
  AND b.event IN ('resisted', 'slipped');   -- urges that came back within 4 hours`,
 task:'Revenge-trade check: pair every <b>losing</b> trade (pnl &lt; 0) with <i>every</i> trade you opened in the hour after it closed: opened at or after the loss’s <b>closed</b> time, up to and including 60 minutes later. Columns: <b>loss_id</b> (the loss’s id), <b>next_id</b> (the later trade’s id), <b>gap_min</b> = (julianday(later trade’s opened) − julianday(loss’s closed)) × 1440, rounded to 2, and <b>next_pnl</b> (the later trade’s pnl). One row per pair; a loss with no trade in that hour doesn’t appear. Row order free.',
 start:R`SELECT a.id AS loss_id,
       b.id AS next_id,

FROM trades a
JOIN trades b
  ON
WHERE `,
 sol:R`SELECT a.id AS loss_id,
       b.id AS next_id,
       ROUND((julianday(b.opened) - julianday(a.closed)) * 1440, 2) AS gap_min,
       b.pnl AS next_pnl
FROM trades a
JOIN trades b
  ON b.opened BETWEEN a.closed AND datetime(a.closed, '+60 minutes')
WHERE a.pnl < 0;`,
 hint:"Two aliases of trades, joined ON b.opened BETWEEN a.closed AND datetime(a.closed, '+60 minutes'); keep a.pnl < 0."},
{id:'sql9',t:'sql',lv:3,title:'Window functions: RANK',
 learn:['Window functions calculate across related rows <i>without collapsing them</i>. OVER (PARTITION BY ... ORDER BY ...) defines the window.','ROW_NUMBER gives 1,2,3…; RANK gives tied rows the same number and leaves a gap after them; DENSE_RANK doesn’t leave gaps. These power top-N-per-group and dedup queries.'],
 ex:R`SELECT day, name, protein,
  ROW_NUMBER() OVER (ORDER BY protein DESC, id) AS pos
FROM meals;`,
 task:'Rank your trades by pnl <b>within each contract</b> (1 = best trade on that contract). Columns: <b>contract</b>, <b>id</b>, <b>pnl</b>, <b>rnk</b>. Use RANK so equal pnl shares a rank.',
 start:R`SELECT contract, id, pnl,
  RANK() OVER (               ) AS rnk
FROM trades;`,
 sol:R`SELECT contract, id, pnl,
  RANK() OVER (PARTITION BY contract ORDER BY pnl DESC) AS rnk
FROM trades;`,
 hint:'OVER (PARTITION BY contract ORDER BY pnl DESC)'},
{id:'sql20',t:'sql',lv:3,title:'Window totals: % of total',
 learn:['An aggregate with an empty window, SUM(kcal) OVER (), puts the total of the whole result on every row without collapsing the rows; OVER (PARTITION BY day) puts each group’s own total there instead. Divide a row by it and you have its <b>share of total</b>: the number behind every mix, contribution and Pareto report.','With a GROUP BY, the window runs <i>after</i> the grouping, on the grouped rows, so you aggregate the aggregate: per meal <b>kind</b>, SUM(kcal) * 100.0 / SUM(SUM(kcal)) OVER () is each kind’s share of all your calories, and SUM(COUNT(*)) OVER () is the total number of meals. Plain COUNT(*) OVER () there counts the <i>groups</i> (2 kinds), not your meals.','Gotchas: COUNT(*) is an integer, so COUNT(*) * 100 / … truncates (7 × 100 / 48 = 14, not 14.6); write 100.0. ORDER BY inside OVER turns the total into a running total (a later lesson), so leave it out. And WHERE runs first: a filter shrinks the denominator, so the shares then add up to 100% of the filtered rows only.'],
 ex:R`SELECT day, name, kcal,
       SUM(kcal) OVER (PARTITION BY day) AS day_kcal,
       ROUND(kcal * 100.0 / SUM(kcal) OVER (PARTITION BY day), 1) AS pct_of_day
FROM meals
ORDER BY day, id;   -- each meal's share of that day's calories`,
 task:'Where does your mind time go? Per <b>practice</b> in <b>mind</b>: <b>sessions</b> (count), <b>minutes</b> (total, not rounded), <b>pct_sessions</b> (that practice’s share of all your mind sessions × 100) and <b>pct_minutes</b> (its share of all your mind minutes × 100), both shares rounded to 1. Columns in this order: practice, sessions, minutes, pct_sessions, pct_minutes. Row order free.',
 start:R`SELECT practice,
       COUNT(*) AS sessions,
       SUM(minutes) AS minutes,

FROM mind
GROUP BY practice;`,
 sol:R`SELECT practice,
       COUNT(*) AS sessions,
       SUM(minutes) AS minutes,
       ROUND(COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), 1) AS pct_sessions,
       ROUND(SUM(minutes) * 100.0 / SUM(SUM(minutes)) OVER (), 1) AS pct_minutes
FROM mind
GROUP BY practice;`,
 hint:'Nest the aggregate inside the window: COUNT(*) * 100.0 / SUM(COUNT(*)) OVER (), and the same move for SUM(minutes).'},
{id:'sql21',t:'sql',lv:3,title:'LAG & LEAD — the previous row',
 learn:['LAG(pnl) OVER (ORDER BY id) returns pnl from the <i>previous</i> row in that order; LEAD returns the next one. LAG(pnl, 2, 0) looks two rows back and gives 0 instead of NULL when there is no such row. That’s how you get change vs the previous period, time since the last event, or what happened right after X.','Add <b>PARTITION BY</b> so the sequence restarts per group: without PARTITION BY day, yesterday’s last trade becomes the “previous” of today’s first. The first row of each partition has nothing before it and gets NULL; NULL &gt; 0 isn’t true, so a CASE quietly sends that row to its ELSE. Filter it out first. A window function can’t go in the WHERE of its own SELECT: compute it in a CTE, then filter outside.','LAG sees exactly one neighbour, unlike the range self-join, which finds every row in a window. And “previous row” isn’t “previous calendar day”: if you didn’t trade on Tuesday, the row before Wednesday’s is Monday’s.'],
 ex:R`SELECT track, day, minutes,
       LAG(minutes) OVER (PARTITION BY track ORDER BY time) AS prev_minutes,
       minutes - LAG(minutes) OVER (PARTITION BY track ORDER BY time) AS change,
       LEAD(day) OVER (PARTITION BY track ORDER BY time) AS next_day
FROM study
ORDER BY track, time;   -- each study session vs your last one on that track`,
 task:'Does a loss tilt you? For every trade <b>except the first of its day</b>, look at the previous trade <b>on the same day</b> (by id) and label the trade <b>after win</b> (previous pnl &gt; 0), <b>after loss</b> (previous pnl &lt; 0) or <b>after flat</b> (previous pnl = 0). Per label: <b>after</b> (the label, written exactly as above), <b>trades</b> (count), <b>wins</b> (trades with pnl &gt; 0) and <b>avg_pnl</b> (average pnl, rounded to 2). Row order free.',
 start:R`WITH t AS (
  SELECT id, day, pnl,
         LAG(pnl) OVER (                ) AS prev_pnl
  FROM trades
)
SELECT CASE WHEN     THEN 'after win'
            WHEN     THEN 'after loss'
            ELSE 'after flat' END AS after,

FROM t
GROUP BY after;`,
 sol:R`WITH t AS (
  SELECT id, day, pnl,
         LAG(pnl) OVER (PARTITION BY day ORDER BY id) AS prev_pnl
  FROM trades
)
SELECT CASE WHEN prev_pnl > 0 THEN 'after win'
            WHEN prev_pnl < 0 THEN 'after loss'
            ELSE 'after flat' END AS after,
       COUNT(*) AS trades,
       SUM(CASE WHEN pnl > 0 THEN 1 ELSE 0 END) AS wins,
       ROUND(AVG(pnl), 2) AS avg_pnl
FROM t
WHERE prev_pnl IS NOT NULL
GROUP BY after;`,
 hint:'In the CTE: LAG(pnl) OVER (PARTITION BY day ORDER BY id). Outside: drop the rows where it is NULL, then group by the CASE label.'},
{id:'sql10',t:'sql',lv:4,title:'Running totals by week',ordered:true,
 learn:['Bucket dates with strftime in SQLite: strftime(\'%Y-%m\', day) gives the month, strftime(\'%Y-%W\', day) the week number (weeks start on Monday). Postgres/Snowflake use DATE_TRUNC, SQL Server FORMAT. Then SUM(...) OVER (ORDER BY bucket) produces a running total.','A month is coarse when you only have a few weeks of logs, so here you’ll bucket by week. A CTE for the rollup plus a window over it is the pattern behind every equity curve and trend report.'],
 ex:R`SELECT strftime('%Y-%m', day) AS month,
       SUM(minutes) AS minutes,
       SUM(SUM(minutes)) OVER (ORDER BY strftime('%Y-%m', day)) AS total_so_far
FROM study
GROUP BY month
ORDER BY month;   -- your study time, month by month`,
 task:'Your P&amp;L curve, week by week. Columns: <b>week</b> (strftime(\'%Y-%W\', day)), <b>pnl</b> (that week’s total) and <b>running_total</b> (all weeks so far), both rounded to 2, ordered by week.',
 start:R`WITH w AS (
  SELECT strftime('%Y-%W', day) AS week,
         SUM(pnl) AS pnl
  FROM trades
  GROUP BY week
)
SELECT week,
FROM w
ORDER BY week;`,
 sol:R`WITH w AS (
  SELECT strftime('%Y-%W', day) AS week,
         SUM(pnl) AS pnl
  FROM trades
  GROUP BY week
)
SELECT week, ROUND(pnl, 2) AS pnl,
       ROUND(SUM(pnl) OVER (ORDER BY week), 2) AS running_total
FROM w
ORDER BY week;`,
 hint:'SUM(pnl) OVER (ORDER BY week)'},
{id:'sql22',t:'sql',lv:4,title:'Moving averages: window frames',ordered:true,
 learn:['A <b>window frame</b> says which rows around the current one an aggregate sees. AVG(x) OVER (ORDER BY day <b>ROWS BETWEEN 6 PRECEDING AND CURRENT ROW</b>) averages this row and the 6 before it: a 7-row moving average. The first rows simply see fewer rows (1, 2, … 6), so they average what exists so far. Count the current row: 6 PRECEDING plus the current row is 7 rows, not 6.','Gotcha: with ORDER BY and <i>no</i> frame, the default is RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW: the running figure from the running-totals lesson, not a moving one. And aggregate to one row per day in a CTE first; a frame over raw <b>meals</b> counts meals, not days.',"<b>ROWS</b> counts rows, not dates: a day you logged nothing isn’t a 0, it simply isn’t there. For a calendar window, order by a number and use <b>RANGE</b>: ORDER BY julianday(day) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW covers the last 7 calendar days, however many rows fall in them. (Postgres: ORDER BY day RANGE BETWEEN INTERVAL '6 days' PRECEDING AND CURRENT ROW.)"],
 ex:R`SELECT day, minutes,
       ROUND(AVG(minutes) OVER (ORDER BY time
             ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 1) AS avg_last_3_sessions,
       SUM(minutes) OVER (ORDER BY julianday(day)
             RANGE BETWEEN 6 PRECEDING AND CURRENT ROW) AS min_last_7_days
FROM study
ORDER BY time;   -- 3 sessions vs 7 calendar days: compare them after a gap`,
 task:'Smooth out your calorie log: a <b>5-day moving average</b> of your daily <b>kcal</b> from <b>meals</b>, over the days you logged at least one meal. Columns: <b>day</b>, <b>kcal</b> (that day’s total) and <b>ma5</b> (the average of that day’s total and the totals of the 4 logged days before it; your first 4 days average only the days that exist so far), both rounded to 2, ordered by day.',
 start:R`WITH d AS (
  SELECT day, SUM(kcal) AS kcal
  FROM meals
  GROUP BY day
)
SELECT day, ROUND(kcal, 2) AS kcal,
       ROUND(AVG(kcal) OVER (ORDER BY day                ), 2) AS ma5
FROM d
ORDER BY day;`,
 sol:R`WITH d AS (
  SELECT day, SUM(kcal) AS kcal
  FROM meals
  GROUP BY day
)
SELECT day, ROUND(kcal, 2) AS kcal,
       ROUND(AVG(kcal) OVER (ORDER BY day
             ROWS BETWEEN 4 PRECEDING AND CURRENT ROW), 2) AS ma5
FROM d
ORDER BY day;`,
 hint:'Put a frame after ORDER BY day inside OVER: ROWS BETWEEN n PRECEDING AND CURRENT ROW, and remember the current day is one of the 5.'},
{id:'sql11',t:'sql',lv:4,title:'Latest record per key',
 learn:['A top data-engineering pattern: keep only the newest row per thing (last session, current weight, latest status). Number the rows per key newest-first with ROW_NUMBER and keep row 1.','Always add a tie-breaker to ORDER BY (e.g. id DESC) so the result is the same every time two rows share a timestamp.'],
 ex:R`SELECT practice, day, minutes FROM (
  SELECT m.*, ROW_NUMBER() OVER (PARTITION BY practice ORDER BY time DESC, id DESC) AS rn
  FROM mind m
) WHERE rn = 1;   -- your last session of each practice`,
 task:'The <b>last time you did each exercise</b>. Columns: <b>exercise</b>, <b>type</b>, <b>day</b>. Newest by <b>time</b>; break ties by the highest id.',
 start:R`SELECT exercise, type, day
FROM (
  SELECT w.*,
    ROW_NUMBER() OVER (            ) AS rn
  FROM workouts w
)
WHERE rn = 1;`,
 sol:R`SELECT exercise, type, day
FROM (
  SELECT w.*,
    ROW_NUMBER() OVER (PARTITION BY exercise ORDER BY time DESC, id DESC) AS rn
  FROM workouts w
)
WHERE rn = 1;`,
 hint:'PARTITION BY exercise ORDER BY time DESC, id DESC'},
{id:'sql23',t:'sql',lv:4,title:'Median & percentiles',
 learn:['The <b>median</b> is the middle value once the values are sorted, or the average of the two middle values when the count is even. A few very long holds pull the mean up but barely move the median, so it describes skewed data honestly. Postgres and Snowflake have PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x), Snowflake and Oracle also MEDIAN(x); standard SQLite has neither.','Build it from window functions. In a CTE, number the rows with ROW_NUMBER() OVER (PARTITION BY g ORDER BY x) AS rn and count them with COUNT(*) OVER (PARTITION BY g) AS n. Then average x where <b>rn IN ((n + 1) / 2, (n + 2) / 2)</b>: integer division picks the one middle row when n is odd and the two middle rows when n is even. (MySQL and Snowflake divide to decimals: wrap each in FLOOR there.)','Gotchas: rn = (n + 1) / 2 alone gives the lower middle for even counts, so test both. A WHERE on rn drops all the other rows, so a COUNT(*) or AVG(x) in that query sees only the middle ones: compute those first, or use AVG(CASE WHEN … THEN x END). NTILE(4) OVER (ORDER BY x) cuts the sorted rows into 4 near-equal groups (quartiles); equal values can straddle two. sql.js adds a non-standard median(): don’t count on it elsewhere.'],
 ex:R`SELECT quartile, COUNT(*) AS sessions,
       MIN(minutes) AS from_min, MAX(minutes) AS to_min
FROM (
  SELECT minutes, NTILE(4) OVER (ORDER BY minutes, id) AS quartile
  FROM mind
)
GROUP BY quartile
ORDER BY quartile;   -- how long your mind sessions run, in quarters`,
 task:'How long do you really hold a trade? Per <b>contract</b>: <b>trades</b> (count), <b>avg_min</b> (mean of <b>minutes</b>, rounded to 2) and <b>median_min</b> (median of minutes, rounded to 2: the middle value once that contract’s trades are sorted by minutes, or the average of the two middle values when the count is even). Row order free.',
 start:R`WITH r AS (
  SELECT contract, minutes,
         ROW_NUMBER() OVER (                ) AS rn,
         COUNT(*) OVER (PARTITION BY contract) AS n
  FROM trades
)
SELECT contract,
FROM r
GROUP BY contract;`,
 sol:R`WITH r AS (
  SELECT contract, minutes,
         ROW_NUMBER() OVER (PARTITION BY contract ORDER BY minutes) AS rn,
         COUNT(*) OVER (PARTITION BY contract) AS n
  FROM trades
)
SELECT contract,
       COUNT(*) AS trades,
       ROUND(AVG(minutes), 2) AS avg_min,
       ROUND(AVG(CASE WHEN rn IN ((n + 1) / 2, (n + 2) / 2) THEN minutes END), 2) AS median_min
FROM r
GROUP BY contract;`,
 hint:'Partition both windows by contract and number by minutes; AVG(CASE WHEN rn IN ((n + 1) / 2, (n + 2) / 2) THEN minutes END) then sits next to a plain AVG(minutes).'},
{id:'sql12',t:'sql',lv:4,title:'Cohort conversion by week',
 learn:['Cohort analysis groups things by when they started and measures how many “converted”. Treat each week’s urges in REWIRE as a cohort: how many of them did you turn into a win (<b>resisted</b>) rather than a <b>slipped</b>? It combines date bucketing, conditional counts and a ratio.','Multiply by 100.0 (not 100) to force decimal division; integer division silently truncates in many databases.'],
 ex:R`SELECT strftime('%Y-%W', c.day) AS week,
       COUNT(DISTINCT c.day) AS checkin_days,
       COUNT(DISTINCT w.day) AS trained,
       ROUND(COUNT(DISTINCT w.day) * 100.0 / COUNT(DISTINCT c.day), 1) AS pct
FROM checkins c
LEFT JOIN workouts w ON w.day = c.day
GROUP BY week;   -- of the days you checked in, how many did you train?`,
 task:'Per <b>week</b> (strftime(\'%Y-%W\', day)), of your urges (event <b>resisted</b> or <b>slipped</b>): <b>week</b>, <b>urges</b>, <b>resisted</b>, <b>pct</b> = resisted×100.0/urges rounded to 1.',
 start:R`SELECT strftime('%Y-%W', day) AS week,
       COUNT(*) AS urges,

FROM habits
WHERE event IN ('resisted', 'slipped')
GROUP BY week;`,
 sol:R`SELECT strftime('%Y-%W', day) AS week,
       COUNT(*) AS urges,
       SUM(CASE WHEN event = 'resisted' THEN 1 ELSE 0 END) AS resisted,
       ROUND(SUM(CASE WHEN event = 'resisted' THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS pct
FROM habits
WHERE event IN ('resisted', 'slipped')
GROUP BY week;`,
 hint:"Count resisted urges with SUM(CASE WHEN event = 'resisted' THEN 1 ELSE 0 END), then divide by COUNT(*) using 100.0."},
{id:'sql24',t:'sql',lv:4,title:'Gaps & islands: streaks',
 learn:['A streak is an <b>island</b> of consecutive days; the missing days between streaks are <b>gaps</b>. The trick: number the days in order and subtract. <b>julianday(day) - ROW_NUMBER() OVER (ORDER BY day)</b> stays the same while the days are consecutive (both go up by 1) and jumps after every gap. GROUP BY that key and take MIN(day), MAX(day) and COUNT(*) per streak.',"Gotchas: it needs exactly one row per day. With two sessions on one day the numbering runs ahead of the calendar and the keys go wrong (streaks split and merge), so GROUP BY day in a CTE first, or use DENSE_RANK, which gives same-day rows the same number. Subtract from julianday(day): '2026-09-03' - 1 is 2025, because SQLite reads the text as the number 2026.",'Another way: flag a day whose gap to the previous one (LAG) is more than 1 day, and a running SUM of the flags numbers the streaks. For runs of rows rather than days (winning trades in a row), subtract two ROW_NUMBERs: one over all rows, one per state.'],
 ex:R`SELECT MIN(day) AS first_day, MAX(day) AS last_day, COUNT(*) AS days
FROM (
  SELECT day, julianday(day) - ROW_NUMBER() OVER (ORDER BY day) AS grp
  FROM checkins            -- one row per day already
)
GROUP BY grp
ORDER BY first_day;   -- your check-in streaks`,
 task:'Your <b>MIND streaks</b>: every run of consecutive calendar days with at least one session in <b>mind</b> (a day without a session ends the streak; a single day counts as a streak of 1). One row per streak: <b>start_day</b>, <b>end_day</b>, <b>days</b> (calendar days in the streak) and <b>sessions</b> (mind sessions logged in it). Some days have more than one session. Row order free.',
 start:R`WITH d AS (            -- one row per day, with its session count
  SELECT
  FROM mind
),
g AS (                 -- the same key for consecutive days
  SELECT day, sessions,
                       AS grp
  FROM d
)
SELECT
FROM g
GROUP BY grp;`,
 sol:R`WITH d AS (
  SELECT day, COUNT(*) AS sessions
  FROM mind
  GROUP BY day
),
g AS (
  SELECT day, sessions,
         julianday(day) - ROW_NUMBER() OVER (ORDER BY day) AS grp
  FROM d
)
SELECT MIN(day) AS start_day, MAX(day) AS end_day,
       COUNT(*) AS days, SUM(sessions) AS sessions
FROM g
GROUP BY grp;`,

{id:'py1',t:'py',lv:1,title:'Filtering a DataFrame',
 learn:['pandas holds tables as DataFrames. Every app log is preloaded: <b>trades</b>, <b>workouts</b>, <b>mind</b>, <b>meals</b>, <b>habits</b>, <b>checkins</b>, <b>study</b>, with pd and np imported.','Filter rows with a boolean mask: df[df["col"] == value]. Combine masks with &amp; (and) or | (or), each in brackets. Select columns with a list: df[["a","b"]]. Assign your answer to <b>result</b>.'],
 ex:R`cardio = workouts[(workouts["type"] == "Cardio") & (workouts["minutes"] > 0)]
print(cardio[["day", "exercise", "minutes"]])`,
 task:'Which <b>Short</b> trades lost you money? Return the <b>Short</b> trades with <b>pnl &lt; 0</b> as <b>result</b>, columns <b>day</b>, <b>contract</b>, <b>pnl</b>.',
 start:R`result = trades[`,
 sol:R`result = trades[(trades["side"] == "Short") & (trades["pnl"] < 0)][["day", "contract", "pnl"]]`,

{id:'py2',t:'py',lv:1,title:'Sorting & head',ordered:true,

{id:'py12',t:'py',lv:1,title:'New columns: vectorized math',
 learn:['df["new"] = expression builds a whole column in one go: trades["gross"] = trades["pnl"] + trades["fees"] adds the fees back on every row, with no loop. That is <b>vectorized</b> math, and + - * / work the same way between two columns or with a number. df.assign(gross=...) builds the same column but returns a new frame and leaves df untouched, so it fits in a chain.','A comparison is a vectorized column too: trades["pnl"] &gt; 0 is True or False for every row. Use it as a filter mask, df[mask], or summarise it: .sum() counts the Trues and .mean() gives the rate. Keep True/False columns as helpers; the answers you hand in are numbers or text.','Gotchas: NaN spreads. Arithmetic with NaN gives NaN, and a comparison with NaN is False (only != is True), so a <b>mind</b> session with a missing mood gets a NaN difference and silently drops out of any &gt;= filter on it. And before adding a column to a filtered slice (w = workouts[...]), take .copy(): otherwise pandas warns (SettingWithCopyWarning) and you can&rsquo;t be sure which frame you changed.'],
 ex:R`w = workouts.copy()
w["volume"] = w["sets"] * w["reps"] * w["load"]   # NaN where there is no load
print(w[["exercise", "type", "volume"]].head(7))
win = trades["pnl"] > 0                            # True/False for every trade
print("wins:", win.sum(), "of", len(win), "| win rate:", round(win.mean(), 3))`,
 task:'Which sessions give your mood a real lift? Add a column <b>lift</b> = <b>mood_after</b> minus <b>mood_before</b> to <b>mind</b>, then return the sessions with a <b>lift</b> of 2 or more (2 included). Columns: <b>day</b>, <b>practice</b>, <b>technique</b>, <b>lift</b> (not rounded). A session with a missing mood has no lift, so it drops out.',
 start:R`mind["lift"] =
result = `,
 sol:R`mind["lift"] = mind["mood_after"] - mind["mood_before"]
result = mind[mind["lift"] >= 2][["day", "practice", "technique", "lift"]]`,
 hint:'Subtract mood_before from mood_after into mind["lift"], then keep the rows where mind["lift"] >= 2 and pick the four columns.'},
{id:'py3',t:'py',lv:1,title:'groupby basics',
 learn:['df.groupby("col") splits rows into groups; .size() counts rows; .agg(...) applies aggregates. as_index=False (or reset_index()) keeps the group key as a column.','Named aggregation gives tidy columns: df.groupby("side", as_index=False).agg(n=("id", "size"), pnl=("pnl", "sum")) is SELECT side, COUNT(*), SUM(pnl) … GROUP BY side.'],
 ex:R`print(mind.groupby("practice", as_index=False).agg(sessions=("id", "size"), avg_min=("minutes", "mean")).round(2))`,
 task:'Do you trade better Long or Short? Per <b>side</b>: number of trades and total P&amp;L (rounded to 2). Columns: <b>side</b>, <b>n</b>, <b>pnl</b>.',
 start:R`result = trades.groupby("side", as_index=False)`,
 sol:R`result = trades.groupby("side", as_index=False).agg(n=("id", "size"), pnl=("pnl", "sum")).round(2)`,
 hint:'.agg(n=("id", "size"), pnl=("pnl", "sum")).round(2)'},
{id:'py13',t:'py',lv:1,title:'value_counts & nunique',
 learn:['s.value_counts() counts how often each distinct value occurs, most frequent first: meals["kind"].value_counts() is bowls vs snacks. value_counts(normalize=True) gives shares from 0 to 1 instead (multiply by 100 for %). s.nunique() counts the distinct values, like COUNT(DISTINCT ...) in SQL: workouts["day"].nunique() is how many days you trained.','nunique works per group as well: workouts.groupby("exercise")["day"].nunique() is the number of different days you did each exercise, and ("day", "nunique") does the same inside named aggregation. size counts rows, nunique counts different values: two shakes on one day are 2 rows but 1 day.','Gotchas: the result is a <b>Series</b> indexed by the values and named <i>count</i> (or <i>proportion</i> with normalize=True). reset_index(name="n") turns it into two columns, the value and n; add rename_axis("new_name") first if the index has no name. Missing values are left out unless you pass dropna=False, so the shares are shares of the non-missing rows.'],
 ex:R`print(workouts["type"].value_counts())                         # rows per type, most frequent first
print(workouts["type"].value_counts(normalize=True).round(3))  # shares from 0 to 1
print("training days:", workouts["day"].nunique())
days = workouts.groupby("exercise")["day"].nunique()           # distinct days per exercise
print(days.reset_index(name="days").head())`,
 task:'Your go-to foods. For each meal <b>name</b> in <b>meals</b>: <b>n</b> = how many times you logged it, and <b>pct</b> = its share of all meals logged, in % (0 to 100), rounded to 1. Columns: <b>name</b>, <b>n</b>, <b>pct</b>.',
 start:R`counts = meals["name"].value_counts()
result = `,
 sol:R`counts = meals["name"].value_counts().reset_index(name="n")
counts["pct"] = (counts["n"] * 100 / counts["n"].sum()).round(1)
result = counts`,
 hint:'reset_index(name="n") turns value_counts() into columns; pct is n * 100 divided by the total of n, rounded to 1.'},
{id:'py14',t:'py',lv:1,title:'Missing values: isna & count',
 learn:['NaN marks a value that was never recorded: an unrated session has no <b>depth</b>, a skipped weigh-in has no <b>weight</b>. s.isna() (or notna()) is True/False per row, so s.isna().sum() counts the gaps and df.isna().sum() counts them for every column. NaN == NaN is False, so never test with == np.nan or == None: that finds nothing.','Aggregates treat NaN differently: <b>size</b> counts rows, <b>count</b> counts non-missing values, and sum and mean skip NaN, so a mean is the average of the values that exist. A group with no values at all gets mean NaN, which is honest: there is nothing to average. Its sum, though, is 0.','Handle gaps on purpose: dropna(subset=["depth"]) drops those rows and fillna(value) fills them. Filling with 0 before a mean is the classic bug: every missing value counts as a 0 and drags the average down. And value_counts skips NaN unless you pass dropna=False.'],
 ex:R`print(checkins.isna().sum())                        # gaps per column
w = checkins["weight"]
print("days:", w.size, "| weigh-ins:", w.count(), "| skipped:", w.isna().sum())
print("found with == np.nan:", (w == np.nan).sum())  # always 0
print("mean:", round(w.mean(), 2), "| after fillna(0):", round(w.fillna(0).mean(), 2))
print(workouts.groupby("type").agg(rows=("id", "size"), timed=("minutes", "count"), avg_min=("minutes", "mean")).round(1))`,
 task:'A missing-data audit of your <b>mind</b> log, per <b>practice</b>: <b>sessions</b> (all rows), <b>rated</b> (sessions that have a <b>depth</b>), <b>avg_depth</b> (mean depth of the rated sessions, rounded to 2; a practice you never rated keeps NaN here, not 0) and <b>no_mood</b> (sessions whose <b>mood_after</b> is missing). Columns: <b>practice</b>, <b>sessions</b>, <b>rated</b>, <b>avg_depth</b>, <b>no_mood</b>.',
 start:R`m = mind.copy()
m["no_mood"] =
result = m.groupby("practice", as_index=False).agg(`,
 sol:R`m = mind.copy()
m["no_mood"] = m["mood_after"].isna()
result = m.groupby("practice", as_index=False).agg(
    sessions=("id", "size"),
    rated=("depth", "count"),
    avg_depth=("depth", "mean"),
    no_mood=("no_mood", "sum"),
).round(2)`,
 hint:'size counts rows and count skips NaN; flag the gaps with m["mood_after"].isna() and sum that column in the agg.'},
{id:'py4',t:'py',lv:2,title:'merge: joining two apps on day',
 learn:['df.merge(other, on="day") is a SQL join (how="inner" by default; also "left", "right", "outer"). Every app log has a <b>day</b> column, so day is how you line up two apps.','Aggregate first when one side has many rows per day (trades, meals), so you join one row per day to one row per day.'],
 ex:R`protein = meals.groupby("day", as_index=False)["protein"].sum()
trained = workouts[["day"]].drop_duplicates()
print(protein.merge(trained, on="day").head())`,

 start:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()
result = `,
 sol:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()
m = checkins.merge(daily, on="day")
result = m[["day", "sleep", "energy", "pnl"]].round(2)`,
 hint:'checkins.merge(daily, on="day"), then select [["day", "sleep", "energy", "pnl"]].'},
{id:'py15',t:'py',lv:2,title:'concat: stacking tables',
 learn:["<code>pd.concat([a, b], ignore_index=True)</code> stacks tables one under the other: SQL's UNION ALL. merge, from the lesson on joining two apps, puts two tables <i>side by side</i> on a key; concat puts them <i>on top of each other</i> and lines the columns up by <b>name</b>. Use it when two logs record the same kind of thing, like the minutes in <b>mind</b> and the minutes in <b>study</b>.",'Once stacked, the rows look alike, so label each input <i>before</i> stacking: <code>mind[["day", "minutes"]].assign(app="MIND")</code>. The label is then an ordinary column you can filter, count or <code>nunique</code> per group. concat keeps duplicates (UNION ALL, not UNION), and without <code>ignore_index=True</code> the old index numbers repeat (0, 1, 2 ... then 0, 1, 2 again).',"Columns are matched by name, not position. A column that only one input has is filled with NaN on the other input's rows, and the same column spelled two ways becomes two half-empty columns. So select (and rename) the same columns on every input first, then stack."],
 ex:R`logged = pd.concat([
    trades[["day"]].assign(app="JOURNAL"),
    workouts[["day"]].assign(app="TRAINING"),
    meals[["day"]].assign(app="NUTRITION"),
], ignore_index=True)
print(logged.tail(3))
print(logged.groupby("app").agg(entries=("day", "size"), first=("day", "min"), last=("day", "max")))`,
 task:'Your daily focus time across <b>MIND</b> and <b>LEARN</b>. Stack the <b>mind</b> and <b>study</b> sessions (<b>day</b>, <b>minutes</b> and an <b>app</b> label, MIND or LEARN, saying where each row came from) into one table. Then, for every day with at least one session in either app: <b>apps</b> (how many of the two apps you used that day: 1 or 2), <b>sessions</b> (number of sessions across both apps) and <b>minutes</b> (total minutes across both). Columns: <b>day</b>, <b>apps</b>, <b>sessions</b>, <b>minutes</b>.',
 start:R`m = mind[["day", "minutes"]].assign(app="MIND")
s =
both = pd.concat(
result = `,
 sol:R`m = mind[["day", "minutes"]].assign(app="MIND")
s = study[["day", "minutes"]].assign(app="LEARN")
both = pd.concat([m, s], ignore_index=True)
result = both.groupby("day", as_index=False).agg(apps=("app", "nunique"), sessions=("app", "size"), minutes=("minutes", "sum"))`,
 hint:'Tag each side with .assign(app=...) before pd.concat; then, per day, apps is the nunique of app and sessions the row count (size).'},
{id:'py5',t:'py',lv:2,title:'pivot_table',
 learn:['pivot_table reshapes long data into a matrix: index = rows, columns = new column headers, values + aggfunc = what fills the cells. fill_value=0 replaces missing combinations.','pd.to_datetime(...) turns the <b>day</b> text into real dates; .dt.day_name(), .dt.month, .dt.year extract parts. pandas sorts the new columns alphabetically.'],
 ex:R`print(trades.pivot_table(index="contract", columns="side", values="pnl", aggfunc="sum", fill_value=0))`,
 task:'When do you practise what? Total <b>mind</b> minutes by <b>practice</b> (rows) and weekday name (columns, from .dt.day_name()), missing = 0. Columns: <b>practice</b>, then one column per weekday in pandas&rsquo; default (alphabetical) order.',

m["weekday"] = pd.to_datetime(m["day"]).dt.day_name()
result = `,

m["weekday"] = pd.to_datetime(m["day"]).dt.day_name()

 hint:'pivot_table(index="practice", columns="weekday", values="minutes", aggfunc="sum", fill_value=0)'},
{id:'py16',t:'py',lv:2,title:'melt: wide to long',
 learn:['Data often arrives <b>wide</b>: one column per moment, metric or month, like <b>mood_before</b> and <b>mood_after</b> in <b>mind</b>. <code>melt</code> makes it <b>long</b>: <code>meals.melt(id_vars=["day", "name"], value_vars=["protein", "carbs", "fat"], var_name="macro", value_name="grams")</code> gives one row per meal and melted column, with the old column name in <b>macro</b> and its value in <b>grams</b>. It is the reverse of pivot_table: melt goes wide to long, pivot_table long to wide.','Long data is what groupby wants: once mood_before and mood_after are rows, "per practice and moment" is a plain <code>groupby(["practice", "moment"])</code>, and a third moment would only be one more name in value_vars. Only melt columns that measure the same thing on the same scale: two 1-10 moods or three macros in grams, yes; a mood and minutes, no.','Columns in neither id_vars nor value_vars are dropped. Leave value_vars out and pandas melts <i>every</i> other column (id, time, minutes ...) into one mixed column. A missing value stays as a row with NaN: <code>mean</code> and <code>count</code> skip it, but <code>size</code> counts it, as in the missing-values lesson.'],
 ex:R`long = checkins.melt(id_vars="day", value_vars=["quality", "energy"], var_name="metric", value_name="score")
print(len(checkins), "wide rows ->", len(long), "long rows")
print(long.head(3))
print(long.value_counts(["metric", "score"]).sort_index())`,
 task:"Mood before vs after, per practice, as a long table. Melt <b>mind</b>'s <b>mood_before</b> and <b>mood_after</b> into rows, then per <b>practice</b> and <b>moment</b>: <b>n</b> (how many of those moods were recorded; a missing mood doesn't count) and <b>mood</b> (their mean, rounded to 2). Keep every practice and moment, even one with no recorded mood at all (n is then 0 and mood NaN). Columns: <b>practice</b>, <b>moment</b> (the original column name: mood_before or mood_after), <b>n</b>, <b>mood</b>.",
 start:R`long = mind.melt(id_vars=
result = `,
 sol:R`long = mind.melt(id_vars="practice", value_vars=["mood_before", "mood_after"], var_name="moment", value_name="mood")
result = long.groupby(["practice", "moment"], as_index=False).agg(n=("mood", "count"), mood=("mood", "mean")).round(2)`,
 hint:'Melt with id_vars="practice" and value_vars=["mood_before", "mood_after"], then group by practice and moment: count skips the NaN moods, size does not.'},
{id:'py6',t:'py',lv:2,title:'np.where: derived categories',

 ex:R`c = checkins.copy()
c["night"] = np.where(c["sleep"] >= 7, "good", "short")
print(c.groupby("night", as_index=False)["energy"].mean().round(2))`,

 start:R`t = trades.copy()
t["result"] = np.where(t["pnl"] > 0, "green", np.where(            ))
result = `,

{id:'py17',t:'py',lv:2,title:'String methods with .str',
 learn:['The <b>.str</b> accessor runs a string operation on every value of a text column, no loop: <code>trades["contract"].str[:2]</code> (first two characters: NQZ6 becomes NQ), <code>.str.len()</code>, <code>.str.lower()</code>, <code>.str.strip()</code>, <code>.str.startswith("Bench")</code>, <code>.str.contains("Press")</code>, <code>.str.replace(old, new)</code>. Each gives a new column you can filter or group by.','<code>.str.split(" ")</code> gives a <i>list</i> per row, so pick a piece with another <code>.str[n]</code>: <code>meals["name"].str.split(" ").str[0]</code> turns "Salmon bowl" into "Salmon", and <code>.str[-1]</code> takes the last piece. Parsing a text key into a coarser one changes what you can group by: several names can fall into one group.','It only works on text: a number column raises an AttributeError (<code>.astype(str)</code> first). A missing value stays missing, so a <code>contains</code> filter needs <code>na=False</code>. <code>contains</code> reads its pattern as a <b>regex</b> by default, so "Almonds (1 oz)" doesn\'t match itself: the parentheses are regex syntax. Pass <code>regex=False</code> for plain text. <code>replace</code> is plain text by default in pandas 2; real regex comes later, in Regex extraction from logs.'],
 ex:R`t = trades.copy()
t["root"] = t["contract"].str[:2]      # NQZ6 -> NQ (the market)
t["expiry"] = t["contract"].str[-2:]   # Z6 -> December 2026
print(t[["contract", "root", "expiry"]].drop_duplicates())
bowls = meals[meals["name"].str.endswith(" bowl")]
print(bowls["name"].str.split(" ").str[0].value_counts())
print(meals["name"].str.contains("(1 oz)", regex=False).sum(), "meals measured in oz")`,
 task:'Your lifting by movement family. Take the <b>Weighted</b> workouts only and give each one a <b>family</b>: the last word of its exercise name, words being separated by spaces (Bench Press, Leg Press and Overhead Press are all <b>Press</b>; Deadlift stays <b>Deadlift</b>). Per family: <b>exercises</b> (how many distinct exercise names it groups) and <b>sets</b> (total sets). Columns: <b>family</b>, <b>exercises</b>, <b>sets</b>.',
 start:R`w = workouts[workouts["type"] == "Weighted"].copy()
w["family"] =
result = `,
 sol:R`w = workouts[workouts["type"] == "Weighted"].copy()
w["family"] = w["exercise"].str.split(" ").str[-1]
result = w.groupby("family", as_index=False).agg(exercises=("exercise", "nunique"), sets=("sets", "sum"))`,
 hint:'The last word is .str.split(" ").str[-1]; then, per family, the nunique of exercise and the sum of sets.'},
{id:'py7',t:'py',lv:3,title:'Dates & weekly buckets',ordered:true,

print(s.groupby("month", as_index=False)["minutes"].sum())`,

 start:R`t = trades.copy()
t["week"] =
