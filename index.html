 start:R`t = trades.copy()
t["week"] =
result = `,

{id:'py18',t:'py',lv:3,title:'Anti-joins: rows with no match',
 learn:['An <b>anti-join</b> keeps the rows that have <i>no</i> match in another table: trading days with no check-in, customers who never ordered. An inner merge silently drops exactly these rows, so you have to ask for them. For one key, <code>isin</code> marks the values that appear in the other column (SQL IN) and <code>~</code> flips the mask: <code>df[~df["day"].isin(checkins["day"])]</code> is SQL\'s NOT IN, or LEFT JOIN ... WHERE right.day IS NULL.','For several key columns, or to see both sides at once, merge with <code>how="left", indicator=True</code>: pandas adds a <b>_merge</b> column that says <b>both</b> or <b>left_only</b>, and you keep <code>_merge == "left_only"</code>. Merge on the right side\'s keys only, deduplicated (<code>other[["day"]].drop_duplicates()</code>), or a key that appears twice there doubles the matched rows.','Test isin or the indicator, never a column from the other table: after a left merge, <b>weight</b> is NaN on days with no check-in <i>and</i> on check-ins where you skipped the scale. ~ binds tighter than &amp;: <code>~a &amp; b</code> negates only a, <code>~(a &amp; b)</code> the whole mask. And decide which rows could have matched at all: days before you started an app aren\'t "skipped".'],
 ex:R`meal_days = meals[["day"]].drop_duplicates()
# one key: a negated isin
no_checkin = meal_days[~meal_days["day"].isin(checkins["day"])]
print(no_checkin["day"].tolist())
# same question with the indicator (works for multi-column keys too)
m = meal_days.merge(checkins[["day"]].drop_duplicates(), on="day", how="left", indicator=True)
print(m["_merge"].value_counts())
print(m[m["_merge"] == "left_only"]["day"].tolist())`,
 task:"Trading days when you skipped the morning check-in. For every trading day (a <b>day</b> in <b>trades</b>) that has no row in <b>checkins</b>, counting only days on or after the earliest day in <b>checkins</b> (before it you weren't using TODAY yet): <b>day</b>, <b>trades</b> (how many trades that day), <b>pnl</b> (that day's total, rounded to 2). Columns: <b>day</b>, <b>trades</b>, <b>pnl</b>.",
 start:R`daily = trades.groupby("day", as_index=False).agg(trades=("id", "size"), pnl=("pnl", "sum"))
first = checkins["day"].min()
result = daily[`,
 sol:R`daily = trades.groupby("day", as_index=False).agg(trades=("id", "size"), pnl=("pnl", "sum"))
first = checkins["day"].min()
skipped = ~daily["day"].isin(checkins["day"]) & (daily["day"] >= first)
result = daily[skipped].round(2)`,
 hint:'Mask with ~daily["day"].isin(checkins["day"]), add the bound against first with & (in brackets), then round(2).'},
{id:'py8',t:'py',lv:3,title:'Top-N per group',

 ex:R`top2 = mind.sort_values(["practice", "minutes", "id"], ascending=[True, False, False]).groupby("practice").head(2)
print(top2[["practice", "day", "minutes"]])`,

 start:R`w = workouts[workouts["type"] == "Weighted"]
w = w.sort_values(
result = `,
 sol:R`w = workouts[workouts["type"] == "Weighted"]
w = w.sort_values(["exercise", "load", "id"], ascending=[True, False, False])

 hint:'sort_values(["exercise", "load", "id"], ascending=[True, False, False]).groupby("exercise").head(3)'},
{id:'py19',t:'py',lv:3,title:'shift & diff: the previous row',
 learn:['<code>shift()</code> moves a column down one row, so each row can see the previous row\'s value: the pandas form of SQL\'s LAG (<code>shift(-1)</code> looks ahead, like LEAD). <code>diff()</code> is the shortcut for <code>x - x.shift()</code>, the change since the previous row. "Previous" just means the row above, so sort first (by id or time).','To restart for every day, practice or contract, shift within groups, the same sort-then-groupby move as Top-N per group: <code>t.groupby("day")["pnl"].shift()</code>. Each group\'s first row gets NaN. A plain <code>t["pnl"].shift()</code> hands the previous day\'s last trade to the next day\'s first one, the most common bug here.','That NaN means "there is no previous row". Drop it (<code>dropna(subset=[...])</code>) before you label or count; a filler like fillna(0), or a label built on NaN, quietly turns "no previous trade" into "previous trade was flat". For dates, convert with pd.to_datetime first: the diff is a Timedelta, and <code>.dt.days</code> makes it a number.'],
 ex:R`m = mind.sort_values("id").copy()
m["date"] = pd.to_datetime(m["day"])
m["prev_min"] = m.groupby("practice")["minutes"].shift()
m["gap_days"] = m.groupby("practice")["date"].diff().dt.days
print(m[["practice", "day", "minutes", "prev_min", "gap_days"]].head(8))
# average days between two sessions of the same practice
print(m.groupby("practice")["gap_days"].mean().round(1))`,
 task:'Do you trade worse after a loss? Take <b>trades</b> in <b>id</b> order. For every trade that isn\'t the first of its <b>day</b>, look at the previous trade on that same day and label the trade <b>"after win"</b> (previous pnl &gt; 0), <b>"after loss"</b> (previous pnl &lt; 0) or <b>"after flat"</b> (previous pnl = 0). Leave out each day\'s first trade. Per label: <b>after</b>, <b>trades</b> (count), <b>avg_pnl</b> (mean pnl of the labelled trades themselves, rounded to 2). Columns: <b>after</b>, <b>trades</b>, <b>avg_pnl</b>.',
 start:R`t = trades.sort_values("id").copy()
t["prev"] =
result = `,
 sol:R`t = trades.sort_values("id").copy()
t["prev"] = t.groupby("day")["pnl"].shift()
t = t.dropna(subset=["prev"])
t["after"] = np.where(t["prev"] > 0, "after win", np.where(t["prev"] < 0, "after loss", "after flat"))
result = t.groupby("after", as_index=False).agg(trades=("id", "size"), avg_pnl=("pnl", "mean")).round(2)`,
 hint:'t.groupby("day")["pnl"].shift() gives each trade the previous pnl of its day (NaN for the first); drop those rows, then label with np.where.'},
{id:'py20',t:'py',lv:3,title:'transform: group totals on each row',
 learn:['<code>groupby(key)[col].transform("sum")</code> computes each group\'s total but hands it back on <i>every original row</i>, with the same length and index as the frame. agg collapses a group to one row; transform keeps the rows and adds context. So <code>m["day_kcal"] = m.groupby("day")["kcal"].transform("sum")</code> puts the day\'s total next to each meal, ready for a share.','It also keeps or drops rows by a group property without collapsing anything: <code>trades[trades.groupby("day")["id"].transform("size") &gt;= 3]</code> keeps every trade of the days with at least 3 trades (HAVING, but you keep the rows). Compare a row with <code>transform("max")</code> to keep the group\'s top rows, or subtract <code>transform("mean")</code> to see how far it is from average.','transform lines up on the original index, so assign it straight back as a column; no merge needed. Assigning an agg result instead (<code>m.groupby("day")["kcal"].sum()</code>) aligns day labels against row numbers and fills the column with NaN. Give transform one function, usually by name ("sum", "mean", "max", "size"; named aggregation doesn\'t apply), and use agg when you want one row per group.'],
 ex:R`m = mind.copy()
m["avg_min"] = m.groupby("practice")["minutes"].transform("mean")
m["vs_avg"] = m["minutes"] - m["avg_min"]
print(m[["practice", "day", "minutes", "avg_min", "vs_avg"]].head(6).round(1))
# every session that ties its practice's longest one (all ties stay)
longest = m[m["minutes"] == m.groupby("practice")["minutes"].transform("max")]
print(longest[["practice", "day", "minutes"]])`,
 task:"Meals that were more than half of the day's calories. Only look at days with at least 2 meals logged (2 or more rows in <b>meals</b>; snacks count). For each meal on those days: <b>day</b>, <b>name</b>, <b>kcal</b> (as logged), <b>pct</b> = the meal's kcal * 100 / that day's total kcal (all of that day's rows), rounded to 1. Keep the meals whose pct <i>before rounding</i> is above 50. Columns: <b>day</b>, <b>name</b>, <b>kcal</b>, <b>pct</b>.",
 start:R`m = meals.copy()
m["day_kcal"] =
result = `,
 sol:R`m = meals.copy()
m["day_kcal"] = m.groupby("day")["kcal"].transform("sum")
m["meals"] = m.groupby("day")["kcal"].transform("size")
m["pct"] = m["kcal"] * 100 / m["day_kcal"]
big = m[(m["meals"] >= 2) & (m["pct"] > 50)]
result = big[["day", "name", "kcal", "pct"]].round({"pct": 1})`,
 hint:'m.groupby("day")["kcal"].transform("sum") for the day total and transform("size") for meals per day, then filter on both.'},
{id:'py9',t:'py',lv:3,title:'Flattening JSON',
 learn:['Exports and APIs return nested JSON. pd.json_normalize flattens it: record_path turns a nested list into rows, meta carries parent fields along (nested keys become "checkin.sleep").','A preloaded list <b>day_export</b> holds your last 14 days: each day has a <b>checkin</b> object (or None) and lists of <b>trades</b>, <b>workouts</b> and <b>meals</b>.'],
 ex:R`print(day_export[0]["day"], day_export[0]["checkin"])
days = pd.json_normalize(day_export)
print(days.columns.tolist())
t = pd.json_normalize(day_export, record_path="trades", meta=["day"])
print(t.groupby("day")["pnl"].sum())`,
 task:'One row per <b>workout</b> entry that has a <b>load</b>, with its training volume (sets &times; reps &times; load). Columns, in this order: <b>day</b>, <b>exercise</b>, <b>volume</b>.',
 start:R`w = pd.json_normalize(day_export, record_path="workouts", meta=["day"])
result = `,
 sol:R`w = pd.json_normalize(day_export, record_path="workouts", meta=["day"])
w = w.dropna(subset=["load"]).copy()
w["volume"] = w["sets"] * w["reps"] * w["load"]
result = w[["day", "exercise", "volume"]]`,
 hint:'dropna(subset=["load"]), w["volume"] = w["sets"] * w["reps"] * w["load"], then select the three columns.'},
{id:'py10',t:'py',lv:4,title:'Regex extraction from logs',
 learn:['Semi-structured text is extracted with regular expressions. Series.str.extract(pattern) returns one column per capture group; lines that don&rsquo;t match become NaN.','A preloaded list <b>logs</b> holds your apps&rsquo; activity as lines like <b>DATE TIME APP event key=value …</b>, e.g. <b>… REWIRE urge habit=Doomscrolling result=resisted intensity=4 trigger="Phone in hand"</b>. Values with spaces are in double quotes; empty fields are left out.'],
 ex:R`s = pd.Series(logs)
d = s.str.extract(r"^\S+ \S+ (\w+) (\w+)")
d.columns = ["app", "event"]
print(d.value_counts())`,
 task:'Which trigger hits you most? From the <b>REWIRE urge</b> lines, count urges per <b>trigger</b> (quoted or not, without the quotes). Columns: <b>trigger</b>, <b>n</b>.',
 start:R`s = pd.Series(logs)
u = s[s.str.contains(" REWIRE urge ")]
t = u.str.extract(r'trigger=(?:"([^"]*)"|(\S+))')
# t[0] holds quoted values, t[1] unquoted ones
result = `,
 sol:R`s = pd.Series(logs)
u = s[s.str.contains(" REWIRE urge ")]
t = u.str.extract(r'trigger=(?:"([^"]*)"|(\S+))')
trig = t[0].fillna(t[1]).dropna()
result = trig.value_counts().rename_axis("trigger").reset_index(name="n")`,
 hint:'t[0].fillna(t[1]).dropna(), then value_counts().rename_axis("trigger").reset_index(name="n").'},
{id:'py11',t:'py',lv:4,title:'Dedup to latest record',
 learn:['sort_values by key + time (+ tie-breaker), then drop_duplicates(key, keep="last") keeps the newest row per key: fast and readable.','This is the pandas equivalent of the ROW_NUMBER() … WHERE rn = 1 pattern.'],
 ex:R`c = checkins.dropna(subset=["weight"]).copy()
c["week"] = pd.to_datetime(c["day"]).dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
print(c.sort_values("day").drop_duplicates("week", keep="last")[["week", "day", "weight"]])`,
 task:'Your <b>most recent session of each practice</b> in <b>mind</b>: columns <b>practice</b>, <b>day</b>, <b>technique</b>, <b>minutes</b>. Order by <b>time</b>, and break time ties by highest <b>id</b>.',
 start:R`m = mind.sort_values(["practice", "time", "id"])
result = `,
 sol:R`m = mind.sort_values(["practice", "time", "id"])
m = m.drop_duplicates("practice", keep="last")
result = m[["practice", "day", "technique", "minutes"]]`,
 hint:'drop_duplicates("practice", keep="last"), then select the four columns.'},
{id:'py21',t:'py',lv:4,title:'Running totals & drawdown',ordered:true,
 learn:['<code>cumsum()</code> turns a column into a running total: each row holds itself plus every row above it, the pandas form of SQL’s SUM(...) OVER (ORDER BY ...). <code>cummax()</code> and <code>cummin()</code> keep the highest and lowest value so far, and <code>groupby("track")["minutes"].cumsum()</code> restarts the total for each group.','For a trader they build the two curves that matter. Total pnl per day, then <code>equity = pnl.cumsum()</code> is the equity curve and <code>equity.cummax()</code> the peak so far. <b>drawdown = equity - peak</b> is 0 on a new high and negative below it; its minimum is the max drawdown, the deepest drop from a peak.','Gotchas: cumulative functions follow row order, so sort by time first (a groupby on <b>day</b> already returns days in order). Aggregate to one row per day before building a daily curve; a per-trade curve has one row per trade. <code>cummax()</code> starts at the first value, not at 0, so a curve that opens with a loss shows no drawdown on day one. If your starting balance should count as the first peak, clip the peak, not the equity: <code>equity.cummax().clip(lower=0)</code>.'],
 ex:R`s = study.sort_values("time").copy()
s["total"] = s["minutes"].cumsum()                          # all tracks so far
s["track_total"] = s.groupby("track")["minutes"].cumsum()   # restarts for each track
s["longest"] = s["minutes"].cummax()                        # longest session so far
print(s[["day", "track", "minutes", "total", "track_total", "longest"]])`,
 task:'Your <b>equity curve</b> by trading day, ordered by <b>day</b> (oldest first). Columns: <b>day</b>; <b>pnl</b> (that day’s total pnl); <b>equity</b> (running total of the daily pnl); <b>drawdown</b> (equity minus the highest equity so far, that day included: 0 on a new high, negative below it; the peak starts at your first day’s equity, not at 0). Every number rounded to 2.',
 start:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()
daily["equity"] =
daily["drawdown"] =
result = `,
 sol:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()   # one row per day, in date order
daily["equity"] = daily["pnl"].cumsum()
daily["drawdown"] = daily["equity"] - daily["equity"].cummax()
result = daily.round(2)`,
 hint:'Total pnl per day first, then equity = pnl.cumsum() and drawdown = equity - equity.cummax().'},
{id:'py22',t:'py',lv:4,title:'Filling calendar gaps',
 learn:['A log only has rows for days when something happened. <code>groupby("day")</code> never produces the days you skipped, so per-day counts lose their zeros and per-day averages come out too high. The fix is a <b>calendar spine</b>: <code>pd.date_range(start, end)</code> lists every day in a range, and you check or fill each one against the log.','Two ways to use it. <code>spine.isin(log_days)</code> (as in the anti-join lesson) marks the days that appear in the log, and <code>per_day.reindex(spine, fill_value=0)</code> puts a per-day Series onto every calendar day. Or put the dates on a DatetimeIndex: <code>resample("D").size()</code> or <code>.sum()</code> emits every day from the first to the last row, empty days as 0.','Gotchas: both sides must be real datetimes (<code>pd.to_datetime</code>): a per-day Series indexed by \'YYYY-MM-DD\' text, reindexed onto a date_range, matches nothing and comes back all zeros. Pick the range on purpose (first to last log day is not full weeks). For weekly buckets keep <code>to_period("W").dt.start_time</code> from Dates &amp; weekly buckets: <code>resample("W")</code> labels each week by the Sunday it ends on.'],
 ex:R`m = mind.assign(date=pd.to_datetime(mind["day"])).set_index("date")
per_day = m.resample("D").size()          # every calendar day, 0 when you didn't practise
print(per_day.head(8))
print("days in range:", len(per_day), "| days without a session:", (per_day == 0).sum())
print("sessions per day: logged days only", round(mind.groupby("day").size().mean(), 2),
      "| every day", round(per_day.mean(), 2))`,
 task:'Rest days per week. Take every calendar day from your first to your last <b>workouts</b> day (both included). A day with at least one workouts row is a training day; any other day is a rest day. Per week (the Monday it starts, as YYYY-MM-DD text): how many training days and rest days. The first and last weeks count only the days inside that range, so they can have fewer than 7; a week inside the range with no workouts at all still gets a row (train_days 0). Columns: <b>week</b>, <b>train_days</b>, <b>rest_days</b>.',
 start:R`days = pd.to_datetime(workouts["day"]).drop_duplicates()
cal = pd.DataFrame({"date": pd.date_range(          )})
cal["train"] =
cal["week"] =
result = `,
 sol:R`days = pd.to_datetime(workouts["day"]).drop_duplicates()
cal = pd.DataFrame({"date": pd.date_range(days.min(), days.max())})
cal["train"] = cal["date"].isin(days).astype(int)
cal["rest"] = 1 - cal["train"]
cal["week"] = cal["date"].dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
result = cal.groupby("week", as_index=False).agg(train_days=("train", "sum"), rest_days=("rest", "sum"))`,
 hint:'pd.date_range(first day, last day) gives every day; isin(training days) marks the training days; then group by the Monday week key and sum.'},
{id:'py23',t:'py',lv:4,title:'Rolling windows over time',
 learn:['A rolling window aggregates each row together with the rows just before it, a moving sum or average that smooths a noisy daily series. <code>s.rolling(7).sum()</code> uses the last 7 <i>rows</i>. <code>df.rolling("7D", on="date")["minutes"].sum()</code> uses the last 7 <i>calendar days</i>: the row’s own day and the 6 days before it.','The two only agree when there is a row for every day. Seven rows of a log with days off can stretch over two weeks, while a time window counts by the calendar, so an empty day simply adds nothing. A time window needs a datetime column, sorted ascending (or a DatetimeIndex); text dates raise a confusing <i>window must be an integer</i> error.','Gotchas: aggregate to one row per day first, or a day with two sessions gives two rows and the first one misses the second’s minutes. Time windows default to <code>min_periods=1</code>, so the first days get a partial window, while <code>rolling(7)</code> stays NaN until 7 rows exist. <code>"7D"</code> on a timestamp like <b>time</b> means 168 hours back from that moment, not 7 calendar days, so roll on the date.'],
 ex:R`c = checkins.assign(date=pd.to_datetime(checkins["day"])).sort_values("date")
c["avg_7_rows"] = c["energy"].rolling(7).mean()                # your last 7 check-ins
c["avg_7_days"] = c.rolling("7D", on="date")["energy"].mean()  # check-ins in the last 7 calendar days
print(c[["day", "energy", "avg_7_rows", "avg_7_days"]].round(2).tail(10))`,
 task:'Your rolling mindfulness load. Total the <b>mind</b> minutes per <b>day</b>; then, for each day you practised: <b>day</b>, <b>minutes</b> (that day’s total) and <b>last_7d</b> (total minutes over the 7 calendar days ending that day: the day itself and the 6 before it; days without a session add nothing, and near your first day the window just covers fewer days). Calendar days come from <b>day</b>, not <b>time</b>. Not rounded (whole minutes). Columns: <b>day</b>, <b>minutes</b>, <b>last_7d</b>.',
 start:R`d = mind.groupby("day", as_index=False)["minutes"].sum()
d["date"] = pd.to_datetime(d["day"])
d["last_7d"] =
result = `,
 sol:R`d = mind.groupby("day", as_index=False)["minutes"].sum()   # one row per day, in date order
d["date"] = pd.to_datetime(d["day"])
d["last_7d"] = d.rolling("7D", on="date")["minutes"].sum()
result = d[["day", "minutes", "last_7d"]]`,
 hint:'Use a time window, not a row count: rolling("7D", on="date") over the per-day totals, then sum the minutes.'},
{id:'py24',t:'py',lv:4,title:'Streaks: runs of consecutive days',
 learn:['Streaks are a gaps-and-islands problem. Sort the distinct dates and flag each one whose gap to the previous date isn’t exactly 1 day: <code>diff().dt.days.ne(1)</code> (from shift &amp; diff). The <code>cumsum()</code> of those True/False flags (from running totals) counts the run starts so far, so every row of one run shares the same number: a <b>run id</b>. Group by it for the start (min), end (max) and length (size).','The same flag-and-cumsum trick labels runs of anything: <code>s.ne(s.shift()).cumsum()</code> gives a new id each time a value changes, which finds runs of winning trades, losing days or high-energy mornings.','Gotchas: deduplicate days first; two logs on one day give a gap of 0, which breaks the run. Take the gap within each key, <code>groupby("habit")["date"].diff()</code>, so one habit’s run can’t continue into another’s. The first row of each group has a NaN gap; <code>ne(1)</code> is True for NaN, so it correctly starts a run. A run’s length is end - start + 1 days, not end - start.'],
 ex:R`t = trades.sort_values("id").copy()
t["result"] = np.where(t["pnl"] > 0, "win", "no win")
t["run"] = t["result"].ne(t["result"].shift()).cumsum()   # new id whenever the label changes
runs = t.groupby("run").agg(result=("result", "first"), trades=("id", "size"),
                            first_day=("day", "min"), pnl=("pnl", "sum"))
longest = runs.sort_values(["trades", "first_day"], ascending=[False, True]).drop_duplicates("result")
print(longest)   # your longest run of each kind`,
 task:'Your good-habit streaks. From the <b>habits</b> rows with event <b>done</b>, find every run of consecutive calendar days on which you did each habit: several logs of one habit on one day count as one day, and a day without it ends the run. One row per run. Columns: <b>habit</b>, <b>start</b> and <b>end</b> (the run’s first and last day, as YYYY-MM-DD text), <b>days</b> (its length in days; a single day is a streak of 1).',
 start:R`d = habits[habits["event"] == "done"][["habit", "day"]].drop_duplicates().copy()
d["date"] = pd.to_datetime(d["day"])
d = d.sort_values(["habit", "date"])
d["run"] =
result = `,
 sol:R`d = habits[habits["event"] == "done"][["habit", "day"]].drop_duplicates().copy()
d["date"] = pd.to_datetime(d["day"])
d = d.sort_values(["habit", "date"])
gap = d.groupby("habit")["date"].diff().dt.days
d["run"] = gap.ne(1).cumsum()          # a new id at each habit's first day and after every gap
result = d.groupby(["habit", "run"], as_index=False).agg(start=("day", "min"), end=("day", "max"), days=("day", "size"))
result = result[["habit", "start", "end", "days"]]`,
 hint:'Within each habit, a gap that isn’t 1 day starts a new run: gap.ne(1).cumsum() is the run id; then group by habit and run id.'},
/* ---------- SAS ---------- */
{id:'sas1',t:'sas',lv:1,title:'The DATA step',
 learn:['SAS works through data one row at a time in a DATA step. DATA names the output, SET reads the input, the statements in between change each row, and RUN executes it.','WHERE filters rows as they are read. KEEP and DROP choose which columns are written. Your app logs are in <b>work.trades</b>, <b>work.workouts</b>, <b>work.mind</b>, <b>work.meals</b>, <b>work.habits</b>, <b>work.checkins</b> and <b>work.study</b>.'],
 ex:R`data short_trades;
  set work.trades;
  where side = 'Short';
  keep day contract qty pnl;
run;`,
 quiz:{q:'Which statement controls which <b>columns</b> are written to the output data set?',o:['WHERE','KEEP','SET','RUN'],a:1,why:'KEEP (or DROP) selects variables. WHERE filters rows, SET names the input, RUN executes the step.'},
 prac:{task:'Write a DATA step that creates <b>slips</b> from work.habits. Keep only the urges you gave in to (event = <b>slipped</b>) and only the columns day, habit, intensity and trigger.',sol:R`data slips;
  set work.habits;
  where event = 'slipped';
  keep day habit intensity trigger;
run;`}},
{id:'sas2',t:'sas',lv:1,title:'PROC SORT & PROC PRINT',
 learn:['Procedures (PROCs) are SAS’s built-in tools. PROC SORT puts rows in order, and many later steps (MERGE, BY-group logic) need sorted input.','OUT= writes a sorted copy and leaves the original alone. NODUPKEY drops rows with a repeated BY value. PROC PRINT with (obs=5) shows the first 5 rows.'],
 ex:R`/* your 5 best trades */
proc sort data=work.trades out=best;
  by descending pnl;
run;

proc print data=best(obs=5);
  var day contract side pnl;
run;`,
 quiz:{q:'What does <b>OUT=</b> do in PROC SORT?',o:['Exports the data to a CSV file','Writes the sorted result to a new data set, leaving the input unchanged','Removes duplicate rows','Prints the output'],a:1,why:'Without OUT=, PROC SORT replaces the input data set with its sorted version.'},
 prac:{task:'Sort work.workouts by exercise, then by day, into <b>wk_sorted</b>, so each exercise’s history reads in date order.',sol:R`proc sort data=work.workouts out=wk_sorted;
  by exercise day;
run;`}},
{id:'sas3',t:'sas',lv:2,title:'PROC SQL',
 learn:['PROC SQL lets you write (mostly ANSI) SQL inside SAS, so the GROUP BY and joins from the SQL track carry over. CREATE TABLE ... AS saves the result as a data set.','You can add SAS formats inline (format=dollar12.2). PROC SQL runs each statement right away and ends with QUIT, not RUN.'],
 ex:R`/* net P&L per contract */
proc sql;
  create table contract_pnl as
  select contract,
         count(*)  as trades,
         sum(pnl)  as net format=dollar12.2
  from work.trades
  group by contract
  order by net desc;
quit;`,
 quiz:{q:'Which statement ends a PROC SQL step?',o:['RUN;','END;','QUIT;','STOP;'],a:2,why:'PROC SQL executes statements as it reads them; QUIT; ends the procedure. RUN; is ignored there.'},
 prac:{task:'With PROC SQL, create <b>practice_time</b> from work.mind: the number of sessions and the total minutes for each practice.',sol:R`proc sql;
  create table practice_time as
  select practice,
         count(*)     as sessions,
         sum(minutes) as total_min
  from work.mind
  group by practice;
quit;`}},
{id:'sas4',t:'sas',lv:2,title:'MERGE with BY and IN=',
 learn:['A DATA-step MERGE joins data sets on a shared BY variable. Your logs share <b>day</b>, so day is the key. IN= makes temporary flags that tell you which input gave each row.','if a and not b; keeps rows only in a (an anti-join). if a and b; is an inner join. With no condition you get a full outer join. Many trades can merge onto one check-in per day: that is a one-to-many merge.'],
 ex:R`/* days you checked in but did not train */
proc sort data=work.checkins out=c; by day; run;
proc sort data=work.workouts(keep=day) out=w nodupkey; by day; run;

data rest_days;
  merge c(in=in_c) w(in=in_w);
  by day;
  if in_c and not in_w;
run;`,
 quiz:{q:'Before a DATA-step MERGE with BY, both inputs must be…',o:['Indexed or sorted by the BY variable','Exported to CSV','The same number of rows','Created with PROC SQL'],a:0,why:'MERGE walks both tables in BY order, so they must be sorted (or indexed) by the BY variable. Otherwise SAS stops with an error.'},
 prac:{task:'Data sets <b>t</b> (work.trades sorted by day) and <b>c</b> (work.checkins sorted by day) exist. Merge them by day into <b>trades_sleep</b>, keeping only trades that have a check-in that day, so each trade carries that morning’s sleep and energy.',sol:R`data trades_sleep;
  merge t(in=in_t) c(in=in_c);
  by day;
  if in_t and in_c;
run;`}},
{id:'sas5',t:'sas',lv:3,title:'PROC MEANS / SUMMARY',
 learn:['PROC MEANS computes statistics by group. CLASS sets the groups (no sorting needed), VAR the measures, and OUTPUT OUT= writes the results to a data set.','NWAY keeps only the full CLASS combination and drops the overall-total row SAS adds by default (_TYPE_=0). NOPRINT turns off the printed report.'],
 ex:R`/* Long vs Short: total, average and count */
proc means data=work.trades noprint nway;
  class side;
  var pnl;
  output out=side_stats(drop=_type_ _freq_)
         sum=net mean=avg_pnl n=trades;
run;`,
 quiz:{q:'What does <b>NWAY</b> do in PROC MEANS?',o:['Uses n-way parallel processing','Keeps only the highest-level combination of CLASS variables in the output','Removes missing values','Sorts the output'],a:1,why:'Without NWAY, OUTPUT includes every subtotal level, including a grand total row (_TYPE_=0).'},
 prac:{task:'Get the min, max and mean kcal for each meal kind (bowl / snack) from work.meals into <b>kcal_stats</b>.',sol:R`proc means data=work.meals noprint nway;
  class kind;
  var kcal;
  output out=kcal_stats(drop=_type_ _freq_)
         min=min_kcal max=max_kcal mean=avg_kcal;
run;`}},
{id:'sas6',t:'sas',lv:3,title:'FIRST. and LAST.: BY-group logic',
 learn:['With BY in a DATA step, SAS creates FIRST.var and LAST.var flags (1 or 0) that mark the first and last row of each group.','They drive dedup (“keep the latest per key”), running counts per group and group-level resets: jobs SQL does with window functions.'],
 ex:R`/* the latest set you logged for each exercise */
proc sort data=work.workouts out=w;
  by exercise time id;
run;

data latest_set;
  set w;
  by exercise;
  if last.exercise;
run;`,
 quiz:{q:'Inside a BY-group, <b>LAST.exercise = 1</b> when…',o:['The exercise name is the last one alphabetically','The current row is the final row for that exercise','The data set has ended','exercise is missing'],a:1,why:'LAST.var is 1 on the last observation of each BY group, so the subsetting IF keeps one row per exercise: the latest one after sorting by time.'},
 prac:{task:'Data set <b>h</b> is work.habits sorted by habit. With BY-group logic, count the log entries per habit into <b>habit_counts</b> (one row per habit, variable n).',sol:R`data habit_counts;
  set h;
  by habit;
  if first.habit then n = 0;
  n + 1;
  if last.habit;
  keep habit n;
run;`}},
{id:'sas7',t:'sas',lv:4,title:'Macros for reusable extracts',
 learn:['The macro language writes SAS code for you. %macro / %mend defines a template, parameters become &variables, and %do loops repeat steps.','Macro variables only resolve inside <b>double</b> quotes. In single quotes, &val stays literal text. That is the #1 macro bug.'],
 ex:R`%macro pull(data=, col=, val=, out=);
  proc sql;
    create table &out as
    select * from &data
    where &col = "&val";
  quit;
%mend pull;

%pull(data=work.trades, col=side, val=Long,  out=longs)
%pull(data=work.meals,  col=kind, val=bowl,  out=bowls)`,
 quiz:{q:'Why does the WHERE clause use <b>"&val"</b> (double quotes)?',o:['Double quotes are faster','Macro variables resolve inside double quotes but not single quotes','SAS requires double quotes for all text','It prevents SQL injection'],a:1,why:'Inside single quotes the macro processor does not scan, so the query would look for the literal text &val.'},
 prac:{task:'Write a %do loop that calls %pull on work.study once per track (SQL, Python, SAS, Tableau), creating study_SQL, study_Python and so on (hint: %scan).',sol:R`%macro all_tracks;
  %let list = SQL Python SAS Tableau;
  %do i = 1 %to 4;
    %let t = %scan(&list, &i);
    %pull(data=work.study, col=track, val=&t, out=study_&t)
  %end;
%mend all_tracks;
%all_tracks`}},
{id:'sas8',t:'sas',lv:4,title:'SQL pass-through to databases',
 learn:['When data lives in a database, push the work there. Say your app logs sync to a Postgres copy (a backup or sync server). Explicit pass-through (CONNECT TO … / CONNECTION TO …) sends native SQL to it, and only the result travels back to SAS.','EXECUTE (...) BY runs statements that return nothing (updates, refreshing a view). LIBNAME engines try implicit pass-through, but explicit pass-through gives you full control of the dialect.'],
 ex:R`proc sql;
  connect to postgres as db
    (server="sync.example.com" database=isionlogs
     user=&user password=&pw);

  /* daily P&L for the last 90 days, summed inside Postgres */
  create table daily_pnl as
  select * from connection to db (
    select day, count(*) as trades, sum(pnl) as net
    from trades
    where day::date >= current_date - 90
    group by day
  );

  execute (refresh materialized view day_summary) by db;
  disconnect from db;
quit;`,
 quiz:{q:'Main benefit of explicit SQL pass-through?',o:['It converts SQL into DATA steps','The query runs inside the database in its own dialect, so only the result is transferred','It encrypts the data','It avoids needing credentials'],a:1,why:'Filtering and aggregating in the database means only a few summary rows cross the network, not every logged row.'},
 prac:{task:'Using an existing connection <b>db</b> to the synced database, pull your total protein per week from its meals table (columns day, protein) into <b>weekly_protein</b>.',sol:R`create table weekly_protein as
select * from connection to db (
  select date_trunc('week', day::date) as week,
         sum(protein) as protein
  from meals
  group by date_trunc('week', day::date)
  order by week
);`}},

{id:'tab1',t:'tab',lv:1,title:'Live connections vs extracts',
 learn:['A <b>live</b> connection queries the source every time the view changes: always current, but only as fast as the source. An <b>extract</b> (.hyper) is a compressed snapshot Tableau stores and refreshes on a schedule.','Your app logs are a good fit for an extract: they grow by a few rows a day. Extract filters and “Aggregate data for visible dimensions” keep it small; data source filters limit what any workbook can see.'],
 ex:R`Connect to the exported logs (SQLite file or the synced database)
Data Source tab → Connection: ( ) Live  (•) Extract → Edit…
  • Filters → Add… → Day — relative date: last 12 months
  • ☑ Aggregate data for visible dimensions
  • Incremental refresh on: Id`,
 quiz:{q:'When is an <b>extract</b> usually the better choice?',o:['When you need second-by-second real-time data','When the source is slow, you want to reduce load on it, or you need offline access','When the data is under 100 rows','Never: live is always better'],a:1,why:'Extracts trade freshness for speed and lower load on the source. Live makes sense for near-real-time needs on a fast database.'},
 prac:{task:'Describe how you would set up a <b>trades</b> extract that keeps only the last 2 years and adds just the new trades each day.',sol:R`Extract → Edit → Filters: Day — relative date: last 2 years
Incremental refresh: ☑ identify new rows using Id (or Closed)
Schedule: full refresh weekly, incremental refresh daily`}},
{id:'tab2',t:'tab',lv:1,title:'Dimensions, measures & aggregation',
 learn:['Dimensions (blue, discrete) slice the view: Contract, Side, Exercise, Habit. Measures (green, continuous) get aggregated: Pnl, Kcal, Minutes. Dropping a measure on a shelf applies a default aggregation, usually SUM.','The level of detail of the view is the set of dimensions on it. That is the same idea as GROUP BY.'],
 ex:R`Columns: [Contract]
Rows:    SUM([Pnl])
→ same as SQL: SELECT contract, SUM(pnl) FROM trades GROUP BY contract`,
 quiz:{q:'With [Side] on Columns, you drag the measure [Pnl] to Rows. What appears?',o:['Every single trade’s P&L','SUM(Pnl) for Long and for Short','The count of sides','An error until you choose an aggregation'],a:1,why:'Measures default to SUM, aggregated to the dimensions in the view (Side).'},
 prac:{task:'Which Tableau setup answers “Which habit do I slip on most?”, i.e. SELECT habit, COUNT(*) FROM habits WHERE event = \'slipped\' GROUP BY habit?',sol:R`Filters: [Event] = slipped
Rows:    [Habit]
Text/Columns: CNT([Habits])   (the table's count field)
Sort descending`}},
{id:'tab3',t:'tab',lv:2,title:'Relationships vs joins',
 learn:['Tableau’s logical layer uses <b>relationships</b> (“noodles”): tables stay separate and are joined at query time, at the right level of detail. Physical-layer <b>joins</b> flatten the tables into one first.','Your logs show why this matters. <b>trades</b> has one row per trade; <b>checkins</b> has one row per day. They relate on Day. Join them physically and each morning’s sleep is copied onto every trade that day.'],
 ex:R`Logical layer:   Trades ──(Day = Day)── Checkins
  → AVG([Sleep]) is computed per check-in day,
    SUM([Pnl]) per trade: both correct

Physical join:   Trades ⨝ Checkins on Day
  → a day with 6 trades repeats its sleep 6 times
  → SUM([Sleep]) is inflated, AVG([Sleep]) leans to busy days`,
 quiz:{q:'Trades (one row per trade) and Checkins (one row per day) are combined with a <b>physical join</b> on Day. What happens to SUM([Sleep])?',o:['It is correct','It is inflated, because each day’s sleep repeats on every trade that day','It becomes NULL','Tableau blocks the join'],a:1,why:'Joining tables of different grain duplicates the coarser rows. Relationships (or a FIXED LOD) prevent this.'},
 prac:{task:'You really do want a row-level table of trades with that morning’s sleep. How do you get to the physical layer and build a left join?',sol:R`Data Source tab → double-click the logical table Trades
→ opens the physical layer → drag Checkins in
→ choose Left join, clause: Day = Day
(every trade kept; Sleep is NULL on days with no check-in)`}},
{id:'tab4',t:'tab',lv:2,title:'Calculated fields',
 learn:['Calculated fields (Analysis → Create Calculated Field) are row-level formulas, like expressions in a SQL SELECT. IF/ELSEIF/ELSE/END, IIF, CASE, DATEDIFF, DATETRUNC and string functions are the core tools.','An IF with no ELSE returns NULL for rows that do not match, and SUM ignores NULLs: handy for conditional measures like “P&L on Long trades only”.'],
 ex:R`// Winning trade? (1/0, so AVG gives your win rate)
IIF([Pnl] > 0, 1, 0)

// Minutes in the trade
DATEDIFF('minute', [Opened], [Closed])

// Mood lift from a meditation session
[Mood After] - [Mood Before]

// Week bucket
DATETRUNC('week', [Day])`,
 quiz:{q:'What does <b>IF [Side] = "Long" THEN [Pnl] END</b> return for a Short trade?',o:['0','NULL','An error','The P&L anyway'],a:1,why:'With no ELSE branch, rows that do not match return NULL. Aggregations like SUM skip NULLs.'},
 prac:{task:'Write a calc on <b>checkins</b> that labels each night: sleep under 6 hours "short", under 7.5 "ok", else "rested".',sol:R`IF [Sleep] < 6 THEN "short"
ELSEIF [Sleep] < 7.5 THEN "ok"
ELSE "rested"
END`}},
{id:'tab5',t:'tab',lv:3,title:'LOD expressions: FIXED',
 learn:['Level of Detail expressions compute at a grain you choose, whatever the view shows. { FIXED [Day] : SUM([Pnl]) } puts the whole day’s P&L on every trade, so you can ask “how did my trades do on red days?”','FIXED runs <b>before</b> dimension filters (but after context, data source and extract filters). INCLUDE and EXCLUDE adjust the view’s grain instead.'],
 ex:R`// Whole-day P&L on every trade row
{ FIXED [Day] : SUM([Pnl]) }

// First day you ever traded each contract
{ FIXED [Contract] : MIN([Day]) }

// Your heaviest load per exercise, on every set
{ FIXED [Exercise] : MAX([Load]) }`,
 quiz:{q:'A FIXED LOD is evaluated relative to a normal <b>dimension filter</b>…',o:['After it, so it respects the filter','Before it, so the filter does not change the FIXED result','At the same time','Only on extracts'],a:1,why:'In Tableau’s order of operations, FIXED LODs come before dimension filters. Add the filter to context if you want FIXED to respect it.'},
 prac:{task:'Write an LOD that returns, for each habit, the number of distinct days you slipped on it.',sol:R`{ FIXED [Habit] : COUNTD(IF [Event] = "slipped" THEN [Day] END) }`}},
{id:'tab6',t:'tab',lv:3,title:'Table calculations',
 learn:['Table calculations run <b>last</b>, on the aggregated numbers already in the view: running totals, % of total, rank, difference, moving averages. Your equity curve is a running sum of daily P&L.','“Compute Using” (table across, pane down, or specific dimensions) sets the direction and scope: the Tableau version of PARTITION BY / ORDER BY.'],
 ex:R`// Columns: DAY([Day])
RUNNING_SUM(SUM([Pnl]))                 // equity curve
SUM([Pnl]) / TOTAL(SUM([Pnl]))          // % of total per contract
RANK(SUM([Pnl]))                        // contract rank
WINDOW_AVG(AVG([Sleep]), -6, 0)         // 7-day moving avg sleep`,
 quiz:{q:'When are table calculations computed?',o:['Before any filters, at row level','In the database during extraction','Last, on the aggregated results currently in the view','Only when exporting'],a:2,why:'They work on the view’s result table, so they change if you filter out marks or change the dimensions in the view.'},
 prac:{task:'Write a table calc for the week-over-week % change in your meditation minutes (from <b>mind</b>).',sol:R`(ZN(SUM([Minutes])) - LOOKUP(ZN(SUM([Minutes])), -1))
/ ABS(LOOKUP(ZN(SUM([Minutes])), -1))
// Columns: WEEK([Day]) · Compute using: Day`}},
{id:'tab7',t:'tab',lv:4,title:'Order of operations & context filters',
 learn:['Tableau’s query pipeline: extract filters → data source filters → <b>context filters</b> → Top N / FIXED LOD → dimension filters → INCLUDE/EXCLUDE LOD → measure filters → table calcs → table-calc filters.','Most “why is my Top 5 wrong?” bugs come from this order. Adding a filter to context makes it apply before Top N and FIXED.'],
 ex:R`Goal: your Top 5 contracts by P&L *on Short trades only*
1. Filters: [Contract] → Top → By field: Top 5 by SUM(Pnl)
2. Filters: [Side] = Short  → right-click → Add to Context
   (without context, the Top 5 is picked from all trades first,
    then Short is applied, so you may see fewer or wrong contracts)`,
 quiz:{q:'Your Top 5 Contracts filter ignores the Side filter. The fix?',o:['Convert Side to a measure','Add the Side filter to context','Use a live connection','Sort descending'],a:1,why:'Top N filters run before regular dimension filters; context filters run before Top N.'},
 prac:{task:'Where do FIXED LODs sit relative to context filters and dimension filters? What does that mean for { FIXED [Day] : SUM([Pnl]) } with a Side filter on?',sol:R`Context filters → FIXED LOD → dimension filters
A normal Side filter does not change the whole-day P&L;
add Side to context to get the day's P&L for that side only.`}},
{id:'tab8',t:'tab',lv:4,title:'Automating extracts: Hyper API & REST',
 learn:['The Tableau Hyper API (Python package tableauhyperapi) builds .hyper extracts straight from code: ideal after a SQL or pandas step that cleans your app logs. You define a table, insert rows, and publish.','Publishing and refreshing are automated with the REST API (the Python wrapper is tableauserverclient, TSC) or the tabcmd command line.'],
 ex:R`from tableauhyperapi import (HyperProcess, Telemetry, Connection, CreateMode,
                             TableDefinition, TableName, SqlType, Inserter)

with HyperProcess(Telemetry.DO_NOT_SEND_USAGE_DATA_TO_TABLEAU) as hp:
    with Connection(hp.endpoint, "isionlogs.hyper", CreateMode.CREATE_AND_REPLACE) as con:
        con.catalog.create_schema("Extract")
        t = TableDefinition(TableName("Extract", "trades"), [
            TableDefinition.Column("id", SqlType.int()),
            TableDefinition.Column("day", SqlType.date()),
            TableDefinition.Column("contract", SqlType.text()),
            TableDefinition.Column("side", SqlType.text()),
            TableDefinition.Column("pnl", SqlType.double()),
        ])
        con.catalog.create_table(t)
        with Inserter(con, t) as ins:
            ins.add_rows(rows)   # list of tuples from trades; day as datetime.date
            ins.execute()`,
 quiz:{q:'Which tool would you use to <b>publish and refresh</b> data sources on Tableau Server/Cloud from a Python script?',o:['tableauhyperapi only','Tableau Server Client (REST API) or tabcmd','PROC SQL','Tableau Prep only'],a:1,why:'The Hyper API creates files; publishing, refresh jobs and permissions go through the REST API (tableauserverclient) or tabcmd.'},
 prac:{task:'Sketch TSC code to publish isionlogs.hyper to a project, overwriting the existing data source.',sol:R`import tableauserverclient as TSC
auth = TSC.PersonalAccessTokenAuth("token-name", "token-secret", site_id="mysite")
server = TSC.Server("https://tableau.example.com", use_server_version=True)
with server.auth.sign_in(auth):
    ds = TSC.DatasourceItem(project_id="PROJECT_ID")
    server.datasources.publish(ds, "isionlogs.hyper", TSC.Server.PublishMode.Overwrite)`}},
];

const DATA=(()=>{
  const p2=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  const stamp=ms=>{const d=new Date(ms);return `${iso(d)} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`};
  const get=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
  const n2=v=>v==null||v===''||!isFinite(v)?null:Math.round(v*100)/100;
  // samples: seeded, so a sample table is the same every time; dates run up to today
  const rng=seed=>{let sd=seed;return()=>(sd=sd*16807%2147483647)/2147483647};
  const now=new Date(),dayAt=(k,h,m,r)=>{const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-k);d.setHours(h,m,Math.floor(r()*60));return d};
  const S={
    trades(){const r=rng(11),C={NQZ6:[20,15,.25,24800],ESZ6:[50,6,.25,6750],GCZ6:[100,3,.1,4150]},px={NQZ6:24800,ESZ6:6750,GCZ6:4150},out=[];
      for(let k=59;k>=0;k--){const d=dayAt(k,9,30,r);if(d.getDay()===0||d.getDay()===6)continue;let t=d.getTime()+r()*20*6e4;
        for(let n=2+Math.floor(r()*4);n>0;n--){const x=r(),c=x<.5?'NQZ6':x<.8?'ESZ6':'GCZ6',[mult,stop,tick]=C[c],o=r(),res=o<.36?'W':o<.84?'L':'B',long=r()<.55;
          px[c]=Math.round((px[c]+(r()-.48)*stop*4)/tick)*tick;const mv=res==='W'?stop*3:res==='L'?-stop:c==='NQZ6'?tick:0,held=(res==='W'?8+r()*35:2+r()*12)*6e4;

const PYSETUP=R`
import pandas as pd, numpy as np, io, json, sys, traceback
TABLES = json.loads(TABLES_JSON)
pd.set_option("display.width", 120)
def fresh_ns():
    ns = {"pd": pd, "np": np, "json": json}
    for name, t in TABLES.items():
        ns[name] = pd.DataFrame(t["rows"], columns=t["cols"])
    ns["day_export"] = json.loads(EXPORT_JSON)
    ns["logs"] = LOGS.split("\n")
    return ns
def to_rows(r):
    if r is None:
        return None
    if isinstance(r, pd.Series):
        r = r.reset_index() if (r.index.name is not None or isinstance(r.index, pd.MultiIndex)) else r.to_frame()
    if isinstance(r, pd.DataFrame):
        if r.index.name is not None or isinstance(r.index, pd.MultiIndex):
            r = r.reset_index()
        r = r.reset_index(drop=True)
        return {"cols": [str(c) for c in r.columns], "rows": json.loads(r.to_json(orient="values", date_format="iso"))}
    return {"cols": ["value"], "rows": [[r if isinstance(r, (int, float, str)) else str(r)]]}
def run_user(code):
    buf = io.StringIO()
    old = sys.stdout
    sys.stdout = buf
    err = ""
    ns = fresh_ns()
    try:
        exec(code, ns)
    except Exception as e:
        err = "".join(traceback.format_exception_only(type(e), e))
    finally:
        sys.stdout = old
    res = None
    if not err:
        try:
            res = to_rows(ns.get("result"))
        except Exception as e:
            err = "Could not read result: " + str(e)
    return json.dumps({"out": buf.getvalue(), "err": err, "res": res})

function setFb(cls,html){const f=$('#fb');if(f)f.innerHTML=`<div class="fb ${cls}">${html}</div>`}
function logEvent(kind,ok){events.push({id:uid(),time:new Date().toISOString(),lesson:CUR,kind,ok});save()}
function complete(l,first){
  const p=pr(l.id);if(p.done)return;
  p.done=true;p.first=first;p.xp=Math.round(XPL[l.lv]*(first?1.5:1));p.date=today();save();
  chime();toast(`Lesson complete · +${p.xp} XP${first?' (first-try bonus!)':''}`);
}
async function doRun(check){
  const l=curLesson(),code=$('#ed').value;drafts[l.id]=code;saveDrafts();
  const out=$('#out');out.innerHTML='<div class="fb info">Running…</div>';
  try{
    let u;
    if(l.t==='sql'){if(!SQLM)setFb('info','Loading the SQL engine (one-time)…');u=await runSQL(code);out.innerHTML=resTable(u)}
    else{const r=await runPyCode(code,m=>setFb('info',m));
      out.innerHTML=(r.out?`<div class="codeh"><b>PRINTED OUTPUT</b></div><pre>${esc(r.out)}</pre>`:'')+(r.err?`<div class="fb no"><b>Error</b><pre style="margin-top:6px;background:transparent;border:0;padding:0;color:inherit;white-space:pre-wrap">${esc(r.err)}</pre></div>`:'')+(r.res?`<div class="codeh"><b>result</b></div>${resTable(r.res)}`:'');
      if(r.err){if(check){pr(l.id).att++;logEvent('check',false)}setFb('no','Fix the error, then try again.');return}
      u=r.res}
    if(!check){$('#fb').innerHTML='';return}
    const s=await solResult(l),cmp=compare(u,s,l.ordered),p=pr(l.id);p.att++;logEvent('check',cmp.ok);
    // a review passes by itself when you got there unaided; after a hint you mark it yourself
    if(cmp.ok){const first=p.att===1&&!p.hint&&!p.rev,s=sstep(),r=s?.k==='r'&&s.res==null,g=r&&!s.h;complete(l,first);if(g)grade(s,1);
      setFb('ok','✓ '+cmp.msg+(first?' First try!':'')+(g?' Review passed.':r?' You had a hint, so mark the review yourself: Got it or Not yet.':''));drawLessonKeep()}
    else setFb('no',cmp.msg+`<br><span class="mu" style="font-size:11px">Expected columns: ${esc(s.cols.join(', '))}</span>`);
  }catch(e){
    const msg=String(e.message||e);out.innerHTML='';
    if(check&&!/download/i.test(msg)){pr(l.id).att++;logEvent('check',false)}
    setFb('no',`<b>Error:</b> ${esc(msg)}`);
  }
}
// redraws the lesson view as it stood, keyboard focus included (the same button, in the top or bottom bar)
function drawLessonKeep(){const sc=$('#po').scrollTop,fb=$('#fb').innerHTML,out=$('#out')?.innerHTML,ed=$('#ed')?.value,dt=edDirty,a=document.activeElement,f=a!==$('#po')&&$('#po').contains(a),k=a?.dataset?.act,bot=!!a?.closest?.('.lnav');
  drawLesson();$('#fb').innerHTML=fb;if(out&&$('#out'))$('#out').innerHTML=out;if(ed!=null&&$('#ed'))$('#ed').value=ed;edDirty=dt;
  if(f){const m=k?[...$('#po').querySelectorAll(`[data-act="${k}"]`)].filter(e=>e.dataset.v===a.dataset.v):a.id?[$('#'+a.id)]:[];(m[bot?m.length-1:0]||$('#po h2'))?.focus({preventScroll:true})}
  $('#po').scrollTop=sc}

/* ================= today's session: START shows the plan, then the lesson view takes you through it step by step ================= */
// SP: the day of the session running in the lesson view (false when none); SQ: the plan on screen; SFT: the track picked for its lesson
let SP=false,SQ=null,SFT=null,edDirty=false;
// the step on screen while a session runs
const sstep=()=>{const P=SP&&tp();return P&&!P.done&&P.items[P.i]?.l===CUR?P.items[P.i]:null};
// what moves you on: a review is got it, not yet or skipped; a lesson moves on once it's done (or is skipped for now)
function stepBar(){
  const P=tp(),s=sstep(),last=P.i===P.items.length-1;
  if(s.k==='r'&&s.res==null)return`<button class="btn xs" data-act="sstep" data-v="-1" title="Not today: it comes back tomorrow at the same step">Skip</button><button class="btn xs" data-act="sstep" data-v="0" title="It comes back tomorrow, from the 1-day step">Not yet</button><button class="btn xs go" data-act="sstep" data-v="1">Got it ${last?'✓':'›'}</button>`;
  const ok=s.k==='r'||isDone(s.l);
  return`<button class="btn xs${ok?' go':''}" data-act="sstep">${last?ok?'Finish ✓':'End session':ok?'Next ›':'Skip ›'}</button>`;
}
// the review panel: which step this is, what to do, and what each answer does
function rvpHTML(s){
  const l=LM[s.l],q=srOf(l.id);
  if(s.res===1)return`<b>REVIEWED ✓</b><br>${q?.done?'That was the 21-day step: this lesson is learned.':`Next review ${dl(q.due)}, in ${pls(diffDays(today(),q.due),'day')}.`}`;
  if(s.res===0)return`<b>REVIEW · NOT YET</b><br>It comes back tomorrow, from the 1-day step. Open the notes below and read it through once more.`;
  const n=q&&!q.done?q.n:0,gap=IV[n+1]?IV[n+1]-IV[n]:0,late=q&&!q.done?diffDays(q.due,today()):0;
  return`<b>REVIEW · ${IV[n]}-DAY STEP</b> <span class="mu">(${n+1} of ${IV.length})</span><br>You completed this ${dago(progress[l.id].date)}${late>0?`; the review has waited ${pls(late,'day')}`:''}. ${l.quiz?'Answer the quiz again from memory':'Write the task again from the starter code, then CHECK it'}, or recall the idea and mark it yourself. The notes are folded away below for after you've tried.
    <br><span class="mu" style="font-size:12px">Got it: ${gap?`the next review is in ${pls(gap,'day')}`:'that was the last step'}. Not yet: back tomorrow, from the 1-day step. Skip: back tomorrow, same step.</span>`;
}
const grade=(s,r)=>{s.res=r;reviewed(s.l,r)};
// records the step (a review's result, or how the lesson stands) and opens the next one; after the last, the session is done
function stepOn(r){
  const P=tp(),s=sstep();if(!s)return;
  if(s.k==='r'&&s.res==null&&r!=null)grade(s,r);
  if(s.k==='l')s.res=isDone(s.l)?1:-1;
  if(edDirty&&$('#ed')){clearTimeout(dT);drafts[CUR]=$('#ed').value;saveDrafts()}
  if(++P.i<P.items.length){save();openLesson(P.items[P.i].l);return}
  // past midnight the plan is no longer today's: the done sheet is still this one
  P.done=true;closeLesson();sessionForm(false,P);
}
// one row of the plan: what it is, why it's there (or how it went), and its minutes
function spi(x,i,P){
  const l=LM[x.l],p=progress[l.id]||{},q=srOf(l.id),r=x.res,past=P&&(i<P.i||P.done),cur=P&&!P.done&&i===P.i;
  const sub=x.k==='r'?past?r===1?'✓ got it':r===0?'not yet · back tomorrow':'skipped · back tomorrow':`${q&&!q.done?IV[q.n]+'-day review · ':''}completed ${dago(p.date)}${q&&!q.done&&q.due<today()?` · waiting ${pls(diffDays(q.due,today()),'day')}`:''}`
    :past?isDone(l.id)?`✓ completed${p.date===today()?` · +${p.xp} XP`:''}`:'still in progress':`${LV[l.lv]} · ${isDone(l.id)?'completed':p.att||sessions.some(s=>(s.lessons||[]).includes(l.id))?'in progress':'new to you'}`;
  return`<div class="spi${cur?' now':past?r===1?' ok':' off':''}"><i>${i+1}</i><div><span class="tag">${x.k==='r'?'Review':'Lesson'}</span>${pill(l.t)}<b>${esc(l.title)}</b><small>${sub}${cur?' · <b class="amb">next</b>':''}</small></div><em>~${x.m} min</em></div>`;
}
// START: today's session. Under way, it picks up where you left off; done, it says how it went; else it offers a new one
function sessionForm(fresh,P=tp()){
  const U=usual(),D=dueList(),nd=nextDue(),hd='<h3>Today\'s session</h3>';
  const yours=U.n<3?`your usual is <b>20 min</b> until you've timed 3 sessions`:`your usual is <b>${U.min} min</b>, the median of your last ${U.n} sessions`;
  if(P&&!fresh){
    const more=planFor().items.length;
    const E=P.done&&sdone(P);
    openModal(`${hd}<p>${E?`${E.ok?'<span class="grn">Done ✓</span>':`Ended · ${E.t}`}${P.sec>=60?` · ${fmin(P.sec/60)} studied`:''}`:`Under way · <b>${P.i} of ${P.items.length}</b> done`} <span class="mu">· ${yours}</span></p>
      <div class="spl">${P.items.map((x,i)=>spi(x,i,P)).join('')}</div>
      ${P.done?`<p class="mu" style="font-size:12px">${D.length?`${pls(D.length,'review')} still due: another session takes them now, or START does tomorrow.`:nd?`No reviews due. The next is on ${dl(nd)}.`:''}</p>`:''}
      <div class="mact"><button class="btn" data-act="close">${P.done?'Close':'Later'}</button>${P.done?more?'<button class="btn go" data-act="sagain">&#9654; ANOTHER SESSION</button>':'':'<button class="btn go" data-act="sgo">&#9654; RESUME</button>'}</div>`);
    $('#mbox').classList.add('ssm');$('#mbox [data-act="sgo"],#mbox [data-act="sagain"],#mbox [data-act="close"]')?.focus();return;
  }
  if(SFT&&!nextIn(SFT))SFT=null;
  const Q=SQ=planFor(SFT),L=Q.items.find(x=>x.k==='l'),R=rotation(),t=L&&LM[L.l].t,n=nrv(Q.items);
  if(!Q.items.length)return openModal(`${hd}<p>Nothing to study today: every lesson is complete${nd?` and the next review is on <b>${dl(nd)}</b>`:''}.</p><div class="mact"><button class="btn" data-act="catalog">ALL LESSONS</button><button class="btn pri" data-act="close">Close</button></div>`);
  const ago=r=>r.at===-Infinity?'new':dago(ymd(new Date(r.at)));
  openModal(`${hd}<p><b>~${Q.min} min</b> <span class="mu">· ${yours}</span></p>
    ${R.length?`<div class="lbl" style="margin:14px 0 6px">Lesson from</div><div class="chips" role="group" aria-label="Lesson from track">${TK.map(k=>`<button class="chip${k===t?' on':''}" data-act="strk" data-v="${k}" aria-pressed="${k===t}"${nextIn(k)?'':' disabled title="Track complete"'}>${TR[k].n}</button>`).join('')}</div>`:''}
    <div class="spl">${Q.items.map((x,i)=>spi(x,i)).join('')}</div>
    <p class="mu" style="font-size:12px;line-height:1.6">${L?`${SFT?`You picked ${TR[t].n}. The rotation`:'The track you\'ve studied least recently goes next'}: ${R.map(r=>`${TR[r.t].n} (${ago(r)})`).join(' → ')}. `:'Every lesson is complete, so this session is reviews only. '}
      ${n&&L?'The reviews go first, as a warm-up. ':''}Completed lessons come back for review 1, 3, 7 and 21 days later.${Q.due>n?` ${pls(Q.due-n,'more review')} ${Q.due-n===1?'is':'are'} due and ${Q.due-n===1?'waits':'wait'} for the next session.`:''}</p>
    <div class="mact"><button class="btn" data-act="close">Cancel</button><button class="btn go" data-act="sgo" data-v="new">&#9654; BEGIN</button></div>`);
  $('#mbox').classList.add('ssm');$('#mbox [data-act="sgo"]').focus();
}
// BEGIN fixes the plan for the day; RESUME carries on from the step you were on
function sessionGo(isNew){
  // another session after today's has ended with something done keeps the day marked done (more)
  if(isNew&&SQ){const was=tp();settings.plan={day:today(),items:SQ.items.map(({k,l,m})=>({k,l,m})),i:0,done:false,more:!!(was&&(was.more||was.done&&sdone(was).any))}}
  const P=tp();if(!P||P.done)return;
  SFT=null;save();closeModal();SP=P.day;openLesson(P.items[P.i].l);
}

function doAct(a){if(!/^\w+$/.test(a||''))return;if(a==='today'){const t=new Date();S.x={};S.sel=today();S.month=new Date(t.getFullYear(),t.getMonth(),1);S.page=1;render();return}const b=document.querySelector(`[data-a="${a}"],[data-act="${a}"]`);if(b)b.click()}

/* ---------- today at a glance (shared hero, timeline and motion from ui.js) ---------- */
function heroToday(){
  if(!sessions.length&&!events.length)return '';
  const t=today(),S1=sessions.filter(x=>dayOf(x)===t),goal=settings.goal||30;
  const doneT=LESSONS.filter(l=>progress[l.id]?.done&&progress[l.id].date===t),xp=doneT.reduce((a,l)=>a+(progress[l.id].xp||0),0),st=streak();
  // each lesson passed today once, at its first pass
  const passed=events.filter(e=>dayOf(e)===t&&e.kind==='check'&&e.ok).sort((a,b)=>Date.parse(a.time)-Date.parse(b.time)).filter((e,i,a)=>a.findIndex(x=>x.lesson===e.lesson)===i);
  // a tile is the dashboard's own stats for that range, without the day, track or card filters, so tapping it shows the same minutes below
  const per=r=>{const o={range:S.range,sel:S.sel,track:S.track,x:S.x};Object.assign(S,{range:r,sel:null,track:'all',x:{}});const x=stats(view());Object.assign(S,o);return x};
  const td=per('today'),wk=per('week'),mo=per('month'),min=Math.round(td.tot),pl=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
  const tile=(k,label,x,sub,tone='')=>({label,value:fmin(x.tot),tone,sub,attrs:{'data-act':'rng','data-v':k,'aria-label':`${label}: ${fmin(x.tot)} studied. Show ${label.toLowerCase()} below`},on:!S.sel&&S.range===k});
  return UI.hero({key:'learn',title:'Today',sub:min>=goal?"Today's goal done ✓":`${goal-min} min to today's goal${st?` · ${st}-day streak`:''}`,
    big:{value:`+${xp}`,label:'XP today',tone:xp>0?'pos':''},
    stats:[tile('today','Today',td,td.ses.length||td.done.length?`${pl(td.ses.length,'session')} · ${pl(td.done.length,'lesson')} done`:'not studied yet',min>=goal?'pos':''),
      tile('week','Week',wk,`${pl(wk.days,'day')} studied`),
      tile('month','Month',mo,`${pl(mo.done.length,'lesson')} done`)],
    action:{label:'▶ Start session',act:'startnext'},
    log:[...S1.map(x=>({at:Date.parse(x.time),tag:'Study',text:`${Math.round(+x.min||0)} min${x.lessons?.length?` · ${x.lessons.length} lesson${x.lessons.length>1?'s':''}`:''}`})),
      ...passed.map(e=>({at:Date.parse(e.time),tag:'Passed',text:LM[e.lesson]?.title||'Exercise',tone:'pos'}))]});
}
