{id:'py18',t:'py',lv:3,title:'Anti-joins: rows with no match',
 learn:['An <b>anti-join</b> keeps the rows that have <i>no</i> match in another table: trading days with no check-in, customers who never ordered. An inner merge silently drops exactly these rows, so you have to ask for them. For one key, <code>isin</code> marks the values that appear in the other column (SQL IN) and <code>~</code> flips the mask: <code>df[~df["day"].isin(checkins["day"])]</code> is SQL\'s NOT IN, or LEFT JOIN ... WHERE right.day IS NULL.','For several key columns, or to see both sides at once, merge with <code>how="left", indicator=True</code>: pandas adds a <b>_merge</b> column that says <b>both</b> or <b>left_only</b>, and you keep <code>_merge == "left_only"</code>. Merge on the right side\'s keys only, deduplicated (<code>other[["day"]].drop_duplicates()</code>), or a key that appears twice there doubles the matched rows.','Test isin or the indicator, never a column from the other table: after a left merge, <b>weight</b> is NaN on days with no check-in <i>and</i> on check-ins where you skipped the scale. ~ binds tighter than &amp;: <code>~a &amp; b</code> negates only a, <code>~(a &amp; b)</code> the whole mask. And decide which rows could have matched at all: days before you started an app aren\'t "skipped".'],
 ex:R`meal_days = meals[["day"]].drop_duplicates()
# one key: a negated isin
no_checkin = meal_days[~meal_days["day"].isin(checkins["day"])]
print(no_checkin["day"].tolist())
# same question with the indicator (works for multi-column keys too)
m = meal_days.merge(checkins[["day"]].drop_duplicates(), on="day", how="left", indicator=True)
print(m["_merge"].value_counts())
print(m[m["_merge"] == "left_only"]["day"].tolist())`,
 task:"Trading days when you skipped the morning check-in. For every trading day (a <b>day</b> in <b>trades</b>) that has no row in <b>checkins</b>, counting only days on or after the earliest day in <b>checkins</b> (before it you weren't using TODAY yet): <b>day</b>, <b>trades</b> (how many trades that day), <b>pnl</b> (that day's total, rounded to 2). Columns: <b>day</b>, <b>trades</b>, <b>pnl</b>.",
 start:R`daily = trades.groupby("day", as_index=False).agg(trades=("id", "size"), pnl=("pnl", "sum"))
first = checkins["day"].min()
result = daily[`,
 sol:R`daily = trades.groupby("day", as_index=False).agg(trades=("id", "size"), pnl=("pnl", "sum"))
first = checkins["day"].min()

{id:'py19',t:'py',lv:3,title:'shift & diff: the previous row',
 learn:['<code>shift()</code> moves a column down one row, so each row can see the previous row\'s value: the pandas form of SQL\'s LAG (<code>shift(-1)</code> looks ahead, like LEAD). <code>diff()</code> is the shortcut for <code>x - x.shift()</code>, the change since the previous row. "Previous" just means the row above, so sort first (by id or time).','To restart for every day, practice or contract, shift within groups, the same sort-then-groupby move as Top-N per group: <code>t.groupby("day")["pnl"].shift()</code>. Each group\'s first row gets NaN. A plain <code>t["pnl"].shift()</code> hands the previous day\'s last trade to the next day\'s first one, the most common bug here.','That NaN means "there is no previous row". Drop it (<code>dropna(subset=[...])</code>) before you label or count; a filler like fillna(0), or a label built on NaN, quietly turns "no previous trade" into "previous trade was flat". For dates, convert with pd.to_datetime first: the diff is a Timedelta, and <code>.dt.days</code> makes it a number.'],
 ex:R`m = mind.sort_values("id").copy()
m["date"] = pd.to_datetime(m["day"])
m["prev_min"] = m.groupby("practice")["minutes"].shift()
m["gap_days"] = m.groupby("practice")["date"].diff().dt.days
print(m[["practice", "day", "minutes", "prev_min", "gap_days"]].head(8))
# average days between two sessions of the same practice
print(m.groupby("practice")["gap_days"].mean().round(1))`,
 task:'Do you trade worse after a loss? Take <b>trades</b> in <b>id</b> order. For every trade that isn\'t the first of its <b>day</b>, look at the previous trade on that same day and label the trade <b>"after win"</b> (previous pnl &gt; 0), <b>"after loss"</b> (previous pnl &lt; 0) or <b>"after flat"</b> (previous pnl = 0). Leave out each day\'s first trade. Per label: <b>after</b>, <b>trades</b> (count), <b>avg_pnl</b> (mean pnl of the labelled trades themselves, rounded to 2). Columns: <b>after</b>, <b>trades</b>, <b>avg_pnl</b>.',
 start:R`t = trades.sort_values("id").copy()
t["prev"] =
result = `,
 sol:R`t = trades.sort_values("id").copy()
t["prev"] = t.groupby("day")["pnl"].shift()
t = t.dropna(subset=["prev"])
t["after"] = np.where(t["prev"] > 0, "after win", np.where(t["prev"] < 0, "after loss", "after flat"))
result = t.groupby("after", as_index=False).agg(trades=("id", "size"), avg_pnl=("pnl", "mean")).round(2)`,
 hint:'t.groupby("day")["pnl"].shift() gives each trade the previous pnl of its day (NaN for the first); drop those rows, then label with np.where.'},
{id:'py20',t:'py',lv:3,title:'transform: group totals on each row',
 learn:['<code>groupby(key)[col].transform("sum")</code> computes each group\'s total but hands it back on <i>every original row</i>, with the same length and index as the frame. agg collapses a group to one row; transform keeps the rows and adds context. So <code>m["day_kcal"] = m.groupby("day")["kcal"].transform("sum")</code> puts the day\'s total next to each meal, ready for a share.','It also keeps or drops rows by a group property without collapsing anything: <code>trades[trades.groupby("day")["id"].transform("size") &gt;= 3]</code> keeps every trade of the days with at least 3 trades (HAVING, but you keep the rows). Compare a row with <code>transform("max")</code> to keep the group\'s top rows, or subtract <code>transform("mean")</code> to see how far it is from average.','transform lines up on the original index, so assign it straight back as a column; no merge needed. Assigning an agg result instead (<code>m.groupby("day")["kcal"].sum()</code>) aligns day labels against row numbers and fills the column with NaN. Give transform one function, usually by name ("sum", "mean", "max", "size"; named aggregation doesn\'t apply), and use agg when you want one row per group.'],
 ex:R`m = mind.copy()
m["avg_min"] = m.groupby("practice")["minutes"].transform("mean")
m["vs_avg"] = m["minutes"] - m["avg_min"]
print(m[["practice", "day", "minutes", "avg_min", "vs_avg"]].head(6).round(1))
# every session that ties its practice's longest one (all ties stay)
longest = m[m["minutes"] == m.groupby("practice")["minutes"].transform("max")]
print(longest[["practice", "day", "minutes"]])`,
 task:"Meals that were more than half of the day's calories. Only look at days with at least 2 meals logged (2 or more rows in <b>meals</b>; snacks count). For each meal on those days: <b>day</b>, <b>name</b>, <b>kcal</b> (as logged), <b>pct</b> = the meal's kcal * 100 / that day's total kcal (all of that day's rows), rounded to 1. Keep the meals whose pct <i>before rounding</i> is above 50. Columns: <b>day</b>, <b>name</b>, <b>kcal</b>, <b>pct</b>.",
 start:R`m = meals.copy()
m["day_kcal"] =
result = `,
 sol:R`m = meals.copy()
m["day_kcal"] = m.groupby("day")["kcal"].transform("sum")
m["meals"] = m.groupby("day")["kcal"].transform("size")
m["pct"] = m["kcal"] * 100 / m["day_kcal"]
big = m[(m["meals"] >= 2) & (m["pct"] > 50)]
result = big[["day", "name", "kcal", "pct"]].round({"pct": 1})`,
 hint:'m.groupby("day")["kcal"].transform("sum") for the day total and transform("size") for meals per day, then filter on both.'},
{id:'py9',t:'py',lv:3,title:'Flattening JSON',

days = pd.json_normalize(day_export)
print(days.columns.tolist())
t = pd.json_normalize(day_export, record_path="trades", meta=["day"])
print(t.groupby("day")["pnl"].sum())`,

result = `,

{id:'py10',t:'py',lv:4,title:'Regex extraction from logs',
 learn:['Semi-structured text is extracted with regular expressions. Series.str.extract(pattern) returns one column per capture group; lines that don&rsquo;t match become NaN.','A preloaded list <b>logs</b> holds your apps&rsquo; activity as lines like <b>DATE TIME APP event key=value …</b>, e.g. <b>… REWIRE urge habit=Doomscrolling result=resisted intensity=4 trigger="Phone in hand"</b>. Values with spaces are in double quotes; empty fields are left out.'],

d = s.str.extract(r"^\S+ \S+ (\w+) (\w+)")
d.columns = ["app", "event"]
print(d.value_counts())`,
 task:'Which trigger hits you most? From the <b>REWIRE urge</b> lines, count urges per <b>trigger</b> (quoted or not, without the quotes). Columns: <b>trigger</b>, <b>n</b>.',

u = s[s.str.contains(" REWIRE urge ")]
t = u.str.extract(r'trigger=(?:"([^"]*)"|(\S+))')
# t[0] holds quoted values, t[1] unquoted ones

{id:'py11',t:'py',lv:4,title:'Dedup to latest record',

print(c.sort_values("day").drop_duplicates("week", keep="last")[["week", "day", "weight"]])`,

result = `,

{id:'py21',t:'py',lv:4,title:'Running totals & drawdown',ordered:true,
 learn:['<code>cumsum()</code> turns a column into a running total: each row holds itself plus every row above it, the pandas form of SQL’s SUM(...) OVER (ORDER BY ...). <code>cummax()</code> and <code>cummin()</code> keep the highest and lowest value so far, and <code>groupby("track")["minutes"].cumsum()</code> restarts the total for each group.','For a trader they build the two curves that matter. Total pnl per day, then <code>equity = pnl.cumsum()</code> is the equity curve and <code>equity.cummax()</code> the peak so far. <b>drawdown = equity - peak</b> is 0 on a new high and negative below it; its minimum is the max drawdown, the deepest drop from a peak.','Gotchas: cumulative functions follow row order, so sort by time first (a groupby on <b>day</b> already returns days in order). Aggregate to one row per day before building a daily curve; a per-trade curve has one row per trade. <code>cummax()</code> starts at the first value, not at 0, so a curve that opens with a loss shows no drawdown on day one. If your starting balance should count as the first peak, clip the peak, not the equity: <code>equity.cummax().clip(lower=0)</code>.'],
 ex:R`s = study.sort_values("time").copy()
s["total"] = s["minutes"].cumsum()                          # all tracks so far
s["track_total"] = s.groupby("track")["minutes"].cumsum()   # restarts for each track
s["longest"] = s["minutes"].cummax()                        # longest session so far
print(s[["day", "track", "minutes", "total", "track_total", "longest"]])`,
 task:'Your <b>equity curve</b> by trading day, ordered by <b>day</b> (oldest first). Columns: <b>day</b>; <b>pnl</b> (that day’s total pnl); <b>equity</b> (running total of the daily pnl); <b>drawdown</b> (equity minus the highest equity so far, that day included: 0 on a new high, negative below it; the peak starts at your first day’s equity, not at 0). Every number rounded to 2.',
 start:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()
daily["equity"] =
daily["drawdown"] =
result = `,
 sol:R`daily = trades.groupby("day", as_index=False)["pnl"].sum()   # one row per day, in date order
daily["equity"] = daily["pnl"].cumsum()
daily["drawdown"] = daily["equity"] - daily["equity"].cummax()
result = daily.round(2)`,
 hint:'Total pnl per day first, then equity = pnl.cumsum() and drawdown = equity - equity.cummax().'},
{id:'py22',t:'py',lv:4,title:'Filling calendar gaps',
 learn:['A log only has rows for days when something happened. <code>groupby("day")</code> never produces the days you skipped, so per-day counts lose their zeros and per-day averages come out too high. The fix is a <b>calendar spine</b>: <code>pd.date_range(start, end)</code> lists every day in a range, and you check or fill each one against the log.','Two ways to use it. <code>spine.isin(log_days)</code> (as in the anti-join lesson) marks the days that appear in the log, and <code>per_day.reindex(spine, fill_value=0)</code> puts a per-day Series onto every calendar day. Or put the dates on a DatetimeIndex: <code>resample("D").size()</code> or <code>.sum()</code> emits every day from the first to the last row, empty days as 0.','Gotchas: both sides must be real datetimes (<code>pd.to_datetime</code>): a per-day Series indexed by \'YYYY-MM-DD\' text, reindexed onto a date_range, matches nothing and comes back all zeros. Pick the range on purpose (first to last log day is not full weeks). For weekly buckets keep <code>to_period("W").dt.start_time</code> from Dates &amp; weekly buckets: <code>resample("W")</code> labels each week by the Sunday it ends on.'],
 ex:R`m = mind.assign(date=pd.to_datetime(mind["day"])).set_index("date")
per_day = m.resample("D").size()          # every calendar day, 0 when you didn't practise
print(per_day.head(8))
print("days in range:", len(per_day), "| days without a session:", (per_day == 0).sum())
print("sessions per day: logged days only", round(mind.groupby("day").size().mean(), 2),
      "| every day", round(per_day.mean(), 2))`,
 task:'Rest days per week. Take every calendar day from your first to your last <b>workouts</b> day (both included). A day with at least one workouts row is a training day; any other day is a rest day. Per week (the Monday it starts, as YYYY-MM-DD text): how many training days and rest days. The first and last weeks count only the days inside that range, so they can have fewer than 7; a week inside the range with no workouts at all still gets a row (train_days 0). Columns: <b>week</b>, <b>train_days</b>, <b>rest_days</b>.',
 start:R`days = pd.to_datetime(workouts["day"]).drop_duplicates()
cal = pd.DataFrame({"date": pd.date_range(          )})
cal["train"] =
cal["week"] =
result = `,
 sol:R`days = pd.to_datetime(workouts["day"]).drop_duplicates()
cal = pd.DataFrame({"date": pd.date_range(days.min(), days.max())})
cal["train"] = cal["date"].isin(days).astype(int)
cal["rest"] = 1 - cal["train"]
cal["week"] = cal["date"].dt.to_period("W").dt.start_time.dt.strftime("%Y-%m-%d")
result = cal.groupby("week", as_index=False).agg(train_days=("train", "sum"), rest_days=("rest", "sum"))`,
 hint:'pd.date_range(first day, last day) gives every day; isin(training days) marks the training days; then group by the Monday week key and sum.'},
{id:'py23',t:'py',lv:4,title:'Rolling windows over time',
 learn:['A rolling window aggregates each row together with the rows just before it, a moving sum or average that smooths a noisy daily series. <code>s.rolling(7).sum()</code> uses the last 7 <i>rows</i>. <code>df.rolling("7D", on="date")["minutes"].sum()</code> uses the last 7 <i>calendar days</i>: the row’s own day and the 6 days before it.','The two only agree when there is a row for every day. Seven rows of a log with days off can stretch over two weeks, while a time window counts by the calendar, so an empty day simply adds nothing. A time window needs a datetime column, sorted ascending (or a DatetimeIndex); text dates raise a confusing <i>window must be an integer</i> error.','Gotchas: aggregate to one row per day first, or a day with two sessions gives two rows and the first one misses the second’s minutes. Time windows default to <code>min_periods=1</code>, so the first days get a partial window, while <code>rolling(7)</code> stays NaN until 7 rows exist. <code>"7D"</code> on a timestamp like <b>time</b> means 168 hours back from that moment, not 7 calendar days, so roll on the date.'],
 ex:R`c = checkins.assign(date=pd.to_datetime(checkins["day"])).sort_values("date")
c["avg_7_rows"] = c["energy"].rolling(7).mean()                # your last 7 check-ins
c["avg_7_days"] = c.rolling("7D", on="date")["energy"].mean()  # check-ins in the last 7 calendar days
print(c[["day", "energy", "avg_7_rows", "avg_7_days"]].round(2).tail(10))`,
 task:'Your rolling mindfulness load. Total the <b>mind</b> minutes per <b>day</b>; then, for each day you practised: <b>day</b>, <b>minutes</b> (that day’s total) and <b>last_7d</b> (total minutes over the 7 calendar days ending that day: the day itself and the 6 before it; days without a session add nothing, and near your first day the window just covers fewer days). Calendar days come from <b>day</b>, not <b>time</b>. Not rounded (whole minutes). Columns: <b>day</b>, <b>minutes</b>, <b>last_7d</b>.',
 start:R`d = mind.groupby("day", as_index=False)["minutes"].sum()
d["date"] = pd.to_datetime(d["day"])
d["last_7d"] =
result = `,
 sol:R`d = mind.groupby("day", as_index=False)["minutes"].sum()   # one row per day, in date order
d["date"] = pd.to_datetime(d["day"])
d["last_7d"] = d.rolling("7D", on="date")["minutes"].sum()
result = d[["day", "minutes", "last_7d"]]`,
 hint:'Use a time window, not a row count: rolling("7D", on="date") over the per-day totals, then sum the minutes.'},
{id:'py24',t:'py',lv:4,title:'Streaks: runs of consecutive days',
 learn:['Streaks are a gaps-and-islands problem. Sort the distinct dates and flag each one whose gap to the previous date isn’t exactly 1 day: <code>diff().dt.days.ne(1)</code> (from shift &amp; diff). The <code>cumsum()</code> of those True/False flags (from running totals) counts the run starts so far, so every row of one run shares the same number: a <b>run id</b>. Group by it for the start (min), end (max) and length (size).','The same flag-and-cumsum trick labels runs of anything: <code>s.ne(s.shift()).cumsum()</code> gives a new id each time a value changes, which finds runs of winning trades, losing days or high-energy mornings.','Gotchas: deduplicate days first; two logs on one day give a gap of 0, which breaks the run. Take the gap within each key, <code>groupby("habit")["date"].diff()</code>, so one habit’s run can’t continue into another’s. The first row of each group has a NaN gap; <code>ne(1)</code> is True for NaN, so it correctly starts a run. A run’s length is end - start + 1 days, not end - start.'],
 ex:R`t = trades.sort_values("id").copy()
t["result"] = np.where(t["pnl"] > 0, "win", "no win")
t["run"] = t["result"].ne(t["result"].shift()).cumsum()   # new id whenever the label changes
runs = t.groupby("run").agg(result=("result", "first"), trades=("id", "size"),
                            first_day=("day", "min"), pnl=("pnl", "sum"))
longest = runs.sort_values(["trades", "first_day"], ascending=[False, True]).drop_duplicates("result")
print(longest)   # your longest run of each kind`,
 task:'Your good-habit streaks. From the <b>habits</b> rows with event <b>done</b>, find every run of consecutive calendar days on which you did each habit: several logs of one habit on one day count as one day, and a day without it ends the run. One row per run. Columns: <b>habit</b>, <b>start</b> and <b>end</b> (the run’s first and last day, as YYYY-MM-DD text), <b>days</b> (its length in days; a single day is a streak of 1).',
 start:R`d = habits[habits["event"] == "done"][["habit", "day"]].drop_duplicates().copy()
d["date"] = pd.to_datetime(d["day"])
d = d.sort_values(["habit", "date"])
d["run"] =
result = `,
 sol:R`d = habits[habits["event"] == "done"][["habit", "day"]].drop_duplicates().copy()
d["date"] = pd.to_datetime(d["day"])
d = d.sort_values(["habit", "date"])
gap = d.groupby("habit")["date"].diff().dt.days
d["run"] = gap.ne(1).cumsum()          # a new id at each habit's first day and after every gap
result = d.groupby(["habit", "run"], as_index=False).agg(start=("day", "min"), end=("day", "max"), days=("day", "size"))
result = result[["habit", "start", "end", "days"]]`,
 hint:'Within each habit, a gap that isn’t 1 day starts a new run: gap.ne(1).cumsum() is the run id; then group by habit and run id.'},

{id:'sas1',t:'sas',lv:1,title:'The DATA step',
 learn:['SAS works through data one row at a time in a DATA step. DATA names the output, SET reads the input, the statements in between change each row, and RUN executes it.','WHERE filters rows as they are read. KEEP and DROP choose which columns are written. Your app logs are in <b>work.trades</b>, <b>work.workouts</b>, <b>work.mind</b>, <b>work.meals</b>, <b>work.habits</b>, <b>work.checkins</b> and <b>work.study</b>.'],
 ex:R`data short_trades;
  set work.trades;
  where side = 'Short';
  keep day contract qty pnl;
run;`,
 quiz:{q:'Which statement controls which <b>columns</b> are written to the output data set?',o:['KEEP','WHERE','SET','RUN'],a:0,why:'KEEP (or DROP) selects variables. WHERE filters rows, SET names the input, RUN executes the step.'},
 prac:{task:'Write a DATA step that creates <b>slips</b> from work.habits. Keep only the urges you gave in to (event = <b>slipped</b>) and only the columns day, habit, intensity and trigger.',sol:R`data slips;
  set work.habits;
  where event = 'slipped';
